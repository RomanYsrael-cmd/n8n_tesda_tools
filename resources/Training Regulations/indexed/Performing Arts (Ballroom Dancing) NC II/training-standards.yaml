    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for the PERFORMING ARTS (BALLROOM DANCING) NC II qualification.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; trainer’s qualification and institutional assessment\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PERFORMING ARTS( BALLROOM DANCING)\nNC Level: NC II\n\nNominal Training Duration: 300 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of dancers in\nperforming the basic modern standard and Latin American dance figures and amalgamations. It\ncovers the basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n\n4.2 Control hazards and risks\n\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 36 ---\nTR Ballroom Dancing NC II\n\n-32-\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Maintain an\neffective\nrelationship with\nclients/customers\n\n1.1 Maintain a professional image\n1.2\nMeet client/customer\nrequirements\n1.3 Build credibility with\ncustomers/clients\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n2. Manage own\nperformance\n\n2.1 Identify tasks accurately\n2.2 Allocate priority to each task\n2.3 Allocate time lines to each\ntask\n2.3\nMeet and comply deadlines\n2.4\nKnow and comply deadlines\n2.5\n Develop work plans\n2.6\nMonitor personal\nperformance\n2.7\nGet advice and guidance\n2.8\nApply guidance from\nmanagement\n2.9\nClarify standard of work\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 37 ---\nTR Ballroom Dancing NC II\n\n-33-\nCORE COMPETENCIES\n(264 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Demonstrate\nunderstanding of\ndance concepts\nand routines\n\n1.1\nDemonstrate fundamental\nmovement vocabulary and\nskills in performing dance\n1.2\nDemonstrate safe physical\ndance practice\n1.3\nArticulate dance context\n1.4\nParticipate in dance in a\nperformance context\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\n Test\n• Interview\n\n2. Perform basic\nmodern standard\ndance figures\nand\namalgamations\n\n2.1 Prepare for performance\n2.2\nPerform warm-up exercises\n2.3 Perform basic modern\nstandard dance figures and\namalgamations\n2.3.1 Waltz\n2.3.2 Tango\n2.3.3 Foxtrot\n 2.3.4 Quickstep\n2.3.5 Viennese Waltz\n2.4 Maintain ballroom costumes,\nshoes, supplies and\nmaterials\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n3. Perform basic\nLatin-American\ndance figures\nand\namalgamations\n\n3.1 Prepare for performance\n3.2 Perform warm-up exercises\n3.3 Perform basic Latin-\nAmerican dance figures and\namalgamations\n3.3.1 Cha-cha-cha\n 3.3.2 Jive\n 3.3.3 Rumba\n 3.3.4 Samba\n 3.3.5 Paso Doble\n3.4 Maintain ballroom costumes,\nshoes, supplies and\nmaterials\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 38 ---\nTR Ballroom Dancing NC II\n\n-34-\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 39 ---\nTR Ballroom Dancing NC II\n\n-35-\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in these course qualifications should possess the\nfollowing requirements:\n\n• At least high school graduate or its equivalent.\n• Must be physically and mentally healthy\n• Must be of good moral character\n• Must be at least 18 years of age*\n\n* for trainees wishing to work overseas\n\n3.4 COSTUMES, EQUIPMENT AND MATERIALS\nPERFORMING ARTS (BALLROOM DANCING) NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 24\ntrainees for Performing Arts (Ballroom Dancing) NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n1 unit\nExecutive Table\n1 unit\nAV Equipment\n5 units Make-up Kit\n25 pcs.\nArmed Chairs\n1 unit\nSound System\n1 box\nCD/VCD\n1 unit\nClerical Table\n1 unit\nCassette Player\n1 box\nCassette Tapes\n 1 pc.\nWhiteboard\n1 unit\nComputer with\nPrinter\n24 pcs.\nNumber\n1 pc.\nBlackboard\n\nAirconditioning\nUnits\n\nDance Floor\n1 pc.\nMicrophone\n1 unit\nMonitor/Television\nSet\n*1 set\nCompetition\nCostumes/Attire\nModern Standard\nMan: Tail Suit/ Black\nStandard Shoes\nLady : Long Gown.\nHairdress/ Standard\nShoes (any color)\nLatin – American\nMan : Trousers/ Shirts,\nBlack Latin Shoes\nLady : Latin Dress / Latin\nShoes (any color)\n\n--- PDF PAGE 40 ---\nTR Ballroom Dancing NC II\n\n-36-\n\n2 pcs.\nSpeakers\n\n*1 set\nPractice Outfit\nModern Standard\nMan : Black Slacks, Polo\n(Long Sleeve)/ Black\nStandard Shoes\nLady : Long Skirt (any\ncolor), Blouse (any color),\nStandard Shoes (any\ncolor)\nLatin – American\nMan : Latin Pants & Shirt/\nLatin Shoes\nLady : Latin Dress/ Latin\nShoes (any color)\nHeadress\n\n1 Set\nSewing Kit\n\n*Note: For demo purposes only\n\n--- PDF PAGE 41 ---\nTR Ballroom Dancing NC II\n\n-37-\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 24 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance Space\n(S/TPS)\n\n10 m x 20 m.\n\n200 sq. m.\n\nLearning Resource Center (LRC)\n\n1 x 5 m.\n\n5 sq. m.\n\nCirculation Area\n\n(S/TPS+LRC+SDR+CR) X 30%\n(50+5+15+10) X 30%=24 sq.m.)\n\n24 sq. m.\n\nSeparate Dressing Rooms for Male and\nFemale Trainees/ Students (SDR)\n\n3 x 5 m.\n\n15 sq. m.\n\nSeparate Restrooms for Male and Female\nTrainees/ Students (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop Area\n\n254 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICES SECTOR\n\nPERFORMING ARTS (BALLROOM DANCING) NC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must have undergone Trainer’s Training Methodology II (TM II)\n• Must be a member of a reputable/recognized dance company/organization\n• Must be physically and mentally fit\n• Must have at least three (3) years teaching experience*\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 42 ---\nTR Ballroom Dancing NC II\n\n-38-"
