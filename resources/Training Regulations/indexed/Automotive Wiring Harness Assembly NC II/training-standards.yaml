on\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 46 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n42\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazards and\nrisks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n1.1 Select measuring\ninstruments\n1.2 Carry out measurements\nand calculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n2. Read, interpret\nand apply\nengineering\nmanuals/specif\nications\n2.1 Identify/access engineering\nmanuals / specification\n2.2 Interpret manual\n2.3 Apply information in\nmanual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n• Direct\nobservation\n• Interview\n3. Apply\nappropriate\nsealant/\nadhesive\n4.1 Identify appropriate sealant/\nadhesive\n4.2 Prepare surface for sealant\n/ adhesive application\n4.3 Store unused and dispose\nused sealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n•Project method\n4. Perform shop\nmaintenance\n5.1 Inspect/clean tools and\nwork area\n5.2 Store/arrange tools and\nshop equipment\n5.3 Dispose waste/used\nlubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\n