t\n1.2 Select and classify\nmaterials/parts for the job\n1.3 Deliver materials/parts to\nassembly line\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n2. Perform cutting\nand stripping of\nelectrical wires\n2.1 Select and use tools and\nequipment/machine\n2.2 Cut strip electrical wires\n2.3 Inspect cut and strip portion\n2.4 Clean up the area\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n3. Perform\ncrimping and\nsoldering of\nterminals\n3.1 Prepare materials for\nsoldering\n3.2 Crimp terminals\n3.3 Solder materials\n3.4 Inspect crimp and solder\njoints\n3.5 Clean up the area\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n•Interview\n4. Perform tying,\ntaping and\nfinishing of\nassembly wires\n\n4.1 Prepare materials for\njointing\n4.2 Joint assembly wires\n4.3 Inspect jointed assembly\nwires\n4.4 Clean up the area\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n•Interview\n\n--- PDF PAGE 48 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n44"
