NTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both orally and in writing; and\n• physically and mentally fit\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE WIRING HARNESS ASSEMBLY NC II\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor AUTOMOTIVE WIRING HARNESS ASSEMBLY NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n4 units Soldering gun/iron\n1 unit\nCrimping machine\n20\npcs.\nApron\n4 sets\nWire\nstrippers/cutters\n1 unit\nAutomatic or\nmanual cutting\nmachine\n20\npcs.\nGoggles\n\nBrushes\n1 unit\nMotor-driven or\nmanual stripping\nmachine\n20\nsets.\nGloves\n4 pcs\nFiles\n1 unit Wiring board\n4 sets\nSolder – solid, resin\ncore and plate\n4 pcs\nSoldering tips\n\n4 sets Flux – resin or\npowder\n4 sets\nSolder syringes\n\n50\nrolls\nPVC tape\nI set\nHolding devices\n\nassort\ned\nPlastic cable tie\n5 sets\nHand tools\n\n1 lot\nAutomotive wires\n(assorted sizes)\n\n1 lot\nTerminal lugs\n(assorted)\n\n--- PDF PAGE 50 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n46\n\n3.5 TRAINING FACILITIES\nAUTOMOTIVE WIRING HARNESS ASSEMBLY NC II\n\nThe automotive workshop must be made of reinforced concrete or steel structure.\nThe size must be suited on the requirements of the competencies. The class size of 25\nstudents/trainees is reserved for the lecture room and the practical demonstration area\nfor carrying out assembly of automotive wiring harness.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n•\nBuilding (permanent)\n12.00 x 32.00\n-\n384.00\n• Student/Trainee Working\nSpace\n2.50 x 2.50 per\nstudent/trainee\n6.25 per student\n156.25\n• Contextual Learning\nLaboratory\n