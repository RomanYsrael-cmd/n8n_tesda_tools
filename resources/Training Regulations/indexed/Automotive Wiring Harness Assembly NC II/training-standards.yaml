    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE WIRING HARNESS ASSEMBLY\n NC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n 96 Hours (Core Competencies)\n\nCourse Description:\n\n This course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of automotive wiring harness assembly in accordance with industry standards. It\ncovers competencies such as: select and classify materials and parts for assembly of wiring\nharness; perform cutting and stripping of electrical wires; perform crimping and soldering of\nterminals and perform tying, taping and finishing of assembly wires.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Participate in workplace\nmeeting and discussions\n1.3 Complete relevant work\nrelated documents\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\n• Interactive\nlecture\n• Structure activity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 46 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n42\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\