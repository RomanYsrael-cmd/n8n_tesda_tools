        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials for crimping and soldering\n1.2 Crimped terminals and soldered materials\n1.3 Inspected crimp and soldered joints\n2. Underpinning\nknowledge and\nattitudes\n2.1 Cleaning solutions and properties and cleaning procedures\n2.2 Use and application of personal protective equipment for crimping\nand soldering\n2.3 Parts and functions of crimping machine\n2.4 Safe work practices and procedures\n2.5 Method of solder preparation\n2.6 Properties of fluxes and their applications/uses\n2.7 Heat and damage protection procedures\n2.8 Soldered joint testing and inspection procedures\n2.9 Reworking procedures and precautions.\n2.10 Positive Work values ( Perseverance, Honesty, Attention to details)\n3. Underpinning\nskills\n3.1 Performing routine soldering process\n3.2 Performing routine crimping process\n6.1 Undertaking material preparation\n6.2 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating procedures\n3.5 Following oral instruction\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Battery to be tested can be separated or to be taken from vehicle\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to the activity\n4.4 The candidate must be permitted to refer to any relevant workplace\nprocedures, product and manufacturing specifications, codes,\nstandards, manuals and reference materials\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Portfolio\n6. Context of\nassessment\n\nCompetency must be assessed on-the-job.\n\n--- PDF PAGE 42 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n38\n\nUNIT OF COMPETENCY :\nPERFORM TYING, TAPING AND FINISHING OF\n\nASSEMBLY WIRES\n\nUNIT CODE :"
        },
        "source_text": "ALT827326\n\nUNIT DESCRIPTOR :\nThis competency unit covers the ability to perform crimping\nand soldering of terminal plate into electrical wires to\nspecification that forms as a part of electrical harness of\nautomotive vehicles\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials\nfor soldering\n1.1 Materials preparation instructions are followed\n1.2 Materials are prepared using correct tools and equipment,\nmaterials and procedures\n1.3 Materials are prepared to specifications using instruction or\nstandard operating procedures\n2. Crimp terminals\n2.1 Terminals of different kinds are connected to the wire stripped\nby crimping parts on terminals by use of crimping machine\n2.2 Workflow and production output are recorded and maintained\n3. Solder materials\n3.1 Correct soldering techniques, procedures, materials and\nsoldering tools are selected\n3.2 Materials to be jointed, mounted, shaped are to specification\nusing standard operating procedures\n3.3 Solder is applied using correct and appropriate techniques\n3.4 Where appropriate, excess material is removed using correct\ntools and techniques\n3.5 Procedures for the protection of components are observed\naccording to standard operating procedures.\n4. Inspect crimp and\nsolder joints\n4.1 Inspection procedure is undertaken to standard operating\nprocedures\n4.2 Inspection results are reported/recorded to standard operating\nprocedures as required\n5. Clean up the area\n5.1 At the end of the shift, cleaning up of working area is done to\nmaintain cleanliness and orderliness of the shop floor area\n\n--- PDF PAGE 40 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n36\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\n1.1 Solder – solid, resin core and plate\n1.2 Flux – resin or powder\n2. Instruction\n2.1 Verbal\n2.2 Written job sheet\n3. Tools and\nequipment\n3.1 Soldering irons\n3.2 Cutters\n3.3 Brushes\n3.4 Files\n3.5 Soldering tips\n3.6 Solder syringes\n3.7 Holding devices\n4. Soldering\ntechniques\n4.1 Soldering plate by immersion\n4.2 soft soldering\n4.3 Manual soldering\n4.4 High reliability\n5. Inspection\nProcedure\n5.1 Visual\n5.2 Mechanical or electric with pre-setup equipment\n\n--- PDF PAGE 41 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n37\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared materials for crimping and soldering\n1.2 Crimped terminals and soldered materials\n1.3 Inspected crimp and soldered joints\n2. Underpinning\nknowledge and\nattitudes\n2.1 Cleaning solutions and properties and cleaning procedures\n2.2 Use and application of personal protective equipment for crimping\nand soldering\n2.3 Parts and functions of crimping machine\n2.4 Safe work practices and procedures\n2.5 Method of solder preparation\n2.6 Properties of fluxes and their applications/uses\n2.7 Heat and damage protection procedures\n2.8 Soldered joint testing and inspection procedures\n2.9 Reworking procedures and precautions.\n2.10 Positive Work values ( Perseverance, Honesty, Attention to details)\n3. Underpinning\nskills\n3.1 Performing routine soldering process\n3.2 Performing routine crimping process\n6.1 Undertaking material preparation\n6.2 Reading and interpreting routine information on written job\ninstructions, specifications and standard operating procedures\n3.5 Following oral instruction\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Battery to be tested can be separated or to be taken from vehicle\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to the activity\n4.4 The candidate must be permitted to refer to any relevant workplace\nprocedures, product and manufacturing specifications, codes,\nstandards, manuals and reference materials\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Portfolio\n6. Context of\nassessment\n\nCompetency must be assessed on-the-job.\n\n--- PDF PAGE 42 ---\nTR-Automotive Wiring Harness Assembly NC II Promulgated\n38\n\nUNIT OF COMPETENCY :\nPERFORM TYING, TAPING AND FINISHING OF\n\nASSEMBLY WIRES\n\nUNIT CODE :"
