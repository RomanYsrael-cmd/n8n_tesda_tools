        "source_title": "PERFORM CUTTING AND STRIPPING OF ELECTRICAL WIRES",
        "source_text": "--- PDF PAGE 36 ---\nTR-Automotive Wiring Harness Assembly NC II         Promulgated                                            \n32\n \n \n \nUNIT OF COMPETENCY:  PERFORM CUTTING AND STRIPPING OF ELECTRICAL  \n                                            WIRES  \n \nUNIT CODE \n:  ALT827325 \n \nUNIT DESCRIPTOR \n: This competency unit covers the ability to perform cutting and \nstripping of electrical wires to specification that forms as a part of \nelectrical harness of an automotive vehicle \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select and use tools \nand equipment / \nmachine \n1.1 Tools and equipment are selected to meet job requirements. \n1.2 Tools and equipment are checked to ensure they are in good \nworking order. \n1.3   Appropriate cutting/stripping machines are selected and \nused in accordance with OH&S requirements\n2. Cut and strip \nelectrical wires \n2.1   Electrical wires are cut to the prescribed or specified length \nusing cutting machines \n2.2   Insulators from both ends are removed/stripped by use of \nstripping machine \n2.3   Workflow and production output are recorded and \nmaintained\n3. Inspect cut and \nstrip portion \n2.1   Inspection procedure is undertaken to standard   \n  operating procedures \n2.2   Inspection results are reported/recorded to standard   \n       operating procedures as required\n4. Clean up the area \n4.1   At the end of the shift, cleaning up of working area is done to \nmaintain cleanliness and orderliness  of the shop floor area\n\n--- PDF PAGE 37 ---\nTR-Automotive Wiring Harness Assembly NC II         Promulgated                                            \n33\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Cutting machines \n1.1 Automatic cutting machine \n1.2 Manual cutting machine\n2. Stripping machines \n2.1 Motor driven stripper \n2.2Manual stripping machine\n3. Inspection \nProcedure \n3.1 Visual \n3.2 Mechanical or electric with pre-setup equipment\n\n--- PDF PAGE 38 ---\nTR-Automotive Wiring Harness Assembly NC II         Promulgated                                            \n34\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \nPerformed cutting and stripping process in accordance with \ncompany procedures \n2. Underpinning \nknowledge and \nattitudes \n2.1 Read and interpret job order \n2.2 Wiring harness assembly terminology \n2.3 Types and sizes of harness wires  \n2.4 Wiring harness parts/components  \n2.5 Use and application of personal protective equipment \n2.6 Safe work practices and procedures \n2.7 Positive Work Values (Honesty, Perseverance, Attention to \nDetails)\n3. Underpinning \nskills \n3.1 Accessing, interpreting and applying technical information \n3.2 Using relevant tools and equipment safely \n3.3 Applying maintenance procedures \n3.4 Speaking and listening skills \n3.5 Reading and writing skills \n3.6Using and interpreting measurements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity  \n4.4Job order and related reference materials\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct observation with questioning \n5.2 Portfolio\n6. Context of \nassessment \n6.1 Competency may be assessed on the job or simulated \nenvironment. \n6.2 The assessment of practical skills must take place after a  \nperiod of supervised practice and repetitive experience.\n",
