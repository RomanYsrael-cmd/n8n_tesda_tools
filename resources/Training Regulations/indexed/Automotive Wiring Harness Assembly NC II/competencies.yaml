        "source_title": "PERFORM TYING, TAPING AND FINISHING OF ASSEMBLY WIRES",
        "source_text": "--- PDF PAGE 42 ---\nTR-Automotive Wiring Harness Assembly NC II         Promulgated                                            \n38\n \n \nUNIT OF COMPETENCY : \nPERFORM TYING, TAPING AND FINISHING OF  \n \n \n \n \nASSEMBLY WIRES  \n  \nUNIT CODE                       :  \nALT827327 \n \n \nUNIT DESCRIPTOR \n:  \nThis competency unit covers the ability to perform tying, \ntaping and finishing of assembly wires as part of assembly \nprocess on forming board to specification that forms as a \npart of electrical harness of an automotive vehicles  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare materials \nfor the job \n1.1   Materials are prepared in accordance with instructions\n1.2   Materials are prepared using tools, equipment, materials and \nprocedures appropriate to the task \n1.3   Materials are prepared to specifications using instruction or \nstandard operating procedures \n2. Perform tying, \ntaping and \nfinishing on \nassembly wires \n2.1 Materials to be tied, taped and finished are to specification using \nstandard operating procedures \n2.2 Tying, taping and finishing of assembly wires  process is \napplied using appropriate tools and techniques \n2.3 Where appropriate, excess material is removed using correct \ntools and techniques \n2.4 Procedures for the protection of components are observed \naccording to standard operating procedures. \n2.5 Workflow and production output are recorded and maintained \nto standard operating procedures\n3. Inspect jointed \nassembly wires \n3.1 Inspection procedure is undertaken to standard operating \nprocedures \n3.2 Inspection results are reported/recorded to standard operating \nprocedures as required\n4. Clean up the area \n4.1   Cleaning up of working area is done to maintain cleanliness \nand orderliness  of the shop floor area\n\n--- PDF PAGE 43 ---\nTR-Automotive Wiring Harness Assembly NC II         Promulgated                                            \n39\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Instruction \n1.1 Verbal \n1.2 Written job sheet \n2. Tying, taping and \nfinishing  \n2.1 Tying is done using plastic cable type and with varying  \n       sizes \n2.2 Taping is done using a PVC type tape  \n2.3 Finishing is practically cleaning of terminals with flux and  \n      testing of continuity.  \n3. Inspection \nProcedure \n3.1 Visual \n3.2 Mechanical or electric with pre-setup equipment\n\n--- PDF PAGE 44 ---\nTR-Automotive Wiring Harness Assembly NC II         Promulgated                                            \n40\nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate performed tying, \ntaping and finishing of assembly wires in accordance \nwith company procedures. \n2. Underpinning \nknowledge and \nattitudes \n2.1 Cleaning solutions and properties and cleaning  \nprocedures \n2.2 Use and application of personal protective equipment for  \ntying, taping and finishing operations  \n2.3 Safe work practices and procedures  \n2.4 Method of joint soldering preparation \n2.5 Properties of fluxes and their applications/uses \n2.6 Heat and damage protection procedures \n2.7 Soldered joint testing and inspection procedures \n2.8 Reworking procedures and precautions. \n2.9 Positive Work values ( Perseverance, Honesty,   \n       Attention to details)\n3. Underpinning \nskills \n3.1 Performing routine tying, taping and finishing process \n3.2 Undertaking material preparation \n3.3 Reading and interpreting routine information on written job \ninstructions, specifications and standard operating procedures \n3.4 Following oral instruction\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Assembly Forming board/jig \n4.2 Appropriate tools and equipment \n4.3 Materials relevant to the activity \n4.4 The candidate must be permitted to refer to any relevant workplace \nprocedures, product and manufacturing specifications, codes, \nstandards, manuals and reference materials\n5. Method of \nassessment \nCompetency MUST be assessed through  \n5.1 Direct observation with questioning \n5.2 Portfolio \n6. Context of \nassessment \n \nCompetency must be assessed on-the-job\n",
