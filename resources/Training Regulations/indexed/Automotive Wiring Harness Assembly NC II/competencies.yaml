        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed\nOccupational\nHealth\nand\nSafety\n(OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used\nPersonal\nProtective\nEquipment\n(PPE)\nin\naccordance with company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\n attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE :"
        },
        "source_text": "500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Identify hazards and risks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding\nindicators\nare\nidentified\nto\nminimize\nor\neliminate\nrisk\nto\nco-workers,\nworkplace and environment in accordance with\norganization procedures\n1.3 Contingency\nmeasures\nduring\nworkplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and risks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 16 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused\nin\naccordance\nwith\norganization\nOHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace\nemergency\nin\naccordance\nwith\nestablished organization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related\ndrills\nand\ntrainings\nare\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 17 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n13\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n4.9 Hard hat\n\n--- PDF PAGE 18 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n14\nVARIABLE\nRANGE\n5. Emergency-related drills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal records\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 19 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n15\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed\nOccupational\nHealth\nand\nSafety\n(OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used\nPersonal\nProtective\nEquipment\n(PPE)\nin\naccordance with company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\n attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE :"
