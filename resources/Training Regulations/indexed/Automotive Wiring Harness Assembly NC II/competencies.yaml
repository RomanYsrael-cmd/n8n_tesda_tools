          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following\nstandard format of the organization\n1.2\nAccessed information using communication\nequipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the\nformal or informal communication\n2. Underpinning knowledge\nand attitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and\ndiscussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace Requirements\n4. Resource implications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Methods of assessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of assessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n5\nUNIT OF COMPETENCY\n: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n :"
