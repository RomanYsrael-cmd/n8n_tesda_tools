        "source_title": "APPLY APPROPRIATE SEALANT/ADHESIVE",
        "source_text": "--- PDF PAGE 27 ---\nTR - Automotive Wiring Harness Assembly NC II                Promulgated \n \n           \n23\nUNIT OF COMPETENCY   :    APPLY APPROPRIATE SEALANT/ADHESIVE \n \nUNIT CODE                        :    ALT723201 \n \nUNIT DESCRIPTOR          :    This competency unit covers the selection and application \nof sealant/adhesives. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify appropriate  \nSealant/adhesive  \n \n1.1Sealant/adhesive  is selected in line with job \n      requirements  and manufacturer’s specification \n1.1 Sealant/adhesive checking is performed to ensure \nthat product is fit for use. \n2. Prepare surface for  \nSealant/adhesive \napplication    \n2.1 Surface materials are identified as per construction \n2.2 Surface is cleaned and free of moisture, dust and other \n       foreign matters to ensure maximum adhesion or seal. \n3. Apply  \nsealant/adhesive     \n      evenly \n3.1 Sealant/adhesive is applied evenly on the surface in \nline  with manufacturer’s specification \n3.2 Excess sealant/adhesive is removed by sanding or  \n       scrapping \n \n3.3Tools and equipment used to apply sealant/adhesive \nare appropriate to job requirements \n3.4 Safety are observed and PPE are worn in accordance \nwith industry SOP \n3.5 Hazards associated with the use of sealant and \nadhesives are identified. \n4. Store/Dispose of  \nsealant/adhesive \n4.1 Sealant/adhesive are stored as per prescribed \nprocedure \n4.2 Waste  are disposed as per workshop SOP\n\n--- PDF PAGE 28 ---\nTR - Automotive Wiring Harness Assembly NC II                Promulgated \n \n           \n24\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Sealant/Adhesive \nSealant/adhesive includes: \n1.1Form in Place Gasket (FIPG) \n1.2 Ribbon Sealer \n1.3Hametite \n1.4Silicon Body sealer \n1.5 Prestite for Auto and Auto Aircon \n2.Adhesive/Sealant     \n    checking \n \nAdhesive/Sealant checking includes: \n2.1 Expiry date \n2.2 Free of contamination \n2.3 Cap/Covers \n2.4 Tightly closed \n2.5 Concentration \n3. Tools and equipment \nTools and equipment include: \n3.1 Putty knife \n3.2 Scraper \n3.3 Compressor \n3.4 Steel brush \n3.5 Paint brush \n3.6 Rubber hammer \n3.7 Hand tools \nPersonal protective equipment include: \n3.8 Gloves \n3.9 Apron \n3.10 Safety shoes \n3.11Goggles \n3.12Gas mask \n4. Safety \nSafety includes: \n4.1 Ventilation \n4.2 Handling of Flammable/Irritating  substances \n4.3 Use of Personal Protective Equipment \n5. Hazards \nHazard includes: \n5.1 Fumes \n5.2 Skin irritation \n5.3 Burns\n\n--- PDF PAGE 29 ---\nTR - Automotive Wiring Harness Assembly NC II                Promulgated \n \n           \n25\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Identified appropriate sealant/adhesives \n1.2 Prepared surface for sealant/adhesive \n1.3 Applied sealant/adhesive \n1.4 Stored unused or dispose of used sealant/adhesive\n2. Underpinning  \nknowledge and \nattitude \n2.1 OH & S regulations \n2.2 Safe handling of sealant/adhesive \n2.3 Industry code of practice \n2.4 Procedures in sealant/adhesive application \n2.5 Procedures in interpreting manuals\n3. Underpinning skills \n3.1 Handling sealant/adhesive \n3.2 Applying sealant/adhesive \n3.3.Sanding the surface \n3.4 Use of tools, equipment \n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource  \n    implications \nThe following resources must be provided: \n4.1 Materials relevant to the activity \n4.2 Appropriate tools and equipment \n4.3 Real or simulated workplace\n5. Method of  \n    assessment \n \nCompetency must be assessed through \n5.1 Observation with questioning \n5.2 Interview related to: \n Safe and correct use of tools and equipment \nApplication of adhesive/sealant\n6. Context of  \n     assessment \n \n6.1 Competency elements must be assessed in a safe  \n      working environment \n6.2 Assessment may be done in a workplace or simulated \nenvironment\n",
