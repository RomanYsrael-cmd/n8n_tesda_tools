  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in AUTOMOTIVE WIRING HARNESS ASSEMBLY NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage\nof information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos,\ninstruction and forms, non-verbal including\ngestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following\nstandard format of the organization\n1.2\nAccessed information using communication\nequipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the\nformal or informal communication\n2. Underpinning knowledge\nand attitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and\ndiscussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace Requirements\n4. Resource implications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Methods of assessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of assessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n5\nUNIT OF COMPETENCY\n: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR\n : This unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a\nteam.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1\nThe role and objective of the team is identified\nfrom available sources of information\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1 Individual role and responsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of other team members are\nidentified and recognized\n2.3 Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1 Effective and appropriate forms of communications\nused and interactions undertaken with team\nmembers who contribute to known team activities\nand objectives\n3.2 Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3 Observed protocols in reporting using standard\noperating procedures\n3.4 Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 10 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with\nenterprise or specific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of information\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4\nOrganizational or external personnel\n2.5\nManufacturer/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected\nand\nused\nappropriate\nworkplace\nlanguage\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge and attitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2. Materials relevant to the proposed activity or tasks\n5. Methods of assessment Competency may be assessed through:\n5.1\nObservation of the individual member in relation\nto the work activities of the group\n5.2\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for assessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n8\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued\ntowards improving the qualifications set for the\nprofession\n1.2 Intra- and interpersonal relationships is are\nmaintained in the course of managing oneself based\non performance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n3 Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3 Maintain professional\ngrowth and development\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n9\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 14 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n10\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which\nare based on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge and\nattitudes\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender\nsensitivity\n2.5 Personal hygiene practices\n3. Underpinning skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Method of assessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for assessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 15 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n11\nUNIT OF COMPETENCY :\n PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE :\n500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Identify hazards and risks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding\nindicators\nare\nidentified\nto\nminimize\nor\neliminate\nrisk\nto\nco-workers,\nworkplace and environment in accordance with\norganization procedures\n1.3 Contingency\nmeasures\nduring\nworkplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and risks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 16 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused\nin\naccordance\nwith\norganization\nOHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace\nemergency\nin\naccordance\nwith\nestablished organization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related\ndrills\nand\ntrainings\nare\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 17 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n13\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n4.9 Hard hat\n\n--- PDF PAGE 18 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n14\nVARIABLE\nRANGE\n5. Emergency-related drills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal records\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 19 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n15\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed\nOccupational\nHealth\nand\nSafety\n(OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used\nPersonal\nProtective\nEquipment\n(PPE)\nin\naccordance with company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\n attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE : ALT311202\n\nUNIT DESCRIPTOR : This unit includes identifying caring, handling and use of\nmeasuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select\nmeasuring\n\ninstruments\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\n using the four basic process of addition (+), subtraction (-),\n multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n3. Maintain\nmeasuring\ninstruments\n3.1 Measuring instruments must kept free from corrosion\n3.2 Measuring instruments not dropped to avoid damage\n3.3 Measuring instruments cleaned before and after using.\n\n--- PDF PAGE 21 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n17\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multi-tester\n1.2 Vernier caliper (Out,inside)\n1.3 Push-pull gage.\n1.4 Thickness gauge\n1.5 Steel ruler\n1.6 Torque Gauge\n2. Calculation\n\nKinds of Part Mensuration include:\n2.1 Area\n2.2 Inside diameter\n2.3 Circumference\n2.5 Length\n2.6 Thickness\n2.7 Outside diameter\n2.8 Taper\n2.9 Out of roundness\n2. 10 Oil clearance\n2.11 Oil clearance\n\n--- PDF PAGE 22 ---\nTR - Automotive Wiring Harness Assembly NC II Promulgated\n\n18\nEVIDENCE GUIDE\n1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1. Selected measuring instruments\n1.2. Carried-out measurements and calculations.\n1.3. Maintained measuring instruments\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of measuring instruments and its uses\n2.2 Safe handling procedures in using measuring\ninstruments\n2.3 Four fundamental operation of mathematics\n2.2 Formula for Volume, Area, Perimeter and other\ngeometric figures\n3 Underpinning\n skills\n3.1 Caring and handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.1 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.2 Visualizing objects and shapes\n3.3 Interpreting formula for volume, area, perimeter and\nother geometric figures\n3 Resource\n implications\nThe following resources must be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing\nprocesses\n4.3 Instructional materials relevant to the propose activity\n5. Method of\n assessment\n\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n6. Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a w