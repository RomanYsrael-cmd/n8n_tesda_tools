      "text": "Wiring harness Wire harness also known as cable harness, cable assembly, wiring assembly or wiring loom; is a string of cables and/or wires which transmit informational signals or operating currents (energy). The cables are bound together by clamps, cable ties, sleeves, electrical tape, conduit, a weave of extruded string, or a combination thereof. Commonly utilized in automobiles, as well as construction machinery, modern-day cable harnesses provide several advantages over loose wires and cables. For example, many aircraft, automobiles and spacecraft contain many masses of wires which would stretch over several kilometers if fully extended. By binding the many wires and cables into a cable harness, the wires and cables can be better secured against the adverse effects of vibrations, abrasions, and moisture. By constricting the wires into a non-flexing bundle, usage of space is optimized, and the risk of a short is decreased. Since the installer has only one harness to install (as opposed to multiple wires), installation time is decreased and the process can be easily standardized. Binding the wires into a flame-retardant sleeve also lowers the risk of electrical fires. --- PDF PAGE 55 --- TR-Automotive Wiring Harness Assembly NC II Promulgated 51 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the development and validation of this Training Regulation. Automotive Wiring Harness Assembly Antonio A. Gimenez- Executive Director - Rodolfo T. Nunez- Plant Manager-Nissan Motors Phils. Inc.(NMPI) Rene Torres (Labor Representative) Nissan Motors Philippines Workers Union-AIWA Nissan TechnoPark Bo. Pulong, Sta. Cruz Laguna Mr. Valentino de Leon VP- Plant Adminstration- Edgardo P. Zaragoza- Paint Shop Manager- NMPI (CATC/PAFI) Carina J. Bondad- Administrative Support Staff, (CATC/P