  "source_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1 The qualification of FURNITURE MAKING (FINISHING) NC II can be\nattained through demonstration of competence in a project-type\nassessment covering the following core units.\n\n4.1.1 Prepare surface for final coating\n4.1.2 Apply coat using spray gun system\n4.1.3 Perform basic preventive maintenance servicing for spray\ngun equipment and booth\n\n4.3. Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.4. The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2. Experienced Workers (wage employed or self-employed)\n\n4.5. The guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nguidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 66 ---\nCOMMON\nCORE\nANNEX A\nFINISHING (NC II)\nCOMPETENCY MAP\nFURNITURE MAKING INDUSTRY\nPrepare surface\nfor final coating\nApply coat using\nspray gun system\nPerform basic preventive\nmaintenance servicing for\nSprayer equipment and\nbooth\nOperate milling\nmachine\nMaintain tools\nand equipment\nApply quality\nstandards\nPerform\nmensuration and\ncalculations\nInterpret technical\ndrawings and plans\nUse hand tools\nObserve procedures,\nspecifications and\nmanual of instructions\nApply occupational health\nand safety (OH&S)\npractices and 5s in the\nworkplace\nReceive and respond to\nworkplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nPractice\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small\nteam\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialist\ncommunication\nskills\nDevelop team\nand individual\nApply problem solving\ntechniques in the\nworkplace\nCollect and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nBASIC\n\n--- PDF PAGE 67 ---\nDEFINITION OF TERMS\n\n1. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n2. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n4. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n6. Philippine TVET\n Qualification\n Framework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter\nfor the integration of learning and assessment in the middle skills\ndevelopment.\n7. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person\nhas achieved competencies relevant to a trade or industry.\n8. Range of\n Variable\nIt describes the circumstances or context in which the work is to\nbe performed.\n9. Unit of\n Competency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n\n--- PDF PAGE 68 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development of this Training Regulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nLINO DESEMBRANO\nManaging Director\nLamon Bay furniture Corporation\nWILFREDO R. RIVERA\nProduction Manager\nLamon Bay furniture Corporation\nEDWIN BACERO\nFinishing Supervisor\nLamon Bay furniture Corporation\n\nROGER ABOGADA\nSprayer\nLamon Bay furniture Corporation"
