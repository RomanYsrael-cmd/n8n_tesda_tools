      "term": "1. Competency",
      "definition": "Is the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace. 2. Certification Refers to the process of verifying and validating competencies of a person through assessment. 3. Element Refers to the building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform. 4. Evidence Guide It is a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment method. 6. Philippine TVET Qualification Framework Refers to a comprehensive, nationally consistent framework for qualifications in the TVET sector. It also provides the parameter for the integration of learning and assessment in the middle skills development. 7. Qualification Refers to the national certificate issued by the TESDA or its accredited industry organizations in recognition that a person has achieved competencies relevant to a trade or industry. 8. Range of Variable It describes the circumstances or context in which the work is to be performed. 9. Unit of Competency Refers to a discrete aspect of work, which would normally be performed by only one person."
