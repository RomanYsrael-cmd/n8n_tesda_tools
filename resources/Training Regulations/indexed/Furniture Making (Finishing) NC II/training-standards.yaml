oth in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n\nModular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery.\n\n--- PDF PAGE 62 ---\nPeer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n\nSupervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\nProject-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\nGood moral character\nAbility to communicate\nPhysically fit and mentally healthy\nCan perform basic mathematical computation and mensuration\n\n--- PDF PAGE 63 ---\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR FURNITURE\nFINISHING NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n5 pcs. Spray gun\n5\nSpray booth\n (dry type)\n25 liters Paints\n5 pcs. Viscosity cup\n1 unit Air compressors\n25 liters Thinner\n1 pc.\n Wet and / or dry\nthermometer\nI unit Regulator and filter\n13\nbottles\nColor stains\n5 pcs. Spray gun Wrenches\n1 unit Trolley\n12.5\nliters\nSealers\n5 pcs. Cleaning brushes\n5 units Racks\n12.5\nliters\nVarnish\n25 pcs. Pallet knife\n5 units Portable sander\n25 pcs. Sample coating board\n(12 “X12 “)\n25 pcs Sanding block\n5 units Working table\n75 pcs. Sand paper\n(240, 360, 600)\n25 pcs Brushes\n1 unit Dust collector\n1 liter\nPutty\n\n25\nunits\nPPE\n5 liters Paint remover\n5 liters Filler\n5 liters Glaze\n2 kilos Rags\n5 pcs\nSteel wool\n\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nContextual Learning\nLaboratory / Lecture Room\n\n40\n40\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n10\n10\nWash room\n20\n20\nCirculation area\n50\n50\nShop room\n\n60\n60\nTOTAL AREA\n200\n\n--- PDF PAGE 64 ---\n3.6 TRAINER’S QUALIFICATION FOR FURNITURE FINISHING\n NC II\n\nMust have undergone training on Training Methodology II (TM II)\nMust be a holder of National Certificate Level II or its equivalent\nGood moral character\nMust be computer literate\nMust be physically and mentally fit\n *Must have 1 year industry experience and/or teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement is\nissued for each unit of competency.\n\n--- PDF PAGE 65 ---"
