  "source_section_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for FURNITURE MAKING\n(FINISHING) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Furniture Finishing Level: NC II\n\nNominal Training Duration:\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and desirable\nwork attitude of a furniture finisher. It covers the basic, common and core\ncompetencies i.e. lay and repair floor and wall tiles, tile corners and curved\nsurfaces.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 57 ---\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 58 ---\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration and\ncalculation\n1.1 Select measuring\ninstruments\n1.2 Carry out\nmeasurements and\ncalculations\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n2. Interpret\nTechnical\nDrawing\n2.1 Analyze sign,\nsymbols and data\n2.2 Interpret technical\ndrawing and plans\n2.3 Apply freehand\nsketching\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n3. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n3.1 Identify and access\nspecification/\nmanuals\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n4. Comply with\nindustry (OH&S)\nguidelines and\nstandards\n4.1 Follow safe workplace\nprocedures for hazard\nidentification and risk\ncontrol\n4.2 Employ safe working\npractices\n4.3 Respond to accidents\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\n\nObservation\nOral questioning\nWritten test\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and equipment\n5.2 Perform basic\npreventive\nMaintenance\n5.3 Store tools and\nequipment\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\n\nObservation\nOral questioning\nWritten test\n\n--- PDF PAGE 59 ---\nUnit of\nCompetency\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Use hand tools\n6.1 Prepare hand tools\n6.2 Utilize hand tools\n6.3 Store hand tools\n\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n7. Apply quality\nstandards\n7.1 Assess quality of\nreceived materials or\ncomponents\n7.2 Assess own work\n7.3 Engage in process\nimprovement\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\n\nObservation\nOral questioning\nWritten test\n\n--- PDF PAGE 60 ---\nCORE COMPETENCIES\n(98 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform basic\npreventive\nmaintenance on\nspray equipment\nand booth\n1.1 Identify coating tools\nand equipment defects\n1.2 Perform basic\npreventive\nmaintenance servicing\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n 2. Prepare surface\nfor final coat\n2.1 Prepare materials,\n 2.2 Tools and equipment\n2.3 Prepare surface\n2.4 Perform good\nhousekeeping\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral Questioning\nWritten test\n3. Apply surface\ncoating using\nspray gun\nsystem\n\n 3.1 Prepare materials,\ntools and equipment\n3.2 Apply surface coating\n\nself –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nInterview\nWritten test\n\n--- PDF PAGE 61 ---\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET:\n\nThe training is based on curriculum developed from the\ncompetency standards;\nLearning is modular in its structure;\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\nTraining is based on work that must be performed;\nTraining materials are directly related to the competency standards\nand the curriculum modules;\nAssessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\nTraining is based both on and off-the-job components;\nTraining program allows for recognition of prior learning (RPL) or\ncurrent competencies;\nTraining allows for multiple entry and exit; and\nTraining programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\nThe dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n\nModular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery.\n\n--- PDF PAGE 62 ---\nPeer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n\nSupervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\nProject-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\nGood moral character\nAbility to communicate\nPhysically fit and mentally healthy\nCan perform basic mathematical computation and mensuration\n\n--- PDF PAGE 63 ---\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR FURNITURE\nFINISHING NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n5 pcs. Spray gun\n5\nSpray booth\n (dry type)\n25 liters Paints\n5 pcs. Viscosity cup\n1 unit Air compressors\n25 liters Thinner\n1 pc.\n Wet and / or dry\nthermometer\nI unit Regulator and filter\n13\nbottles\nColor stains\n5 pcs. Spray gun Wrenches\n1 unit Trolley\n12.5\nliters\nSealers\n5 pcs. Cleaning brushes\n5 units Racks\n12.5\nliters\nVarnish\n25 pcs. Pallet knife\n5 units Portable sander\n25 pcs. Sample coating board\n(12 “X12 “)\n25 pcs Sanding block\n5 units Working table\n75 pcs. Sand paper\n(240, 360, 600)\n25 pcs Brushes\n1 unit Dust collector\n1 liter\nPutty\n\n25\nunits\nPPE\n5 liters Paint remover\n5 liters Filler\n5 liters Glaze\n2 kilos Rags\n5 pcs\nSteel wool\n\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nContextual Learning\nLaboratory / Lecture Room\n\n40\n40\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n10\n10\nWash room\n20\n20\nCirculation area\n50\n50\nShop room\n\n60\n60\nTOTAL AREA\n200\n\n--- PDF PAGE 64 ---\n3.6 TRAINER’S QUALIFICATION FOR FURNITURE FINISHING\n NC II\n\nMust have undergone training on Training Methodology II (TM II)\nMust be a holder of National Certificate Level II or its equivalent\nGood moral character\nMust be computer literate\nMust be physically and mentally fit\n *Must have 1 year industry experience and/or teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement is\nissued for each unit of competency.\n\n--- PDF PAGE 65 ---"
