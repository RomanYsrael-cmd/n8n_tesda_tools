    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Furniture Finishing Level: NC II\n\nNominal Training Duration:\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and desirable\nwork attitude of a furniture finisher. It covers the basic, common and core\ncompetencies i.e. lay and repair floor and wall tiles, tile corners and curved\nsurfaces.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 57 ---\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 58 ---\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration and\ncalculation\n1.1 Select measuring\ninstruments\n1.2 Carry out\nmeasurements and\ncalculations\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n2. Interpret\nTechnical\nDrawing\n2.1 Analyze sign,\nsymbols and data\n2.2 Interpret technical\ndrawing and plans\n2.3 Apply freehand\nsketching\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n3. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n3.1 Identify and access\nspecification/\nmanuals\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n4. Comply with\nindustry (OH&S)\nguidelines and\nstandards\n4.1 Follow safe workplace\nprocedures for hazard\nidentification and risk\ncontrol\n4.2 Employ safe working\npractices\n4.3 Respond to accidents\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\n\nObservation\nOral questioning\nWritten test\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and equipment\n5.2 Perform basic\npreventive\nMaintenance\n5.3 Store tools and\nequipment\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\n\nObservation\nOral questioning\nWritten test\n\n--- PDF PAGE 59 ---\nUnit of\nCompetency\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Use hand tools\n6.1 Prepare hand tools\n6.2 Utilize hand tools\n6.3 Store hand tools\n\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n7. Apply quality\nstandards\n7.1 Assess quality of\nreceived materials or\ncomponents\n7.2 Assess own work\n7.3 Engage in process\nimprovement\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\n\nObservation\nOral questioning\nWritten test\n\n--- PDF PAGE 60 ---\nCORE COMPETENCIES\n(98 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform basic\npreventive\nmaintenance on\nspray equipment\nand booth\n1.1 Identify coating tools\nand equipment defects\n1.2 Perform basic\npreventive\nmaintenance servicing\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral questioning\nWritten test\n 2. Prepare surface\nfor final coat\n2.1 Prepare materials,\n 2.2 Tools and equipment\n2.3 Prepare surface\n2.4 Perform good\nhousekeeping\nSelf –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nOral Questioning\nWritten test\n3. Apply surface\ncoating using\nspray gun\nsystem\n\n 3.1 Prepare materials,\ntools and equipment\n3.2 Apply surface coating\n\nself –paced\ninstructions\nDiscussion\nPractical\nexercises\nObservation\nInterview\nWritten test\n\n--- PDF PAGE 61 ---"
