th the endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 39 ---\nUNIT TITLE:\nUSE HAND TOOLS\nUNIT CODE:\nFUR714202\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes on the\nsafe use, handling and maintenance of tools\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Plan and prepare for\n tasks to be undertaken\n1.1 Tasks to be undertaken are properly identified\n1.2 Appropriate hand tools are identified and selected\n according to the task requirements\n2. Prepare hand tools\n2.1 Appropriate hand tools are checked for proper operation\n and safety\n2.2 Unsafe or faulty tools are identified and marked for repair\n according to standard company procedure\n3. Use appropriate hand\n tools and test equipment\n3.1 Tools are used according to tasks undertaken\n3.2 All safety procedures in using tools are observed at all\n times and appropriate personal protective equipment\n (PPE) are used\n3.3 Malfunctions, unplanned or unusual events are reported\n to the supervisor\n4. Maintain hand tools\n4.1 Tools are not dropped to avoid damage\n4.2 Routine maintenance of tools undertaken according to\n standard operational procedures, principles and\n techniques\n4.3 Tools are stored safely in appropriate locations in\n accordance with manufacturer’s specifications or\n standard operating procedures\n\n--- PDF PAGE 40 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hand tools\n1.1 Hand tools for adjusting, dismantling, assembling,\n finishing, cutting.\n1.2 Tool set includes the following but not limited to: screw\n drivers, pliers, punches, wrenches, files\n2. Personal Protective\n Equipment (PPE)\n2.1 Gloves\n2.2 Protective eyewear\n2.3 Apron/overall\n3. Maintenance\n3.1 Cleaning\n3.2 Lubricating\n3.3 Tightening\n3.4 Simple tool repairs\n3.5 Hand sharpening\n3.6 Adjustment using correct procedures\n\n--- PDF PAGE 41 ---\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\nAssessment must show that the