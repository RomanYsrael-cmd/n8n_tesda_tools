\n1.1 Materials, tools and equipment are identified\naccording to classification and job requirements\n1.2 Non-functional tools and equipment are\nsegregated and labeled according to classification\n1.3 Safety of tools and equipment are observed in\naccordance with manufacturer's instructions\n1.4 Condition of PPE are checked in accordance with\nmanufacturer's instructions\n2. Perform basic preventive\nmaintenance\n2.1 Appropriate lubricants are identified according to\n types of equipment\n2.2 Tools and equipment are lubricated according to\n preventive maintenance schedule or manufacturer's\nspecifications\n2.3 Measuring instruments are checked and\n calibrated in accordance with manufacturer’s\n instructions\n2.4 Tools are cleaned and lubricated according to standard\n procedures\n2.5 Defective instruments, equipment and accessories are\n inspected and replaced According to manufacturer’s\n specifications\n2.6 Tools are inspected, repaired and replaced after use\n2.7 Work place is cleaned and kept in safe state in line with\n OHSA regulations\n3. Store tools and\nequipment\n\n3.1 Inventory of tools, instruments and equipment are\nconducted and recorded as per company practices\n3.2 Tools and equipment are stored safely in appropriate\n locations in accordance with manufacturer's\n specifications or company procedures\n\n--- PDF PAGE 36 ---\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\n 2.1 Cutting tools - hacksaw, crosscut saw,\n rip saw\n 2.2 Boring tools - auger, brace, grinlet, hand\n drill\n 2.3 Holding tools - vise grip, C-clamp, bench\n vise\n 2.4 Threading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n4. Forms\n4.1 Maintenance schedule forms\n4.2 