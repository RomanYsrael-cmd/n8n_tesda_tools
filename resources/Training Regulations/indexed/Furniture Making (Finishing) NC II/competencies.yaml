        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetencies\nAssessment must show that the candidate:\n1.1\nIdentified and described safety\n1.2\nWorking practices relating to all tasks undertaken in\nthe workplace\n1.3\nIdentified and selected appropriate equipment and\nsafety devices for particular workplace tasks and\nactivities\n1.4\nInterpreted hazard warnings and safety signs correctly\nand described the application of these warnings and\nsigns in the work activities\n1.5\nResponded to accidents\n1.6\nMaintained accident records\n2. Underpinning knowledge\n2.1\n5S of good housekeeping\n2.2\nGeneral OH & S principles, responsibilities and\nlegislations\n2.3\nGeneral ergonomic principles\n2.4\nOH & S requirements in relation to work safety\n2.5\nEnvironmental requirements relative to work safety\n2.6\nHazard identification\n2.7\nFirst Aid\n2.8\nAccident/hazard reporting\n3. Underpinning skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n3.3\nProblem-solving in emergency situation\n4. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the candidate:\n4.1\nObservation\n4.2\nQuestioning\n4.3\nPractical demonstration\n5. Resource implication\n\n5.1\nSafety signs\n5.2\nAccident reporting procedures\n5.3\nFirst Aid materials and guidelines\n5.4\nHousekeeping equipment and materials\n5.5\nSafety devices\n6. Context of Assessment\n6.1 Assessment may be conducted in the workplace or\n in a simulated environment\n\n--- PDF PAGE 35 ---\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :"
        },
        "source_text": "FUR714201\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to work safely in the workplace, interpret\nsafety signs and symbols and follow emergency procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Follow safe workplace\nprocedures for hazard\nidentification and risk\ncontrol\n1.1 Hazards in the work area are recognized and reported\n to designated personnel according to workplace\n procedures\n1.2 Workplace procedures and work instructions for\n controlling risks are followed accurately\n1.3 Workplace procedures for dealing with emergencies are\n followed whenever necessary within the scope of\n responsibilities and competencies\n1.4 All work areas are kept clean, free from obstacles and\n emergency exits are known and kept clear at all times\n1.5 All equipment and safety devices are used according\n to company or manufacturer’s procedures\n1.6 Occupational health and safety standards are applied\n at all times in daily work routines\n2. Employ safe working\npractices\n2.1 Hazard warnings and safety signs are recognized and\nobserved at all times\n2.2 Work is conducted within ergonomic guidelines\n2.3 All hazardous materials and equipment are handled in\naccordance with manufacturer’s guidelines and\nspecified safe handling guidelines\n2.4 Safe manual handling techniques and safe equipment\noperation techniques are employed at all times\n2.5 Potentially hazardous situations when identified,\nincluding faulty and dangerous equipment, are\nimmediately reported\n3. Respond to accidents\n3.1 Workplace accidents are identified\n3.2 Workplace emergency first aid procedures are followed\n\n--- PDF PAGE 31 ---\n4. Maintain accident\nrecords and statistics\n\n4.1 Accident/incident records maintained in accordance\n with standard operating procedures\n4.2 Records analyzed for trends or particular problem\n areas are identified\n\n--- PDF PAGE 32 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\nThese include but not limited to:\n1.1 Burns\n1.2 Falls\n1.3 Eye accidents\n1.4 Spills\n1.5 Explosion\n1.6 Obstructions\n1.7 Loose objects/fixtures\n1.8 Chemicals\n1.9 Faulty equipment\n1.10\nElectrical faults\n2. Designated personnel\n2.1 Assigned staff as OH & S representative\n2.2 Supervisors\n3. Emergencies\nEmergencies may include the following but not limited\nto:\n3.1 Fire\n3.2 Explosion\n3.3 Spills\n3.4 Falls\n4. Equipment and safety devices\n4.1 Protective eyewear\n4.2 Gloves\n4.3 Apron\n4.4 Ground strap\n4.5 Wrist strap\n4.6 Safety belt\n4.7 Hard hat\n4.8 Ear plug\n4.9 Finger cuts\n4.10 Electro static discharge (ESD) shoes\n5. OH & S standards\n5.1 Philippine Electrical Code\n5.2 Philippine OHS standards\n5.3 Philippine Environmental Standards\n\n--- PDF PAGE 33 ---\n6. Ergonomic guidelines\n6.1 Types of equipment used\n6.2 Appropriate furniture\n6.3 Seating posture\n6.4 Lifting posture\n6.5 Visual display unit screen brightness\n6.6 Manual handling\n7. Hazard warnings and safety\nsigns\n7.1 Internationally-recognized hazard warning\n signs and safety symbols\n7.2 Industry-recognized hazard warning signs and\n safety symbols\n\n--- PDF PAGE 34 ---\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetencies\nAssessment must show that the candidate:\n1.1\nIdentified and described safety\n1.2\nWorking practices relating to all tasks undertaken in\nthe workplace\n1.3\nIdentified and selected appropriate equipment and\nsafety devices for particular workplace tasks and\nactivities\n1.4\nInterpreted hazard warnings and safety signs correctly\nand described the application of these warnings and\nsigns in the work activities\n1.5\nResponded to accidents\n1.6\nMaintained accident records\n2. Underpinning knowledge\n2.1\n5S of good housekeeping\n2.2\nGeneral OH & S principles, responsibilities and\nlegislations\n2.3\nGeneral ergonomic principles\n2.4\nOH & S requirements in relation to work safety\n2.5\nEnvironmental requirements relative to work safety\n2.6\nHazard identification\n2.7\nFirst Aid\n2.8\nAccident/hazard reporting\n3. Underpinning skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n3.3\nProblem-solving in emergency situation\n4. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the candidate:\n4.1\nObservation\n4.2\nQuestioning\n4.3\nPractical demonstration\n5. Resource implication\n\n5.1\nSafety signs\n5.2\nAccident reporting procedures\n5.3\nFirst Aid materials and guidelines\n5.4\nHousekeeping equipment and materials\n5.5\nSafety devices\n6. Context of Assessment\n6.1 Assessment may be conducted in the workplace or\n in a simulated environment\n\n--- PDF PAGE 35 ---\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :"
