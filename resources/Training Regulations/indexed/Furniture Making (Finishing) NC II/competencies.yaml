 4.1.6 Stain \n4.2 Tools \n        4.2.1 Pallet knife \n        4.2.2 Sanding block \n        4.2.3 Brushes \n        4.2.4 Rags \n        4.2.5 Steel wool \n4.3 Equipment  \n        4.3.1 Portable sander \n        4.3.2 Working table  \n      \n5. Surface preparation \nprocedure \nMay include but not limited to: \n5.1 Sanding, sealing and base coating \n5.2 Sanding, staining and sealing  \n5.3 Sanding, filling and sealing \n5.4 Sanding, filling and staining  \n5.5 Sanding, filling and special finish\n\n--- PDF PAGE 47 ---\n6. Prepared items \n6.1 Furniture parts \n6.2 Semi-assembled parts \n6.3 Full-assembled furniture \n6.4 Fittings\n\n--- PDF PAGE 48 ---\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to comply with occupational health and  \n      safety requirements \n1.2 Demonstrates ability to prepare materials, tools and  \n      equipment following job specifications \n1.3 Demonstrates ability to perform surface preparation   \n      procedure \n1.4 Demonstrates ability to perform good housekeeping \n2. Underpinning Knowledge \nand Attitudes \n \n2.1 Occupational safety and health standards \n2.2 Surface preparation materials, tools and equipment types \n      and uses \n2.3 Job specifications or work requirement \n2.4 Follow good housekeeping \n \n3. Underpinning Skills \n3.1 Complying with occupational health and safety standards \n3.2 Using surface preparation materials, tools and equipment \n3.3 Following job specifications or work requirement \n3.4 Performing good housekeeping \n4. Resource Implications \nThe following resources MUST be provided \n4.1 Materials, tools and equipment relevant to the activity \n4.2 PPE \n4.3 Job  specifications \n5. Methods of Assessment\nCompetency MAYBE assessed using the following methods \n5.1 Observation of practical skills \n5.2 Oral questioning \n6. Context of Assessment \n6.1 Competency in this unit maybe assessed in the workplace  \n        or in a simulated environment.\n",
