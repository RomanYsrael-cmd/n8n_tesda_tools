        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to comply with occupational health\nand safety requirements\n1.2 Demonstrates ability to prepare materials, tools and\nequipment following manufacturer’s recommendations\nand job specifications\n1.3 Demonstrates ability to apply surface coating following the\nspecified volume per surface area\n1.4 Demonstrates ability to perform good housekeeping\n2. Underpinning Knowledge\nand Attitudes\n\n2.1 Occupational safety and health standards\n2.2 Coating materials, tools and equipment types and uses\n2.3 Interpret manufacturer’s recommendations\n2.4 Work piece standard requirements\n2.5 Follow good housekeeping\n2.6 Trade Mathematics\n3. Underpinning Skills\n3.1 Complying with occupational safety and health standards\n3.2 Using coating materials, tools and equipment\n3.3 Interpreting and following manufacturer’s\n recommendations\n3.4 Following work piece standard requirements\n3.5 Performing good housekeeping\n3.6 Applying Trade Mathematics\n\n4. Resource Implications\n The following resources MUST be provided\n4.1 Tools, equipment and materials relevant to the activity\n4.2 Workplace\n4.3 PPE\n5. Methods of Assessment\n Competency MAYBE assessed using the following methods\n5.1 Observation of practical skills\n5.2 Oral questioning\n5.3 Written test\n\n6. Context of Assessment\n6.1 Competency in this unit maybe assessed in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 53 ---\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE MAINTENANCE ON\nSPRAY EQUIPMENT AND BOOTH\nUNIT CODE :"
        },
        "source_text": "FUR714302\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required\nto apply surface coating using spray gun system.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Prepare materials, tools\n equipment\n1.1 Occupational safety and health requirements are\ncomplied with.\n1.2 Personal protective equipment are selected and used\nfollowing occupational health and safety requirements\n1.3 Work instruction is secured from appropriate personnel\nfollowing company rules and regulations.\n1.4 Materials, tools and equipment are prepared following\njob specifications and manufacturer’s\nrecommendations.\n2. Apply surface coating\n2.1 Tools and equipment are tested to conform with job\nspecifications.\n2.2 Spray gun system is activated according to\nmanufacturer’s recommendations.\n2.3 Finished items are moved following safe handling\nprocedure.\n3. Perform good\nhousekeeping\n3.1 Put away procedure is performed following company\nregulations\n3.2 Completion report is prepared and submitted to\nappropriate personnel following company standard\noperating procedure (SOP).\n3.3 Work area is cleaned following company SOP.\n\n--- PDF PAGE 50 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Occupational safety and\nhealth requirements\nMay include but not limited to:\n1.1 Spray booth is working properly\n1.2 Appropriate breathing apparatus or mask\n1.3 Appropriate gloves\n2. Personal protective\nequipment\nMay include but not limited to:\n2.1 Mask and breathing apparatus\n2.2 Apron\n2.3 Safety shoes\n2.4 Gloves\n2.5 Goggles\n3. Work instruction\n3.1 Verbal\n3.2 Written\n3.3 Actual sample\n4. Personnel\n4.1 Finishing Supervisor\n4.2 Production Manager\n4.3 Company Owner\n5. Materials, tools and\nequipment\nMay include but not limited to:\n5.1 Materials\n 5.1.1 Paints\n 5.1.2 Thinner\n 5.1.3 Color stains\n 5.1.4 Sealers\n 5.1.5 Varnish\n5.2 Tools\n 5.2.1 Spray gun\n 5.2.2 Viscosity cup\n 5.2.3 Wet and / or dry thermometer\n 5.2.4 Wrenches\n 5.2.5 Cleaning brushes\n5.3 Equipment\n 5.3.1 Spray booth\n 5.3.2 Air compressors\n 5.3.3 Regulator and filter\n6. Job specifications\nMay include but not limited to:\n6.1 Coating type\n 6.1.1 Base coat\n 6.1.2 In-between coat\n 6.1.2 Final or top coat\n\n--- PDF PAGE 51 ---\n7. Spray gun system\n7.1 Pressure-feed system\n7.2 Siphon-feed system\n7.3 High volume low pressure\n7.4 Airless system\n7.5 Air-assisted airless system\n8. Finished items\nMay include but not limited to:\n8.1 Furniture parts\n8.2 Semi-assembled parts\n8.3 Full-assembled furniture\n8.4 Fittings\n 8.4.1 Handles\n 8.4.2 Hinges\n\n9. Safe handling procedure\nMay include but not limited to the use of:\n9.1 Conveyors\n9.2 Pallet trucks\n9.3 Trolleys\n9.4 Racks\n\n--- PDF PAGE 52 ---\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to comply with occupational health\nand safety requirements\n1.2 Demonstrates ability to prepare materials, tools and\nequipment following manufacturer’s recommendations\nand job specifications\n1.3 Demonstrates ability to apply surface coating following the\nspecified volume per surface area\n1.4 Demonstrates ability to perform good housekeeping\n2. Underpinning Knowledge\nand Attitudes\n\n2.1 Occupational safety and health standards\n2.2 Coating materials, tools and equipment types and uses\n2.3 Interpret manufacturer’s recommendations\n2.4 Work piece standard requirements\n2.5 Follow good housekeeping\n2.6 Trade Mathematics\n3. Underpinning Skills\n3.1 Complying with occupational safety and health standards\n3.2 Using coating materials, tools and equipment\n3.3 Interpreting and following manufacturer’s\n recommendations\n3.4 Following work piece standard requirements\n3.5 Performing good housekeeping\n3.6 Applying Trade Mathematics\n\n4. Resource Implications\n The following resources MUST be provided\n4.1 Tools, equipment and materials relevant to the activity\n4.2 Workplace\n4.3 PPE\n5. Methods of Assessment\n Competency MAYBE assessed using the following methods\n5.1 Observation of practical skills\n5.2 Oral questioning\n5.3 Written test\n\n6. Context of Assessment\n6.1 Competency in this unit maybe assessed in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 53 ---\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE MAINTENANCE ON\nSPRAY EQUIPMENT AND BOOTH\nUNIT CODE :"
