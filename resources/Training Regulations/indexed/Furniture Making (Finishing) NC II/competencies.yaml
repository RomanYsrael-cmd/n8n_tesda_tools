an, job requirements and\nclassifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn workplan following specifications\n1.5 Determined job specifications based on\nworking/technical drawing\n\n2. Underpinning\nknowledge\n\n2.1 TRADE MATHEMATICS\n 2.1.1 Linear measurement\n 2.1.2 Dimension\n 2.1.3 Unit conversion\n2.2 BLUEPRINT READING AND PLAN\n SPECIFICATION\n 2.2.1 Electrical, mechanical plan, symbols and\n abbreviations\n 2.2.2 Drawing standard symbols\n2.3 TRADE THEORY\n 2.3.1 Basic technical drawing\n 2.3.2 Types technical plans\n 2.3.3 Various types of drawings\n 2.3.4 Notes and specifications\n3. Underpinning skills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n5. Methods of assessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n5.3 Written test related to underpinning knowledge\n\n--- PDF PAGE 26 ---\n6. Context of\nassessment\n6.1 Competency assessment may occur in the workplace or in any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\nwhether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 27 ---\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :\nCON311201\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to specifications\nand manuals and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed as per\n job requirements\n1.2 Version and date of manual are checked to ensure that\ncorrect specification and procedures are identified\n2. Interpret manuals\n2.1 Relevant sections, chapters of specifications/ manuals\n are located in relation to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\n in accordance with industry practices\n3. Apply information in\n manual\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\n manufacturer's specification\n3.3 Manual data are applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted\n in accordance with information contained on the manual\n or specifications\n4. Store manuals\n4.1 Manual or specification is stored appropriately to prevent\ndamage, ready access and updating of information when\nrequired in accordance with company requirements\n\n--- PDF PAGE 28 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Procedures,\nSpecifications and\nManuals of Instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 29 ---\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\n requirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in construction sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning\nskills\n3.1 Reading and comprehension skills required to identify and\n interpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to construction sector\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in accordance\n with the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\n environment\n\n--- PDF PAGE 30 ---\nUNIT TITLE:\nAPPLY OCCUPATIONAL HEALTH AND SAFETY (OH&S)\nPRACTICES AND 5S IN THE WORKPLACE\nUNIT CODE:\nFUR714201\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to work safely in the workplace, interpret\nsafety signs and symbols and follow emergency procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Follow safe workplace\nprocedures for hazard\nidentification and risk\ncontrol\n1.1 Hazards in the work area are recognized and reported\n to designated personnel according to workplace\n procedures\n1.2 Workplace procedures and work instructions for\n controlling risks are followed accurately\n1.3 Workplace procedures for dealing with emergencies are\n followed whenever necessary within the scope of\n responsibilities and competencies\n1.4 All work areas are kept clean, free from obstacles and\n emergency exits are known and kept clear at all times\n1.5 All equipment and safety devices are used according\n to company or manufacturer’s procedures\n1.6 Occupational health and safety standards are applied\n at all times in daily work routines\n2. Employ safe working\npractices\n2.1 Hazard warnings and safety signs are recognized and\nobserved at all times\n2.2 Work is conducted within ergonomic guidelines\n2.3 All hazardous materials and equipment are handled in\naccordance with manufacturer’s guidelines and\nspecified safe handling guidelines\n2.4 Safe manual handling techniques and safe equipment\noperation techniques are employed at all times\n2.5 Potentially hazardous situations when identified,\nincluding faulty and dangerous equipment, are\nimmediately reported\n3. Respond to accidents\n3.1 Workplace accidents are identified\n3.2 Workplace emergency first aid procedures are followed\n\n--- PDF PAGE 31 ---\n4. Maintain accident\nrecords and statistics\n\n4.1 Accident/incident records maintained in accordance\n with standard operating procedures\n4.2 Records analyzed for trends or particular problem\n areas are identified\n\n--- PDF PAGE 32 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\nThese include but not limited to:\n1.1 Burns\n1.2 Falls\n1.3 Eye accidents\n1.4 Spills\n1.5 Explosion\n1.6 Obstructions\n1.7 Loose objects/fixtures\n1.8 Chemicals\n1.9 Faulty equipment\n1.10\nElectrical faults\n2. Designated personnel\n2.1 Assigned staff as OH & S representative\n2.2 Supervisors\n3. Emergencies\nEmergencies may include the following but not limited\nto:\n3.1 Fire\n3.2 Explosion\n3.3 Spills\n3.4 Falls\n4. Equipment and safety devices\n4.1 Protective eyewear\n4.2 Gloves\n4.3 Apron\n4.4 Ground strap\n4.5 Wrist strap\n4.6 Safety belt\n4.7 Hard hat\n4.8 Ear plug\n4.9 Finger cuts\n4.10 Electro static discharge (ESD) shoes\n5. OH & S standards\n5.1 Philippine Electrical Code\n5.2 Philippine OHS standards\n5.3 Philippine Environmental Standards\n\n--- PDF PAGE 33 ---\n6. Ergonomic guidelines\n6.1 Types of equipment used\n6.2 Appropriate furniture\n6.3 Seating posture\n6.4 Lifting posture\n6.5 Visual display unit screen brightness\n6.6 Manual handling\n7. Hazard warnings and safety\nsigns\n7.1 Internationally-recognized hazard warning\n signs and safety symbols\n7.2 Industry-recognized hazard warning signs and\n safety symbols\n\