ecorded and/or\nreported to the supervisor concerned in accordance with\nworkplace procedures\n1.5 Faulty materials or components are replaced in\naccordance with workplace procedures\n2. Assess own work\n2.1 Documentation relative to quality within the company is\nidentified and used\n2.2 Completed work is checked against workplace standards\nrelevant to the task undertaken\n2.3 Faulty pieces are identified and isolated\n2.4 Information on the quality and other indicators of\nproduction performance is recorded in accordance with\nworkplace procedures\n2.5 In cases of deviations from specified quality standards,\ncauses are documented and reported in accordance\nwith the workplace’ standards operating procedures\n3. Engage in quality\n improvement\n3.1 Process improvement procedures are participated in\nrelation to workplace assignment\n3.2 Work is carried out in accordance with process\nimprovement procedures\n3.3 Performance of operation or quality of product or service\nto ensure customer satisfaction is monitored\n\n--- PDF PAGE 43 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials/components\n1.1 Materials may include but not limited to:\n 1.1.1 wires\n 1.1.2 cables, soldering lead\n 1.1.3 electrical tape\n1.2 Components may include but not limited to:\n 1.2.1 ICs\n 1.2.2 Diodes\n2. Faults\n2.1 Faults may include but not limited to:\n2.2 Components/materials not according to specification\n2.3 Components/materials contain manufacturing defects\n2.4 Components/materials do not conform with government\nregulation i.e., PEC, environmental code\n2.5 Components/materials have safety defect\n3. Documentation\n3.1 Organization work procedures\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4. Quality standards\nQuality standards may relate but not limited to the following:\n4.1 Materials\n4.2 Component parts\n4.3 Final product\n4.4 Production processes\n5. Customer\n5.1 Co-worker\n5.2 Supplier\n5.3 Client\n5.4 Organization receiving the product or service\n\n--- PDF PAGE 44 ---\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\n standard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\n standard operating procedures\n1.4 Carried out work in accordance with the process\n improvement procedures\n2. Underpinning knowledge\n2.1 Relevant production processes, materials and\n products\n2.2 Characteristics of materials/component parts used\n in electronic production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\n processes\n2.6 Fault identification and reporting\n2.7 Quality improvement process\n3. Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\n defined work procedures\n3.3 Carry out work in accordance with OHS policies and\n procedures\n4. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the candidate:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n5. Resource implication\n\nMaterials and component parts and equipment to\nbe used in a real or simulated electronic production\nsituation\n6. Context of Assessment\n\n6.1 Assessment may be conducted in the workplace\n or in a simulated environment\n\n--- PDF PAGE 45 ---\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE SURFACE FOR FINAL COAT\nUNIT CODE :\nFUR714301\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nprepare surface for final coating.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Prepare materials, tools\nand equipment\n1.1 Occupational safety and health requirements are\ncomplied with.\n1.2 Personal protective equipment are selected and used