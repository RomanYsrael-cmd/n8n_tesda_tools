        "source_text": "CON311203\nUNIT DESCRIPTOR:\nThis unit includes identifying caring, handling and use of\nmeasuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Select measuring\n instruments\n1,1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected\naccording to job requirements\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job\nrequirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks\n2.5 Numerical computation is self-checked and corrected for\n accuracy Instruments are read to the limit of accuracy of\n the tool\n3. Maintain measuring\ninstruments\n\n3.1 Measuring instruments must kept free from corrosion\n3.2 Measuring instruments not dropped to avoid damage\n3.3 Measuring instruments cleaned before and after using\n\n--- PDF PAGE 21 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring instruments\nMeasuring instruments\nincludes:\nMultitester\nMicrometer (In-out, depth)\nVernier caliper (Out, inside)\nDial Gauge with Mag. Std.\nPlastigauge\nStraight Edge\nThickness gauge\n\nTorque Gauge\nSmall Hole gauge\nTelescopic Gauge\nTry square\nProtractor\nCombination gauge\nSteel rule\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 22 ---\nEVIDENCE GUIDE\n1. Critical aspect of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations\n1.3 Maintained measuring instruments\n2. Underpinning\n knowledge and\n attitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\n figures\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction,\n multiplication and Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\n geometric figures\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n5. Methods of\n Assessment\n\nCompetency should be assessed by:\n5.1 Direct observation\n5.2 Written test\n5.3 Interview\n5.4 Practical application\n\nAssessment of underpinning knowledge and practical skills\n May be combined\n6. Context of\n Assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 23 ---\nUNIT OF COMPETENCY:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\nUNIT CODE :"
