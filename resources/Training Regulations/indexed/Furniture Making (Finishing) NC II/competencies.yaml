erpret and apply  \n      defined work procedures \n3.3 Carry out work in accordance with OHS policies and  \n      procedures  \n4.  Method of assessment \nThe assessor may select two (2) of the following \nassessment methods to objectively assess the candidate: \n4.1 Observation \n4.2 Questioning \n4.3 Practical demonstration \n5. Resource implication \n \nMaterials and component parts and equipment to  \nbe used in a real or simulated electronic  production \nsituation \n6. Context of Assessment \n \n6.1 Assessment may be conducted in the workplace  \n       or in a simulated environment\n",
