        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to identify spray gun equipment and\nbooth major and minor defects\n1.2 Demonstrates ability to perform basic preventive\nmaintenance servicing for spray gun equipment and booth\nminor defects\n1.3 Demonstrates ability to accomplish maintenance report\n2. Underpinning Knowledge\nand Attitudes\n\n2.1 Spray gun equipment and booth minor and major defects\n2.2 Basic preventive maintenance servicing procedure for\n minor defects\n2.3 Company standard operating procedure\n3. Underpinning Skills\n3.1 Identifying and servicing spray gun equipment and booth\n minor defects\n3.2 Identifying and reporting spray gun equipment and booth\n major defects\n3.3 Complying with company standard operating procedures\n4. Resource Implications\nThe following resources MUST be provided\n4.1 Defective spray gun equipment and booth\n4.2 Basic hand tools and repair kit\n4.3 Maintenance report form\n5. Methods of Assessment\nCompetency MAYBE assessed using the following methods\n5.1 Observation of practical skills\n5.2 Oral questioning\n6. Context of Assessment\n6.1 Competency in this unit maybe assessed in the workplace\n or in a simulated environment.\n\n--- PDF PAGE 56 ---"
        },
        "source_text": "FUR714303\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nperform basic preventive maintenance servicing for spray gun\nsystem and booth.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify defects\n1.1 Occupational safety and health requirements are\n complied with\n1.2 Personal protective equipment are selected and used\n following occupational health and safety requirements\n1.3 Spray gun equipment and booth minor defects are\n identified following company standard operating procedure\n (SOP)\n1.4 Spray gun equipment and booth major defects are\n identified and reported following SOP\n2. Perform basic preventive\nmaintenance servicing\n2.1 Basic hand tools and repair kit are prepared according\nto job requirements\n2.2 Basic preventive maintenance servicing for spray gun\nequipment and booth is performed according to job\nrequirements\n3. Prepare maintenance\nreport\n3.1 Maintenance report is accomplished to appropriate\npersonnel following company SOP\n3.2 Maintenance report is submitted to appropriate personnel\nfollowing company SOP\n\n--- PDF PAGE 54 ---\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Personal protective\nequipment\nMay include but not limited to:\n1.1 Mask and breathing apparatus\n1.2 Apron\n1.3 Safety shoes\n1.4 Gloves\n1.5 Goggles\n2. Spray gun equipment and\nbooth minor defects\nMay include but not limited to:\n2.1 Clogged spray gun\n 2.2 Worn-out gaskets\n 2.3 Broken spring\n 2.4 Saturated and worn-out filter\n\n3. Spray gun equipment and\nbooth major defects\nMay include but not limited to:\n3.1 Burned motor suction system\n3.2 Defective water pump\n3.3 Defective air compressor\n3.4 Leaks in hoses and tubes\n3.5 Defective air filter\n3.6 Busted lights\n4. Basic hand tools and\nrepair kit\nMay include but not limited to:\n4.1 Basic hand tools\n 4.1.1 Spray gun wrench\n4.2 Repair kit\n 4.2.1 Nozzle\n 4.2.2 Gasket\n 4.2.3 Spring\n5. Basic preventive\nmaintenance servicing\n5.1 Clean clogged spray gun\n5.2 Replace worn-out gaskets\n5.3 Replace broken spring\n5.4 Replace filter\n5.5 Replace damaged nozzle\n6. Personnel\nMay include but not limited to:\n6.1 Maintenance\n6.2 Finishing supervisor\n6.3 Production manager\n\n--- PDF PAGE 55 ---\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to identify spray gun equipment and\nbooth major and minor defects\n1.2 Demonstrates ability to perform basic preventive\nmaintenance servicing for spray gun equipment and booth\nminor defects\n1.3 Demonstrates ability to accomplish maintenance report\n2. Underpinning Knowledge\nand Attitudes\n\n2.1 Spray gun equipment and booth minor and major defects\n2.2 Basic preventive maintenance servicing procedure for\n minor defects\n2.3 Company standard operating procedure\n3. Underpinning Skills\n3.1 Identifying and servicing spray gun equipment and booth\n minor defects\n3.2 Identifying and reporting spray gun equipment and booth\n major defects\n3.3 Complying with company standard operating procedures\n4. Resource Implications\nThe following resources MUST be provided\n4.1 Defective spray gun equipment and booth\n4.2 Basic hand tools and repair kit\n4.3 Maintenance report form\n5. Methods of Assessment\nCompetency MAYBE assessed using the following methods\n5.1 Observation of practical skills\n5.2 Oral questioning\n6. Context of Assessment\n6.1 Competency in this unit maybe assessed in the workplace\n or in a simulated environment.\n\n--- PDF PAGE 56 ---"
      }
