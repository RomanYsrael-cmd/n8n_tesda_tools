      "term": "Includes road testing, oil leakage, functionality, etc",
      "definition": "6. Maintenance the regular or periodic maintenance servicing of vehicles to keep it in top condition. 7. Out of standard worn-out, unserviceable components, not conforming to manufacturer’s standard. 8. Overhaul take apart a major automobile component in order to examine it and repair/replace a part if necessary to bring back the major component to working condition. 9. Repair fix or return to working condition a part/component. It refers to cleaning, adjustment, and replacement. 10. Service the act of rendering maintenance service and repair/replacement of parts of an automobile to keep it in top condition."
