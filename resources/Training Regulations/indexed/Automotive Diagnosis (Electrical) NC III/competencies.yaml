        "source_text": "--- PDF PAGE 91 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  87 \n \nUNIT OF COMPETENCY \n: \nDIAGNOSE AND REPAIR IMMOBILIZER SYSTEM \n \n \n \nUNIT CODE \n: \nALT723371 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitude \nrequired to prepare, diagnose, and repair of \nimmobilizer. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare to \ndiagnose and \nrepair Immobilizer \nSystem \n1.1  Safety practices are \napplied following \nOSHS. \n1.2  Job requirements \nare determined \nfrom workplace \ninstructions. \n1.3  Diagnosis \ninformation is \nsourced and \ninterpreted \naccording to \nworkplace \nprocedures. \n1.4  Hazards associated \nwith the work are \nidentified and risks \nare managed \nfollowing industry \ncriteria. \n1.5  Tools and \nequipment are \nselected and \nchecked for \nserviceability \naccording to \nindustry criteria. \n1.6  Defective tools and \nequipment are \nreported following \nworkplace \nprocedures. \n1.7  Supplies and \nmaterials, and \nelectrical \ncomponent parts \nare prepared \nfollowing workplace \nprocedures. \n1.1 OSHS \n1.2 Waste \nmanagement \n1.3 Sourcing out and \ninterpretation of \nrepair information \n1.4 Service/Repair \nmanual \n1.5 Tools, equipment, \nsupplies and \nmaterials in \ninspecting and \nrepairing \nImmobilizer \nsystem \nInterpretation of \njob requirements \n1.6 Different job \nrequirements \n1.7 Serviceability of \ntools and \nequipment \n1.8 Work hazards \n1.9 Repair Order \nchecklist \n1.10 Identification and \nfunction of \nImmobilizer \nsystem \n1.1 Interpreting job \nrequirements \nfrom workplace \ninstructions \n1.2 Clarifying \ninstructions \n1.3 Locating \nappropriate \nsources of \ninformation \n1.4 Selecting and \nchecking tools \nand equipment \n1.5 Reporting \ndefective tools \nand equipment \n1.6 Preparing of \nsupplies and \nmaterials \n1.7 Applying safety \npractices\n\n--- PDF PAGE 92 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  88 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Diagnose \nImmobilizer \nSystem \n2.1  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n2.2  Diagnostic \nsymptoms are \ndetermined and \nanalyzed using \ntroubleshooting \nguide, repair \nmanual, technical \ninformation sheet \nand most \nappropriate to the \ncircumstances. \n2.3  Diagnostic tests are \ncarried out \naccording to \nindustry criteria. \n2.4  Faults are identified \nbased on \ndiagnostic test. \n2.5  Diagnostic findings \nand \nrecommendations \nare prepared and \nreported according \nto industry criteria. \n2.1 Diagnostic \nprocedures for \nImmobilizer \nSystem \n2.2 Identification and \nfunction of \nImmobilizer \nSystems \n2.3 Mensuration \n2.4 Arithmetic \noperations \n2.5 Use of measuring \ndevices \n2.6 Reporting \nprocedures \n2.7 OSHS \n2.8 Wearing of PPEs \n2.9 Industry criteria \n2.1 Analyzing \ndiagnostic \nsymptoms \n2.2 Interpreting \ninformation from \nmanufacturer and \nworkshop \n2.3 Interpreting and \ncomparing \ndiagnostic data \nusing trouble \nshooting guide \nand \nmanufacturer’s \nmanual \n2.4 Diagnosing \nImmobilizer \nSystem \n2.5 Reporting \ninspection \nfindings, \nrecommendation \nand repair \ninstructions \n2.6 Applying safety \npractices \n2.7 Mensuration skills \n2.8 Applying \narithmetic \noperations \n3.  Repair Immobilizer \nSystem \n3.1  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n3.2  Repairs are carried \nout according to \nmanufacturer’s \nmanual. \n3.3  Repair options and \nsolutions are \nanalyzed and \nselected based on \nmanufacturer’s \nmanual and \ncircumstances at \nhand. \n3.4  Post-service \ntesting is carried \n3.1 Harness assembly \n3.2 Different repairs \nfor Immobilizer \nSystem \n3.3 Identification and \nfunction of \nImmobilizer \nSystem \n3.4 Arithmetic \noperations \n3.5 Mensuration \n3.6 Use of measuring \ndevices \n3.7 Service/Repair \nManual \n3.8 Post-service \ntesting for \nImmobilizer \nSystem \n3.1 Workshop \nliterature  \n3.2 Applying safety \npractices \n3.3 Mensuration skills \n3.4 Applying \narithmetic \noperations \n3.5 Repairing \nImmobilizer \nSystem  \n3.6 Performing post- \nservice testing\n\n--- PDF PAGE 93 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  89 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nout according to \nworkplace \nprocedures \n3.9 Isolation and \nelimination \napproach  \n3.10 OSHS \n3.11 Wearing of PPEs \n3.12 Accomplishment \nof Repair Order \n4.  Complete work \nprocesses \n4.1  Final inspection is \nconducted based \non workplace \nprocedure. \n4.2  Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace \nprocedure. \n4.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n4.4  Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n4.5  Tools and \nequipment are \nchecked and stored \naccording to \nworkplace \nprocedures. \n4.6  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n4.1 Final inspection \nprocedure: \n4.1.1 Visual \ninspection \n4.1.2 Checking of \ntightening of \ntorque \n4.2 Turn-over of \nvehicle \n4.3 Accomplishment \nof repair order and \nother forms \n4.3.1 Job done \n4.4 OSHS \n4.5 Wearing of PPEs \n4.6 3Rs \n4.7 5S of Good \nHousekeeping \n4.8 Waste \nmanagement \n4.9 Checking and \nstorage of tools \nand equipment \n4.10 Workplace \ndocuments \n4.1 Filling out \nworkplace \ndocumentation \n4.2 Conducting final \ninspection \n4.3 Performing \nvehicle turn-over \n4.4 Restoring work \narea \n4.5 Managing wastes \n4.6 Checking and \nstoring tools and \nequipment \n4.7 Wearing of PPEs \n4.8 Applying safety \npractices\n\n--- PDF PAGE 94 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  90 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job requirements \nJob requirements may include: \n1.1   Inspection of Immobilizer System \n1.2   Replacement of sensor \n1.3   Replacement of actuator \n1.4   Replacement of electronic control unit \n1.5   Repair of electrical wirings and connectors \n1.6   Inspection of system circuit \n1.7   Programming of ECU \n2.  Industry criteria \nIndustry criteria may include: \n2.1   Manufacturer specifications \n2.2   Repair manual \n2.3   Workplace procedures \n2.4   Safety and environmental requirements \n2.5   Service history \n3.  Tools and equipment \nTools and equipment may include: \n3.1   Tools: \n3.1.1   Scan Tools \n3.1.2   Standard technician hand tools \n3.1.3   Digital multi - tester \n3.1.4   Battery Tester \n3.1.5   Soldering kit \n \n3.2   Equipment: \n3.2.1   Battery Charger \n3.2.2   Trouble light \n4.  Supplies and materials \nSupplies and materials may include: \n4.1   Rags \n4.2   Grease \n4.3   Contact Cleaners  \n4.4   Penetrating oil \n4.5   Soldering Paste \n4.6   Soldering led \n4.7   Electrical tape  \n4.8   Shrinkable tube  \n4.9   Vehicle Protective Kit (VPK) \n4.10 Sand Paper \n4.11 PPEs \n5.  Electrical component \nparts \nElectrical component parts may include: \n5.1   Immobilizer ECU \n5.2   Connectors and terminals \n5.3   Wires \n5.4   Actuators and sensors \n5.5   Transponder key \n6.  Trouble shooting guide \nTrouble shooting guide includes: \n6.1   Verification \n6.2   Determine  \n6.3   Analyze\n\n--- PDF PAGE 95 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  91 \n \nVARIABLE \nRANGE \n6.4   Isolate \n6.5   Repair \n6.6   Confirm \n7.  Technical information \nsheet \nTechnical information sheet may include: \n7.1   Service bulletin \n7.2   Technical service information  \n7.3   Recall information \n8.  Repair of Immobilizer \nSystem \nRepair of Immobilizer System may include: \n8.1   Removal and installation of immobilizer sensors \n8.2   Removal and installation of immobilizer actuators \n8.3   Soldering of wires \n8.4   Replacement of connectors and terminals \n8.5   Replacement of immobilizer ECU \n8.6   Programming of ECU \n9.  Post- service testing \nPost- service testing may include: \n9.1   Inspection for functionality \n9.2   Inspection for warning lights \n10. Workplace documents \nWorkplace documents may include: \n10.1 Repair order \n10.2 Diagnostic form\n\n--- PDF PAGE 96 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  92 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared to diagnose and repair Immobilizer System. \n1.1.1   Applied safety practices. \n1.1.2   Determined job requirements. \n1.1.3   Sourced and interpreted diagnosis information. \n1.1.4   Identified hazards and managed risks. \n1.1.5   Selected and checked tools and equipment. \n1.1.6   Reported defective tools and equipment. \n1.1.7   Prepared supplies and materials, and electrical \ncomponent parts. \n \n1.2   Diagnosed Immobilizer System. \n1.2.1   Applied safety practices. \n1.2.2   Determined and analyzed diagnostic symptoms. \n1.2.3   Carried out diagnostic tests. \n1.2.4   Identified faults. \n1.2.5   Prepared and reported diagnostic findings and \nrecommendations. \n \n1.3   Repaired Immobilizer System. \n1.3.1   Applied safety practices. \n1.3.2   Carried out repairs. \n1.3.3   Analyzed and selected repair options and solutions. \n1.3.4   Carried out post-service testing. \n \n1.4   Completed work processes. \n1.4.1   Conducted final inspection. \n1.4.2   Turned-over vehicle to immediate superior. \n1.4.3   Restored work. \n1.4.4   Managed wastes. \n1.4.5   Checked and stored tools and equipment. \n1.4.6   Accomplished workplace. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Actual or simulated workplace \n2.2   Tools, materials and equipment needed to perform the \nrequired task \n2.3   References and manuals  \n2.4   PPEs \n2.5   Training vehicle \n2.6    First Aid Kit \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration/Observation with Oral Questioning \n3.2   Written Test \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
