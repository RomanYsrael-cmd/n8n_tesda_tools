        "source_text": "--- PDF PAGE 53 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  49 \n \nUNIT OF COMPETENCY \n: \nMOVE AND POSITION VEHICLE \n \n \n \nUNIT CODE \n: \nALT832212 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit involves the skills and knowledge and \nattitudes required to move and position vehicle \nsafely including systematic and efficient control of all \nvehicle functions. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare vehicle for \noperation \n1.1  Vehicle multi point \ninspection is \nconducted \naccording to \nindustry practice. \n1.2  Cockpit Drill is \nperformed \naccording to \nindustry practice. \n1.3  Vehicle is start-up \nfollowing owner’s \nmanual. \n1.4  Parking brake is \nengaged according \nto industry practice. \n● Revolutions per \nminute during idle \n● Manual, automatic \nand CVT \nTransmission \n● Vehicle parts, \ncomponents and \nfunctions  \n● Inspection \nprocedures \n● Owner’s manual \n● Safety procedures \n● Performing Cockpit \nDrill \n● Conducting \nVehicle Multi point \ninspection \n● Starting the engine \n● Using owner’s \nmanual \n2.  Position vehicle \n2.1  Workshop \nhazards are \nidentified and \navoided as per \nstandard operating \nprocedures. \n2.2  Vehicle is moved \naccording to \nOccupational \nHealth and Safety \nStandards. \n2.3  Workshop rules and \nregulations are \nrecognized \naccording to \nstandard \nprocedures. \n● Revolutions per \nminute in running \ncondition \n● Kilometer per hour \n● Estimation/ timing \n● Manual, automatic \nand CVT \nTransmission \n● Diesel, Gasoline and \nEV engines \n● Vehicle parts, \ncomponents and \nfunctions  \n● Defensive driving \n● Owner’s Manual \n● Safety procedures \n● Skills in positioning \nvehicle \n● Vehicle positioning \nestimation skill \n● Identifying \nworkshop signs \nand markin