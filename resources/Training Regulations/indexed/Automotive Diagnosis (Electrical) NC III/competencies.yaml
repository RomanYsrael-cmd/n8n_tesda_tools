fety practices \n● Following manuals \n2.  Retrieve and \nwithdraw parts and \nconsumables \n2.1  Requisition slip is \nprepared according \nto identified parts \nand consumables. \n2.2  Withdrawal of parts \nand materials are \nrecorded. \n2.3  Quantity of parts \nand consumables \n● Job requirements \n● Safety practices \n● Understanding \nmanuals \n● Hazardous parts and \nconsumables \n● Solid waste \nmanagement act \n(RA 6969) \n● Reading and \ninterpreting \nrequisition slip \n● Validating quantity \nof parts and \nmaterials \n● Handling parts and \nconsumables\n\n--- PDF PAGE 71 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  67 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nare validated \naccording to job \nrequirements \n2.4  Parts and materials \nare handled \nfollowing safety \nprocedures. \n● Wearing of PPE’s \n● Updated types of \nparts & \nconsumables for \nproper usage \n3.  Complete work \nprocess \n3.1  Used parts and \nconsumables are \nlabeled and \nsegregated \n3.2  Used parts are \npacked and \nreturned to \ncustomers \n3.3  Consumables are \ncollected for \nrecycling \n3.4  PPEs are worn \nfollowing OSHS. \n3.5  Wastes are \ndisposed according \nto RA 6969. \n● Labeling and \nsegregation of used \nparts and \nconsumables \n● Job requirements \n● Safety practices \n● 3Rs \n● Solid waste \nmanagement act \n(RA 6969) \n● Wearing of PPE’s \n● Waste segregation \nand disposal of \nparts & \nconsumables \naccording to RA \n6969\n\n--- PDF PAGE 72 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  68 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Parts and consumables \nMay include: \n1.1   Engine oil  \n1.2   Clutch fluid  \n1.3   Transmission oil  \n1.4   Differential oil  \n1.5   Power steering fluid  \n1.6   Brake fluid  \n1.7   Engine coolant  \n1.8   Engine oil filter \n1.9   Fuel filter \n1.10 Air cleaner element \n1.11 Feed pump strainer \n1.12 Sparkplugs (Gasoline engine) \n1.13 Battery \n1.14 Air cleaner \n1.15 Tire \n1.16 Wiper blade \n1.17 A/C pollen filter \n1.18 Bulb \n1.19 Brake pad/brake shoe \n1.20 Clutch lining \n2.  Determining parts and \nconsumables \nMay include: \n2.1  Quantity \n2.2  Quality \n3.  Indirect materials \nMay include: \n3.1  Rags \n3.2  Saw dust \n3.3  Cleaning fluids \n3.4  Sand paper \n4.  Hazardous parts \nconsumables \nMay include: \n4.1  Batteries \n4.2  Used oil \n4.3  Used fluids \n4.4  Used coolant \n4.5  Used parts \n4.6  Used oil filter \n5.  Wastes \nMay include: \n5.1  Contaminated consumables \n5.2  Contaminated parts\n\n--- PDF PAGE 73 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  69 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Identified parts and consumables \n1.2  Retrieved and withdrawn parts and consumables \n1.3  Completed work process \n1.4  Applied safety practices \n2.  Resource \nimplications \nThe following resources should be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Materials relevant to the activity  \n2.3  Repair manuals and related reference materials \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1  Direct observation  \n3.2  Interview \n3.3  Written examination \n3.4  Demonstration with oral questioning \n3.5  Third party report \n4.  Context of \nAssessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
