 \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Edit, format and \ncheck information \n3.1 Basic editing \ntechniques are used  \n3.2 Accuracy of \ndocuments are \nchecked  \n3.3 Editing and \nformatting tools and \ntechniques are used \nfor more complex \ndocuments  \n3.4 Proof reading \ntechniques is used \nto check that \ndocuments look \nprofessional \n3.1 Basic file-handling \ntechniques \n3.2 Techniques in \nchecking \ndocuments \n3.3 Techniques in \nediting and \nformatting \n3.4 Proof reading \ntechniques  \n \n3.1 Using basic file-\nhandling \ntechniques is \nused for the \nsoftware \n3.2 Using different \ntechniques in \nchecking \ndocuments \n3.3 Applying editing \nand formatting \ntechniques \n3.4 Applying proof \nreading \ntechniques\n\n--- PDF PAGE 34 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  30 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1. \nProperty  \n1.2. \nOrganizational \n1.3. \nTechnical reference \n2. Technical information \nMay include: \n2.1. \npaper based  \n2.2. \nelectronic \n3. Software   \nMay include: \n3.1. \nspreadsheets  \n3.2. \ndatabases \n3.3. \nword processing \n3.4. \n presentation  \n4. Sources \nMay include: \n4.1. \nother IT systems \n4.2. \nmanually created  \n4.3. \nwithin own organization  \n4.4. \noutside own organization  \n4.5. \ngeographically remote \n5. Customers \nMay include: \n5.1. \ncolleagues \n5.2. \ncompany and project management \n5.3. \nclients \n6. Security measures \nMay include: \n6.1. \naccess rights to input;  \n6.2. \npasswords;  \n6.3. \naccess rights to outputs;  \n6.4. \ndata consistency and back-up;  \n6.5. \nrecovery plans\n\n--- PDF PAGE 35 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  31 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Used technical information systems and information \ntechnology \n1.2. Applied information technology (IT) systems \n1.3. Edited, formatted and checked information \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1. Computers \n2.2. Software and IT system \n3. Methods of \nAssessment \nCompetency in this unit MUST be assessed through: \n3.1. Direct Observation \n3.2. Oral interview and written test \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
