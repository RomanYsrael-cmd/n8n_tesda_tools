        "source_text": "--- PDF PAGE 61 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  57 \n \nUNIT OF COMPETENCY \n: \nPERFORM MENSURATION AND CALCULATION \n \n \n \nUNIT CODE \n: \nALT723214 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills on how to \nuse automotive measuring tools. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Select measuring \ninstruments \n1.1  Component to be \nmeasured is \nidentified based on \njob requirements. \n1.2  Automotive \nmeasuring \ninstrument is \nidentified based on \njob requirements. \n1.3  Correct \nspecifications are \nobtained from \nrepair manual. \n1.4  Measuring tools are \ncalibrated in line \nwith job \nrequirements. \n1.5  Measuring \ninstruments are \nchecked for \naccuracy and \nadjusted according \nto manufacturer’s \nmanual \n1.6  Defective \nmeasuring \ninstruments are \nreported and \nreturned to \ntoolkeeper following \nindustry standards \n1.7  Safety practices are \napplied following \nOSHS \n● Category of \nmeasuring \ninstruments \n● Types and uses of \nmeasuring \ninstruments \n● Shapes and \nDimensions \n● Use of user’s \nmanual \n● Workshop \nprocedures in \nreporting defective \ninstruments \n● Characteristics of \ndefective measuring \ninstruments \n● Procedure in \npreparing report \n● OSHS in calibrating \nmeasuring \ninstruments \n● Calibration of \nmeasuring tools \n● Inspection of \nmeasuring tools \n● Segregation and \nreporting of \ndefective measuring \ninstruments \n● Identifying and \nselecting \nmeasuring \ninstruments \n● Visualizing objects \nand shapes \n● Calibration skills \n● Identifying \ndefective \nmeasuring \ninstruments \n● Reporting skills \n● Applying safety \npractices \n● Obtaining correct \nspecifications \n● Checking \nmeasuring \ninstruments for \naccuracy \n● Reporting and \nsegregating \ndefective \nmeasuring \ninstruments \n2.  Carry out \nmeasurements \nand calculation \n2.1  Automotive \nmeasuring \ninstrument is \nselected to achieve \nrequired outcome in \nline with job \nrequirements \n● Formulas for \nvolume, areas, \nperimeters of plane \nand geometric \nfigures \n● Performing \ncalculation \n● Applying formulas \nfor volume, areas, \nperimeters of \nplane and \ngeometric figures\n\n--- PDF PAGE 62 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  58 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2  Accurate \nmeasurements are \nobtained in line with \njob requirements \n2.3  Calculation \nneeded to complete \nwork tasks are \nperformed using \nmathematical \noperations. \n2.4  Numerical \ncomputation is self-\nchecked and \ncorrected for \naccuracy following \nmanufacturer’s \nworkshop manual \n2.3  Tools’ limit of \naccuracy are read \nfollowing \nmanufacturer’s \nworkshop manual \n2.4  Report is submitted \nto immediate \nsupervisor following \nindustry standard \noperating \nprocedure \n2.5  Safety practices are \napplied following \nOSHS \n● Different automotive \nmeasuring \ninstruments \n● Calculation & \nmeasurement \n● Four fundamental \noperation \n● Linear measurement \n● Dimensions \n● Unit conversion \n● Ratio and proportion \n● Handling of \nmeasuring \ninstruments \n● Tools’ limit of \naccuracy \n● OSHS \n● PPEs \n● Handling \nmeasuring \ninstruments \n● Selecting \nautomotive \nmeasuring \ninstruments \n● Obtaining accurate \nmeasurements \n● Performing \ncalculation \n● Self-checking and \ncorrecting \nnumerical \ncomputation \n● Reading tools’ limit \nof accuracy \n● Applying OSHS \n● Wearing of PPEs \n3.  Maintain \nmeasuring \ninstruments \n3.1  Measuring \ninstruments are \nhandled following \nmanufacturer’s \nmanual \n3.2  Measuring \ninstruments are \ncleaned following \nmanufacturer’s \nmanual. \n3.3  Instruments are \nstored according to \nmanufacturer’s \nspecifications and \nstandard operating \nprocedures. \n3.4  Safety practices are \napplied \n● Types of measuring \ninstruments and \ntheir uses \n● Safe handling \nprocedures in using \nmeasuring \ninstruments \n● Four fundamental \noperation of \nmathematics \n● Formula for volume, \narea, perimeter and \nother geometric \nfigures \n● 5S of good \nhousekeeping \n● Waste management \n● Handling and \nmaintaining \nmeasuring \ninstruments \n● Disposing wastes \n● Practicing good \nhousekeeping \n● Applying safety \npractices\n\n--- PDF PAGE 63 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  59 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n● Storing of measuring \ninstruments \n● OSHS\n\n--- PDF PAGE 64 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  60 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Automotive measuring \ninstruments \nMay include: \n1.1    Torque wrench \n1.2    Vernier caliper \n1.3    Micrometer (inside and outside) \n1.4    Dial gauge \n1.5    Feeler gauge \n1.7    Pitch/thread gauge \n1.8    Multi-tester (analog/digital) \n1.9    Vacuum Gauge \n1.10  Tire depth gauge \n1.11  Battery tester \n1.12  Steel tape \n1.13  Ruler \n2.  Calculation \nMay include:  \n2.1   Volume \n2.2   Area \n2.3   Displacement \n2.4   Inside diameter \n2.5   Circumference \n2.6   Length \n2.7   Thickness \n2.8   Outside diameter \n2.9   Taper \n2.10 Out of roundness \n2.11 Voltage \n2.12 Resistance  \n2.13 Current \n2.14 Pressure  \n2.15 Clearance \n2.16 Distortion/run-out \n2.17 Torque conversion \n2.18 Temperature \n3.  Mathematical operations \nIncludes: \n3.1  Addition \n3.2  Subtraction \n3.3  Multiplication \n3.4  Division \n3.5  Fractions \n3.6  Percentages \n3.7  Mixed numbers\n\n--- PDF PAGE 65 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  61 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate perform the \nfollowing: \n1.1  Selected measuring instruments \n1.2  Performed measurements and calculation \n1.3  Maintained measuring instruments \n1.4  Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Appropriate Automotive Measuring Tools & equipment \n2.3  Materials relevant to the activity \n2.4  Training vehicle or simulators \n2.5  User’s manual \n2.6  Repair manual \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1  Written exam \n3.2  Demonstration with oral questioning \n3.3 Third party report \n3.4  Interview \n4.  Context of \nassessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
