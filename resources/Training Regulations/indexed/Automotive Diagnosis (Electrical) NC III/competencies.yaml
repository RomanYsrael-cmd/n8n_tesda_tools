        "source_text": "--- PDF PAGE 17 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  13 \n \nUNIT OF COMPETENCY \n: \nAPPLY CRITICAL THINKING AND PROBLEM-\nSOLVINGTECHNIQUES IN THE WORKPLACE \n \n \n \nUNIT CODE \n: \n400311321 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to solve problems in the workplace \nincluding the application of problem solving \ntechniques and to determine and resolve the root \ncause/s of specific problems in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Examine specific \nworkplace \nchallenges. \n1.1 Variances are \nexamined from \nnormal operating \nparameters; and \nproduct quality. \n1.2 Extent, cause and \nnature of the \nspecific problem are \ndefined through \nobservation, \ninvestigation and \nanalytical \ntechniques. \n1.3  Problems are \nclearly stated and \nspecified. \n1.1  Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard \nsituations. \n1.2  Competence to \ninclude the ability \nto apply and \nexplain, enough \nfor the \nidentification of \nfundamental \ncauses of \nspecific \nworkplace \nchallenges. \n1.3   Relevant \nequipment and \noperational \nprocesses. \n1.4   Enterprise goals, \ntargets and \nmeasures. \n1.5   Enterprise \nquality OHS and \nenvironmental \nrequirement. \n1.6   Enterprise \ninformation \n1.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace. \n1.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace.\n\n--- PDF PAGE 18 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324  