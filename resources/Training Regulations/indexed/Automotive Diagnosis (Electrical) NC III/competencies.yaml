nized and \ndocumented in \nrelation to team \nobjectives.  \n2.1 Value of diversity \nin the economy \nand society in \nterms of \nWorkforce \ndevelopment \n2.2  Importance of \ninclusiveness in a \n2.1 Demonstrating \ncross-cultural \ncommunication \nskills and active \nlistening \n2.2 Recognizing \ndiverse groups in \nthe workplace\n\n--- PDF PAGE 24 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  20 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2 Fellow workers are \nencouraged to \nutilize and share \ntheir specific \nqualities, skills or \nbackgrounds with \nother team \nmembers and \nclients to enhance \nwork outcomes. \n2.3 Relations with \ncustomers and \nclients are \nmaintained to show \nthat diversity is \nvalued by the \nbusiness.  \ndiverse \nenvironment \n2.3 Shared vision and \nunderstanding of \nand commitment \nto team, \ndepartmental, \nand \norganizational \ngoals and \nobjectives \n2.4 Strategies for \ncustomer service \nexcellence \nand community \nas defined by \ndivergent culture, \nreligion, traditions \nand practices  \n2.3 Demonstrating \ncollaboration \nskills \n2.4 Exhibiting \ncustomer service \nexcellence \n3. Identify common \nissues in a \nmulticultural and \ndiverse \nenvironment \n3.1 Diversity-related \nconflicts within the \nworkplace are \neffectively \naddressed and \nresolved. \n3.2 Discriminatory \nbehaviors towards \ncustomers/stakehold\ners are minimized \nand addressed \naccordingly. \n3.3 Change \nmanagement \npolicies are in place \nwithin the \norganization. \n3.1 Value, and \nleverage of \ncultural diversity \n3.2 Inclusivity and \nconflict resolution \n3.3 Workplace \nharassment \n3.4 Change \nmanagement and \nways to overcome \nresistance to \nchange \n3.5 Advanced \nstrategies for \ncustomer service \nexcellence \n3.1 Addressing \ndiversity-related \nconflicts in the \nworkplace \n3.2 Eliminating \ndiscriminatory \nbehavior \ntowards \ncustomers and \nco-workers \n3.3 Utilizing change \nmanagement \npolicies in the \nworkplace\n\n--- PDF PAGE 25 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  21 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Diversity \nThis refers to diversity in both the workplace and the \ncommunity and may include divergence in : \n1.1 Religion \n1.2 Ethnicity, race or nationality \n1.3 Culture \n1.4 Gender, age or personality \n1.5 Educational background \n2. Diversity-related conflicts \nMay include conflicts that result from: \n2.1 Discriminatory behaviors  \n2.2 Differences of cultural practices \n2.3 Differences of belief and value systems \n2.4 Gender-based violence  \n2.5 Workplace bullying \n2.6 Corporate jealousy \n2.7 Language barriers \n2.8 Individuals being differently-abled persons \n2.9 Ageism (negative attitude and behavior towards old \npeople) \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAdjusted language and behavior as required by \ninteractions with diversity \n1.2 \nIdentified and respected individual differences in \ncolleagues, clients and customers \n1.3 \nApplied relevant regulations, standards and codes of \npractice \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Manuals and policies on Workplace Diversity \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nGroup discussions and interactive activities \n3.3 \nCase studies/problems involving workplace diversity \nissues \n3.4 \nThird-party report \n3.5 \nWritten examination \n3.6 \nRole Plays \n4. Context for \nAssessment \nCompetency assessment may occur in workplace or any \nappropriately simulated environment\n",
