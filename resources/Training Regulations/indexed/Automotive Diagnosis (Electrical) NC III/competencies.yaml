n5.4  Radio\n\n--- PDF PAGE 56 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  52 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Prepared vehicle for operation  \n1.2  Positioned the vehicle  \n1.3  Parked and stopped the vehicle \n1.4  Used owner’s manual \n2.  Resource \nimplication \nThe following resources MUST be provided: \n2.1  Workshop range/area \n2.2  Service working bay \n2.3  Appropriate vehicle for moving and positioning \n2.4  Owner’s manual \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1  Demonstration with oral questioning \n3.2  Written exam \n3.3  Interview \n3.3  Direct observation \n4.  Context of \nassessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
