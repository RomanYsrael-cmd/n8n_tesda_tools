        "source_title": "EVALUATE OCCUPATIONAL SAFETY AND HEALTH WORK PRACTICES",
        "source_text": "--- PDF PAGE 36 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  32 \n \nUNIT OF COMPETENCY \n: \nEVALUATE OCCUPATIONAL SAFETY AND \nHEALTH WORK PRACTICES \n \n \n \nUNIT CODE \n: \n400311325 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to interpret Occupational Safety and Health \npractices, set OSH work targets, and evaluate \neffectiveness of Occupational Safety and Health \nwork instructions. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Interpret \nOccupational \nSafety and Health \npractices \n \n1.1 OSH work practices \nissues are identified \nrelevant to work \nrequirements  \n1.2 OSH work standards \nand procedures are \ndetermined based on \napplicability to nature \nof work \n1.3 Gaps in work \npractices are \nidentified related to \nrelevant OSH work \nstandards  \n \n1.1. OSH work \npractices issues \n1.2. OSH work \nstandards \n1.3. General OSH \nprinciples and \nlegislations \n1.4. Company/ \nworkplace policies/ \nguidelines  \n1.5. Standards and \nsafety \nrequirements of   \nwork process and \nprocedures \n1.1. Communication \nskills \n1.2. Interpersonal \nskills \n1.3. Critical thinking \nskills \n1.4. Observation \nskills \n2.  Set OSH work \ntargets \n \n2.1 Relevant work \ninformation are \ngathered necessary \nto determine OSH \nwork targets \n2.2 OSH Indicators \nbased on gathered \ninformation are \nagreed upon to \nmeasure \neffectiveness of \nworkplace OSH \npolicies and \nprocedures  \n2.3 Agreed OSH \nindicators are \nendorsed for \napproval from \nappropriate \npersonnel \n2.4 OSH work  \ninstructions are \n2.1. OSH work targets \n2.2. OSH Indicators \n2.3. OSH work  \ninstructions \n2.4. Safety and health  \nrequirements of \ntasks  \n2.5. Workplace \nguidelines on \nproviding \nfeedback on \nOSH and security  \nconcerns  \n2.6. OSH regulations \nHazard control \nprocedures \n2.7. OSH trainings \nrelevant to work   \n2.1. Communication \nskills \n2.2. Collaborating \nskills \n2.3. Critical thinking \nskills \n2.4. Observation \nskills\n\n--- PDF PAGE 37 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  33 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nreceived in \naccordance with \nworkplace policies \nand procedures* \n3.  Evaluate \neffectiveness of \nOccupational \nSafety and Health  \nwork instructions \n \n \n \n3.1  OSH Practices are \nobserved based on \nworkplace \nstandards \n3.2 Observed OSH \npractices are \nmeasured against \napproved OSH \nmetrics  \n3.3 Findings regarding \neffectiveness are \nassessed and gaps \nidentified are \nimplemented based \non OSH work \nstandards  \n \n \n3.1. OSH Practices \n3.2. OSH metrics \n3.3. OSH Evaluation \nTechniques \n3.4. OSH work \nstandards \n3.1. Critical thinking \nskills \n3.2. Evaluating skills\n\n--- PDF PAGE 38 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  34 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OSH Work Practices \nIssues \nMay include: \n1.1 Workers’ experience/observance on presence of \nwork hazards \n1.2 Unsafe/unhealthy administrative arrangements \n(prolonged work hours, no break-time, constant \novertime, scheduling of tasks) \n1.3 Reasons for compliance/non-compliance to use of \nPPEs or other OSH procedures/policies/ guidelines \n2. OSH Indicators \nMay include: \n2.1 Increased of incidents of accidents, injuries \n2.2 Increased occurrence of sickness or health \ncomplaints/symptoms \n2.3 Common complaints of workers’ related to OSH \n2.4 High absenteeism for work-related reasons    \n3. OSH Work Instructions \nMay include: \n3.1 Preventive and control measures, and targets \n3.2 Eliminate the hazard (i.e., get rid of the dangerous \nmachine \n3.3 Isolate the hazard (i.e. keep the machine in a closed \nroom and operate it remotely; barricade an unsafe \narea off) \n3.4 Substitute the hazard with a safer alternative (i.e., \nreplace the machine with a  safer one) \n3.5 Use administrative controls to reduce the risk (i.e. \ngive trainings on how to use  equipment safely; \nOSH-related topics, issue warning signages, \nrotation/shifting work schedule) \n3.6 Use engineering controls to reduce the risk (i.e. use \nsafety guards to machine)   \n3.7 Use personal protective equipment   \n3.8 Safety, Health and Work Environment Evaluation  \n3.9 Periodic and/or special medical examinations of \nworkers \n4. OSH metrics \nMay include: \n4.1 Statistics on incidence of accidence and injuries \n4.2 Morbidity (Type and Number of Sickness) \n4.3 Mortality  (Cause and Number of Deaths) \n4.4 Accident Rate\n\n--- PDF PAGE 39 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  35 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. Identify OSH work practices issues relevant to work \nrequirements \n1.2. Identify gaps in work practices related to relevant OSH \nwork standards \n1.3. Agree upon OSH Indicators based on gathered information \nto measure effectiveness of workplace OSH policies and \nprocedures \n1.4. Receive OSH work instructions in accordance with \nworkplace policies and procedures \n1.5. Compare Observed OSH practices with against approved \nOSH work instructions \n1.6. Assess findings regarding effectiveness based on OSH \nwork standards \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1    Facilities, materials, tools and equipment necessary for \nthe activity \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Observation/Demonstration with oral questioning \n3.2   Third party report \n3.3    Written exam \n \n4.  Context for \nAssessment \n4.1    Competency may be assessed in the work place or in a \nsimulated work place setting\n",
