nts \nfrom workplace \ninstructions \n1.4 Sourcing and \ninterpreting \ndiagnosis \ninformation \n1.5 Clarifying \ninstructions \n1.6 Locating \nappropriate \nsources of \ninformation \n1.7 Selecting and \nchecking tools \nand equipment \n1.8 Reporting \ndefective tools \nand equipment \n1.9 Preparing of \nsupplies and \nmaterials\n\n--- PDF PAGE 79 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  75 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nprepared following \nworkplace \nprocedures. \n2.  Diagnose Multiplex \nCommunication \nand Body Control \nModule System \n2.1  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n2.2  Diagnostic \nsymptoms are \ndetermined and \nanalyzed using \ntroubleshooting \nguide, repair \nmanual, technical \ninformation sheet \nand most \nappropriate to the \ncircumstances. \n2.3  Diagnostic tests are \ncarried out \naccording to \nmanufacturer’s \nrepair manual. \n2.4  Faults are identified \nbased on \ndiagnostic test. \n2.5  Diagnostic findings \nand \nrecommendations \nare prepared and \nreported according \nto industry criteria. \n2.1 Diagnostic \nprocedures for \nMultiplex \nCommunication \nand Body Control \nModule System \n2.2 Identification and \nfunction of \nMultiplex \nCommunication \nand Body Control \nModule System \n2.3 Related resources \nof information \n2.3.1 Service \nbulletin \n2.3.2 Technical \nservice \ninformation  \n2.3.3 Recall \ninformation \n2.4 Mensuration \n2.5 Arithmetic \noperations \n2.6 Use of measuring \ndevices \n2.7 Reporting \nprocedures \n2.8 OSHS \n2.9 Wearing of PPEs \n2.10 Industry criteria \n2.1 Analyzing \ndiagnostic \nsymptoms \n2.2 Interpreting \ninformation from \nmanufacturer and \nworkshop  \n2.3 Interpreting and \ncomparing \ndiagnostic data \nusing trouble \nshooting guide