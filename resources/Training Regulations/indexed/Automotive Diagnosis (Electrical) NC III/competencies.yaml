 and work allocation problem \n3.4. \nSafety and emergency situations and incidents \n3.5. \nRisk assessment and management \n4. Action plans \nAction plans may include: \n4.1. \nPriority requirements \n4.2. \nMeasurable objectives \n4.3. \nResource requirements \n4.4. \nTimelines \n4.5. \nCo-ordination and feedback requirements \n4.6. \nSafety requirements \n4.7. \nRisk assessment \n4.8. \nEnvironmental requirements\n\n--- PDF PAGE 22 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  18 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Examined specific workplace challenges. \n1.2. Analyzed the causes of specific workplace challenges. \n1.3. Formulated resolutions to specific workplace challenges. \n1.4. Implemented action plans and communicated results on \nspecific workplace challenges. \n2. Resource \nImplications \n2.1. Assessment will require access to an operating plant over \nan extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios / case studies / what ifs will \nbe required as well as bank of questions which will be used \nto probe the reason behind the observable action.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Observation \n3.2. Case Formulation \n3.3. Life Narrative Inquiry \n3.4. Standardized test \n \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be based on \nthe actual workplace and will include walk through of the \nrelevant competency components.  \n \nThese assessment activities should include a range of \nproblems, including new, unusual and improbable situations that \nmay have happened. \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
