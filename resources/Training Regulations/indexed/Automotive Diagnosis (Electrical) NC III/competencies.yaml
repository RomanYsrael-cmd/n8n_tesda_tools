        "source_text": "--- PDF PAGE 40 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  36 \n \nUNIT OF COMPETENCY \n: \nEVALUATE ENVIRONMENTAL WORK \nPRACTICES \n \n \n \nUNIT CODE \n: \n400311326 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude to \ninterpret environmental Issues,  establish targets to \nevaluate environmental practices and evaluate \neffectiveness of environmental practices. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret \nenvironmental \npractices, policies \nand procedures \n1.1 Environmental \nwork practices \nissues are identified \nrelevant to work \nrequirements \n1.2 Environmental \nStandards and \nProcedures  nature \nof work are \ndetermined based \non Applicability to \nnature of work  \n1.3 Gaps in work \npractices related to \nEnvironmental \nStandards and \nProcedures are \nidentified \n1.1 Environmental \nIssues  \n1.2 Environmental \nWork Procedures \n1.3 Environmental \nLaws \n1.4 Environmental \nHazardous and \nNon-Hazardous \nMaterials \n1.5 Environmental \nrequired license, \nregistration or \ncertification \n1.1.  Analyzing \nEnvironmental \nIssues and \nConcerns \n1.2. Critical thinking \n1.3. Problem Solving \n1.4. Observation \nSkills \n \n2. Establish targets to \nevaluate \nenvironmental \npractices \n \n \n2.1. Relevant \ninformation are \ngathered necessary \nto determine \nenvironmental work \ntargets \n2.2. Environmental \nIndicators based \non gathered \ninformation are set \nto measure \nenvironmental work \ntargets \n2.3. Indicators are \nverified with \nappropriate \npersonnel \n2.1. Environmental  \nIndicators \n2.2. Relevant \nEnvironment \nPersonnel or \nexpert \n2.3. Relevant \nEnvironmental \nTrainings and \nSeminars \n2.1. Investigative \nSkills \n2.2. Critical thinking \n2.3.  Problem \nSolving \n2.4. Observation \nSkills\n\n--- PDF PAGE 41 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  37 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Evaluate \neffectiveness of \nenvironmental \npractices \n3.1. Work environmental \npractices are \nrecorded based on \nworkplace \nstandards \n3.2. Recorded work \nenvironmental \npractices are \ncompared against \nplanned indicators \n3.3. Findings regarding \neffectiveness are \nassessed and gaps \nidentified are \nimplemented based \non environment  \nwork standards and \nprocedures \n3.4. Results of \nenvironmental \nassessment are \nconveyed to \nappropriate \npersonnel \n \n1.1. Environmental \nPractices \n1.2. Environmental \nStandards and \nProcedures \n3.1 Documentation \nand Record \nKeeping Skills \n3.2 Critical thinking \n3.3 Problem Solving \n3.4 Observation \nSkills\n\n--- PDF PAGE 42 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  38 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Environmental Practices \nIssues \n May include: \n1.1 \nWater Quality  \n1.2 \nNational and Local Government Issues \n1.3 \nSafety \n1.4 \nEndangered Species \n1.5 \nNoise \n1.6 \nAir Quality \n1.7 \nHistoric \n1.8 \nWaste \n1.9 \nCultural \n2. Environmental Indicators \nMay include: \n2.1 \nNoise level \n2.2 \nLighting (Lumens) \n2.3 \nAir Quality - Toxicity \n2.4 \nThermal Comfort \n2.5 \nVibration \n2.6 \nRadiation  \n2.7 \nQuantity of the Resources \n2.8 \nVolume\n\n--- PDF PAGE 43 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  39 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      Competency  \nAssessment requires evidence that the candidate: \n1.1. Identified environmental issues relevant to work \nrequirements \n1.2. Identified gaps in work practices related to Environmental \nStandards and Procedures \n1.3. Gathered relevant information necessary to determine \nenvironmental work targets \n1.4. Set environmental indicators based on gathered \ninformation to measure environmental work targets \n1.5. Recorded work environmental practices are recorded \nbased on workplace standards \n1.6. Conveyed results of environmental assessment to \nappropriate personnel \n2.  Resource   \nImplications \nThe following resources should  be provided: \n2.1  Workplace/Assessment location \n2.2  Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3  Case studies/scenarios relating to environmental protection \n3.  Methods of \nAssessment \nCompetency in this unit may  be assessed through: \n3.1  Written/ Oral Examination \n3.2  Interview/Third Party Reports \n3.3  Portfolio (citations/awards from GOs and NGOs, certificate \nof  training – local and abroad) \n 3.4  Simulations and role-plays \n4.  Context for \nAssessment \n4.1  Competency may be assessed in actual workplace or  \n at the designated TESDA center.\n",
