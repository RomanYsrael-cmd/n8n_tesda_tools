  "source_section_text": "SECTION 1 DEFINITION OF QUALIFICATION\n\nThe AUTOMOTIVE DIAGNOSIS (ELECTRICAL) NC III Qualification consists\nof competencies that a person must achieve to diagnose and repair electrical systems.\n\nThis Qualification is packaged from the competency map of the Automotive and\nLand Transportation Industry (Service sector) as shown in Annex A.\n\nThe Units of Competency comprising this qualification include the following\n\nUnit Code\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\nApply critical thinking and problem-solving techniques in the\nworkplace\n400311322\nWork in a diverse environment\n400311323\nPropose methods of applying learning and innovation in the\norganization\n400311324\nUse information systematically\n400311325\nEvaluate occupational safety and health work practices\n400311326\nEvaluate environmental work practices\n400311327\nFacilitate entrepreneurial skills for micro-small-medium enterprises\n(MSMEs)\n\nUnit Code\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT832212\nMove and position vehicle\nALT723213\nUtilize automotive tools\nALT723214\nPerform mensuration and calculation\nALT723215\nUtilize workshop facilities and equipment\nALT723216\nPrepare servicing parts and consumables\nALT723217\nPrepare vehicle for servicing and releasing\n\nUnit Code\nCORE COMPETENCIES\nALT723369\nDiagnose and repair multiplex communication system and body\ncontrol module system\nALT723370\nDiagnose and repair theft deterrent system\nALT723371\nDiagnose and repair immobilizer system\nALT723378\nDiagnose and repair smart entry and start system\nALT723379\nDiagnose and repair automatic air-conditioner system\nALT723380\nDiagnose and repair of Supplemental Restraint System (SRS)\n\n--- PDF PAGE 6 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324 Promulgated (11/13/2024) 2\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Electrical Diagnosis Technician\n\n--- PDF PAGE 7 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324 Promulgated (11/13/2024) 3"
}
