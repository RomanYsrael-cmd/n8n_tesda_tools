DL324                    Promulgated (11/13/2024)                  101 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Repair Automatic \nAir-conditioning \nSystem \n3.1  Repairs are carried \nout according to \nmanufacturer’s \nmanual. \n3.2  Repair options and \nsolutions are \nanalyzed and \nselected based on \nmanufacturer’s \nmanual and \ncircumstances at \nhand. \n3.3  Post-service \ntesting is carried \nout according to \nworkplace \nprocedures. \n3.4  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n3.1 Harness assembly \n3.2 Different repairs \nfor Automatic Air-\nconditioner \nSystem \n3.3 Identification and \nfunction of \nAutomatic Air-\nconditioner \nSystem \n3.4 Arithmetic \noperations \n3.5 Mensuration \n3.6 Use of measuring \ndevices \n3.7 Service/Repair \nManual \n3.8 Post-service \ntesting for \nAutomatic Air-\nconditioner  \n3.9 Isolation and \nelimination \napproach System \n3.10 OSHS \n3.11 Wearing of PPEs \n3.12 Accomplishment \nof Repair Order \n3.1 Sourcing of \ninformation \n3.2 Interpreting \ninformation from \nmanufacturer and \nworkshop \nliterature  \n3.3 Applying safety \npractices \n3.4 Mensuration skills \n3.5 Applying \narithmetic \noperations \n3.6 Repairing \nAutomatic Air-\nconditioner \nSystem  \n3.7 Performing post- \nservice testing \n4.  Complete work \nprocesses \n4.1  Final inspection is \nconducted based \non workplace \nprocedure. \n4.2  Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace \nprocedure. \n4.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n4.4  Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n4.5  Tools and \nequipment are \nchecked and stored \n4.1 Final inspection \nprocedure: \n4.1.1 Visual \ninspection \n4.1.2 Checking of \ntightening of \ntorque \n4.2 Turn-over of \nvehicl