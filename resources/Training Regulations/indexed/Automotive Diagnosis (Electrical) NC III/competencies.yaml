        "source_text": "--- PDF PAGE 48 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  44 \n \n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nVALIDATE VEHICLE SPECIFICATION \n \n \n \nUNIT CODE \n: \nALT723211 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude to \ncheck body type of the vehicle, check vehicle engine \ntype, check vehicle specifications and complete \nvalidation of vehicle specification. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Check body type of \nthe vehicle \n1.1  Kind of vehicle is \ndetermined \naccording to job \norder. \n1.2  Vehicle \ndimensions is \ndetermined \naccording to \nmanual. \n1.3  Vehicle weight is \ndetermined \naccording to the \nmanual. \n1.4  Body shape is \ndetermined \naccording to the \nmanual. \n1.6  Power train is \ndetermined \naccording to the \nmanual. \n1.7  Safety practices are \napplied following \nOSHS \n● Kind of vehicle \n- Aerodynamics \n- Vehicle Dynamics \n- Body shapes \n- Power train \n- Major dimensions \n● Vehicle \nspecifications \n- Vehicle \nperformance \n- Weight & \nMeasurements \n● Automotive history \n● Documentation/ \nAccomplishing \nchecklist \n● Resources \ninformation \n- Bulletin \n- Shop manual \n● OSHS \n● PPEs \nAttitude: \n● Patience \n● Attention to details \n● Identifying kind of \nvehicle, \ndimensions, \nweight, body \nshape, and power \ntrain \n● Accomplishing \nchecklist \n● Estimating visually \ndimensions and \nmasses \n● Utilizing resource \ninformation \n● Wearing PPEs \n● Applying safety \npractices \n2.  Check vehicle \nengine type \n2.1  Engine type is \nidentified according \nto industry \nstandards. \n2.2  Engine fuel/energy \nsystem is identified \naccording to \nmanual. \n2.3  Engine \ncomponents are \n● Principles of internal \ncombustions \n● Principles of \nElectricity and \nmotors \n● History of engines \n● Hybrid technology \n● Resources \ninformation \n- Bulletin \n- Shop manual \n● Identifying engine \ntype, parts & \ncomponents \n● Identifying fuel \nsystems or energy \nsystems \n● Utilizing resource \ninformation\n\n--- PDF PAGE 49 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  45 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nidentified following \nmanual. \n3.  Check vehicle \nspecifications \n3.1  VIN plate is \ninspected for \nspecification of \nvehicle according to \nmanual. \n3.2  Vehicle \nspecification is \nverified according \nto vehicle \nreference \nmaterials. \n3.3  Vehicle \nmodifications and \nconversions are \nchecked following \nthe manual. \n3.3  Vehicle conversions \nare inspected \nfollowing the \nmanual. \n● Fundamentals of \nAutomotive \nengineering: \n- Understanding of \npower & torque \n- Gear Ratios \n- Vehicle \nRegulations \n- Knowledge of \nvehicle \nperformance \n- Knowledge in \nVehicle \nmanufacturing \nprocess \n- Knowledge of \nvehicle use \n- Automotive history \n● Knowledge in \nspecifications \n● Reading of \nbrochure, owner’s \nmanuals \n● Reading of \nResources \ninformation \n- Bulletin \n- Shop manual \n● Reading vehicle \nreference \nmaterials \n● Conducting vehicle \ninspection for \nmodification and \nconversion \n● Comparing actual \nvehicle and \nspecification \nsheets \n● Utilizing resource \ninformation \n4.  Complete \nvalidation of \nvehicle \nspecification \n4.1  Vehicle ownership \nis verified using \nrepair order and \nvehicle reference \nmaterials. \n4.2  Dealers check \nsheet is \naccomplished \nfollowing industry \nstandards. \n4.3  Dealers check \nsheet is submitted \nto immediate \nsuperior following \nindustry standards. \n● Reporting to \nimmediate superior \n● Documentation/ \nAccomplishing \nchecklist \n \nAttitude: \n● Accuracy \n● Verifying vehicle \nownership \n● Accomplishing \ndealers check \nsheet \n● Reporting skills\n\n--- PDF PAGE 50 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  46 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Kind of Vehicle \nMay include: \n1.1   Motorized \n1.2   Not Motorized \n1.3   On-Road \n1.4   Off-Road \n1.5   Passenger \n1.6   Commercial \n1.7   Utility \n1.8   Manned \n1.9   Unmanned \n1.10 Remote control \n1.11 Automated/Self Driving \n1.12 Guided \n2.  Vehicle Dimensions \nMay include: \n2.1   Overall length \n2.2   Overall width \n2.3   Overall height \n2.4   Wheelbase \n2.5   Tread \n2.6   Minimum running ground clearance \n2.7   Room Length \n2.8   Room Width \n2.9   Room Height \n2.10 Overhang front \n2.11 Overhang rear \n2.12 Angle of approach \n2.13 Angle of departure \n3.  Vehicle Weight \nMay include: \n3.1   Gross weight \n3.2   Curb weight \n3.3   Tare weight \n3.4   Net weight \n4.  Body Shape \nMay include: \n4.1   Sedan \n4.2   Coupe \n4.3   Hardtop \n4.4   Convertible \n4.5   Multipurpose vehicle (MPV) \n4.6   Sports utility vehicle (SUV) \n4.7   Truck \n4.8   Tractor Head \n4.9   Trailer \n4.10 Special Utility Truck \n4.11 Bus \n4.12 Mini Bus \n4.13 Articulated bus \n4.14 Asian Utility Vehicle (AUV)\n\n--- PDF PAGE 51 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  47 \n \nVARIABLE \nRANGE \n5.  Power Train \nMay include: \n5.1  Front Wheel Drive \n5.2  Rear Wheel Drive \n5.3  4x2 \n5.4  4x4 \n5.5  Limited Slip Differential (LSD) \n5.6  Manual Transmission \n5.7  Automatic Transmission \n5.8  Continuously Variable Transmission \n6.  Engine Type \nMay include: \n6.1  Internal Combustion Engine \n6.2  Electric Motor \n7.  Fuel/Energy System \nMay include: \n7.1  Diesel Fuel \n7.2  Gasoline Fuel \n7.3  Compressed Natural Gas (CNG) \n7.4  Liquefied Petroleum Gas (LPG) \n7.5  Methanol \n7.6  Hydrogen  \n7.7  Biodiesel \n7.8  Solar Cell \n7.9  Fuel Cell \n8.  Engine Components \nMay include: \n8.1  Intake System \n8.2  Electrical System \n8.3  Cooling System \n8.4  Exhaust System \n8.5  Valve Train System \n8.6  Cylinder Head \n8.7  Engine Block \n8.8  Lubricating System \n9.  Vehicle reference \nmaterials \nMay include: \n9.1  Warranty booklet \n9.2  Brochure of the vehicle \n9.3  Vehicle registration \n10. Dealers check sheet \nMay include: \n10.1 Vehicle mileage \n10.2 Owner’s information \n10.3 Damage\n\n--- PDF PAGE 52 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  48 \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Checked body type of the vehicle \n1.2  Checked vehicle engine type \n1.3  Checked vehicle specifications \n1.4  Completed validation of vehicle specification \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Appropriate vehicle or model equivalent \n2.3  Materials relevant to the activity \n2.4  Resource information, references, and manual \n3.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Direct Observation \n3.2  Interview \n3.3  Third Party Report \n3.4  Written exam \n3.5  Demonstration with Oral questioning \n4.  Context of \nAssessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
