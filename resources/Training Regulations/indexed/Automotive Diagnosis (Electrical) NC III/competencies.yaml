   Contact Cleaner \n5.3   Electrical tape \n5.4   Sand Paper \n5.5   PPEs \n6.  Trouble shooting guide \nTrouble shooting guide includes: \n6.1   Verification \n6.2   Determine  \n6.3   Analyze \n6.4   Isolate \n6.5   Repair \n6.6   Confirm \n7.  Technical information \nsheet \nTechnical information sheet may include: \n7.1   Service bulletin \n7.2   Technical service information \n7.3   Recall information \n8.  Repair of Multiplex \nCommunication and Body \nControl Module System \nRepair of Multiplex Communication and Body Control \nModule System may include: \n8.1   Removal and installation of electrical component \nassembly\n\n--- PDF PAGE 82 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  78 \n \nVARIABLE \nRANGE \n8.2   Soldering of MPX wires \n8.3   Replacement of MPX wires \n8.4   Replacement of connectors and terminals \n8.5   Replacement of harness \n9.  Post-service testing \nPost – service testing may include: \n9.1   Inspection for functionality \n9.2   Inspection for warning lights \n9.3   Check for trouble code \n10. Workplace documents \nWorkplace documents may include: \n10.1 Repair order \n10.2 Inspection form \n10.3 Diagnostic form\n\n--- PDF PAGE 83 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  79 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared for inspection and servicing of Multiplex \nCommunication and Body Control Module System \n1.1.1   Applied safety practices. \n1.1.2   Identified hazards and managed risks. \n1.1.3   Determined job requirements. \n1.1.4   Sourced and interpreted diagnosis information. \n1.1.5   Selected and checked tools and equipment for \nserviceability. \n1.1.6   Reported defective tools and equipment. \n1.1.7   Prepared supplies and materials. \n \n1.2   Diagnosed Multiplex Communication and Body Control \nModule System. \n \n1.2.1   Applied safety practices. \n1.2.2   Determined and analyzed diagnostic symptoms. \n1.2.3   Carried out diagnostic tests. \n1.2.4   Identified faults. \n1.2.5   Prepared and reported diagnostic findings and \nrecommendations. \n \n1.3   Repaired Multiplex Communication and Body Control \nModule System. \n \n1.3.1   Applied safety practices. \n1.3.2   Carried out repairs. \n1.3.3   Analyzed and selected repair options and solutions. \n1.3.4   Carried out post-service testing. \n \n1.4   Completed work processes. \n1.4.1   Conducted final inspection. \n1.4.2   Turned-over vehicle to immediate superior. \n1.4.3   Restored work area. \n1.4.4   Managed wastes. \n1.4.5   Checked and stored tools and equipment. \n1.4.6   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Actual or simulated workplace \n2.2   Tools, materials and equipment needed to perform the \nrequired task \n2.3   References and manuals \n2.4   PPEs \n2.5   Training vehicle \n2.6   First Aid Kit \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration/Observation with Oral Questioning \n3.2   Written Test\n\n--- PDF PAGE 84 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  80 \n \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
