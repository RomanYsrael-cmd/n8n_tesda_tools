          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Check body type of \nthe vehicle \n1.1  Kind of vehicle is \ndetermined \naccording to job \norder. \n1.2  Vehicle \ndimensions is \ndetermined \naccording to \nmanual. \n1.3  Vehicle weight is \ndetermined \naccording to the \nmanual. \n1.4  Body shape is \ndetermined \naccording to the \nmanual. \n1.6  Power train is \ndetermined \naccording to the \nmanual. \n1.7  Safety practices are \napplied following \nOSHS \n● Kind of vehicle \n- Aerodynamics \n- Vehicle Dynamics \n- Body shapes \n- Power train \n- Major dimensions \n● Vehicle \nspecifications \n- Vehicle \nperformance \n- Weight & \nMeasurements \n● Automotive history \n● Documentation/ \nAccomplishing \nchecklist \n● Resources \ninformation \n- Bulletin \n- Shop manual \n● OSHS \n● PPEs \nAttitude: \n● Patience \n● Attention to details \n● Identifying kind of \nvehicle, \ndimensions, \nweight, body \nshape, and power \ntrain \n● Accomplishing \nchecklist \n● Estimating visually \ndimensions and \nmasses \n● Utilizing resource \ninformation \n● Wearing PPEs \n● Applying safety \npractices \n2.  Check vehicle \nengine type \n2.1  Engine type is \nidentified according \nto industry \nstandards. \n2.2  Engine fuel/energy \nsystem is identified \naccording to \nmanual. \n2.3  Engine \ncomponents are \n● Principles of internal \ncombustions \n● Principles of \nElectricity and \nmotors \n● History of engines \n● Hybrid technology \n● Resources \ninformation \n- Bulletin \n- Shop manual \n● Identifying engine \ntype, parts & \ncomponents \n● Identifying fuel \nsystems or energy \nsystems \n● Utilizing resource \ninformation\n\n--- PDF PAGE 49 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  45 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nidentified following \nmanual. \n3.  Check vehicle \nspecifications \n3.1  VIN plate is \ninspected for \nspecification of \nvehicle according to \nmanual. \n3.2  Vehicle \nspecification is \nverified according \nto vehicle \nreference \nmaterials. \n3.3  Vehicle \nmodifications and \nconversions are \nchecked following \nthe manual. \n3.3  Vehicle conversions \nare inspected \nfollowing the \nmanual. \n● Fundamentals of \nAutomotive \nengineering: \n- Understanding of \npower & torque \n- Gear Ratios \n- Vehicle \nRegulations \n- Knowledge of \nvehicle \nperformance \n- Knowledge in \nVehicle \nmanufacturing \nprocess \n- Knowledge of \nvehicle use \n- Automotive history \n● Knowledge in \nspecifications \n● Reading of \nbrochure, owner’s \nmanuals \n● Reading of \nResources \ninformation \n- Bulletin \n- Shop manual \n● Reading vehicle \nreference \nmaterials \n● Conducting vehicle \ninspection for \nmodification and \nconversion \n● Comparing actual \nvehicle and \nspecification \nsheets \n● Utilizing resource \ninformation \n4.  Complete \nvalidation of \nvehicle \nspecification \n4.1  Vehicle ownership \nis verified using \nrepair order and \nvehicle reference \nmaterials. \n4.2  Dealers check \nsheet is \naccomplished \nfollowing industry \nstandards. \n4.3  Dealers check \nsheet is submitted \nto immediate \nsuperior following \nindustry standards. \n● Reporting to \nimmediate superior \n● Documentation/ \nAccomplishing \nchecklist \n \nAttitude: \n● Accuracy \n● Verifying vehicle \nownership \n● Accomplishing \ndealers check \nsheet \n● Reporting skills\n\n--- PDF PAGE 50 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  46 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Kind of Vehicle \nMay include: \n1.1   Motorized \n1.2   Not Motorized \n1.3   On-Road \n1.4   Off-Road \n1.5   Passenger \n1.6   Commercial \n1.7   Utility \n1.8   Manned \n1.9   Unmanned \n1.10 Remote control \n1.11 Automated/Self Driving \n1.12 Guided 