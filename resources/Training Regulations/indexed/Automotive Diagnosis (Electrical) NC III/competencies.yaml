        "source_title": "FACILITATE ENTREPRENUERIAL SKILLS FOR MICRO-SMALL-MEDIUM ENTERPRISES (MSMEs)",
        "source_text": "--- PDF PAGE 44 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  40 \n \nUNIT OF COMPETENCY \n: \nFACILITATE ENTREPRENUERIAL SKILLS FOR \nMICRO-SMALL-MEDIUM ENTERPRISES \n(MSMEs) \n \n \n \nUNIT CODE \n: \n400311327 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to build, \noperate and grow a micro/small-scale enterprise. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Develop and \nmaintain micro-\nsmall-medium \nenterprise (MSMEs) \nskills in the \norganization  \n1.1 Appropriate \nbusiness \nstrategies are \ndetermined and set \nfor the enterprise \nbased on current \nand emerging \nbusiness \nenvironment.  \n1.2 Business \noperations are \nmonitored and \ncontrolled following \nestablished \nprocedures.  \n1.3 Quality assurance \nmeasures are \nimplemented \nconsistently.  \n1.4 Good relations are \nmaintained with \nstaff/ workers.  \n1.5 Policies and \nprocedures on \noccupational safety \nand health and \nenvironmental \nconcerns are \nconstantly \nobserved.   \n1.1 Business models \nand strategies \n1.2 Types and \ncategories of \nbusinesses \n1.3 Business \noperation  \n1.4 Basic \nBookkeeping \n1.5 Business internal \ncontrols  \n1.6 Basic quality \ncontrol and \nassurance \nconcepts \n1.7 Government and \nregulatory \nprocesses \n \n1.1 Basic \nbookkeeping/ \naccounting skills  \n1.2 Communication \nskills \n1.3 Building relations \nwith customer \nand employees \n1.4 Building \ncompetitive \nadvantage of the \nenterprise \n2. Establish and \nMaintain client-\nbase/market  \n2.1 Good customer \nrelations are \nmaintained \n2.2 New customers and \nmarkets are \nidentified, explored \nand reached out to.  \n2.3 Promotions/ \nIncentives are \n2.1 Public relations \nconcepts     \n2.2 Basic product \npromotion \nstrategies    \n2.3 Basic market and \nfeasibility studies \n2.4 Basic business \nethics   \n2.1 Building customer \nrelations \n2.2 Individual \nmarketing skills  \n2.3 Using basic \nadvertising \n(posters/ \ntarpaulins, flyers,\n\n--- PDF PAGE 45 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  41 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \noffered to loyal \ncustomers  \n2.4 Additional products \nand services are \nevaluated and tried \nwhere feasible. \n2.5 Promotional/adver\ntising initiatives \nare carried out \nwhere necessary \nand feasible. \nsocial media, \netc.)  \n3. Apply budgeting \nand financial \nmanagement skills   \n3.1 Enterprise is built \nup and sustained \nthrough judicious \ncontrol of cash \nflows.  \n3.2 Profitability of \nenterprise is \nensured though \nappropriate internal \ncontrols. \n3.3 Unnecessary or \nlower-priority \nexpenses and \npurchases are \navoided.  \n3.1 Cash flow \nmanagement \n3.1 Basic financial \nmanagement \n3.2 Basic financial \naccounting \n3.3 Business internal \ncontrols  \n3.1 Setting business \npriorities and \nstrategies \n3.2 Interpreting basic \nfinancial \nstatements \n3.3 Preparing \nbusiness plans\n\n--- PDF PAGE 46 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  42 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business strategies \nMay include: \n1.1. \nDeveloping/Maintaining niche market  \n1.2. \nUse of organic/healthy ingredients   \n1.3. \nEnvironment-friendly and sustainable practices  \n1.4. \nOffering both affordable and high-quality products \nand services  \n1.5. \nPromotion and marketing strategies (e. g., on-line \nmarketing) \n2. Business operations  \nMay include: \n2.1 Purchasing  \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management  \n4. Promotional/Advertising \ninitiatives  \nMay include: \n4.1 \nUse of tarpaulins, brochures, and/or flyers \n4.2 \n Sales, discounts and easy payment terms \n4.3 \nUse of social media/Internet \n4.4 \n“Service with a smile” \n4.5 \nExtra attention to regular customers\n\n--- PDF PAGE 47 ---\nAutomotive Diagnosis (Electrical) NC III - ALTADL324                    Promulgated (11/13/2024)                  43 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate : \n1.1   Demonstrated basic entrepreneurial skills \n1.2   Demonstrated ability to conceptualize and plan a \nmicro/small enterprise \n1.3   Demonstrated ability to manage/operate a micro/small-\nscale business   \n2. Resource \nImplications \nThe following resources should be provided: \n  \n2.1 Simulated or actual workplace \n2.2 Tools, materials and supplies needed to demonstrate the \nrequired tasks  \n2.3 References and manuals \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n3.1 Written examination \n3.2 Demonstration/observation with oral questioning \n3.3 Portfolio assessment with interview \n3.4 Case problems \n4. Context of \nAssessment \n1.1 Competency may be assessed in workplace or in a \nsimulated  workplace setting \n1.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
