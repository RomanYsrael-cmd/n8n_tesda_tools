 to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\nA set of wood or steel forms in place to hold wet concrete until it\nhardens\n\nIs defined as providing adequate moisture, temperature, and\ntime to allow the concrete to achieve the desired properties for\nits intended use\n\nThis term is usually used to describe the most basic knowledge\nand skills needed to operate software products such as an\noperating system, a software application, or an automated Web\ndesign tool.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 117 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 113\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMasonry NC III\nQualification Code:\nCONMAS318\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMasonry NC III\n2006-09 /\n04/20/06\nN/A\n01\nDocument Amended\n\nMasonry NC III\n2018-31 /\n10/29/18\nNo. 011 series\nof 2019\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 118 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 114\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated 