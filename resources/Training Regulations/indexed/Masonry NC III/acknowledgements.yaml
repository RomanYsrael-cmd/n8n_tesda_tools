\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nOccupational\nSafety and\nHealth practices\n\n1.1 OSH work practices\nissues are identified\nrelevant to work\nrequirements\n1.2 OSH work standards and\nprocedures are\ndetermined based on\napplicability to nature of\nwork\n1.3 Gaps in work practices\nare identified related to\nrelevant OSH work\nstandards\n\n1.1. OSH work\npractices issues\n1.2. OSH work\nstandards\n1.3. General OSH\nprinciples and\nlegislations\n1.4. Company/\nworkplace policies/\nguidelines\n1.5. Standards and\nsafety\nrequirements of\nwork process and\nprocedures\n1.1. Communication\nskills\n1.2. Interpersonal skills\n1.3. Critical thinking\nskills\n1.4. Observation skills\n2. Set OSH work\ntargets\n\n2.1 Relevant work\ninformation are gathered\nnecessary to determine\nOSH work targets\n2.2 OSH Indicators based\non gathered information\nare agreed upon to\nmeasure effectiveness of\nworkplace OSH policies\nand procedures\n2.3 Agreed OSH indicators\nare endorsed for\napproval from\nappropriate personnel\n2.4 OSH work instructions\nare received in\naccordance with\nworkplace policies and\nprocedures*\n2.1. OSH work targets\n2.2. OSH Indicators\n2.3. OSH work\ninstructions\n2.4. Safety and health\nrequirements of\ntasks\n2.5. Workplace\nguidelines on\nproviding\nfeedback on OSH\nand security\nconcerns\n2.6. OSH regulations\nHazard control\nprocedures\n2.7. OSH trainings\nrelevant to work\n2.1. Communication\nskills\n2.2. Collaborating skills\n2.3. Critical thinking\nskills\n2.4. Observation skills\n\n--- PDF PAGE 35 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 31\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n\n3.1 OSH Practices are\nobserved based on\nworkplace standards\n3.2 Observed OSH\npractices are measured\nagainst approved OSH\nmetrics\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nOSH work standards\n\n3.1. OSH Practices\n3.2. OSH metrics\n3.3. OSH Evaluation\nTechniques\n3.4. OSH work\nstandards\n3.1. Critical thinking\nskills\n3.2. Evaluating skills\n\n--- PDF PAGE 36 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Work\nPractices Issues\nMay include:\n1.1 Workers’ experience/observance on presence of work hazards\n1.2 Unsafe/unhealthy administrative arrangements (prolonged work\nhours, no break-time, constant overtime, scheduling of tasks)\n1.3 Reasons for compliance/non-compliance to use of PPEs or\nother OSH procedures/policies/ guidelines\n2. OSH Indicators\nMay include:\n2.1 Increased of incidents of accidents, injuries\n2.2 Increased occurrence of sickness or health\ncomplaints/symptoms\n2.3 Common complaints of workers’ related to OSH\n2.4 High absenteeism for work-related reasons\n3. OSH Work\nInstructions\nMay include:\n3.1 Preventive and control measures, and targets\n3.2 Eliminate the hazard (i.e., get rid of the dangerous machine\n3.3 Isolate the hazard (i.e. keep the machine in a closed room and\noperate it remotely; barricade an unsafe area off)\n3.4 Substitute the hazard with a safer alternative (i.e., replace the\nmachine with a safer one)\n3.5 Use administrative controls to reduce the risk (i.e. give trainings\non how to use equipment safely; OSH-related topics, issue\nwarning signages, rotation/shifting work schedule)\n3.6 Use engineering controls to reduce the risk (i.e. use safety\nguards to machine)\n3.7 Use personal protective equipment\n3.8 Safety, Health and Work Environment Evaluation\n3.9 Periodic and/or special medical examinations of workers\n4. OSH metrics\nMay include:\n4.1 Statistics on incidence of accidence and injuries\n4.2 Morbidity (Type and Number of Sickness)\n4.3 Mortality (Cause and Number of Deaths)\n4.4 Accident Rate\n\n--- PDF PAGE 37 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 33\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Identify OSH work practices issues relevant to work\nrequirements\n1.2. Identify gaps in work practices related to relevant OSH\nwork standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of workplace OSH\npolicies and procedures\n1.4. Receive OSH work instructions in accordance with\nworkplace policies and procedures\n1.5. Compare Observed OSH practices with against approved\nOSH work instructions\n1.6. Assess findings regarding effectiveness based on OSH\nwork standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment necessary for\nthe activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 38 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 34\n\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK PRACTICES\n\nUNIT CODE\n: 400311326\n\nUNIT DESCRIPTOR\n\n:\n\nThis unit covers the knowledge, skills and attitude to interpret\nenvironmental\nIssues,\nestablish\ntargets\nto\nevaluate\nenvironmental practices and evaluate effectiveness of\nenvironmental practices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n1.1 Environmental work\npractices issues are\nidentified relevant to\nwork requirements\n1.2 Environmental\nStandards and\nProcedures nature of\nwork are determined\nbased on Applicability to\nnature of work\n1.3 Gaps in work practices\nrelated to Environmental\nStandards and\nProcedures are\nidentified\n\n1.1 Environmental\nIssues\n1.2 Environmental\nWork Procedures\n1.3 Environmental\nLaws\n1.4 Environmental\nHazardous and\nNon-Hazardous\nMaterials\n1.5 Environmental\nrequired license,\nregistration or\ncertification\n1.1. Analyzing\nEnvironmental\nIssues and\nConcerns\n1.2. Critical thinking\n1.3. Problem Solving\n1.4. Observation Skills\n\n2. Establish\ntargets to\nevaluate\nenvironmental\npractices\n\n2.1. Relevant information are\ngathered necessary to\ndetermine environmental\nwork targets\n2.2. Environmental\nIndicators based on\ngathered information are\nset to measure\nenvironmental work\ntargets\n2.3. Indicators are verified\nwith appropriate\npersonnel\n2.1. Environmental\nIndicators\n2.2. Relevant\nEnvironment\nPersonnel or\nexpert\n2.3. Relevant\nEnvironmental\nTrainings and\nSeminars\n2.1. Investigative\nSkills\n2.2. Critical thinking\n2.3. Problem Solving\n2.4. Observation Skills\n\n--- PDF PAGE 39 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 35\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness\nof\nenvironmental\npractices\n3.1. Work environmental\npractices are recorded\nbased on workplace\nstandards\n3.2. Recorded work\nenvironmental practices\nare compared against\nplanned indicators\n3.3. Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nenvironment work\nstandards and\nprocedures\n3.4. Results of environmental\nassessment are\nconveyed to appropriate\npersonnel\n\n3.1 Environmental\nPractices\n3.2 Environmental\nStandards and\nProcedures\n3.1 Documentation and\nRecord Keeping\nSkills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\n--- PDF PAGE 40 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 36\n\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental Practices Issues May include:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 41 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 37\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1. Identified environmental issues relevant to work requirements\n1.2. Identified gaps in work practices related to Environmental\nStandards and Procedures\n1.3. Gathered relevant information necessary to determine\nenvironmental work targets\n1.4. Set environmental indicators based on gathered information\nto measure environmental work targets\n1.5. Recorded work environmental practices are recorded based\non workplace standards\n1.6. Conveyed results of environmental assessment to\nappropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate\n of training – local and abroad)\n 3.4 Simulations and role-plays\n4. Context for Assessment 4.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 42 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 38\n\nUNIT OF COMPETENCY :\nFACILITATE ENTREPRENEURIAL SKILLS FOR MICRO-\nSMALL-MEDIUM ENTERPRISES (MSMEs)\n\n UNIT CODE\n:\n400311327\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to build, operate and\ngrow a micro/small-scale enterprise.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n1.1 Appropriate business\nstrategies are\ndetermined and set for\nthe enterprise based on\ncurrent and emerging\nbusiness environment.\n1.2 Business operations\nare monitored and\ncontrolled following\nestablished procedures.\n1.3 Quality assurance\nmeasures are\nimplemented consistently.\n1.4 Good relations are\nmaintained with\nstaff/workers.\n1.5 Policies and procedures\non occupational safety\nand health and\nenvironmental concerns\nare constantly observed.\n1.1 Business\nmodels and\nstrategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business\noperation\n1.4 Basic\nBookkeeping\n1.5 Business\ninternal controls\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n1.7 Government\nand regulatory\nprocesses\n\n1.1 Basic\nbookkeeping/\naccounting skills\n1.2 Communication\nskills\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building\ncompetitive\nadvantage of the\nenterprise\n2. Establish and\nmaintain client-\nbase/market\n2.1 Good customer relations\nare maintained\n2.2 New customers and\nmarkets are identified,\nexplored and reached out\nto.\n2.3 Promotions/Incentives\nare offered to loyal\ncustomers\n2.4 Additional products and\nservices are evaluated\nand tried where feasible.\n2.5 Promotional/advertising\ninitiatives are carried out\nwhere necessary and\nfeasible.\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/ tarpaulins,\nflyers, social media,\netc.)\n\n--- PDF PAGE 43 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 39\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Apply budgeting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.1 Cash flow\nmanagement\n3.1 Basic financial\nmanagement\n3.2 Basic financial\naccounting\n3.3 Business\ninternal controls\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial statements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 44 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 40\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business strategies\nMay include:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products and\nservices\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/Advertising\ninitiatives\nMay include:\n4.1 Use of tarpaulins, brochures, and/or flyers\n4.2 Sales, discounts and easy payment terms\n4.3 Use of social media/Internet\n4.4 “Service with a smile”\n4.5 Extra attention to regular customers\n\n--- PDF PAGE 45 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 41\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n 1.3 Demonstrated ability to manage/operate a\nmicro/small-scale business\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 46 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 42\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPREPARE CONSTRUCTION MATERIALS AND\nTOOLS\n\nUNIT CODE\n\n:\nCON931201\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction\nmaterials and tools in various workplace settings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify materials\n\n1.1 Materials are identified\nas per job requirements\n1.2 Quantity and\ndescription of\nmaterials and tools\nconform with the job\nrequirements\n1.3 Tools and accessories\nare identified according\nto job requirements\n1.1 Different work\nspecifications\n1.2 Types and uses\nof Masonry\ntools and\naccessories\n\n1.1 Identifying tools\nand accessories\naccording to the\njob requirements\n\n2. Prepare requisition\nof materials\n\n2.1 Materials and tools\nneeded are requested\naccording to the\nidentified requirements\n2.2 Request is done as per\ncompany standard\noperating procedures\n(SOP)\n2.3 Substitute materials and\ntools are provided\nwithout sacrificing cost\nand quality of work\n2.1 Work\nrequirements\n2.2 Types and uses\nof Masonry tools\nand accessories\n2.3 Material take-off\n2.4 Requisition\nprocedures\n2.1 Preparing material\ntake-off\n2.2 Requesting\nmaterials and tools\n\n3. Receive and\ninspect materials\n3.1 Materials and tools\nissued are inspected as\nper quantity and\nspecification\n3.2 Tools, accessories and\nmaterials are checked\n3.3 Materials and tools are\nset aside to appropriate\nlocation\n3.1 Policy on\nreceiving\nmaterial\ndeliveries\n3.2 Material and\ntools quality and\ndefects\n3.3 Material\nhandling\n3.1 Checking and\ninspecting\nmaterials and tools\n3.2 Storing/ stacking\nof tool and\nmaterials\n\n--- PDF PAGE 47 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 43\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Description of\nmaterials and tools\n\nMay include:\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n2. Tools and\naccessories\nMay include:\n1.1 Electrical supplies\n1.2 Mechanical supplies\n1.3 Cleaning supplies\n3. Company standard\noperating\nprocedures\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 48 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 44\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list\nprepared and as per company SOP\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Provided tools with safety devices\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 49 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 