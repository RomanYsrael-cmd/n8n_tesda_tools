iles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden\nformworks\n\nInstall wooden door\njamb, window frame\nand panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall\nand/or cladding frames\nand boards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\n\nCORE COMPETENCIES\n\n--- PDF PAGE 116 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 112\n\nGLOSSARY OF TERMS\n\n1. DOWEL\nA headless, cylindrical pin which, is sunk into corresponding\nholes\n\n2. LINTEL\nRefers to the horizontal member over an opening such as door\nor window, usually carrying the load\n\n3. MORTAR\nRefers to a mixture of cement, sand and water used for laying\nbricks or masonry units\n\n4. REBAR\nRefers to the reinforcing bars that are embedded in building\ncomponents such as concrete, masonry walls, columns, beams\nand other structural parts\n\n5. SCAFFOLD\n\n6. FORMWORKS\n\n7. CURING\n\n8. COMPUTER\nLITERATE\n\n9. 5S\n\n10. 3R\n\nReduce\n\nReuse\n\nRecycling\n\nRefers to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\nA set of wood or steel forms in place to hold wet concrete until it\nhardens\n\nIs defined as providing adequate moisture, temperature, and\ntime to allow the concrete to achieve the desired properties for\nits intended use\n\nThis term is usually used to describe the most basic knowledge\nand skills needed to operate software products such as an\noperating system, a software application, or an automated Web\ndesign tool.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 117 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 113\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMasonry NC III\nQualification Code:\nCONMAS318\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMasonry NC III\n2006-09 /\n04/20/06\nN/A\n01\nDocument Amended\n\nMasonry NC III\n2018-31 /\n10/29/18\nNo. 011 series\nof 2019\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 118 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 114\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nROLANDO C. BADILLA\nTechnical Specialist – Industry Expert\nJames Hardie Philippines, Inc.\nCabuyao, Laguna\nJELUZ B. CORRO\nDepartment Head - Industry Expert\nDatem Con