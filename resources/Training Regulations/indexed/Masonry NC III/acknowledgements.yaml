      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. DOWEL A headless, cylindrical pin which, is sunk into corresponding holes"
    },
    {
      "source_text": "2. LINTEL Refers to the horizontal member over an opening such as door or window, usually carrying the load"
    },
    {
      "source_text": "3. MORTAR Refers to a mixture of cement, sand and water used for laying bricks or masonry units"
    },
    {
      "source_text": "4. REBAR Refers to the reinforcing bars that are embedded in building components such as concrete, masonry walls, columns, beams and other structural parts"
    },
    {
      "source_text": "5. SCAFFOLD"
    },
    {
      "source_text": "6. FORMWORKS"
    },
    {
      "source_text": "7. CURING"
    },
