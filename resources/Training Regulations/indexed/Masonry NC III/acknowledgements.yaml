      "source_text": "Reuse"
    },
    {
      "source_text": "Recycling"
    },
    {
      "source_text": "Refers to a temporary or movable platform supported on the ground or suspended, used for working at considerable heights above the ground."
    },
    {
      "source_text": "A set of wood or steel forms in place to hold wet concrete until it hardens"
    },
    {
      "source_text": "Is defined as providing adequate moisture, temperature, and time to allow the concrete to achieve the desired properties for its intended use"
    },
    {
      "source_text": "This term is usually used to describe the most basic knowledge and skills needed to operate software products such as an operating system, a software application, or an automated Web design tool."
    },
