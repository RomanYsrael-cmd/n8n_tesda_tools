      "source_text": "UNIT OF COMPETENCY : EVALUATE OCCUPATIONAL SAFETY AND HEALTH WORK PRACTICES UNIT CODE : 400311325"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to interpret Occupational Safety and Health practices, set OSH work targets, and evaluate effectiveness of Occupational Safety and Health work instructions"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Interpret Occupational Safety and Health practices"
    },
    {
      "source_text": "1.1 OSH work practices issues are identified relevant to work requirements 1.2 OSH work standards and procedures are determined based on applicability to nature of work 1.3 Gaps in work practices are identified related to relevant OSH work standards"
    },
    {
      "source_text": "1.1. OSH work practices issues 1.2. OSH work standards 1.3. General OSH principles and legislations 1.4. Company/ workplace policies/ guidelines 1.5. Standards and safety requirements of work process and procedures 1.1. Communication skills 1.2. Interpersonal skills 1.3. Critical thinking skills 1.4. Observation skills 2. Set OSH work targets"
    },
    {
      "source_text": "2.1 Relevant work information are gathered necessary to determine OSH work targets 2.2 OSH Indicators based on gathered information are agreed upon to measure effectiveness of workplace OSH policies and procedures 2.3 Agreed OSH indicators are endorsed for approval from appropriate personnel 2.4 OSH work instructions are received in accordance with workplace policies and procedures* 2.1. OSH work targets 2.2. OSH Indicators 2.3. OSH work instructions 2.4. Safety and health requirements of tasks 2.5. Workplace guidelines on providing feedback on OSH and security concerns 2.6. OSH regulations Hazard control procedures 2.7. OSH trainings relevant to work 2.1. Communication skills 2.2. Collaborating skills 2.3. Critical thinking skills 2.4. Observation skills"
    },
    {
      "source_text": "-- PDF PAGE 35 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 31"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Evaluate effectiveness of Occupational Safety and Health work instructions"
    },
    {
      "source_text": "3.1 OSH Practices are observed based on workplace standards 3.2 Observed OSH practices are measured against approved OSH metrics 3.3 Findings regarding effectiveness are assessed and gaps identified are implemented based on OSH work standards"
    },
    {
      "source_text": "3.1. OSH Practices 3.2. OSH metrics 3.3. OSH Evaluation Techniques 3.4. OSH work standards 3.1. Critical thinking skills 3.2. Evaluating skills"
    },
    {
      "source_text": "-- PDF PAGE 36 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 32"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. OSH Work Practices Issues May include: 1.1 Workers’ experience/observance on presence of work hazards 1.2 Unsafe/unhealthy administrative arrangements (prolonged work hours, no break-time, constant overtime, scheduling of tasks) 1.3 Reasons for compliance/non-compliance to use of PPEs or other OSH procedures/policies/ guidelines 2. OSH Indicators May include: 2.1 Increased of incidents of accidents, injuries 2.2 Increased occurrence of sickness or health complaints/symptoms 2.3 Common complaints of workers’ related to OSH 2.4 High absenteeism for work-related reasons 3. OSH Work Instructions May include: 3.1 Preventive and control measures, and targets 3.2 Eliminate the hazard (i.e., get rid of the dangerous machine 3.3 Isolate the hazard (i.e. keep the machine in a closed room and operate it remotely; barricade an unsafe area off) 3.4 Substitute the hazard with a safer alternative (i.e., replace the machine with a safer one) 3.5 Use administrative controls to reduce the risk (i.e. give trainings on how to use equipment safely; OSH-related topics, issue warning signages, rotation/shifting work schedule) 3.6 Use engineering controls to reduce the risk (i.e. use safety guards to machine) 3.7 Use personal protective equipment 3.8 Safety, Health and Work Environment Evaluation 3.9 Periodic and/or special medical examinations of workers 4. OSH metrics May include: 4.1 Statistics on incidence of accidence and injuries 4.2 Morbidity (Type and Number of Sickness) 4.3 Mortality (Cause and Number of Deaths) 4.4 Accident Rate"
    },
    {
      "source_text": "-- PDF PAGE 37 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 33"
    },
