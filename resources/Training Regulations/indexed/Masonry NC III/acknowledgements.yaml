    {
      "source_text": "VARIABLE RANGE 1. Diversity This refers to diversity in both the workplace and the community and may include divergence in : 1.1 Religion 1.2 Ethnicity, race or nationality 1.3 Culture 1.4 Gender, age or personality 1.5 Educational background 2. Diversity-related conflicts May include conflicts that result from: 2.1 Discriminatory behaviors 2.2 Differences of cultural practices 2.3 Differences of belief and value systems 2.4 Gender-based violence 2.5 Workplace bullying 2.6 Corporate jealousy 2.7 Language barriers 2.8 Individuals being differently-abled persons 2.9 Ageism (negative attitude and behavior towards old people)"
