      "source_text": "2.1 DOLE Department Order No. 13 series 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.2 Green Building Concept relative to Construction (3R, 5S) 2.3 Methods and techniques in measurements 2.4 Safe handling of tools 2.5 Safety signs and symbols 2.6 Technical drawing and specifications 2.7 Quality standard requirements 2.8 Factors affecting productivity 2.9 Productivity work measurements 2.10 Ways of improving productivity 2.11 Adherence to work requirements"
    },
    {
