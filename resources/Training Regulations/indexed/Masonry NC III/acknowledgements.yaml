    {
      "source_text": "SECTION 1 MASONRY NC III QUALIFICATION"
    },
    {
      "source_text": "The MASONRY NC III qualification consists of competencies that a person must achieve that will enable to perform basic tile setting, perform straight-to-finish concrete floor and rectify non-conforming concrete and masonry surfaces."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of Construction – Civil Works sub-sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 400311319 Lead workplace communication 400311320 Lead small teams 400311321"
    },
    {
      "source_text": "400311322 Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment 400311323"
    },
    {
      "source_text": "400311324 400311325 400311326 400311327 Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311202 Interpret technical drawings and plans CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON711320 CON711321 CON711322 Perform basic tile setting Perform straight-to-finish floor concreting Rectify non-conforming concrete and masonry surfaces"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –"
    },
    {
      "source_text": " Finishing Mason"
    },
