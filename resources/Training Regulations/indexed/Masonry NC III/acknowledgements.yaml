    {
      "source_text": "UNIT OF COMPETENCY : PROPOSE METHODS OF APPLYING LEARNING AND INNOVATION IN THE ORGANIZATION"
    },
    {
      "source_text": "UNIT CODE : 400311323"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to assess general obstacles in the application of learning and innovation in the organization and to propose practical methods of such in addressing organizational challenges."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Assess work procedures, processes and systems in terms of innovative practices 1.1. Reasons for innovation are incorporated to work procedures. 1.2. Models of innovation are researched. 1.3. Gaps or barriers to innovation in one’s work area are analyzed. 1.4. Staff who can support and foster innovation in the work procedure are identified."
    },
    {
      "source_text": "1.1 Seven habits of highly effective people. 1.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004) 1.3 Five minds of the future concepts (Gardner, 2007). 1.4 Adaptation concepts in neuroscience (Merzenich, 2013). 1.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992)."
    },
    {
      "source_text": "1.1 Demonstrating collaboration and networking skills. 1.2 Applying basic research and evaluation skills 1.3 Generating insights on how to improve organizational procedures, processes and systems through innovation."
    },
    {
      "source_text": "-- PDF PAGE 25 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 21"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Generate practical action plans for improving work procedures, processes 2.1 Ideas for innovative work procedure to foster innovation using individual and group techniques are conceptualized 2.2 Range of ideas with other team members and colleagues are evaluated and discussed 2.3 Work procedures and processes subject to change are selected based on workplace requirements (feasible and innovative). 2.4 Practical action plans are proposed to facilitate simple changes in the work procedures, processes and systems. 2.5 Critical inquiry is applied and used to facilitate discourse on adjustments in the simple work procedures, processes and systems. 2.1 Seven habits of highly effective people. 2.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004) 2.3 Five minds of the future concepts (Gardner, 2007). 2.4 Adaptation concepts in neuroscience (Merzenich, 2013). 2.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992). 2.1 Assessing readiness for change on simple work procedures, processes and systems. 2.2 Generating insights on how to improve organizational procedures, processes and systems through innovation. 2.3 Facilitating action plans on how to apply innovative procedures in the organization."
    },
    {
      "source_text": "-- PDF PAGE 26 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 22"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Evaluate the effectiveness of the proposed action plans 3.1 Work structure is analyzed to identify the impact of the new work procedures 3.2 Co-workers/key personnel is consulted to know who will be involved with or affected by the work procedure 3.3 Work instruction operational plan of the new work procedure is developed and evaluated. 3.4 Feedback and suggestion are recorded. 3.5 Operational plan is updated. 3.6 Results and impact on the developed work instructions are reviewed 3.7 Results of the new work procedure are evaluated 3.8 Adjustments are recommended based on results gathered 3.1 Five minds of the future concepts (Gardner, 2007). 3.2 Adaptation concepts in neuroscience (Merzenich, 2013). 3.3 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992). 3.1 Generating insights on how to improve organizational procedures, processes and systems through innovation. 3.2 Facilitating action plans on how to apply innovative procedures in the organization. 3.3 Communicating results of the evaluation of the proposed and implemented changes in the workplace procedures and systems. 3.4 Developing action plans for continuous improvement on the basic systems, processes and procedures in the organization."
    },
    {
      "source_text": "-- PDF PAGE 27 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 23"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Reasons May include: 1.1 Strengths and weaknesses of the current systems, processes and procedures. 1.2 Opportunities and threats of the current systems, processes and procedures. 2. Models of innovation May include: 2.1 Seven habits of highly effective people. 2.2 Five minds of the future concepts (Gardner, 2007). 2.3 Neuroplasticity and adaptation strategies. 3. Gaps or barriers May include: 3.1 Machine 3.2 Manpower 3.3 Methods 3.4 Money 4. Critical Inquiry May include: 4.1 Preparation. 4.2 Discussion. 4.3 Clarification of goals. 4.4 Negotiate towards a Win-Win outcome. 4.5 Agreement. 4.6 Implementation of a course of action. 4.7 Effective verbal communication. See our pages: Verbal Communication and Effective Speaking. 4.8 Listening. 4.9 Reducing misunderstandings is a key part of effective negotiation. 4.10 Rapport Building. 4.11 Problem Solving. 4.12 Decision Making. 4.13 Assertiveness. 4.14 Dealing with Difficult Situations."
    },
    {
      "source_text": "-- PDF PAGE 28 --- MASONRY NC III Revision 01 Promulgated (10/29/2018) 24"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Established the reasons why innovative systems are required 1.2 Established the goals of a new innovative system 1.3 Analyzed current organizational systems to identify gaps and barriers to innovation. 1.4 Assessed work procedures, processes and systems in terms of innovative practices. 1.5 Generate practical action plans for improving work procedures, and processes. 1.6 Reviewed the trial innovative work system and adjusted reflect evaluation feedback, knowledge management systems and future planning. 1.7 Evaluated the effectiveness of the proposed action plans. 2. Resource Implications The following resources should be provided: 2.1 Pens, papers and writing implements. 2.2 Cartolina. 2.3 Manila papers. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Psychological and behavioral Interviews. 3.2 Performance Evaluation. 3.3 Life Narrative Inquiry. 3.4 Review of portfolios of evidence and third-party workplace reports of on-the-job performance. 3.5 Sensitivity analysis. 3.6 Organizational analysis. 3.7 Standardized assessment of character strengths and virtues applied. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions."
    },
