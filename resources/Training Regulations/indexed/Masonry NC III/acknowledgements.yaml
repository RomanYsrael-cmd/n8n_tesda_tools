      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1. Identify OSH work practices issues relevant to work requirements 1.2. Identify gaps in work practices related to relevant OSH work standards 1.3. Agree upon OSH Indicators based on gathered information to measure effectiveness of workplace OSH policies and procedures 1.4. Receive OSH work instructions in accordance with workplace policies and procedures 1.5. Compare Observed OSH practices with against approved OSH work instructions 1.6. Assess findings regarding effectiveness based on OSH work standards 2. Resource Implications The following resources should be provided: 2.1 Facilities, materials, tools and equipment necessary for the activity 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Observation/Demonstration with oral questioning 3.2 Third party report 3.3 Written exam"
    },
    {
      "source_text": "4. Context for Assessment 4.1 Competency may be assessed in the work place or in a simulated work place setting"
    },
