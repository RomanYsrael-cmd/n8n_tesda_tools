      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required productively rectify non-conforming concrete and masonry surfaces."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Identify defective concrete and masonry surfaces 1.1 Personal protective equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 1.2 Non-conforming concrete / masonry surfaces are identified, marked and reported to the immediate supervisor. 1.3 Prepare and select materials, tools and equipment needed for rectification work. 1.4 Work area is cleaned according to safety and environmental regulations (e.g. PD 1152 Section 6, 8 & 42) 1.5 Required output is completed as specified by the immediate supervisor based on work schedule."
    },
