        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for work in accordance with job\nrequirements\n1.2 Laid out tiling area in line with approved working drawings\n1.3 Installed wall and floor tiles according to specifications.\n1.4 Performed housekeeping\n1.5 Observed and complied with safety and environmental\nregulations\n1.6 Communicated with others to ensure effective work\noperation\n1.7 Observed and complied with the productivity requirements\n1.8 Complied with attitudinal work requirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1\nActual or simulated workplace\n2.2\nTools, materials and equipment needed to perform the\nrequired tasks\n2.3\nReferences and manuals\n2.4\nPPE\n2.5\nFirst Aid Kit\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with Oral Questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or at\n the designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 70 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 66\n\nUNIT OF COMPETENCY :\nPERFORM STRAIGHT-TO FINISH FLOOR CONCRETING\n\nUNIT CODE :"
