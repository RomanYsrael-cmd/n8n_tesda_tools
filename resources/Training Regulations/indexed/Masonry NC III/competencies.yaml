        "source_text": "CON711321\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nproductively place and finish floor concreting.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\nwork\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Work permit and\ninstruction are secured\nand interpreted in line\nwith job requirements.\n1.3 Safety and quality\nrequirements are\nidentified in line with\nOccupational Safety\nand Health Standards\n(OSHS) and job\nspecifications.\n1.4 Materials, tools and\nequipment are\nidentified and prepared\nin accordance with job\nrequirements.\n1.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n1.6 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n1.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n1.3 Safe handling of\ntools and equipment\n1.4 Safety signs and\nsymbols\n1.5 Technical drawing\nand specifications\n1.6 Materials\nidentifications and\nclassifications\n1.7 Manufacturer’s\nproduct\nspecifications and\ninstructions\n1.8 Quality standard\nrequirements\n1.9 Adherence to work\nrequirements\n\n1.1 Communication skills\n1.2 Organizing materials\nto be used\n1.3 Estimating materials\n1.4 Handling of materials,\ntools and equipment\n1.5 Implementing 3R and\n5S\n\n--- PDF PAGE 71 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 67\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Place concrete\n2.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n2.2 Concrete is conveyed\nas per job requirements.\n2.3 Concrete is deposited\nas near as possible to\nits final position. (at\nmost 1.5 meter free\ndrop height)\n2.4 Concrete is\nconsolidated as per job\nspecifications.\n2.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n2.6 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n2.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n2.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n2.3 Methods and\ntechniques in\nconveying,\ndepositing and\nconsolidating\nconcrete.\n2.4 Safe handling of\nmaterials, tools and\nequipment\n2.5 Safety signs and\nsymbols\n2.6 Technical\nspecifications\n2.7 Quality standard\nrequirements\n2.8 Factors affecting\nproductivity\n2.9 Productivity work\nmeasurements\n2.10\nWays of\nimproving\nproductivity\n2.11\nAdherence to\nwork requirements\n2.1 Communication skills\n2.2 Handling of\nmaterials, tools and\nequipment\n2.3 Applying productive\nmethods and\ntechniques in\nconsolidating\nconcrete\n2.4 Implementing 3R and\n5S\n\n--- PDF PAGE 72 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 68\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Finish concrete\nsurface\n\n3.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n3.2 Surface is screeded to\ndesired grade.\n3.3 Surface is rubbed\n(“buli”) in accordance\nwith job requirements.\n3.4 Surface is finished in\naccordance with job\nrequirements\n3.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n3.6 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n3.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n3.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n3.3 Safe handling of\ntools and equipment\n3.4 Safety signs and\nsymbols\n3.5 Technical\nspecifications\n3.6 Methods and\ntechniques in\nfinishing concrete\nsurface\n3.7 Quality standard\nrequirements\n3.8 Factors affecting\nproductivity\n3.9 Productivity work\nmeasurements\n3.10\nWays of\nimproving\nproductivity\n3.11\nAdherence to\nwork requirements\n\n3.1 Communication skills\n3.2 Observing safe use\nof tools and\nequipment\n3.3 Handling of tools and\nequipment\n3.4 Applying productive\nmethods and\ntechniques in\nfinishing concrete\nsurface\n3.5 Implementing 3R and\n5S\n\n--- PDF PAGE 73 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 69\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Perform Curing\n4.1 Personal protective\nequipment (PPE) is\nselected and used\naccording to job\nrequirements.\n4.2 Curing materials are\nprepared in accordance\nwith job requirements.\n4.3 Curing of concrete is\nperformed based on\njob requirements.\n4.4 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n4.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n4.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n4.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n4.3 Safe handling of\nmaterials, tools and\nequipment\n4.4 Safety signs and\nsymbols\n4.5 Technical\nspecifications\n4.6 Methods and\ntechniques in curing\nconcrete\n4.7 Quality standard\nrequirements\n4.8 Factors affecting\nproductivity\n4.9 Productivity work\nmeasurements\n4.10\nWays of\nimproving productivity\n4.11\nAdherence to\nwork requirements\n\n4.1 Communication skills\n4.2 Observing safe use\nof materials, tools\nand equipment\n4.3 Applying productive\nmethods and\ntechniques in curing\n4.4 Implementing 3R and\n5S\n\n--- PDF PAGE 74 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 70\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Protective\nEquipment (PPE)\nInclude:\n1.1 Hard hat\n1.2 Safety shoes/ rubber boots\n1.3 Proper uniform\n1.4 Gloves (cotton)\n1.5 Dust mask\n1.6 Safety goggles\n1.7 Reflectorized vest\n\n2. Job requirements\n\nMay include:\n2.1 Approved working drawings\n2.2 Specifications / Standards\n\n3. Quality requirements\nMay include:\n3.1 Quality of materials\n3.2 Quality of prepared surface\n3.3 Working procedures\n3.4 Application procedures\n\n4. Occupational Safety and\nHealth Standards\nMay include:\n4.1 Protective clothing and equipment\n4.2 Use of tools and equipment\n4.3 Handling of materials\n4.4 Hazardous materials\n\n5. Tools and equipment\nMay include:\n5.1 One bagger concrete mixer\n5.2 Shovel\n5.3 Bucket\n5.4 Screeder\n5.5 Hand/ Power trowel\n5.6 Hand/ Power float\n5.7 Vibrator\n5.8 Sprayer\n5.9 Pulley or lifting equipment\n\n6. Materials\nMay include:\n6.1 Ready-mixed concrete\n6.2 Cement\n6.3 Sand\n6.4 Gravel\n6.5 Water\n6.6 Admixtures\n6.7 Curing materials\n\n--- PDF PAGE 75 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 71\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for work in accordance with job\nrequirements.\n1.2 Placed concrete as per job specifications.\n1.3 Finished concrete surface in accordance with job requirements\n1.4 Performed curing based on job requirements.\n1.5 Observed and complied with safety and environmental\nregulations\n1.6 Communicated with others to ensure effective work operation\n1.7 Observed and complied with the productivity requirements\n1.8 Complied with attitudinal work requirements\n\n2. Resource Implications The following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the required\ntasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 76 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 72\n\nUNIT OF COMPETENCY : RECTIFY NON-CONFORMING CONCRETE AND\nMASONRY SURFACES\n\nUNIT CODE :"
