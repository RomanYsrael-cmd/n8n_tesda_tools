        "source_text": "CON311204\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance\nand storing of construction painting tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Check condition of\ntools and\nequipment\n\n1.1 Materials, tools\nand equipment\nare identified\naccording to\nclassification and\njob requirements\n1.2 Non-functional\ntools and\nequipment are\nsegregated and\nlabeled according\nto classification\n1.3 Safety of tools and\nequipment are\nobserved in\naccordance with\nmanufacturer's\ninstructions\n1.4 Condition of\nPersonal\nProtective\nEquipment (PPE)\nare checked in\naccordance with\nmanufacturer's\ninstructions\n\n1.1 Use of PPE\n1.2 Handling of tools\nand equipment\n1.3 Good\nhousekeeping\n1.4 Types and uses\nof lubricants\n1.5 Types and uses\nof cleaning\nmaterials\n\n1.1 Maintaining tools\nand equipment\n1.2 Handling of tools\nand equipment\n1.3 Identifying tools\nand equipment\ndefects\n\n--- PDF PAGE 60 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 56\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate\nlubricants are\nidentified\naccording to types\nof equipment\n2.2 Tools and\nequipment are\nlubricated\naccording to\npreventive\nmaintenance\nschedule or\nmanufacturer's\nspecifications\n2.3 Measuring\ninstruments are\nchecked and\ncalibrated in\naccordance with\nmanufacturer’s\ninstructions\n2.4 Tools are cleaned\nand lubricated\naccording to\nstandard\nprocedures\n2.5 Defective\ninstruments,\nequipment and\naccessories are\ninspected and\nreplaced according\nto manufacturer’s\nspecifications\n2.6 Tools are\ninspected, repaired\nand replaced after\nuse\n2.7 Work place is\ncleaned and kept\nin safe state in line\nwith Occupational\nSafety and Health\n(OSHS)\n\n2.1 Use of PPE\n2.2 Handling of tools\nand equipment\n2.3 Good\nhousekeeping\n2.4 Types and uses\nof lubricants\n2.5 Types and uses\nof cleaning\nmaterials\n2.6 Methods and\ntechniques\n2.7 Procedures\n\n2.1 Handling of tools\nand equipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 61 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 57\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Store tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany\npractices\n3.2 Tools and\nequipment are\nstored safely in\nappropriate\nlocations in\naccordance with\nmanufacturer's\nspecifications or\ncompany\nprocedures\n\n3.1 Use of PPE\n3.2 Handling of tools\nand equipment\n3.3 Storing\nprocedures and\ntechniques\n3.4 Storage\nconditions/\nlocations\n\n3.1 Storing tools and\nequipment\n3.2 Handling of tools\nand equipment\n\n--- PDF PAGE 62 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 58\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw\nBoring tools - brace, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Reflectorized Vest\n\n--- PDF PAGE 63 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 59\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1