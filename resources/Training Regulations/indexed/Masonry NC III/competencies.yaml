        "evidence_guide": {
          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified defective concrete and masonry surfaces\n1.2 Corrected non-conforming concrete / masonry surfaces\n1.3 Checked repaired concrete and masonry surfaces in accordance with\n established procedures\n1.4 Observed and complied with safety and environmental regulations\n1.5 Communicated with others to ensure effective work operation\n1.6 Observed and complied with the productivity requirements\n1.7 Complied with attitudinal work requirements\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the required tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the designated\nTESDA Accredited Assessment Center\n\n--- PDF PAGE 81 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 77"
        },
        "source_text": "CON711322\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required\nproductively rectify non-conforming concrete and masonry\nsurfaces.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\ndefective\nconcrete and\nmasonry\nsurfaces\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Non-conforming\nconcrete / masonry\nsurfaces are identified,\nmarked and reported to\nthe immediate\nsupervisor.\n1.3 Prepare and select\nmaterials, tools and\nequipment needed for\nrectification work.\n1.4 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n1.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n1.2 Green Building\nConcept relative to\nConstruction (3R, 5S)\n1.3 Technical\nspecifications\n1.4 Quality standard\nrequirements\n1.5 Types of concrete\nand masonry defects\n1.6 Factors affecting\nproductivity\n1.7 Productivity work\nmeasurements\n1.8 Ways of improving\nproductivity\n1.9 Adherence to work\nrequirements\n\n1.1 Communication skills\n1.2 In-process inspection\n1.3 Applying productive\nmethods and\ntechniques in\nidentifying defective\nconcrete and masonry\nsurface\n1.4 Implementing 3R and\n5S\n\n--- PDF PAGE 77 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 73\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Correct non-\nconforming\nconcrete /\nmasonry\nsurfaces\n2.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n2.2 All defective concrete /\nmasonry surfaces are\nprepared and/or\ncleaned in accordance\nto rectification\nprocedure.\n2.3 Materials needed are\nprepared and mixed in\naccordance with\nrectification procedure.\n2.4 Rectification\nprocedure is\nperformed as per\nidentified non-\nconformity.\n2.5 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n2.6 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n2.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n2.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n2.3 Safe handling of\nmaterials, tools and\nequipment\n2.4 Safety signs and\nsymbols\n2.5 Technical\nspecifications\n2.6 Methods and\ntechniques in\nrectifying non-\nconforming\nconcrete/ masonry\nsurfaces\n2.7 Quality standard\nrequirements\n2.8 Factors affecting\nproductivity\n2.9 Productivity work\nmeasurements\n2.10 Ways of improving\nproductivity\n2.11 Adherence to work\nrequirements\n\n2.1 Communication skills\n2.2 Observing safe use of\nmaterials, tools and\nequipment\n2.3 Handling of materials,\ntools and equipment\n2.4 Applying productive\nmethods and\ntechniques in repairing\nnon-conforming\nconcrete/ masonry\nsurfaces\n2.5 Implementing 3R and\n5S\n\n--- PDF PAGE 78 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 74\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Check repaired\nconcrete and\nmasonry\nsurfaces\n3.1 Final check is made to\nensure that work\n conforms with\ninstructions and job\nrequirements\n3.2 Immediate superior is\ninformed upon\ncompletion of work.\n3.3 Tools, equipment and\nany surplus resources\nand materials are\nchecked, disposed\nand/or stores in\naccordance with\nestablished\nprocedures.\n3.4 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n3.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n3.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction Industry\n3.2 Technical\nspecifications\n3.3 Quality standard\nrequirements\n1.10\nGreen Building\nConcept relative to\nConstruction (3R,\n5S)\n3.4 Factors affecting\nproductivity\n3.5 Productivity work\nmeasurements\n3.6 Ways of improving\nproductivity\n3.7 Adherence to work\nrequirements\n\n3.1 Communication skills\n3.2 Applying productive\nmethods and\ntechniques in\ninspecting and testing\nof repaired concrete\nand masonry surfaces\n3.3 Implementing 3R and\n5S\n\n--- PDF PAGE 79 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 75\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Personal Protective Equipment\n(PPE)\nInclude:\n1.1 Cotton Gloves\n1.2 Dust Mask\n1.3 Body harness\n1.4 Safety shoes\n1.5 Safety Helmet\n1.6 Safety glasses / goggles\n1.7 Safety goggles\n1.8 Reflectorized vest\n1.9 Full body harness\n\n2. Materials\n\nMay include:\n2.1 Cement\n2.2 Water\n2.3 Sand (Screened)\n2.4 Bonding agent\n\n3. Tools and equipment\nMay include:\n3.1 Mixing board\n3.2 Pointed trowel\n3.3 Foam / Sponge\n3.4 Grinder\n3.5 Scaffolding / ladder\n3.6 Hammer\n3.7 Wooden float\n3.8 Shovel\n3.9 Steel float\n3.10 Bucket\n3.11 Cold chisel\n3.12 Brush\n3.13 Nylon string\n3.14 Spirit level\n\n4. Final check\nMay include:\n4.1\nPlumbness\n4.2\nLevelness\n4.3\nSquareness\n4.4\nConcrete quality\n4.5\nSmoothness, if necessary\n4.6\nColor consistency / uniformity\n\n--- PDF PAGE 80 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 76\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified defective concrete and masonry surfaces\n1.2 Corrected non-conforming concrete / masonry surfaces\n1.3 Checked repaired concrete and masonry surfaces in accordance with\n established procedures\n1.4 Observed and complied with safety and environmental regulations\n1.5 Communicated with others to ensure effective work operation\n1.6 Observed and complied with the productivity requirements\n1.7 Complied with attitudinal work requirements\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the required tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the designated\nTESDA Accredited Assessment Center\n\n--- PDF PAGE 81 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 77"
