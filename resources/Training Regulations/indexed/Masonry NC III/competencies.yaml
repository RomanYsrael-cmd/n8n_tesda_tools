        "source_text": "CON711320\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nproductively install wall and floor tiles (30 cm x 30 cm maximum\ntile size).\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\nwork\n\n1.1 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Work instruction is\nsecured and interpreted\nin line with job\nrequirements.\n1.3 Safety and quality\nrequirements are\nidentified in line with\nOccupational Safety\nand Health Standards\n(OSHS) and job\nspecifications.\n1.4 Materials, tools and\nequipment are\nidentified and prepared\nin accordance with job\nrequirements\n1.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n1.6 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n1.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n1.3 Safe handling of\ntools and equipment\n1.4 Safety signs and\nsymbols\n1.5 Technical drawing\nand specifications\n1.6 Materials\nidentifications and\nclassifications\n1.7 Manufacturer’s\nproduct\nspecifications and\ninstructions\n1.8 Quality standard\nrequirements\n1.9 Adherence to work\nrequirements\n\n1.1 Communication skills\n1.2 Organizing materials\nto be used\n1.3 Estimating materials\n1.4 Handling of materials,\ntools and equipment\n8.1 Implementing 3R and\n5S\n\n--- PDF PAGE 65 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Lay out tiling\narea\n2.1 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n2.2 Tiling area is cleared\nand cleaned according\nto standard operating\nprocedures.\n2.3 Area to be tiled is\nchecked in line with job\nrequirements.\n2.4 Tiling area is laid out in\nline with approved\nworking drawings\n2.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n2.6 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n2.1 DOLE Department\nOrder No. 13\nseries 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n2.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n2.3 Methods and\ntechniques in\nmeasurements\n2.4 Safe handling of\ntools\n2.5 Safety signs and\nsymbols\n2.6 Technical drawing\nand specifications\n2.7 Quality standard\nrequirements\n2.8 Factors affecting\nproductivity\n2.9 Productivity work\nmeasurements\n2.10 Ways of improving\nproductivity\n2.11 Adherence to work\nrequirements\n\n2.1 Communication skills\n2.2 Applying trade\nmathematics and\nmensuration\n2.3 Handling of tools\n2.4 Establishing horizontal\nand vertical guide\n2.5 Applying productive\nmethods and\ntechniques in lay\nouting of tiling area\n2.6 Implementing 3R and\n5S\n\n--- PDF PAGE 66 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 62\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Install wall\n and floor tiles\n\n3.1 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n3.2 Waterproofing is\napplied to walls and\nfloors according to\nspecifications\n3.3 Cement or tile\nadhesive is prepared\nand applied according\nto manufacturer’s\ninstructions.\n3.4 Tiles are prepared and\ninstalled according to\nspecifications.\n3.5 Joints are checked for\nstraightness and\nsurface for evenness.\n3.6 Grout is mixed and\napplied according to\nmanufacturer's\nspecifications.\n3.7 Tiles are cleaned and\npolished to\nspecifications,\nremoving all dust from\nsurface and joints.\n3.8 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n3.9 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n3.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n3.2 Green Building\nConcept relative to\nConstruction (3R,\n5S)\n3.3 Safe handling of\ntools and\nequipment\n3.4 Safety signs and\nsymbols\n3.5 Technical drawing\nand specifications\n3.6 Materials\nidentifications and\nclassifications\n3.7 Manufacturer’s\nproduct\nspecifications and\ninstructions\n3.8 Quality standard\nrequirements\n3.9 Tile installation\nprocedures and\ntechniques\n3.10 Factors affecting\nproductivity\n3.11 Productivity work\nmeasurements\n3.12 Ways of improving\nproductivity\n3.13 Adherence to work\nrequirements\n\n3.1 Communication skills\n3.2 Observing safe use\nof tools and\nequipment\n3.3 Handling of materials,\ntools and equipment\n3.4 Applying productive\nmethods and\ntechniques in\ninstalling and laying\nof tiles\n3.5 Applying productive\nmethods and\ntechniques in cutting\n3.6 Implementing 3R and\n5S\n\n--- PDF PAGE 67 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 63\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized and bold terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Perform\nhousekeeping\n4.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards.\n4.2 Excess/un-used\nmaterials are recovered\nand stockpiled\naccording to company\nrules and procedures\n4.3 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n4.4 Tools and other\nmaterials are\ncleaned after use.\n4.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n4.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n4.2 Green Building\nConcept relative to\nConstruction (3R,\n5S\n4.3 Safe handling and\nstandard\nspecification of\nmaterials and tools\n4.4 Safety signs and\nsymbols\n4.5 Adherence to work\nrequirements\n\n4.1 Working safely\n4.2 Organizing materials\nto be stored\n4.3 Handling and use of\nmaterials and tools\n4.4 Communicating\neffectively\n4.5 Using PPE\n4.6 Implementing 3R and\n5S\n\n--- PDF PAGE 68 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 64\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal\nProtective\nEquipment (PPE)\nInclude:\n1.1 Hard hat\n1.2 Safety shoes/ rubber boots\n1.3 Proper uniform/clothing\n1.4 Gloves (cotton)\n1.5 Dust mask\n1.6 Safety goggles\n1.7 Reflectorized vest\n2. Job requirements\n\nMay include:\n2.1 Approved working drawings\n2.2 Specifications / Standards\n3. Quality requirements\nMay include:\n3.1 Quality of materials\n3.2 Quality of prepared surface\n3.3 Laying out procedures\n3.4 Application procedures\n3.5 Workplace operations and procedures\n4. Occupational Safety and\n Health Standards\nMay include:\n1.1 Protective clothing and equipment\n1.2 Use of tools and equipment\n1.3 Handling of materials\n1.4 Hazardous materials\n5. Materials, tools and\nequipment\nMay include:\nMaterials:\n5.1 Ceramic tiles\n5.2 Porcelain tiles\n5.3 Tile adhesive\n5.4 Cement\n5.5 Tile grout\n5.6 Tile trims\n5.7 Tile spacers\nTools:\n5.8 Tile cutter\n5.9 Pull-push-rule\n5.10 Notched trowel\n5.11 Pointed trowel\n5.12 Spirit level\n5.13 Rubber mallet\n5.14 Rubber squeegee\n5.15 Tile plier\nEquipment:\n5.16 Portable electric grinder (4” dia. Diamond blade)\n5.17 Vacuum cleaner\n\n--- PDF PAGE 69 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 65\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for work in accordance with job\nrequirements\n1.2 Laid out tiling area in line with approved working drawings\n1.3 Installed wall and floor tiles according to specifications.\n1.4 Performed housekeeping\n1.5 Observed and complied with safety and environmental\nregulations\n1.6 Communicated with others to ensure effective work\noperation\n1.7 Observed and complied with the productivity requirements\n1.8 Complied with attitudinal work requirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1\nActual or simulated workplace\n2.2\nTools, materials and equipment needed to perform the\nrequired tasks\n2.3\nReferences and manuals\n2.4\nPPE\n2.5\nFirst Aid Kit\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with Oral Questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or at\n the designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 70 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 66\n\nUNIT OF COMPETENCY :\nPERFORM STRAIGHT-TO FINISH FLOOR CONCRETING\n\nUNIT CODE :"
