\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 98 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 94\n\nCORE COMPETENCIES\n (80 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform basic tile\nsetting\n1.1 Plan and prepare for\nwork\n\n• Explain quality/occupational\nhealth and safety/\nenvironmental procedures\n• Identify materials, equipment\nand tools\n• Interpret work schedule\n• Understanding the factors\naffecting productivity\n• Practicing 3R and 5S\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith\nquestioning\n• Written /\nExamination\n\n4 Hours\n\n1.2 Layout tiling area\n• Understanding the pattern of\nlaying tiles\n• Explain the sequence of tiling\noperation\n• Perform layouting\n• Measuring work productivity\n• Utilizing most productive\npractice\n• Practicing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n8 Hours\n\n--- PDF PAGE 99 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 95\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.3 Install wall and floor tiles\n•\nApplying procedures for\nwaterproofing\n•\nApplying procedures of\ntile adhesive\n•\nInstalling wall and floor\ntiles\n•\nGrouting and cleaning of\njoints\n•\nMeasuring work\nproductivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n24 Hours\n\n1.4 Perform housekeeping\n• Explain regulatory\nrequirements on safety\nand environmental\n• Identify methods on waste\nsegregation and disposal\n• Explain 3R and 5S\n• Lecture\n• Practical/\nDemonstration\n• Observation/\nDemonstration\nwith\nquestioning\n• Written\nExamination\n\n4 Hours\n\n--- PDF PAGE 100 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 96\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Perform straight–to\nfinish floor\nconcreting\n2.1 Plan and prepare for\nwork\n\n• Explain\nquality/occupational\nhealth and safety/\nenvironmental\nprocedures\n• Identify materials,\nequipment and tools\n• Interpret work schedule\n• Practicing 3R and 5S\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith\nquestioning\n• Written /\nExamination\n\n4 Hours\n\n2.2 Place concrete\n\n• Understanding the\nproperties of concrete\n• Convey, deposit and\nconsolidate concrete\n• Measuring work\nproductivity\n• Utilizing most productive\npractice\n• Understanding the\nfactors affecting\nproductivity\n• Practicing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n12 Hours\n\n2.3 Finish concrete surface\n• Spread concrete to the\ndesired level\n• Finish concrete surface\n• Measuring work\nproductivity\n• Utilizing most productive\npractice\n• Practicing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n4 Hours\n\n--- PDF PAGE 101 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 97\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.4 Perform curing\n• Enumerate and explain\nTypes of curing methods\nand processes\n• Perform curing\n• Measuring work productivity\n• Utilizing most productive\npractice\n• Practicing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n4 hours\n3. Rectify non-\nconforming concrete\nand masonry\nsurfaces\n3.1 Identify defective\nconcrete and masonry\nsurfaces\n• Identify kinds of defects\n• Practicing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n3.2 Correct non-conforming\nconcrete / masonry\nsurfaces\n• Explain remedies and\nprocedures in correcting\nconcrete/ masonry surfaces\ndefects\n• Applying remedies and\nprocedures in correcting\nconcrete/ masonry surfaces\ndefects\n• Measuring work productivity\n• Utilizing most productive\npractice\n• Practicing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n12 Hours\n\n3.3 Check repaired concrete\nand masonry surfaces\n• Enumerate criteria for\nacceptance and/ or rejection\nof concrete and masonry\nsurfaces\n• Conduct final inspection\n• Practicing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n--- PDF PAGE 102 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 98\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized\nindustry\nsector;\n(Learning\nsystem\nis\ndriven\nby\ncompetencies written to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 103 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 99\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or\nfield-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n--- PDF PAGE 104 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 100\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Holder of Masonry NC II\n• Can communicate both orally and in writing\n• Physically fit\n\n--- PDF PAGE 105 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 101\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for MASONRY NC III are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs.\nBucket / Pail\n1 pc\nMixing board\n(4x8 feet)\n10 pcs.\nShovel, flat\n25 pcs.\nSteel trowel, 8 inches\n25 pcs.\nWooden float\n25 pcs.\nPull-push-rule, 5 m\n5 pcs.\nSpirit level, 2’\n4 sets\nSteel Scaffold\n(1.2 meters width)\n5 pcs.\nCross-cut saw, 18 inches\n5 pcs.\nTile cutter\n5 pcs.\nSteel square\n5 pcs.\nCold chisel\n5 pcs.\nLevel hose\n(5 meters)\n5 pcs.\nClaw hammer\n5 pcs.\nMeasuring box\n5 pcs\nHacksaw\n10pcs\nHacksaw blade\n5 pcs.\nSteel brush\n5 pcs.\nWheel barrow\n\n--- PDF PAGE 106 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 102\n\nTOOLS\nQTY\nDESCRIPTION\n5 pcs.\nCrow bar, 18 inches\n5 pcs.\nPlier\n10 pcs.\nNotched trowel\n10 pcs\nPointed trowel\n\n10 pcs.\nRubber mallet\n10 pcs.\nRubber squeegee\n10 pcs.\nTile plier\n4 pcs.\nScreed, aluminum, 4’\n2 pcs.\nKnap-sack sprayer\n200 pcs\nTile spacer\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nOne bagger concrete mixer\n1 unit\nPortable Grinder\n1 unit\nVacuum cleaner\n1 unit\nPulley or lifting equipment\n1 unit\nConcrete vibrator, 1” dia, diesel driven\n\n--- PDF PAGE 107 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 103\n\nMATERIAL\nQTY\nDESCRIPTION\n15 bags\nPortland cement\n12 pcs.\nReinforcing bars,(10 mm diameter)\n1 m3\nSand\nVar\nWater\n2 kls.\nGI wire, #20\n2 kls.\nCommon wire Nails (assorted sizes)\n4 pcs.\nLumber (2” x 4” x 10’)\n25 pcs.\nPencil\n5 rolls\nNylon string (5 meter length)\n1 m3\nGravel (¾ inch)\n5 bags\nScreened Sand\n100 pcs.\nCeramic tiles, 30”x30”\n\n100 pcs.\nPorcelain tiles, 30”x30”\n\n3 bags\nTile adhesive, 20 kgs\n3 bags\nTile grout, 2 kgs\n13 pcs.\nTile trims, 8’\n\n--- PDF PAGE 108 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 104\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\n\n--- PDF PAGE 109 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 105\n\n3.5 TRAINING FACILITIES\n\nThe masonry workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n20 x 25\n500\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n668\n\n--- PDF PAGE 110 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 106\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nMASONRY NC III\n• Must be computer literate\n• Must have at least three (3) years industry experience in Civil works and\none (1) year teaching experience in Masonry\n• Must have completed the 40-Hour Construction Occupational Safety and\nHealth (COSH) per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction Industry\nconducted by OSHC and DOLE accredited Safety Training Organizations\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of Competency.\n\n--- PDF PAGE 111 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 107"
