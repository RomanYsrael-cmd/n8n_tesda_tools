      "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: MASONRY NC III\n\nNominal Training Duration:\n40 Hours Basic Competencies\n24 Hours Common Competencies\n 80 Hours Core Competencies\n Total 144 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and attitude,\napplicable in performing work activities involve in performing basic tile setting, performing\nstraight-to-finish floor concreting and rectify non-conforming concrete and masonry surfaces. This\nincludes classroom learning activities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieve\n\n--- PDF PAGE 82 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 78\n\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises o