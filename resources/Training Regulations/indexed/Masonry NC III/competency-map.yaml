  "source_text": "SECTION 1 MASONRY NC III QUALIFICATION\n\nThe MASONRY NC III qualification consists of competencies that a person must achieve\nthat will enable to perform basic tile setting, perform straight-to-finish concrete floor and rectify\nnon-conforming concrete and masonry surfaces.\n\nThis Qualification is packaged from the competency map of Construction – Civil Works\nsub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\n400311322\nApply critical thinking and problem-solving techniques in\nthe workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in\nthe organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON711320\nCON711321\nCON711322\nPerform basic tile setting\nPerform straight-to-finish floor concreting\nRectify non-conforming concrete and masonry surfaces\n\nA person who has achieved this Qualification is competent to be a –\n\n Finishing Mason\n\n--- PDF PAGE 6 ---\nMASONRY NC III Revision 01 Promulgated (10/29/2018) 2"
