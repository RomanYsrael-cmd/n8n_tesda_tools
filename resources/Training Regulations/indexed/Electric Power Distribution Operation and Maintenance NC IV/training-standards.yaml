  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Electric Power Distribution Operation and Maintenance NC\nIV.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title : Electric Power Distribution Operation and Maintenance\n\nNC Level\n: NC IV\n\nNominal Training Duration:\n54 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 120 hrs – Core Competencies\n\n ------------\n\n 234 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan electric power distribution line foreman, in accordance with industry standards. It covers\nthe basic and common competencies in addition to the core competencies such as\nperforming onsite assessment and testing of installed electric distribution line equipment\nand devices, troubleshooting faults and implement solution on electric power distribution\nsystem and supervising operation and maintenance on electric power distribution system.\n\nThe nominal duration of 234 hours covers the required units at Electric Power\nDistribution Operation and Maintenanc