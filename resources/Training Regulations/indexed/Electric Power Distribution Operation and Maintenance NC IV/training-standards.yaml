    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title : Electric Power Distribution Operation and Maintenance\n\nNC Level\n: NC IV\n\nNominal Training Duration:\n54 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 120 hrs – Core Competencies\n\n ------------\n\n 234 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan electric power distribution line foreman, in accordance with industry standards. It covers\nthe basic and common competencies in addition to the core competencies such as\nperforming onsite assessment and testing of installed electric distribution line equipment\nand devices, troubleshooting faults and implement solution on electric power distribution\nsystem and supervising operation and maintenance on electric power distribution system.\n\nThe nominal duration of 234 hours covers the required units at Electric Power\nDistribution Operation and Maintenance NC IV. TVET providers can however, offer a longer,\nladderized course covering the NC IV basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 79 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 75\n\nBASIC COMPETENCIES\n(54 hours)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1. Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n1.1.1. Read\no Communication process\no Dynamics of groups and\ndifferent styles of group\nleadership\n1.1.2. Identify different approaches to\nmeet the needs of clients and\ncolleagues\n• Lecture\n• Written examination\n1 hr.\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n1.2.1. Apply communication skills to fulfill\njob roles as specified by the\norganization\n1.2.2. Apply communication techniques\nin communicating with clients and\ncolleagues\no Active listening\no Feedback\no Interpretation\no Role boundaries setting\no Negotiation\no Establishing empathy\n1.2.3. Describe strategies for internal\nand external dissemination of\ninformation\n• Demonstration\n• Group\ndiscussion\n• Observation\n• Oral evaluation\n1 hr.\n\n1.3. Represent the\norganization\n\n1.3.1. Describe criteria for a good\npresentation\n1.3.2. Prepare presentation material for\ninternal or external forums to\npromote the organization\n1.3.3. Use appropriate media to enhance\nthe presentation\n• Demonstration\n• Observation\n1 hr.\n\n--- PDF PAGE 80 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 76\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n1.4. Facilitate group\ndiscussion\n1.4.1. Gather relevant information\n1.4.2. Apply values in facilitating\ndifferences in views\n• Demonstration\n• Observation\n1 hr.\n1.5. Conduct interview\n1.5.1. Describe communication\nstrategies employed in interview\nsituations\n1.5.2. Conduct interview\n1.5.3. Apply organizations procedure in\nmaintaining records of interviews\n1.5.4. Use questioning, listening and\nnonverbal communication\ntechniques to client groups\n• Group\ndiscussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 hr.\n2. Develop teams\nand individuals\n2.1. Provide team\nleadership\n\n2.1.1. Describe\no Coaching and mentoring\nprinciples\no working effectively with team\nmembers who have diverse\nwork styles, aspirations,\ncultures and perspective\no facilitating team development\nand improvement\n2.1.2. Read\no methods for identifying and\nprioritizing personal\ndevelopment opportunities and\noptions\no methods and techniques for\neliciting and interpreting\nfeedback\n2.1.3. Apply communication skills in\nreceiving feedback and reporting,\nmaintaining effective relationships\nand conflict management\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written examination\n1 hr.\n\n--- PDF PAGE 81 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 77\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n2.1.4. Apply team leadership skills to\nsupport colleagues:\no Planning skills\no Coaching and mentoring skills\no Reporting skills\no Facilitation skills\n• Group\ndiscussion\n• Oral evaluation\n\n2.2. Foster individual\nand organizational\ngrowth\n2.2.1. Describe Learning and\ndevelopment program goals and\nobjectives\n2.2.2. Apply learning delivery methods in\npreparing learning and program\ngoals and objectives\n2.2.3. Identify and prioritize personal\ndevelopment opportunities and\noptions for career paths and\ncompetency standards in the\nindustry\n• Group\ndiscussion\n• Demonstration\n• Lecture\