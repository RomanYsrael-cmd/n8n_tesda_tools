nt, procedures and techniques\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands on practice\n• Demonstration\n• Oral\nquestioning\n• Written exam\n• Laboratory\nexercises\n• Simulation\nexercises\n4 hours\n2.4. Implement\ncorrective\nsolution\n2.4.1. Lecture and demonstration on:\no Electric distribution line repair and\nreplacement procedures\no Procedures in assessment of fault condition\no Protocols on distribution line restoration/ re-\nenergization (lock-out/tag-out)\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands on practice\n• Demonstration\n• Oral\nquestioning\n• Written exam\n• Laboratory\nexercises\n8 hours\n\n--- PDF PAGE 102 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 98\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\no Procedures on replacement of\ndefective/damaged equipment and materials\n2.4.2. Repair faulty condition on distribution line\n2.4.3. Replace defective/damaged equipment and\nmaterials\n2.4.4. Restore/re-energize repaired faulty condition\n• Simulation\nexercises\n3. Supervise\noperation and\nmaintenance\non electric\npower\ndistribution\nsystem\n3.1. Supervise line\nworker works\n3.1.1. Lecture and discussion on:\no Duties of electric power distribution\nsupervisor\no Supervisory and leadership principles\no Safety precautions necessary when working\non high voltage electrical lines.\no Applicable laws, codes and safety orders\nrelating to electrical line work.\no Jurisdictional and company regulations\nregarding system authority and switching\norders\no Load breaking capabilities and methods\n3.1.2. Read and interpret electrical distribution\nconstruction plans and specification