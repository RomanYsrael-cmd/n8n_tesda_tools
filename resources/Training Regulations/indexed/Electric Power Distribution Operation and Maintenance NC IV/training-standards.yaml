s long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1. Institution- Based:\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n2.2. Enterprise-Based:\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 105 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 101\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n1.\nMust be a holder of certificate in Electric Power Distribution Operation\nand Maintenance NC III\n2.\nMust have at least 5-years work experience in electric distribution\nsystem\n3.\nCan communicate in oral and written language\n4.\nMust be physically fit to undergo training\n\nThis list does not include specific institutional requirement such as written\nentrance exam, and others that may be required from the trainees by the school\nor training center delivering the TVET program.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n\n20 trainees for Electric Power Distribution Operation and Maintenance NC IV:\n\nTOOLS\n\nEQUIPMENT\nQTY\nUNIT\nITEM\nQTY\nUNIT\nITEM\n2\nunits\nBolt cutter, 24” & 36”, steel\nhandle\n10\nsets\nPole climbing equipment\n2\nunits\nRachet, 1.5 to