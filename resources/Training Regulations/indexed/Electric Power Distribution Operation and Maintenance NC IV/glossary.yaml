      "term": "Ground line maintenance work",
      "definition": "refers to activities in the ground done by distribution line personnel which do not require climbing activity 10. Groundworks - a person working at ground level in support of a lineman working overhead. 11. Guy Wire. The wire or cable normally used in a down guy is seven-strand galvanized steel wire or seven-strand aluminum clad wire. Alum weld wire consists of steel wire strands coated with a layer of aluminum to prevent corrosion. Guy wire is used in various sizes with diameters from ¼ to 1 ¼ in. 12. Guy-wire assembly -is a tensioned cable designed to add stability to structures (frequently ship masts, radio masts, wind turbines, utility poles, and tents). One end of the cable is attached to the structure, and the other is anchored to the ground at a distance from the structure's base. 13. Handline - used for lifting or lowering small objects and also for holding equipment away from the pole as it is being raised 14. Hazard - a dangerous condition, potential or inherent, that can bring about an interruption or interfere with the expected orderly progress of an activity. It is any work materials, equipment, methods or practices that have the potential to cause harm to life, health, property or environment. 15. Hazardous - an atmosphere that may expose employees to the risk of death, atmosphere incapacitation, impaired ability to self-rescue unaided, injury, or acute illness. 16. Hazardous atmospheres - include flammable gas, vapor, or mist, airborne combustible dust, oxygen concentration below 19.5 percent or above 23.5 percent, Electric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 109 concentrations of substances that exceed dose or permissible exposure limits, or other atmospheric condition immediately dangerous to life or health. 17. High Voltage (Sub-transmission if 33-115kV and transmission if 115kV+) – between 33 kV and about 230 kV, used for sub-transmission and transmission of bulk quantities of electric power and connection to very large consumers. 18. Hot Line Order - a statement with documentation from the Operations Supervisor to the Job Supervisor that specific work may be done on or near a line or other equipment without requiring that it be disconnected from all sources of energy. The equipment is to be considered energized or “hot.” 19. Hotstick - an insulated stick, usually made of fiberglass, that is used to work energized overhead conductors and operate electrical equipment that is overhead, underground and pad mounted. 20. Insulator - a device that is used to electrically isolate a conductor or electrical device from ground or a different electrical potential. Insulators must support the conductors and withstand both the normal operating voltage and surges due to switching and lightning. Insulators are broadly classified as either pin-type, which support the conductor above the structure, or suspension type, where the conductor hangs below the structure. Up to about 33 kV (69 kV in North America) both types are commonly used. At higher voltages only suspension-type insulators are common for overhead conductors. Insulators are usually made of wet-process porcelain or toughened glass, with increasing use of glass-reinforced polymer insulators. 21. Line to line clearance – refers to the distance of live conductors to another live conductor. 22. Line to ground clearance - refers to the distance of live conductors to the ground 23. Line worker - a payroll classification or title given a craftsperson whose duties include climbing wood poles or steel structures to perform work on electric power transmission and distribution circuits. 24. Low voltage – less than 1000 volts, used for connection between a residential or small commercial customer and the utility. 25. Medium Voltage (Distribution) – between 1000 volts (1 kV) and to about 33 kV, used for distribution in urban and rural areas. 26. OHSAS 18001 – is a framework for an Occupational Health and Safety (OHS) Management Systems and is part of the OHSAS 18000 series of standards, along with OHSAS 18002. 27. Overhead ground wire (OHGW) – is an electrical conductor which provides protection to transmission lines against direct lightning strokes. 28. Overhead power line - is an electric power transmission line suspended by towers or poles. Since most of the insulation is provided by air, overhead power lines are generally the lowest-cost method of transmission for large quantities of electric power. Towers for support of the lines are made of wood (as-grown or laminated), steel (either lattice structures or tubular poles), concrete, aluminum, and occasionally reinforced plastics. The bare wire conductors on the line are generally made of aluminum (either plain or reinforced with steel or sometimes composite materials), though some copper wires are used in medium-voltage distribution and low-voltage connections to customer premises. Electric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 110 29. Personal Protective Equipment (PPE) - refers to protective clothing, helmets, goggles, or other garment or equipment designed to protect line personnel from job-related occupational hazards 30. Personal Protective Equipment (PPE) - the term shall include, but is not limited to, devices designed to be worn by workers for eye, face, head, respiratory, hand, arm, body, leg, foot, and fall protection. 31. Philippine Grid Code - establishes and documents the basic rules, requirements, procedures and standards that govern the operation, maintenance and development of the high-voltage backbone transmission system in the Philippines (Republic Act No. 9136, also known as the “Electric Power Industry Reform Act of 2001) 32. Pole Dressing – refers to installation of structure components, such as cross arms, insulators and etc. 33. Pole Setting – refers to pole positioning, pole erection and pole facing. 34. Pre-formed Armor Rod - a spiral-formed aluminum rod, a group of which is placed around a conductor at the point of suspension to minimize vibration and to protect the conductor from burning in case of a flashover. 35. Reeving - The operation of passing the rope around the sheaves of blocks. 36. Rigging – is the term used to described the process of moving/lifting both heavy and light loads using rope, blocks, and other special equipment. 37. Right of way (ROW) – the legal right, established by usage or grant, to pass along a specific route through grounds or property belonging to another. 38. Risks - a probability or threat of damage, injury, liability, loss or any other negative occurrence that is caused by external or internal vulnerabilities, and that may be avoided through preemptive action. 39. Slings - provide a method of attaching rigging tools to structures or equipment. They can be made of rope, webbing or steel. Some slings are made with a continuous loop while others are made with an eye on each end. 40. Slope Protection – The protection of an embankment slope against wave action or erosion. 41. Tag Line - A rope used to control the position of equipment being lifted. This is not to be confused with the rope used to actually lift the equipment. 42. Transmission line - is the material medium or structure that forms all or part of a path from one place to another for directing the transmission of energy, such as electromagnetic waves or acoustic waves, as well as electric power transmission. Components of transmission lines include wires, coaxial cables, dielectric slabs, optical fibers, electric power lines, and waveguides. 43. Ultra High Voltage – higher than 800 kV. 44. Vibration Damper - a device used to dissipate the vibration of conductors on a transmission line. 45. Voltage Detector- is a sensor used to detect presence of electricity in a wire. Electric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 111"
