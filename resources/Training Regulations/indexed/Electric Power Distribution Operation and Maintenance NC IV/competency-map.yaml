ion\nDavao del Sur Electric Coop., Inc. (DASURECO)\nSurigao del Sur I Electric Coop., Inc. (SURSECO I)\nCogon, Digos City\nSan Fernando, Bislig City\n\n• THE MANAGEMENT AND STAFF OF NATIONAL ELECTRIFICATION\nADMINISTRATION\n\nENGR. ARTIS NIKKI L. TORTOLA\nNORA I. RIVERA\nDeputy Administrator for Technical Services\nDepartment Manager, NETI\nNational Electrification Administration\nNational Electrification Administration\nNIA Rd., Brgy. Piñahan, Gov’t. Ctr, Diliman, Q.C.\nNIA Rd., Brgy. Piñahan, Gov’t. Ctr, Diliman, Q.C.\n\nRAEON JAKOW K. LASPIÑAS\nCHERIE JOYCE C. GARCIA\nNational Electrification Administration\nNational Electrification Administration\nNIA Rd., Brgy. Piñahan, Gov’t. Center, Diliman, Q.C.\nNIA Rd., Brgy. Piñahan, Gov’t. Ctr, Diliman, Q.C.\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT\nCOMMITTEE\n\n• THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT\n\n•\nQualifications and Standards Office (QSO)\n\nName\nCompany/industry\n Email Address\n\n1. Dir. IMELDA B. TAGANAS - QSO-TESDA\nibtaganas@tesda.gov.ph\n2. JULFORD C. ABASOLO\n- CSDD-QSO-TESDA\njcabasolo@tesda.gov.ph\n3. SAMUEL E. CALADO, JR. - CSDD-QSO-TESDA\nsecaladojr@tesda.gov.ph\n4. VENZEL Y. CONCOLES\n- CSDD-QSO-TESDA\nvyconcoles@tesda.gov.ph"
