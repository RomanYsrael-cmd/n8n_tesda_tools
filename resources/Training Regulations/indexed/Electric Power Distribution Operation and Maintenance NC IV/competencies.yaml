          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for onsite assessment and testing\n1.2 Assessed and evaluated installed electric distribution\nline equipment and devices\n1.3 Conducted testing of installed electric distribution\nequipment and devices\n\n2. Resource implications\nThe following resources should be available:\n2.1 Needed tools, equipment, poles, cross-arms, hardware\nand PPEs\n2.2 Site or work area\n2.3 Boom or derrick truck (if necessary)\n\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n\n4. Context of assessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 71 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 67\n\nUNIT OF COMPETENCY : TROUBLESHOOT FAULTS AND IMPLEMENT SOLUTION\nON ELECTRIC POWER DISTRIBUTION SYSTEM\n\nUNIT CODE\n\n:"
        },
        "source_text": "UTL741320\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto perform onsite assessment and testing of installed electric\ndistribution line equipment and devices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare for\nonsite\nassessment\nand testing\n\n1.1 Work instruction is secured\nand interpreted according\nto job requirements\n1.2 Relevant occupational\nsafety requirements are\nidentified following job\nspecifications\n1.3 Relevant distribution line\ntools, equipment and\nhardware are identified in\naccordance with job\nrequirements\n1.4 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.5 Toolbox meeting with the\nline crew is conducted\naccording to electric utility\nprocedures\n1.1 Uses and\nspecifications of\ndistribution line\ntools, equipment\nand hardware\n1.2 Relevant\noccupational\nsafety\nrequirements\n1.3 Power distribution\nindustry standards\nand specifications\n1.1 Interpretation\nskills\n1.2 Identifying\ndistribution\nhand/line tools,\nequipment and\nhardware\n1.3 Identifying\noccupational\nsafety standards\nfor line workers\n\n2. Assess and\nevaluate\ninstalled\nelectric\ndistribution\nline equipment\nand devices\n2.1. Occupational work safety\nprocedures are observed\nbased on job requirements\n2.2. Electric distribution line is\nassessed and evaluated in\naccordance with standard\nconstruction\nspecifications\n2.3. Equipment and devices\nare assessed and evaluated\nin accordance with\nstandard installation and\nconnection specifications\n2.1. Occupational\nwork safety\nprocedures\n2.2. Onsite\nassessment\nevaluation\nprocedures\n2.3. Standard\nconstruction\nspecifications\n2.4. Standard\ninstallation and\nconnection\nspecifications\n2.1. Interpretation\nskills\n2.2. Communication\nskills\n2.3. Pole climbing\nskills\n2.4. Evaluative skills\n2.5. Materials\nhandling skills\n\n3. Conduct\ntesting of\ninstalled\nelectric\ndistribution\n3.1. Occupational work safety\nprocedures are observed\nbased on job requirements\n3.1. Occupational\nwork safety\nprocedures\n3.1. Interpretation\nskills\n3.2. Communication\nskills\n\n--- PDF PAGE 68 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 64\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nequipment\nand devices\n3.2. Electric distribution\nequipment and devices are\ntested and verified\naccording to its functionality\nto meet specifications and\noperational requirements\n3.3. Document results of tests\ncarried out in accordance\nwith electric utility\nprocedures\n3.2. Installation and\noperation of\nelectric\ndistribution\nequipment and\ndevices\n\n3.3. Pole climbing\nskills\n3.4. Testing skills\n3.5. Documentation\nskills\n3.6. Materials\nhandling skills\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational\nsafety\nrequirements\n\nMay include:\n1.1 Personal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Work gloves\n1.1.4. Line worker boots/Rubber boots\n1.1.5. Working clothes\n1.1.6. Rain suits\n1.2\nPole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. pair of climbers\n2. Distribution line\ntools, equipment\nand hardware\nMay include but not limited to:\n2.1 Tools\n2.1.1. Rope/Hand line\n2.1.2. Adjustable wrench or line worker wrench\n2.1.3. Pliers\n2.1.4. Ball peen hammer\n2.1.5. Measuring rule / steel tape\n2.1.6. Screw driver\n2.1.7. Auger bit\n2.1.8. Ratchet\n2.1.9. Cum-a-long\n2.1.10. Bolt cutter\n2.1.11. wire skinning knife\n2.1.12. Bull line\n2.1.13. Pulling line\n2.1.14. Compression tool\n2.1.15. Pulley\n2.2\nEquipment\n2.1.1 Boom truck or derrick truck\n2.1.2 Pole climbing equipment\n2.1.3 Wench\n2.1.4 Ladder\n2.3\nConstruction materials for pole top, conductor, (anchor, guy,\ngrounding assemblies, if needed)\n\n--- PDF PAGE 69 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 65\n\nVARIABLE\nRANGE\n2.4\nConductors or wires (bare or insulated)\n2.4.1. Aluminum Conductor Steel Reinforced (ACSR)\n2.4.2. Copper wire\n3. Standard\nconstruction\nspecifications\nMay include:\n3.1\nclearances\n3.1.1. horizontal\n3.1.2. vertical\n3.2\npole facing and alignment\n3.3\ncondition of pole top assembly\n3.4\ncondition of pole\n3.5\ncondition of guy and anchor\n3.6\ngrounding condition\n3.7\ncondition of conductors\n4. Equipment and\ndevices\nMay include:\n4.1 Distribution transformer\n4.1.1. Cut-out and arrester assembly\n4.2 Line capacitor\n4.3 Regulators\n4.4 Three-phase metering\n4.4.1. Potential transformer\n4.4.2. Current transformer\n4.5 Switches\n4.5.1. Disconnecting switch (DS)\n4.5.2. Sectionalizer\n4.5.3. Recloser\n4.5.4. Air break switch (ABS)\n4.5.5. Load break switch (LBS)\n4.5.6. Circuit breaker (CB)\n5. Standard\ninstallation and\nconnection\nspecifications\nMay include:\n5.1\nStandard connection of cut-out and arrester\n5.2\nProper sizing of jumpers and conductors\n5.3\nCondition of connections\n5.4\nNo signs of corrosion and oil leaks\n\n--- PDF PAGE 70 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 66\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for onsite assessment and testing\n1.2 Assessed and evaluated installed electric distribution\nline equipment and devices\n1.3 Conducted testing of installed electric distribution\nequipment and devices\n\n2. Resource implications\nThe following resources should be available:\n2.1 Needed tools, equipment, poles, cross-arms, hardware\nand PPEs\n2.2 Site or work area\n2.3 Boom or derrick truck (if necessary)\n\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n\n4. Context of assessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 71 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 67\n\nUNIT OF COMPETENCY : TROUBLESHOOT FAULTS AND IMPLEMENT SOLUTION\nON ELECTRIC POWER DISTRIBUTION SYSTEM\n\nUNIT CODE\n\n:"
