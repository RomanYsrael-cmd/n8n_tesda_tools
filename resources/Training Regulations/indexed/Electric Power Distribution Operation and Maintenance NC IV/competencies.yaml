        "source_text": "UTL311205\nDESCRIPTOR : This unit covers the knowledge, skills and attitude to operate\nand maintain electric distribution line tools and equipment.\nThis unit will involve working in a team environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1 Work instruction is secured\nand interpreted according\nto job requirements\n1.2 Relevant occupational\nhealth and safety\nrequirements are\nidentified following job\nspecifications\n1.3 Relevant transmission line\ntools, equipment and\nhardware are identified\nand requested in\naccordance with job\nspecifications\n1.1. Relevant\noccupational health\nand safety\nstandards\n1.2. Types and usage of\ndistribution line tools\nand equipment\n1.3. Basic preventive\nmaintenance\nservicing for\ndistribution line\nequipment\n\n1.1. Following and\ncomplying\noccupational\nhealth and safety\nstandards\n1.2. Following\nprocedures for\nthe safe use of\ndistribution line\ntools and\nequipment\n1.3. Performing basic\npreventive\nmaintenance\nservicing for\ndistribution line\nequipment\n2. Prepare\nelectric\ndistribution\nline tools and\nequipment\n\n2.1 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n2.2 Electric distribution line\ntools, equipment and\nhardware are acquired and\nsecured in line with job\nrequirements\n2.3 Electric distribution hot line\ntools are tested/set\nfollowing\nmanufacturer’s standards\nor recommendation\n2.1. Types and functions\nof PPEs\n2.2. Types and usage of\ndistribution line tools\nand equipment\n2.3. Basic preventive\nmaintenance\nservicing for\ndistribution line\nequipment\n2.4. Proper testing of\nelectric distribution\nhot line tools\n2.1. Following and\ncomplying\noccupational\nhealth and safety\nstandards\n2.2. Following\nprocedures for\nthe safe use of\ndistribution line\ntools and\nequipment\n2.3. Performing basic\npreventive\nmaintenance\nservicing for\ndistribution line\nequipment\n2.4. Testing skills\n3. Operate\nelectric\ndistribution\nline tools and\nequipment\n3.1 PPE are used in line with\njob requirements\n3.2 Distribution line tools and\nequipment are used in line\nwith job requirements\n3.1. Proper usage of\nPPEs\n3.2. Proper procedure\nfor the use of\ndistribution line tools\nand equipment\n3.1. Using PPEs\n3.2. Following\nprocedures for\nthe safe use of\ndistribution line\n\n--- PDF PAGE 59 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 55\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3. Basic preventive\nmaintenance\nservicing for\ndistribution line\nequipment\ntools and\nequipment\n3.3. Performing basic\npreventive\nmaintenance\nservicing for\ndistribution line\nequipment\n4. Check\ncondition of\nelectric\ndistribution\nline tools and\nequipment\n\n4.1 Electric distribution line\ntools and equipment are\nidentified according to\nclassification and job\nrequirements\n4.2 Non-functional electric\ndistribution line tools and\nequipment are\nsegregated and labeled\naccording to classification\n4.3 Safety of distribution line\ntools and equipment are\nobserved in accordance\nwith manufacturer's\ninstructions\n4.4 Condition of PPE are\nchecked in accordance\nwith manufacturer's\ninstructions\n4.1. Classification of\ndistribution line tools\nand equipment\n4.2. Proper safety\nprocedure for the\nuse of distribution\nline tools and\nequipment\n4.3. Basic preventive\nmaintenance\nservicing for\ndistribution line\nequipment\n\n4.1. Classifying\ndistribution line\ntools and\nequipment\n4.2. Following and\ncomplying\noccupational\nhealth and safety\nstandards\n4.3. Following\nprocedures for\nthe safe use of\ndistribution line\ntools and\nequipment\n4.4. Performing basic\npreventive\nmaintenance\nservicing for\ndistribution line\nequipment\n5. Perform\nbasic\npreventive\nmaintenance\n5.1 Appropriate lubricants are\nidentified according to\ntypes of equipment\n5.2 Equipment are lubricated\naccording to preventive\nmaintenance schedule or\nmanufacturer's\nspecifications\n5.3 Electric distribution line\ntools are cleaned and\ntested according to\nstandard procedures\n5.4 Electric distribution line\ntools and equipment are\ninspected, and repaired\nand replaced, if necessary,\nafter use\n5.5 Work place is cleaned and\nkept in safe state in line\nwith OHSA regulations\n5.1. Types and usage of\nlubricants for\ndistribution line\nequipment\n5.2. Proper procedure\nfor the use and\nmaintenance of\ndistribution line tools\nand equipment\n5.3. Basic preventive\nmaintenance\nservicing for\ndistribution line\nequipment\n5.4. Applicable OHSA\nregulations in\npreventive\nmaintenance\n\n5.1. Identifying types\nand usage of\nlubricants\n5.2. Following\nprocedures for\nthe safe use and\nmaintenance of\ndistribution line\ntools and\nequipment\n5.3. Performing basic\npreventive\nmaintenance\nservicing for\ndistribution line\nequipment\n5.4. Following OHSA\nregulations\n\n--- PDF PAGE 60 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 56\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n6. Store tools\nand\nequipment\n\n6.1 Inventory of electric\ndistribution line tools and\nequipment are conducted\nand recorded as per\ncompany practices\n6.2 Electric distribution line\ntools and equipment are\nstored safely in appropriate\nlocations in accordance\nwith manufacturer's\nspecifications or company\nprocedures\n6.1. Proper procedure\nfor the inventory and\nstorage of\ndistribution line tools\nand equipment\n6.1. Following\nprocedures for\nthe inventory and\nstorage of\ndistribution line\ntools and\nequipment\n6.2. Inventory skills\n6.3. Proper storage\nand handling\nskills\n\n--- PDF PAGE 61 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\n1.1 Perform overhead distribution line work\n1.2 Erect pole\n1.3 Perform hotline maintenance work\n1.4 Perform cold-line maintenance work\n1.5 Perform ground line maintenance work\n\n2. Occupational health\n and safety\n requirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Safety goggles\n2.1.3 Safety gloves\n2.1.4 Safety shoes\n2.1.5 Safety harness/strap\n2.2 Installation of grounding cluster\n\n3. Transmission line\n tools, equipment and\n hardware\nMay include but not limited to:\n3.1 Hand tools\n3.1.1 Pliers\n3.1.2 Screwdrivers\n3.1.3 Adjustable wrenches\n3.1.4 Ball peen hammer\n3.1.5 Auger bit\n3.1.6 Hacksaw/cutting tools\n3.1.7 Steel tape\n3.2 Equipment\n3.2.1 Motorized capstan\n3.2.2 Climbing gears\n3.2.3 Line truck/Boom truck\n3.3 Set of hot line trailer\n3.4 Hardware\n3.4.1 Insulator\n3.4.2 Machine bolts\n3.4.3 Suspension clamp assembly (ACSR/OHGW)\n3.4.4 Strain clamp assembly(ACSR/OHGW)\n3.4.5 Overhead ground wires\n3.4.6 Cross-arms and braces\n3.4.7 Conductors and accessories\n\n--- PDF PAGE 62 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 58\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates ability to identify and comply with\noccupational health and safety standards in operating\nand maintaining distribution line\n1.2. Demonstrates ability to identify and safely use\ndistribution line tools and equipment\n1.3. Demonstrates ability to perform basic preventive\nmaintenance servicing for distribution line equipment\n\n2. Resource Implications The following resources should be provided:\n2.1. Distribution line tools, equipment and PPE\n2.2. Work area\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Observation and Oral questioning\n3.2. Demonstration with oral questioning\n3.3. Written test\n\n4. Context of\n assessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 59\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:"
