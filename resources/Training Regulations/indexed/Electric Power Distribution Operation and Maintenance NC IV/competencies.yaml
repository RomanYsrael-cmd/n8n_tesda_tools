        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Identifies hazards/risks in the workplace and/or\nits indicators\n1.2. Requests for evaluation and/or work environment\nmeasurements of OSH hazards/risk in the\nworkplace\n1.3. Gathers OSH issues and/or concerns raised by\nworkers\n1.4. Identifies and implements prevention and control\nmeasures, including use of PPE (personal\nprotective equipment) for specific hazards\n1.5. Recommends appropriate risk controls based on\nresult of OSH hazard evaluation and OSH issues\ngathered\n1.6. Establish contingency measures, including\nemergency procedures in accordance with\norganization procedures\n1.7. Provides information to work team about\ncompany OHS program, procedures and\npolicies/guidelines\n1.8. Participates in the implementation of OSH\nprocedures and policies/guidelines\n1.9. Trains and advises team members on OSH\nstandards and procedures\n1.10. Implements procedures for maintaining OSH-\nrelated records\n2. Resource implication\n\nThe following resources should be provided:\n2.1. Workplace or assessment location\n2.2. OHS personal records\n2.3. PPE\n2.4. Health records\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Portfolio Assessment\n3.2. Interview\n3.3. Case Study/Situation\n3.4. Observation/Demonstration and oral questioning\n4. Context of Assessment\n\n4.1. Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 43\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
        },
        "source_text": "500311155\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead the implementation of workplace’s safety and health\nprogram, procedures and policies/guidelines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nworkplace\nhazards and\nrisk\n1.1. Hazards in the workplace\nand/or its indicators of its\npresence are identified\n1.2. Evaluation and/or work\nenvironment\nmeasurements of OSH\nhazards/risk existing in the\nworkplace is conducted by\nauthorized personnel or\nagency\n1.3. OHS issues and/or\nconcerns raised by\nworkers are gathered\n1.1. General OSH\nPrinciples\n1.2. Occupational\nhazards/risks\nrecognition\n1.3. OSH organizations\nproviding services\non OSH evaluation\nand/or work\nenvironment\nmeasurements\n(WEM)\n1.4. National OSH\nregulations;\ncompany OSH\npolicies and\nprotocols\n1.5. Systematic\ngathering of OSH\nissues and\nconcerns\n\n1.1. Reading skills\nrequired to\ninterpret work\ninstruction\n1.2. Critical thinking\n1.3. Interpreting\nwork\ninstructions\n2. Identify and\nimplement\nappropriate\ncontrol\nmeasures\n2.1. Prevention and control\nmeasures, including use of\nPPE (personal protective\nequipment) for specific\nhazards identified and\nimplemented\n2.2. Appropriate risk controls\nbased on result of OSH\nhazard evaluation is\nrecommended\n2.3. Contingency measures,\nincluding emergency\nprocedures during\nworkplace incidents and\nemergencies are\nrecognized and established\nin accordance with\norganization procedures\n\n2.1. General OSH\nPrinciples\n2.2. Appropriate\nprevention and\ncontrol measures\nfor specific hazards\n2.3. Hierarchy of risk\ncontrols\n2.4. Familiarity on\ncontingency\nmeasures\nestablished in the\nworkplace\n2.1. Knowledge\nmanagement\n2.2. Analytic skills\n2.3. Critical thinking\nskills\n2.4. Coordinating\nskills\n2.5. Communication\nskills\n\n--- PDF PAGE 42 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 38\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement\nOSH\nprograms,\nprocedures\nand policies/\nguidelines\n3.1. Information to work team\nabout company OHS\nprogram, procedures and\npolicies/guidelines are\nprovided\n3.2. Implementation of OSH\nprocedures and\npolicies/guidelines are\nparticipated\n3.3. Team members are trained\nand advised on OSH\nstandards and procedures\n3.4. Procedures for maintaining\nOSH-related records are\nimplemented\n3.1. General OSH\nprinciples\n3.2. National OSH\nregulations\n3.3. Company OSH and\nrecording protocols,\nprocedures and\npolicies/guidelines\n3.4. Training and/or\ncounselling\nmethodologies and\nstrategies\n3.1. Knowledge\nmanagement\n3.2. Interpersonal\nskills\n3.3. Coordinating\nskills\n3.4. Communication\nskills\n3.5. Troubleshooting\nskills\n3.6. Presentation\nskills\n3.7. Training skills\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include but are not limited to:\n1.1.\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, extreme temperature, radiation\n1.2.\nBiological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n1.3.\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n1.4.\nErgonomics\n1.4.1. Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n1.4.2. Physiological factors – monotony, personal\nrelationship, work out cycle\n1.5.\nSafety hazards (unsafe workplace condition) –\nconfined space, excavations, falling objects, gas\nleaks, electrical, poor storage of materials and waste,\nspillage, waste and debris\n1.6.\nUnsafe workers’ act (Smoking in off-limited areas,\nSubstance and alcohol abuse at work)\n2. Indicators\nMay include but not limited to:\n2.1.\nIncreased of incidents of accidents, injuries\n2.2.\nIncreased occurrence of sickness or health\ncomplaints/symptoms\n2.3.\nCommon complaints of workers’ related to OSH\n2.4.\nHigh absenteeism for work-related reasons\n3. Evaluation and/or\nwork environment\nmeasurements\nMay include but not limited to\n3.1.\nHealth Audit\n3.2.\nSafety Audit\n3.3.\nWork Safety and Health Evaluation\n3.4.\nWork Environment Measurements of Physical and\nChemical Hazards\n4. OHS issues\nand/or concerns\nMay include but not limited to\n4.1.\nWorkers’ experience/observance on presence of\nwork hazards\n4.2.\nUnsafe/unhealthy administrative arrangements\n(prolonged work hours, no breaktime, constant\novertime, scheduling of tasks)\n4.3.\nReasons for compliance/non-compliance to use of\nPPEs or other OSH procedures/policies/ guidelines\n5. Prevention and\ncontrol measures\nMay include but are not limited to:\n5.1.\nEliminate the hazard (i.e., get rid of the dangerous\nmachine\n5.2.\nIsolate the hazard (i.e. keep the machine in a closed\nroom and operate it remotely; barricade an unsafe\narea off)\n5.3.\nSubstitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 40\n\nVARIABLE\nRANGE\n5.4.\nUse administrative controls to reduce the risk (i.e.\ngive trainings on how to use equipment safely; OSH-\nrelated topics, issue warning signages,\nrotation/shifting work schedule)\n5.5.\nUse engineering controls to reduce the risk (i.e. use\nsafety guards to machine)\n5.6.\nUse personal protective equipment\n5.7.\nSafety, Health and Work Environment Evaluation\n5.8.\nPeriodic and/or special medical examinations of\nworkers\n6. Safety gears /PPE\n(Personal\nProtective\nEquipments)\nMay include but are not limited to:\n6.1.\nArm/Hand guard, gloves\n6.2.\nEye protection (goggles, shield)\n6.3.\nHearing protection (ear muffs, ear plugs)\n6.4.\nHair Net/cap/bonnet\n6.5.\nHard hat\n6.6.\nFace protection (mask, shield)\n6.7.\nApron/Gown/coverall/jump suit\n6.8.\nAnti-static suits\n6.9.\nHigh-visibility reflective vest\n7. Appropriate risk\ncontrols\nAppropriate risk controls in order of impact are as follows:\n7.1.\nEliminate the hazard altogether (i.e., get rid of the\ndangerous machine)\n7.2.\nIsolate the hazard from anyone who could be harmed\n(i.e., keep the machine in a closed room and operate\nit remotely; barricade an unsafe area off)\n7.3.\nSubstitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n7.4.\nUse administrative controls to reduce the risk (i.e.,\ntrain workers how to use equipment safely; train\nworkers about the risks of harassment; issue signage)\n7.5.\nUse engineering controls to reduce the risk (i.e.,\nattach guards to the machine to protect users)\n7.6.\nUse personal protective equipment (i.e., wear gloves\nand goggles when using the machine)\n8. Contingency\nmeasures\nMay include but are not limited to:\n8.1.\nEvacuation\n8.2.\nIsolation\n8.3.\nDecontamination\n8.4.\n(Calling designed) emergency personnel\n9. Emergency\nprocedures\nMay include but are not limited to:\n9.1.\nFire drill\n9.2.\nEarthquake drill\n9.3.\nBasic life support/CPR\n9.4.\nFirst aid\n9.5.\nSpillage control\n9.6.\nDecontamination of chemical and toxic\n9.7.\nDisaster preparedness/management\n9.8.\nUse of fire-extinguisher\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 41\n\nVARIABLE\nRANGE\n10. Incidents and\nemergencies\nMay include but are not limited to:\n10.1. Chemical spills\n10.2. Equipment/vehicle accidents\n10.3. Explosion\n10.4. Fire\n10.5. Gas leak\n10.6. Injury to personnel\n10.7. Structural collapse\n10.8. Toxic and/or flammable vapors emission\n11. OSH-related\nRecords\nMay include but are not limited to:\n11.1. Medical/Health records\n11.2. Incident/accident reports\n11.3. Sickness notifications/sick leave application\n11.4. OHS-related trainings obtained\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 42\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Identifies hazards/risks in the workplace and/or\nits indicators\n1.2. Requests for evaluation and/or work environment\nmeasurements of OSH hazards/risk in the\nworkplace\n1.3. Gathers OSH issues and/or concerns raised by\nworkers\n1.4. Identifies and implements prevention and control\nmeasures, including use of PPE (personal\nprotective equipment) for specific hazards\n1.5. Recommends appropriate risk controls based on\nresult of OSH hazard evaluation and OSH issues\ngathered\n1.6. Establish contingency measures, including\nemergency procedures in accordance with\norganization procedures\n1.7. Provides information to work team about\ncompany OHS program, procedures and\npolicies/guidelines\n1.8. Participates in the implementation of OSH\nprocedures and policies/guidelines\n1.9. Trains and advises team members on OSH\nstandards and procedures\n1.10. Implements procedures for maintaining OSH-\nrelated records\n2. Resource implication\n\nThe following resources should be provided:\n2.1. Workplace or assessment location\n2.2. OHS personal records\n2.3. PPE\n2.4. Health records\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Portfolio Assessment\n3.2. Interview\n3.3. Case Study/Situation\n3.4. Observation/Demonstration and oral questioning\n4. Context of Assessment\n\n4.1. Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 43\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
