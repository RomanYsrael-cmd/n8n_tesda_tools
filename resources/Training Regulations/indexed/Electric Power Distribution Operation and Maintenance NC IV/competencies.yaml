tion\n3.2. Research methods\n3.2.1. Qualitative\n3.2.2. Quantitative\n3.2.3. Statistical\n3.3. Report writing\n3.4. Use of relevant\nsoftware\n3.4.1. Spreadsheets\n3.4.2. Presentation\ngraphics\n3.4.3. Work processor\n3.4.4. Statistical\npackage\n3.1. Communicating\neffectively\n3.2. Performing\nresearch\n3.3. Reading /\ninterpreting\ndata and\ninformation\n3.4. Problem\nsolving\n\n--- PDF PAGE 21 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 17\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Present findings/\nrecommendations\n4.1. Findings/\nrecommendations\nsummarized and\npresented/packaged in\nuser-friendly manner\n4.2. Relevant inputs gathered\nto finalize report\n4.3. Draft report prepared\nbased on standard format.\n4.4. Technical reports are\nsubmitted and\ndisseminated to concerned\noffices.\n\n4.1. Data processing,\nInformation analysis\nand interpretation\n4.2. Research methods\n4.2.1. Qualitative\n4.2.2. Quantitative\n4.2.3. Statistical\n4.3. Report writing\n4.4. Use of relevant\nsoftware\n4.4.1. Spreadsheets\n4.4.2. Presentation\ngraphics\n4.4.3. Work processor\n4.4.4. Statistical\npackage\n4.1. Communicating\neffectively\n4.2. Performing\nresearch\n4.3. Reading /\ninterpreting data\nand information\n4.4. Problem solving\n\n--- PDF PAGE 22 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 18\n\nRANGE OF VARIABLES\n\nVARIABLES\nR A N G E\n 1. Research procedures\n May include:\n1.1 TNA\n1.2 Front-end analysis\n1.3 Surveys\n1.4 Interviews\n1.5 Functional analysis\n1.6 DACUM research\n\n 2. Forms\n May include:\n 2.1 Survey forms/Questionnaires\n 2.2 Personal information/Profile\n 2.3 Accident report form\n 2.4 Requisition slip\n 2.5 Job orders\n 2.6 Purchase request form\n 2.7 Incident report form\n\n 3. Methodologies\n May include:\n 3.1 Qualitative methods\n 3.2 Quantitative methods\n 4. Statistical analysis/\nmethods\nMay include:\n 4.1. Averages (Mean, Median, Mode)\n 4.2. Percentage\n 4.3. Ranks\n 4.4. Frequency Distribution\n 4.5 Statistical test\n\n 5. Data\n May include:\nRaw Data\n 6. Information\n May include:\nProcessed and packaged data\n\n--- PDF PAGE 23 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 19\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n Assessment requires evidence that the candidate:\n 1.1 Determined information requirements based on\norganizational goals and objectives.\n 1.2 Used relevant forms and recording systems to gather\ndata\n 1.3 Processed data based on the objectives of the\nprogram\n 1.4 Utilized relevant research methods based on the\nobjective of the program\n 1.5 Analyzed and organized information gathered\n 1.6 Submitted/Disseminated technical reports to\nconcerned offices\n\n 2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 Access to office equipment and facilities relevant to\nthe unit\n2.3 Case studies/scenarios\n\n 3. Methods of\nAssessment\n\nCompetency may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interviews\n3.3 Portfolio\n\n 4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nTESDA Accredited Assessment Center\n\n--- PDF PAGE 24 ---\n-----------------------