        "source_text": "500311150\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nsustain and develop an environment in which improvement,\ninnovation and learning are promoted and rewarded.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Review\nprograms,\nsystems and\nprocesses\n1.1. Strategies are established to\nmonitor and evaluate\nperformance and sustainability\nof key systems and processes\n1.2. Undertake detailed analyses of\nsupply chains, and operational,\nproduct and service delivery\nsystems\n1.3. Performance measures are\nIdentified, and assessment tools\nand techniques, and evaluate\ntheir effectiveness\n1.4. Performance reports and\nvariance are analyzed from\nplans for key result areas of the\norganization\n1.5. Changing trends and\nopportunities are Identified and\nanalyzed relevant to the\norganization\n1.6. Advice from specialists is seek,\nwhere appropriate, to identify\ntechnology and electronic\ncommerce opportunities\n1.1. Techniques in\nsystems thinking\nand process\n1.2. Basic Project\nManagement\nTechniques\n1.3. Principles of\nchange\nmanagement\n1.4. Psychology of\nchange\nmanagement\n1.5. techniques for\nrecommending\nchanges\n1.1. Planning and\nimplementing\nstrategies\n1.2. Analyzing,\nevaluating and\nintegration of\nfacts\n1.3. Practicing\nanalytical\nthinking\n1.4. Demonstrating\nstrategies and\ntechniques in\nrecommending\nchanges and in\nmanaging\nchanges in the\nworkplace\n2. Develop\noptions for\ncontinuous\nimprovement\n2.1. Groups are briefed on\nperformance improvement\nstrategies and innovation as an\nessential element of competition\n2.2. Creative climate and\norganizational learning are\nfostered by promoting interaction\nwithin and between work groups\n2.3. New ideas and entrepreneurial\nbehavior are encouraged, tested\nand recognized\n2.4. Failure of an idea are accepted\nduring trialing and recognize,\ncelebrate and embed success\ninto systems\n2.5. Risk management and cost-\nbenefit analysis are undertook\nfor each option or idea approved\nfor trial\n2.6. Innovations through agreed\norganizational processes are\napproved\n2.1. Cost-benefit\nanalysis method\n2.2. Creativity and\ninnovation theories\nand concepts\n2.3. Quality\nmanagement and\ncontinuous\nimprovement\ntheories\n2.4. Practical Risk\nmanagement\nconcepts\n2.1. Computing cost\nbenefit\n2.2. Practicing\ncreativity and\ninnovation\n2.3. Applying\ncontinuous\nimprovement\n2.4. Applying risk\nmanagement\n\n--- PDF PAGE 33 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 29\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement\ninnovative\nprocesses\n3.1. Continuous improvement and\nsustainability are promoted as\nessential to doing business\n3.2. Impact of change and\nconsequences are addressed for\npeople and implement transition\nplans\n3.3. Objectives, timeframes,\nmeasures and communication\nplans are ensured in place to\nmanage implementation\n3.4. Contingency plans in are\nimplemented in the event of\nnonperformance\n3.5. Failure by prompt investigation\nand analysis are followed up of\ncauses and managed emerging\nchallenges and opportunities\n3.6. Learnings from activities are\ncaptured and managed to inform\nfuture work\n3.7. Continuous improvement are\nregularly evaluated systems and\nprocesses\n3.8. Costs and benefits of\ninnovations and improvements\nare communicated to relevant\ngroups and individuals\n3.1. Knowledge\nmanagement\nsystem\n3.2. Developing risk\nmanagement\ntechniques and\ncontrol systems\n3.3. Evaluating impact\nof changes and\ndeveloping action\nplans\n3.4. Techniques in\nimplementing\ninnovative change\nin the workplace\n3.1. Applying\nknowledge\nmanagement\n3.2. Describing best\npractices\n3.3. Demonstrating\ncompetence in\nevaluating\nextent of\nchanges and\nefficacy of set\naction plans\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Strategies\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n\n--- PDF PAGE 34 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 30\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Analyzed and evaluated systems and performance in key\nareas of the organization and identify opportunities for\nimprovement, seeking advice from experts as appropriate\n1.2 Promoted the value of creativity, innovation and\nsustainability and recognize successes\n1.3 Supported the testing and trialing of new ideas and\nundertake risk management and cost-benefit analysis for\noptions\n1.4 Planned for and implemented improvements using\norganization’s processes for approvals, project\nmanagement and change management\n1.5 Facilitated effective contributions to and communications\nabout continuous improvement and innovation\n1.6 Captured insights, experiences and ideas for\nimprovements and incorporate them into the\norganization’s knowledge management systems and\nfuture planning\n\n2. Resource Implications The following resources should be provided:\n2.1 Pens\n2.2 Note pads\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Interview\n3.2 Written evaluation\n3.3 Case analysis\n\n4. Context for Assessment\n4.1 Competency may be assessed individually in actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 35 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 31\n\nUNIT TITLE\n:\nPERFORM HIGHER ORDER THINKING PROCESSES AND\nAPPLY TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n:"
