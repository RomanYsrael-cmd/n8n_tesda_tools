        "source_text": "UTL741322\n\nUNIT DESCRIPTOR : This unit covers the outcomes required for supervising\noperation and maintenance on electric power distribution\nsystem. This includes competencies on supervising line\nworker works, recommending and implementing preventive\nmaintenance schedule and reporting the completion of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Supervise line\nworker works\n\n1.1 Work instruction is\npresented and discussed\nwith the line crew\naccording to job\nrequirements\n1.2 Line crew are directed to\nline work following plan\nand specifications\n1.3 Relevant occupational\nsafety requirements are\ndiscussed and enforced\nfollowing safety guidelines\n1.4 Usage of resources is\nmonitored and optimized\nas per job requirements\n1.5 Contingency situations are\nrecognized and corrective\nactions taken in\nconsultation with\nimmediate supervisor\n1.6 Instructions from\nimmediate supervisor are\ncarried out accordingly.\n1.1 Relevant\noccupational safety\nrequirements\n1.2 Supervisory and\nleadership\nprinciples\n1.3 Jurisdictional and\ncompany\nregulations\nregarding system\nauthority and\nswitching orders\n1.4 Load breaking\ncapabilities and\nmethods\n1.1 Interpretation\nskills\n1.2 Communication\nskills\n1.3 Analytical skills\n1.4 Supervisory\nskills\n1.5 Monitoring skills\n1.6 Identifying\noccupational\nsafety\nstandards for\nline workers\n\n2. Recommend\nand\nimplement\npreventive\nmaintenance\nschedule\n2.1 Results of distribution line\nassessment, evaluation\nand tests carried out is\ngathered and analyzed in\naccordance with electric\nutility procedures\n2.2 Preventive maintenance\nschedule is recommended\nbased on the test results\nduring assessment and\nevaluation\n2.3 Approved maintenance\nwork schedule is followed\nto ensure completion on\ntime in accordance with\ntechnical specifications\nrequirements\n2.1 Relevant electric\ndistribution\nstandards and\nprocedures\n2.2 Pole and pole\naccessories\nmaintenance\nprograms\n\n2.1 Interpretation\nskills\n2.2 Communication\nskills\n2.3 Analytical skills\n2.4 Supervisory\nskills\n2.5 Monitoring skills\n2.6 Time\nmanagement\nskills\n\n--- PDF PAGE 76 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 72\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Report the\ncompletion of\nwork\n3.1 Final checks are made to\nensure that work conforms\nwith instructions and job\nrequirements\n3.2 Immediate supervisor is\nnotified upon completion of\nwork\n3.3 Completion report is\nprepared according to work\nrequirements\n3.4 Tools, equipment and any\nexcess resources and\nmaterials are ensured to be\ncleaned, checked and\nreturned to storage area in\naccordance with standard\noperating procedures\n3.5 Work area is ensured to be\ncleaned up and made safe\nin accordance with OSH\nrequirements\n3.1 Walk through\nprocedures based\non checklist\n3.2 List of items/ scope\ncompleted in\noperation and\nmaintenance\n3.3 5-S principles\n3.4 Equipment/tools/\nmaterials inventory\n3.1 Interpretation\nskills\n3.2 Communication\nskills\n3.3 Analytical skills\n3.4 Supervisory\nskills\n3.5 Inventory skills\n3.6 Identifying\noccupational\nsafety\nstandards for\nline workers\n\n--- PDF PAGE 77 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 73\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational\nsafety\nrequirements\nMay include but not limited to:\n1.1 Personal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Work gloves\n1.1.4. Line worker boots\n1.1.5. Working clothes\n1.1.6. Rubber boots\n1.1.7. Rain suits\n1.2 Pole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. pair of climbers\n2. resources\nMay include:\n2.1 materials\n2.2 manpower\n2.3 equipment and devices\n2.4 logistics\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Supervised line worker works\n1.2. Recommended and implemented preventive\nmaintenance schedule\n1.3. Reported the completion of work\n\n2. Resource implications\nThe following resources should be available:\n2.1. PPE,\n2.2. Tools, materials, equipment and devices\n2.3. Site or work area\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1. Direct observation / Demonstration with oral questioning\n3.2. Written test\n\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 78 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 74"
