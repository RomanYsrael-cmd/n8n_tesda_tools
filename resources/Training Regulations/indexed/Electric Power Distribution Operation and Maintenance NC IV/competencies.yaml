        "source_text": "UTL311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\napply quality standards in the workplace. The unit also includes\nthe application of relevant safety procedures and regulations,\norganization procedures and customer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess quality\nof received\nmaterials or\ncomponents\n1.1. Work instructions are obtained\nand work is carried out in\naccordance with standard\noperating procedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and specifications\n1.3. Faulty material or components\nrelated to work are identified\nand isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance with\nworkplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n\n1.1. Relevant\nproduction\nprocesses,\nmaterials and\nproducts\n1.2. Characteristics of\nmaterials,\nsoftware and\nhardware used in\nproduction\nprocesses\n1.3. Quality checking\nprocedures\n1.4. Quality\nWorkplace\nprocedures\n1.5. Identification of\nfaulty materials\nrelated to work\n1.1. Reading\nskills\nrequired to\ninterpret\nwork\ninstruction\n1.2. Critical\nthinking\n1.3. Interpreting\nwork\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company is\nidentified and used\n2.2. Completed work is checked\nagainst workplace standards\nrelevant to the task\nundertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality and\nother indicators of production\nperformance is recorded in\naccordance with workplace\nprocedures\n2.5. Deviations from specified\nquality standards, causes\nare documented and reported\nin accordance with the\nworkplace standards operating\nprocedures\n2.1. Safety and\nenvironmental\naspects of\nproduction\nprocesses\n2.2. Fault\nidentification and\nreporting\n2.3. Workplace\nprocedure in\ndocumenting\ncompleted work\n2.4. Workplace\nQuality Indicators\n2.1. Carry out\nwork in\naccordance\nwith OHS\npolicies and\nprocedures\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 44\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated in\nrelation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service to\nensure customer satisfaction\nis monitored\n\n3.1. Quality\nimprovement\nprocesses\n3.2. Company\ncustomers\ndefined\n3.1. Solution\nproviding and\ndecision-\nmaking\n3.2. Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components Materials may include but not limited to:\n1.1. Wires\n1.2. Cables\n1.3. Electrical tape, etc.\nComponents may include but not limited to:\n1.4. Cross-arms and braces\n1.5. Conductors and accessories\n1.6. Insulators, etc.\n\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n\n3. Documentation\nMay include:\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n\n4. Quality standards\nQuality standards may relate but not limited to the\nfollowing:\n4.1. Materials\n4.2. Component parts\n4.3. Final product\n\n5. Customer\nMay include:\n5.1. Co-worker\n5.2. Suppliers\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 46\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n\n2. Resource implication\n\nThe following resources should be provided:\n2.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Questioning\n3.3. Practical demonstration\n\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated work environment.\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 47\n\nUNIT TITLE\n:\nCOMPLY WITH ENVIRONMENTAL PROTECTION\nPROCEDURES\nUNIT CODE\n:"
      }
