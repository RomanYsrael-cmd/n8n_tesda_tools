idate participating in a\ngroup problem-solving session\n3.6\n Oral or written questioning to assess knowledge\nof typical blockers to the critical thinking process.\n3.7\nLife Narrative Inquiry to reflect life stories that\nreflect how critical thinking and problem solving is\napplied in the lives.\n4. Context for Assessment\n4.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 41 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 37\n\nUNIT TITLE\n:\nLEAD IN IMPLEMENTATION OF OCCUPATIONAL SAFETY\nAND HEALTH (OSH) PROGRAM, PROCEDURES AND\nPOLICIES/GUIDELINES\n\nUNIT CODE\n:\n500311155\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead the implementation of workplace’s safety and health\nprogram, procedures and policies/guidelines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nworkplace\nhazards and\nrisk\n1.1. Hazards in the workplace\nand/or its indicators of its\npresence are identified\n1.2. Evaluation and/or work\nenvironment\nmeasurements of OSH\nhazards/risk existing in the\nworkplace is conducted by\nauthorized personnel or\nagency\n1.3. OHS issues and/or\nconcerns raised by\nworkers are gathered\n1.1. General OSH\nPrinciples\n1.2. Occupational\nhazards/risks\nrecognition\n1.3. OSH organizations\nproviding services\non OSH evaluation\nand/or work\nenvironment\nmeasurements\n(WEM)\n1.4. National OSH\nregulations;\ncompany OSH\npolicies and\nprotocols\n1.5. Systematic\ngathering of OSH\nissues and\nconcerns\n\n1.1. Reading skills\nrequired to\ninterpret work\ninstruction\n1.2. Critical thinking\n1.3. Interpreting\nwork\ninstructions\n2. Identify and\nimplement\nappropriate\ncontrol\nmeasures\n2.1. Prevention and control\nmeasures, including use of\nPPE (personal protective\nequipment) for specific\nhazards identified and\nimplemented\n2.2. Appropriate risk controls\nbased on result of OSH\nhazard evaluation is\nrecommended\n2.3. Contingency measures,\nincluding emergency\nprocedures during\nworkplace incidents and\nemergencies are\nrecognized and established\nin accordance with\norganization procedures\n\n2.1. General OSH\nPrinciples\n2.2. Appropriate\nprevention and\ncontrol measures\nfor specific hazards\n2.3. Hierarchy of risk\ncontrols\n2.4. Familiarity on\ncontingency\nmeasures\nestablished in the\nworkplace\n2.1. Knowledge\nmanagement\n2.2. Analytic skills\n2.3. Critical thinking\nskills\n2.4. Coordinating\nskills\n2.5. Communication\nskills\n\n--- PDF PAGE 42 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 38\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement\nOSH\nprograms,\nprocedures\nand policies/\nguidelines\n3.1. Information to work team\nabout company OHS\nprogram, procedures and\npolicies/guidelines are\nprovided\n3.2. Implementation of OSH\nprocedures and\npolicies/guidelines are\nparticipated\n3.3. Team members are trained\nand advised on OSH\nstandards and procedures\n3.4. Procedures for maintaining\nOSH-related records are\nimplemented\n3.1. General OSH\nprinciples\n3.2. National OSH\nregulations\n3.3. Company OSH and\nrecording protocols,\nprocedures and\npolicies/guidelines\n3.4. Training and/or\ncounselling\nmethodologies and\nstrategies\n3.1. Knowledge\nmanagement\n3.2. Interpersonal\nskills\n3.3. Coordinating\nskills\n3.4. Communication\nskills\n3.5. Troubleshooting\nskills\n3.6. Presentation\nskills\n3.7. Training skills\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include but are not limited to:\n1.1.\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, extreme temperature, radiation\n1.2.\nBiological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n1.3.\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n1.4.\nErgonomics\n1.4.1. Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n1.4.2. Physiological factors – monotony, personal\nrelationship, work out cycle\n1.5.\nSafety hazards (unsafe workplace condition) –\nconfined space, excavations, falling objects, gas\nleaks, electrical, poor storage of materials and waste,\nspillage, waste and debris\n1.6.\nUnsafe workers’ act (Smoking in off-limited areas,\nSubstance and alcohol abuse at work)\n2. Indicators\nMay include but not limited to:\n2.1.\nIncreased of incidents of accidents, injuries\n2.2.\nIncreased occurrence of sickness or health\ncomplaints/symptoms\n2.3.\nCommon complaints of workers’ related to OSH\n2.4.\nHigh absenteeism for work-related reasons\n3. Evaluation and/or\nwork environment\nmeasurements\nMay include but not limited to\n3.1.\nHealth Audit\n3.2.\nSafety Audit\n3.3.\nWork Safety and Health Evaluation\n3.4.\nWork Environment Measurements of Physical and\nChemical Hazards\n4. OHS issues\nand/or concerns\nMay include but not limited to\n4.1.\nWorkers’ experience/observance on presence of\nwork hazards\n4.2.\nUnsafe/unhealthy administrative arrangements\n(prolonged work hours, no breaktime, constant\novertime, scheduling of tasks)\n4.3.\nReasons for compliance/non-compliance to use of\nPPEs or other OSH procedures/policies/ guidelines\n5. Prevention and\ncontrol measures\nMay include but are not limited to:\n5.1.\nEliminate the hazard (i.e., get rid of the dangerous\nmachine\n5.2.\nIsolate the hazard (i.e. keep the machine in a closed\nroom and operate it remotely; barricade an unsafe\narea off)\n5.3.\nSubstitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 40\n\nVARIABLE\nRANGE\n5.4.\nUse administrative controls to reduce the risk (i.e.\ngive trainings on how to use equipment safely; OSH-\nrelated topics, issue warning signages,\nrotation/shifting work schedule)\n5.5.\nUse engineering controls to reduce the risk (i.e. use\nsafety guards to machine)\n5.6.\nUse personal protective equipment\n5.7.\nSafety, Health and Work Environment Evaluation\n5.8.\nPeriodic and/or special medical examinations of\nworkers\n6. Safety gears /PPE\n(Personal\nProtective\nEquipments)\nMay include but are not limited to:\n6.1.\nArm/Hand guard, gloves\n6.2.\nEye protection (goggles, shield)\n6.3.\nHearing protection (ear muffs, ear plugs)\n6.4.\nHair Net/cap/bonnet\n6.5.\nHard hat\n6.6.\nFace protection (mask, shield)\n6.7.\nApron/Gown/coverall/jump suit\n6.8.\nAnti-static suits\n6.9.\nHigh-visibility reflective vest\n7. Appropriate risk\ncontrols\nAppropriate risk controls in order of impact are as follows:\n7.1.\nEliminate the hazard altogether (i.e., get rid of the\ndangerous machine)\n7.2.\nIsolate the hazard from anyone who could be harmed\n(i.e., keep the machine in a closed room and operate\nit remotely; barricade an unsafe area off)\n7.3.\nSubstitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n7.4.\nUse administrative controls to reduce the risk (i.e.,\ntrain workers how to use equipment safely; train\nworkers about the risks of harassment; issue signage)\n7.5.\nUse engineering controls to reduce the risk (i.e.,\nattach guards to the machine to protect users)\n7.6.\nUse personal protective equipment (i.e., wear gloves\nand goggles when using the machine)\n8. Contingency\nmeasures\nMay include but are not limited to:\n8.1.\nEvacuation\n8.2.\nIsolation\n8.3.\nDecontamination\n8.4.\n(Calling designed) emergency personnel\n9. Emergency\nprocedures\nMay include but are not limited to:\n9.1.\nFire drill\n9.2.\nEarthquake drill\n9.3.\nBasic life support/CPR\n9.4.\nFirst aid\n9.5.\nSpillage control\n9.6.\nDecontamination of chemical and toxic\n9.7.\nDisaster preparedness/management\n9.8.\nUse of fire-extinguisher\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 41\n\nVARIABLE\nRANGE\n10. Incidents and\nemergencies\nMay include but are not limited to:\n10.1. Chemical spills\n10.2. Equipment/vehicle accidents\n10.3. Explosion\n10.4. Fire\n10.5. Gas leak\n10.6. Injury to personnel\n10.7. Structural collapse\n10.8. Toxic and/or flammable vapors emission\n11. OSH-related\nRecords\nMay include but are not limited to:\n11.1. Medical/Health records\n11.2. Incident/accident reports\n11.3. Sickness notifications/sick leave application\n11.4. OHS-related trainings obtained\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 42\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Identifies hazards/risks in the workplace and/or\nits indicators\n1.2. Requests for evaluation and/or work environment\nmeasurements of OSH hazards/risk in the\nworkplace\n1.3. Gathers OSH issues and/or concerns raised by\nworkers\n1.4. Identifies and implements prevention and control\nmeasures, including use of PPE (personal\nprotective equipment) for specific hazards\n1.5. Recommends appropriate risk controls based on\nresult of OSH hazard evaluation and OSH issues\ngathered\n1.6. Establish contingency measures, including\nemergency procedures in accordance with\norganization procedures\n1.7. Provides information to work team about\ncompany OHS program, procedures and\npolicies/guidelines\n1.8. Participates in the implementation of OSH\nprocedures and policies/guidelines\n1.9. Trains and advises team members on OSH\nstandards and procedures\n1.10. Implements procedures for maintaining OSH-\nrelated records\n2. Resource implication\n\nThe following resources should be provided:\n2.1. Workplace or assessment location\n2.2. OHS personal records\n2.3. PPE\n2.4. Health records\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Portfolio Assessment\n3.2. Interview\n3.3. Case Study/Situation\n3.4. Observation/Demonstration and oral questioning\n4. Context of Assessment\n\n4.1. Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 43\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nUTL311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\napply quality standards in the workplace. The unit also includes\nthe application of relevant safety procedures and regulations,\norganization procedures and customer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess quality\nof received\nmaterials or\ncomponents\n1.1. Work instructions are obtained\nand work is carried out in\naccordance with standard\noperating procedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and specifications\n1.3. Faulty material or components\nrelated to work are identified\nand isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance with\nworkplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n\n1.1. Relevant\nproduction\nprocesses,\nmaterials and\nproducts\n1.2. Characteristics of\nmaterials,\nsoftware and\nhardware used in\nproduction\nprocesses\n1.3. Quality checking\nprocedures\n1.4. Quality\nWorkplace\nprocedures\n1.5. Identification of\nfaulty materials\nrelated to work\n1.1. Reading\nskills\nrequired to\ninterpret\nwork\ninstruction\n1.2. Critical\nthinking\n1.3. Interpreting\nwork\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company is\nidentified and used\n2.2. Completed work is checked\nagainst workplace standards\nrelevant to the task\nundertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality and\nother indicators of production\nperformance is recorded in\naccordance with workplace\nprocedures\n2.5. Deviations from specified\nquality standards, causes\nare documented and reported\nin accordance with the\nworkplace standards operating\nprocedures\n2.1. Safety and\nenvironmental\naspects of\nproduction\nprocesses\n2.2. Fault\nidentification and\nreporting\n2.3. Workplace\nprocedure in\ndocumenting\ncompleted work\n2.4. Workplace\nQuality Indicators\n2.1. Carry out\nwork in\naccordance\nwith OHS\npolicies and\nprocedures\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 44\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated in\nrelation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service to\nensure customer satisfaction\nis monitored\n\n3.1. Quality\nimprovement\nprocesses\n3.2. Company\ncustomers\ndefined\n3.1. Solution\nproviding and\ndecision-\nmaking\n3.2. Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components Materials may include but not limited to:\n1.1. Wires\n1.2. Cables\n1.3. Electrical tape, etc.\nComponents may include but not limited to:\n1.4. Cross-arms and braces\n1.5. Conductors and accessories\n1.6. Insulators, etc.\n\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n\n3. Documentation\nMay include:\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n\n4. Quality standards\nQuality standards may relate but not limited to the\nfollowing:\n4.1. Materials\n4.2. Component parts\n4.3. Final product\n\n5. Customer\nMay include:\n5.1. Co-worker\n5.2. Suppliers\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 46\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n\n2. Resource implication\n\nThe following resources should be provided:\n2.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Questioning\n3.3. Practical demonstration\n\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated work environment.\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 47\n\nUNIT TITLE\n:\nCOMPLY WITH ENVIRONMENTAL PROTECTION\nPROCEDURES\nUNIT CODE\n:\nUTL311206\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto implement and monitor environmental protection policies\nand procedures including accessing relevant information\nconcerning environmental protection regulations and\nprocedures, and implementing and monitoring procedures\nconcerning environmental hazards, related control\nprocedures, environmental training arrangements, and\nrequired records and documentation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Access\ninformation\nconcerning\nenvironmental\nprotection\nregulations\nand\nprocedures\n\n1.1. Relevant provisions of\nenvironmental legislation\nand codes of practice are\naccurately followed\n1.2. Information on workplace\nenvironmental policies,\nprocedures and programs is\nstored in a readily\naccessible location and\nmanner\n1.3. Information is accurately\nand clearly explained to the\nwork team and updated\naccording to change in\nworkplace policy\n1.4. Information about the\noutcomes of environmental\nrisk identification and\ncontrol procedures is\nprovided to the appropriate\npersonnel\n1.1. Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n1.2. Environmental\nrisks associated\nwith workplace\noperations and\nrelated\nprecautions to\ncontrol the risk\n1.3. Environmental\nprotection\nstandards\nrequired in the\nworkplace\n\n1.1. Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n1.2. Communication\nskills\n1.3. Accessing\ninformation and\ndata\n1.4. Ability to\nrecognize\npotential\nenvironmental\nrisks and ways\nof minimizing\nthem\n\n2. Implement and\nmonitor\nprocedures\nconcerning\nenvironmental\nhazards\n2.1 Existing and potential\nenvironmental hazards in\nthe workplace are identified\nand reported\n2.2 Identified hazards are\nassessed in relation to\nrelevant environmental\nprotection policies\n2.3 Workplace procedures for\ndealing with hazardous\nevents are implemented\nwherever necessary to\nensure that prompt control\naction is taken\n2.4 Personal protective\nequipment (PPE) are\nobtained and used in\naccordance with job\nrequirements\n2.1 Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n2.2 Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nprocedures\nconcerning\nenvironmental\nhazards\n2.3 Workplace\nenvironmental\nhazards and\nrelated hazard\n2.1 Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n2.2 Communication\nskills\n2.3 Problem solving\nskills\n2.4 Ability to:\n2.5 recognize\npotential\nenvironmental\nhazards and\nways of\nminimizing\nthem\n2.6 counsel, advise\nand inform\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 48\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.5 Hazardous events are\ninvestigated to identify\ncauses, and control\nmeasures are implemented\nto prevent recurrence and\nminimize risks of such\nevents\ncontrol\nmeasures\n2.4 Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\nprotection\nprocedures\n2.5 Organizational\nstructure and\nsite layout\nothers on\nenvironmental\nprotection\nmatters\n2.7 identify and\ncorrectly use\nequipment and\nvehicles in\naccordance\nwith\nenvironmental\nprotection\nregulations and\nguidelines\n3. Implement and\nmonitor\nenvironmental\ncontrol\nprocedures\n3.1 Existing environmental\nprotection measures are\nimplemented, monitored\nand reviewed\n3.2 Work procedures to protect\nenvironment are\nimplemented and\nadherence to them by the\nwork group is monitored\n3.3 Required improvements to\nexisting control measures\nare identified, including\nrequired resources for\nimplementation, and\nreported to appropriate\npersonnel\n3.1 Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n3.2 Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nenvironmental\ncontrol\nprocedures\n3.3 Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\ncontrol\nprocedures\n3.4 Organizational\nstructure and\nsite layout\n3.1 Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n3.2 Communication\nskills\n3.3 Accessing\ninformation and\ndata\n3.4 Problem solving\nskills\n3.5 Ability to:\n3.5.1 counsel,\nadvise and\ninform\nothers on\nenvironment\nal control\nprocedures\n3.5.2 identify and\ncorrectly use\nequipment\nand vehicles\nin\naccordance\nwith\nenvironment\nal control\nprocedures,\nregulations\nand\nguidelines\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 49\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Environment\n\nEnvironment may include:\n1.1 indoor\n1.2 outdoor\n1.3 marine\n1.4 atmospheric\n\n2 Information\nInformation/documents may include:\n2.1\nWorkplace procedures and practices related to\nenvironmental protection, including all financial,\noperating and customer service policies and\nprocedures\n2.2\nOHS and environmental protection regulations\n2.3\nWorkplace housekeeping procedures and\npolicies\n2.4\nCode of practice for environmental protection\n2.5\nMaterial safety data sheets\n2.6\nPolicies and procedures for entry and work in\nconfined spaces\n2.7\nManufacturer’s instructions concerning the use\nand servicing of equipment\n2.8\nEmergency pro