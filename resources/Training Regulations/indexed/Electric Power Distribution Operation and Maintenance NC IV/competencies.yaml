        "source_text": "500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto determine individual and team development needs and\nfacilitate the development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Learning and\ndevelopment needs are\nsystematically identified\nand implemented in line\nwith organizational\nrequirements\n1.2 Learning plan to meet\nindividual and group\ntraining and\ndevelopmental needs is\ncollaboratively developed\nand implemented\n1.3 Individuals are\nencouraged to self-\nevaluate performance and\nidentify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected from\nrelevant sources and\ncompared with established\nteam learning process\n1.1. Coaching and\nmentoring\nprinciples\n1.2. Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations, cultures\nand perspective\n1.3. Understanding how\nto facilitate team\ndevelopment and\nimprovement\n1.4. Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n1.1. Ability to :\n1.1.1. read and\nunderstand a\nvariety of texts,\n1.1.2. prepare general\ninformation and\ndocuments\naccording to\ntarget audience;\n1.1.3. spell with\naccuracy;\n1.1.4. use grammar\nand punctuation\neffective\nrelationships and\nconflict\nmanagement\n1.2. Communication skills\n1.3. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n2. Foster\nindividual and\norganizational\ngrowth\n2.1. Learning and development\nprogram goals and\nobjectives are identified to\nmatch the specific\nknowledge and skills\nrequirements of\ncompetency standards\n2.2. Learning delivery\nmethods are appropriate\nto the learning goals, the\nlearning style of\nparticipants and\navailability of equipment\nand resources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are provided to\nfacilitate individual and\nteam achievement of\ncompetencies\n2.1. Coaching and\nmentoring\nprinciples\n2.2. Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n2.3. Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n2.1. Communication skills\nincluding receiving\nfeedback and\nreporting,\nmaintaining effective\nrelationships and\nconflict management\n2.2. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n2.3. Reporting skills to\norganize information;\nassess information\nfor relevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n2.4. Facilitation skills to\nconduct small group\ntraining sessions\n\n--- PDF PAGE 12 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 8\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4. Resources and timelines\nrequired for learning\nactivities are identified and\napproved in accordance\nwith organizational\nrequirements\n\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement improvements\nin future learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and recorded to\ndetermine the\neffectiveness of\ndevelopment programs\nand the extent of\nadditional support\n3.3 Modifications to learning\nplans are negotiated to\nimprove the efficiency\nand effectiveness of\nlearning\n3.4 Records and reports of\ncompetency are\nmaintained within\norganizational\nrequirement\n3.1. Understanding how\nto facilitate team\ndevelopment and\ni