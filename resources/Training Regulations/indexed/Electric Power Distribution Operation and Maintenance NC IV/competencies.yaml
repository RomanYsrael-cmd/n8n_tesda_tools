mmunicating\ninsights on\nworkplace\neffectiveness\nand efficiency.\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 33\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Develop\npractical\naction plans\nfor improving\nworkplace\nconditions.\n3.1. Evaluation of efficiency\nand effectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated to\nstakeholders.\n3.2. Practical action plans\nin improving\nworkplace conditions\nare formulated,\npresented and\nnegotiated with\nstakeholders.\n3.3. Proposed changes and\ndirections are inquired,\nprocessed and\nnegotiated between and\namong teams, and\nstakeholders as well of\nthe organization.\n3.4. Commitment to\ncontinuous improvement\nand change is\nhighlighted.\n3.5. Passion and dedication\nfor changing and\nadapting to the demands\nof the 21st century\nworkplace are\nconsidered.\n3.1. Different methods of\ncritical and\nappreciative inquiry\nand their relevance to\ndifferent situations.\n3.2. Techniques to assist\nin forming the habit of\nasking questions and\ntaking responsibility\nfor answers.\n3.3. Why questions are\nimportant and the\nbenefits of asking\ngood questions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of critical\nthinking).\n3.4. Growth mindset and\npositive\ncommunication and\nrelationship strategies\nand techniques.\n3.5. Creative negotiation\nskills.\n3.6. Change management\nand continuous\nimprovement\nconcepts.\n3.1. Using range of\nanalytical\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation).\n3.2. Communicating\nto actively listen\nand to ask\nquestions of\nothers in a\nconstructive\nway.\n3.3. Using critical\nthinking\npathway to\nformulate and\nask relevant\nquestions and\ncome up with\nappropriate\nanswers.\n3.4. Performing\nassimilation and\naccommodation\nskills to interpret\nand distil key\ninformation of\nrelevance to a\ngiven situation.\n3.5. Assessing and\nmeasuring the\nextent of\neffectiveness\nand efficiency of\nthe systems,\nprocesses and\nprocedures in\nthe workplace.\n3.6. Communicating\npractical\ninsights on\nimproving\nworkplace\nconditions.\n\n--- PDF PAGE 38 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 34\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Effectiveness and\nefficiency of workplace\nstandards and\nprocedures\nMay include;\n1.1. Developing a more efficient way of doing something\n1.2. Developing a new idea\n1.3. Developing and improving products and services\n1.4. Enhancing skills and career opportunities\n1.5. Enhancing the physical environment\n1.6. Financial benefit\n1.7. Greater personal satisfaction\n1.8. Improving interpersonal relationships\n1.9. Evaluating overall workplace conditions\n2. Context of critical\ninquiry and curiosity\nMay include:\n2.1. Accuracy\n2.2. Breadth\n2.3. Clarity\n2.4. Depth\n2.5. Emotion\n2.6. Fairness\n2.7. Logic\n2.8. Meaning\n2.9. Planning\n2.10. Attention\n2.11. Precision\n2.12. Relevance\n2.13. Significance\n2.14. Social engagement\n2.15. Society\n2.16. Style\n2.17. Growth mindset\n2.18. Positive communication\n2.19. Positive negotiation\n2.20. Workplace conditions\n2.21. Appreciative inquiry methods\n\n3. Practical action plans\nfor improving workplace\nconditions.\nMay include:\n3.1. Insights on continuous improvement\n3.2. Creative strategies and techniques for becoming better\nat work and real life\n3.3. Career plans\n3.4. Challenging workplace policies, procedures and\nprotocols\n3.5. Specifying plans for change and adapting to the\ndemands of the contemporary workforce\n3.6. Challenges in negotiating with stakeholders and teams\n3.7. Change management, innovation and knowledge\ncreation\n3.8. Contractual agreements\n3.9. Extreme time pressure or non-negotiable deadlines\n3.10. Financial limitations\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 35\n\nVARIABLE\nRANGE\n3.11. Procedures determined by laws or other regulations\n3.12. Safety issues\n3.13. When others are totally closed to new ideas\n3.14. acknowledging shared responsibility\n3.15. adopting a positive 'can do' attitude\n3.16. following up on practical details\n3.17. pro-actively seeking information\n3.18. suggesting a new approach\n3.19. talking to others about possible answers\n3.20. constraints of the broader context and environment\n3.21. overall goal - what needs to be achieved\n3.22. personal hopes and expectations\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 36\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated the effectiveness and efficiency of\nworkplace systems, processes and procedures.\n1.2\nFostered the habit of critical inquiry and curiosity\nin the workplace\n1.3\nShown a thorough knowledge and understanding\nof how critical thinking impacts on individual lives,\nthe broader community and work situations.\n1.4\nDeveloped practical action plans for improving\nworkplace conditions.\n2. Resource Implications\n2.1.\nInteractions with specific challenges and situations\nto demonstrate the application of critical thinking\n(this would usually involve interactions with\nothers).\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\n Direct questioning combined with review of\nportfolios of evidence and third-party workplace\nreports of on-the-job performance by the\ncandidate\n3.2\n Evaluation of a candidate blog exploring different\nideas and questions\n3.3\n Review of candidate response to scenarios that\nallow the candidate to apply critical thinking\ntechniques to a life or work situation, and to\ndemonstrate ability to portray curiosity and\nexploration of new concepts\n3.4\n Evaluation of candidate response to the\nchallenge of adopting different perspectives on a\nsituation, and ability to both develop and respond\nto questions from those perspectives\n3.5\n Observation of the candidate participating in a\ngroup problem-solving session\n3.6\n Oral or written questioning to assess knowledge\nof typical blockers to the critical thinking process.\n3.7\nLife Narrative Inquiry to reflect life stories that\nreflect how critical thinking and problem solving is\napplied in the lives.\n4. Context for Assessment\n4.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 41 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 37\n\nUNIT TITLE\n:\nLEAD IN IMPLEMENTATION OF OCCUPATIONAL SAFETY\nAND HEALTH (OSH) PROGRAM, PROCEDURES AND\nPOLICIES/GUIDELINES\n\nUNIT CODE\n:"
