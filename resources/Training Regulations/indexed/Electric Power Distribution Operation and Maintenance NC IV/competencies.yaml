        "source_text": "UTL741321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto troubleshoot faults and implement solution on electric\npower distribution system. This involves working with a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare for\ntroubleshooting\nwork\n\n1.1 Work instruction is secured\nand interpreted according\nto job requirements\n1.2 Relevant occupational\nsafety requirements are\nidentified following job\nspecifications\n1.3 Relevant distribution line\ntools, equipment,\nmaterials and devices\nare identified and secured\nin accordance with job\nrequirements\n1.4 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.5 Conduct toolbox meeting\nwith the line crew\naccording to electric utility\nprocedures\n\n1.1 Relevant\noccupational safety\nrequirements\n1.2 procedures in\ntroubleshooting\ndistribution line\nequipment and\ndevices\n1.3 Power distribution\nindustry standards\nand specifications\n1.1 Interpretation\nskills\n1.2 Identifying\ndistribution line\nequipment,\ndevices and\nmaterials\n1.3 Troubleshooting\nskills\n1.4 Identifying\noccupational\nsafety standards\nfor line workers\n\n2. Conduct\ndistribution line\nsurvey\n2.1 Line crews are\nassigned/deployed to\ndifferent line section for\ntroubleshooting of affected\ndistribution line\n2.2 Electric distribution line is\nassessed and evaluated in\naccordance with standard\nconstruction specifications\n2.3 Fault indicators and relay\nerror codes are interpreted\nbased on the results\n2.1 Procedures in\ntroubleshooting\ndistribution line\nequipment and\ndevices\n2.2 Assessment and\nevaluation\n2.3 Standard\nconstruction\nspecifications\n2.4 Interpretation of\nerror codes and\nfault indications\n\n2.1 Interpretation\nskills\n2.2 Analytical skills\n2.3 Communication\nskills\n2.4 Logical skills\n2.5 Troubleshooting\nskills\n\n--- PDF PAGE 72 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 68\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Check/Assess\nfault condition\n3.1 Appropriate tests to\nestablish fault condition to\nmajor component level is\nconducted using\nappropriate test\nequipment, procedures\nand techniques\n3.2 Affected distribution line is\nisolated/sectionalized in\naccordance with standard\noperating procedures\n(SOP)\n3.3 Results of assessment\ncarried out is documented\nin accordance with electric\nutility procedures\n\n3.1 Procedures in\nassessment of fault\ncondition\n3.2 Procedures in\nisolation of affected\nline section (lock-\nout/tag-out)\n3.3 Conductor and fuse\nsizing\n\n3.1 Interpretation\nskills\n3.2 Analytical skills\n3.3 Communication\nskills\n3.4 Logical skills\n3.5 Troubleshooting\nskills\n3.6 Skills in\nconductor and\nfuse sizing\n3.7 Documentation\nskills\n\n4. Implement\ncorrective\nsolution\n4.1. Faulty condition on\ndistribution line is repaired\nusing appropriate tools,\nequipment and techniques\nto meet the standard\nspecifications\n4.2. Replacement of\ndefective/damaged\nequipment and materials is\nundertaken in accordance\nwith standard\nspecifications\n4.3. Affected distribution line is\nrestored/re-energized in\naccordance with SOP\n4.4. Housekeeping procedure\nis performed in line with\nestablished procedure\n4.1. Electric distribution\nline repair and\nreplacement\nprocedures\n4.2. Protocols on\ndistribution line\nrestoration/ re-\nenergization (lock-\nout/tag-out)\n4.3. Power distribution\nindustry standards\nand specifications\n4.4. 5-S principles\n\n4.1. Interpretation\nskills\n4.2. Analytical skills\n4.3. Communication\nskills\n4.4. Logical skills\n4.5. Troubleshooting\nskills\n4.6. Skills in\nrepairing\ndistribution line\n4.7. Skills in\nreplacement of\nequipment and\ndevices\n4.8. Good\nhousekeeping\nskills\n\n--- PDF PAGE 73 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 69\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational\nsafety\nrequirements\nMay include:\n1.1 Personal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Working gloves\n1.1.4. Line worker boots\n1.1.5. Working clothes\n1.1.6. Rain suits\n1.1.7. Rubber boots\n1.2\nPole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. Pair of climbers\n\n2. Tools, materials,\nequipment and\ndevices\nMay include but not limited to:\n2.1 Tools\n2.1.1. Rope/Hand line/Bull line\n2.1.2. Adjustable wrench or line worker wrench\n2.1.3. Pliers\n2.1.4. Ball peen hammer\n2.1.5. Measuring rule / steel tape\n2.1.6. Screw driver\n2.1.7. Auger bit\n2.1.8. Wire skinning knife\n2.1.9. Compression tool\n2.2\nMaterials/Hardware\n2.2.1. conductors\n2.2.2. insulators and pins\n2.2.3. ground rod\n2.2.4. ground lead\n2.2.5. connectors\n2.2.6. bolts and accessories\n2.2.7. pole clamps\n2.2.8. wedge clamps\n2.2.9. hot line clamps\n2.3\nEquipment and devices\n2.3.1. Transformer gin\n2.3.2. Cut-out and lightning arrester\n2.3.3. Distribution transformer\n2.3.4. Pulley or block and tackle\n2.3.5. Ladder\n2.3.6. Boom truck or derrick truck\n2.3.7. Pole climbing equipment\n\n--- PDF PAGE 74 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 70\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Prepared for troubleshooting work\n1.2. Conducted distribution line survey\n1.3. Checked/Assessed fault condition\n1.4. Implemented corrective solution\n2. Resource\nimplications\nThe following resources should be available:\n2.1. Needed tools, equipment and devices\n2.2. Appropriate PPE\n2.3. Site or work area\n2.4. Transformer gin, Pulley or block and tackle, Handline / Rope /\nBull line\n2.5. Boom or derrick truck (if necessary)\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation/Demonstration with oral questioning\n3.2 Written test\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 75 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 71\n\nUNIT OF COMPETENCY : SUPERVISE OPERATION AND MAINTENANCE ON\nELECTRIC POWER DISTRIBUTION SYSTEM\n\nUNIT CODE\n\n:"
