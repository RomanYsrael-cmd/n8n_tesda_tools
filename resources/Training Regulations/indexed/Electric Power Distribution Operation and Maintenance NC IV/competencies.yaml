chniques in\nrecommending\nchanges and in\nmanaging\nchanges in the\nworkplace\n2. Develop\noptions for\ncontinuous\nimprovement\n2.1. Groups are briefed on\nperformance improvement\nstrategies and innovation as an\nessential element of competition\n2.2. Creative climate and\norganizational learning are\nfostered by promoting interaction\nwithin and between work groups\n2.3. New ideas and entrepreneurial\nbehavior are encouraged, tested\nand recognized\n2.4. Failure of an idea are accepted\nduring trialing and recognize,\ncelebrate and embed success\ninto systems\n2.5. Risk management and cost-\nbenefit analysis are undertook\nfor each option or idea approved\nfor trial\n2.6. Innovations through agreed\norganizational processes are\napproved\n2.1. Cost-benefit\nanalysis method\n2.2. Creativity and\ninnovation theories\nand concepts\n2.3. Quality\nmanagement and\ncontinuous\nimprovement\ntheories\n2.4. Practical Risk\nmanagement\nconcepts\n2.1. Computing cost\nbenefit\n2.2. Practicing\ncreativity and\ninnovation\n2.3. Applying\ncontinuous\nimprovement\n2.4. Applying risk\nmanagement\n\n--- PDF PAGE 33 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 29\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement\ninnovative\nprocesses\n3.1. Continuous improvement and\nsustainability are promoted as\nessential to doing business\n3.2. Impact of change and\nconsequences are addressed for\npeople and implement transition\nplans\n3.3. Objectives, timeframes,\nmeasures and communication\nplans are ensured in place to\nmanage implementation\n3.4. Contingency plans in are\nimplemented in the event of\nnonperformance\n3.5. Failure by prompt investigation\nand