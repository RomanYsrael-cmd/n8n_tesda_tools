        "source_text": "UTL311206\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto implement and monitor environmental protection policies\nand procedures including accessing relevant information\nconcerning environmental protection regulations and\nprocedures, and implementing and monitoring procedures\nconcerning environmental hazards, related control\nprocedures, environmental training arrangements, and\nrequired records and documentation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Access\ninformation\nconcerning\nenvironmental\nprotection\nregulations\nand\nprocedures\n\n1.1. Relevant provisions of\nenvironmental legislation\nand codes of practice are\naccurately followed\n1.2. Information on workplace\nenvironmental policies,\nprocedures and programs is\nstored in a readily\naccessible location and\nmanner\n1.3. Information is accurately\nand clearly explained to the\nwork team and updated\naccording to change in\nworkplace policy\n1.4. Information about the\noutcomes of environmental\nrisk identification and\ncontrol procedures is\nprovided to the appropriate\npersonnel\n1.1. Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n1.2. Environmental\nrisks associated\nwith workplace\noperations and\nrelated\nprecautions to\ncontrol the risk\n1.3. Environmental\nprotection\nstandards\nrequired in the\nworkplace\n\n1.1. Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n1.2. Communication\nskills\n1.3. Accessing\ninformation and\ndata\n1.4. Ability to\nrecognize\npotential\nenvironmental\nrisks and ways\nof minimizing\nthem\n\n2. Implement and\nmonitor\nprocedures\nconcerning\nenvironmental\nhazards\n2.1 Existing and potential\nenvironmental hazards in\nthe workplace are identified\nand reported\n2.2 Identified hazards are\nassessed in relation to\nrelevant environmental\nprotection policies\n2.3 Workplace procedures for\ndealing with hazardous\nevents are implemented\nwherever necessary to\nensure that prompt control\naction is taken\n2.4 Personal protective\nequipment (PPE) are\nobtained and used in\naccordance with job\nrequirements\n2.1 Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n2.2 Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nprocedures\nconcerning\nenvironmental\nhazards\n2.3 Workplace\nenvironmental\nhazards and\nrelated hazard\n2.1 Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n2.2 Communication\nskills\n2.3 Problem solving\nskills\n2.4 Ability to:\n2.5 recognize\npotential\nenvironmental\nhazards and\nways of\nminimizing\nthem\n2.6 counsel, advise\nand inform\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 48\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.5 Hazardous events are\ninvestigated to identify\ncauses, and control\nmeasures are implemented\nto prevent recurrence and\nminimize risks of such\nevents\ncontrol\nmeasures\n2.4 Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\nprotection\nprocedures\n2.5 Organizational\nstructure and\nsite layout\nothers on\nenvironmental\nprotection\nmatters\n2.7 identify and\ncorrectly use\nequipment and\nvehicles in\naccordance\nwith\nenvironmental\nprotection\nregulations and\nguidelines\n3. Implement and\nmonitor\nenvironmental\ncontrol\nprocedures\n3.1 Existing environmental\nprotection measures are\nimplemented, monitored\nand reviewed\n3.2 Work procedures to protect\nenvironment are\nimplemented and\nadherence to them by the\nwork group is monitored\n3.3 Required improvements to\nexisting control measures\nare identified, including\nrequired resources for\nimplementation, and\nreported to appropriate\npersonnel\n3.1 Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n3.2 Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nenvironmental\ncontrol\nprocedures\n3.3 Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\ncontrol\nprocedures\n3.4 Organizational\nstructure and\nsite layout\n3.1 Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n3.2 Communication\nskills\n3.3 Accessing\ninformation and\ndata\n3.4 Problem solving\nskills\n3.5 Ability to:\n3.5.1 counsel,\nadvise and\ninform\nothers on\nenvironment\nal control\nprocedures\n3.5.2 identify and\ncorrectly use\nequipment\nand vehicles\nin\naccordance\nwith\nenvironment\nal control\nprocedures,\nregulations\nand\nguidelines\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 49\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Environment\n\nEnvironment may include:\n1.1 indoor\n1.2 outdoor\n1.3 marine\n1.4 atmospheric\n\n2 Information\nInformation/documents may include:\n2.1\nWorkplace procedures and practices related to\nenvironmental protection, including all financial,\noperating and customer service policies and\nprocedures\n2.2\nOHS and environmental protection regulations\n2.3\nWorkplace housekeeping procedures and\npolicies\n2.4\nCode of practice for environmental protection\n2.5\nMaterial safety data sheets\n2.6\nPolicies and procedures for entry and work in\nconfined spaces\n2.7\nManufacturer’s instructions concerning the use\nand servicing of equipment\n2.8\nEmergency procedures\n2.9\nRegulations and policies concerning noise, waste\ndisposal/