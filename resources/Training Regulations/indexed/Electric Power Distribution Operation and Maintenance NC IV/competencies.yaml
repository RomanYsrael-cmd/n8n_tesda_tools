ompetency in this unit may be assessed through:\nThrough direct observation of application to tasks and\nquestions related to underpinning knowledge\nUnder general guidance, checking various stages of\noperation and at the completion of the activity against\nperformance criteria and specifications\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in the work place or\nin a simulated work place setting\n4.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while\ntasks are undertaken either individually or as part\nof a team under limited supervision\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 16\n\nUNIT OF COMPETENCY : COLLECT, ANALYZE AND ORGANIZE INFORMATION\n(Access and evaluate information)\n\nUNIT CODE :"
