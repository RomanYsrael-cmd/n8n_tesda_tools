        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be\nobtained by observation of performance and questioning\nto indicate knowledge and understanding of the elements\nof the competency and performance criteria.\n2. Resource\nImplications\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios/case studies/what ifs will\nbe required as well as bank of questions which will be\nused to probe the reasoning behind the observable\nactions.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nThrough direct observation of application to tasks and\nquestions related to underpinning knowledge\nUnder general guidance, checking various stages of\noperation and at the completion of the activity against\nperformance criteria and specifications\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in the work place or\nin a simulated work place setting\n4.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while\ntasks are undertaken either individually or as part\nof a team under limited supervision\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 16\n\nUNIT OF COMPETENCY : COLLECT, ANALYZE AND ORGANIZE INFORMATION\n(Access and evaluate information)\n\nUNIT CODE :"
        },
        "source_text": "500311117\nUNIT DESCRIPTOR : This competency covers the knowledge, skills and attitudes\nrequired to apply the process of problem solving and other\nproblems beyond those associated directly with the process\nunit. It includes the application of structured processes and\nimprovement tools. This competency is typically performed by\nan experienced technician, team leader or supervisor.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Analyze the\nproblem\n (Use system\nthinking)\n1.1. Issues/concerns are\nevaluated based on\ndata gathered\n1.2. Possible causes of\nproblem are identified\nwithin the area of\nresponsibility as\nbased on experience\nand the use of problem\nsolving tools/analytical\ntechniques\n1.3. Possible cause\nstatements are\ndeveloped based on\nfindings\n\n1.1. Broad understanding\nof systems,\norganizational systems\nand functions\n1.2. Broad knowledge of\nhelp desk and\nmaintenance practices\n1.3. Broad knowledge of\nthe client business\ndomain\n1.4. Broad knowledge\nbased of diagnostic\ntools\n1.5. General principles of\nOHS\n1.6. Divisional/unit\nresponsibilities\n1.1. Decision making\nwithin a limited range\nof options.\n1.2. Communication is\nclear, precise and\nvaries according to\nthe type of audience\n1.3. Time management as\napplied to self-\nmanagement.\n1.4. Analytical skills in\nrelation to routine\nmalfunctions.\n2. Identify\npossible\nsolutions\n2.1 All possible options are\nconsidered for\nresolution of the\nproblem in accordance\nwith safety and\noperating procedures\n2.2 Strengths and\nweaknesses of possible\noptions are considered\n2.3 Corrective action is\ndetermined to resolve\nthe problem and its\npossible future causes\n2.1. Broad understanding\nof systems,\norganizational systems\nand functions\n2.2. Broad knowledge of\nhelp desk and\nmaintenance practices\n2.3. Current industry\naccepted hardware\nand software products\nwith broad and\ndetailed knowledge of\nits general features\nand capabilities\n2.4. Broad knowledge of\nthe operating system\n2.5. Broad knowledge of\nthe client business\ndomain\n2.6. Broad knowledge\nbased of diagnostic\ntools\n2.1. Decision making\nwithin a limited range\nof options.\n2.2. Communication is\nclear, precise and\nvaries according to\nthe type of audience\n2.3. Teamwork in\nreference to personal\nresponsibility\n2.4. Time management as\napplied to self-\nmanagement.\n2.5. Analytical skills in\nrelation to routine\nmalfunctions.\n2.6. General customer\nservice skills\ndisplayed\n2.7. Questioning and\nactive listening is\nemployed to clarify\ngeneral information\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 13\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Recommend\nsolution to\nhigher\nmanagement\n (Make\njudgment and\ndecisions/\nSolve\nproblems )\n3.1. Report/ communication\nor documentation are\nprepared\n3.2. Recommendations are\npresented to appropriate\npersonnel\n3.3. Recommendations are\nfollowed-up, if required\n3.1. Broad understanding\nof systems,\norganizational systems\nand functions\n3.2. Broad knowledge of\nhelp desk and\nmaintenance practices\n3.3. Broad knowledge of\nthe operating system\n3.4. Broad knowledge of\nthe client business\ndomain\n3.5. Broad knowledge\nbased incorporating\ncurrent industry\npractices related to\nescalation procedures\n3.6. Broad knowledge\nbased of diagnostic\ntools\n3.1. Decision making\nwithin a limited range\nof options.\n3.2. Communication is\nclear, precise and\nvaries according to\nthe type of audience\n3.3. Teamwork in\nreference to personal\nresponsibility\n3.4. Time management as\napplied to self-\nmanagement.\n3.5. Analytical skills in\nrelation to routine\nmalfunctions.\n3.6. General customer\nservice skills\ndisplayed\n4. Implement\nsolution\n4.1. Measurable objectives\nare identified\n4.2. Resource needs are\nidentified\n4.3. Timelines are identified\nin accordance with plan\n4.1. Broad knowledge of\nhelp desk and\nmaintenance practices\n4.2. Broad knowledge of\nthe client business\ndomain\n4.3. Broad knowledge\nbased incorporating\ncurrent industry\npractices related to\nescalation procedures\n4.4. Broad knowledge\nbased of diagnostic\ntools\n4.5. General principles of\nOHS\n4.6. Divisional/unit\nresponsibilities\n4.1. Decision making\nwithin a limited range\nof options.\n4.2. Time management as\napplied to self-\nmanagement.\n4.3. Analytical skills in\nrelation to routine\nmalfunctions.\n4.4. General customer\nservice skills\ndisplayed.\n4.5. Questioning and\nactive listening is\nemployed to clarify\ngeneral information\n5. Evaluate/\nMonitor results\nand outcome\n5.1. Processes and\nimprovements are\nidentified based on\nevaluative assessment\nof problem\n5.2. Recommendations are\nprepared and submitted\nto superiors.\n5.1. Broad knowledge of\nthe client business\ndomain\n5.2. Broad knowledge\nbased incorporating\ncurrent industry\npractices related to\nescalation procedures\n5.3. Broad knowledge\nbased of diagnostic\ntools\n5.4. General principles of\nOHS\n5.5. Divisional/unit\nresponsibilities\n5.1. Time management as\napplied to self-\nmanagement.\n5.2. Analytical skills in\nrelation to routine\nmalfunctions.\n5.3. General customer\nservice skills\ndisplayed.\n5.4. Questioning and\nactive listening is\nemployed to clarify\ngeneral information\n\n--- PDF PAGE 18 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance 