        "source_text": "500311119\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required in planning and\norganizing work. It may be applied to a small independent\noperation or to a section of a large organization.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Set objectives\n1.1 Objectives are consistent\nwith and linked to work\nactivities in accordance with\norganizational aims\n1.2 Objectives are stated as\nmeasurable targets with clear\ntime frames\n1.3 Support and commitment of\nteam members are reflected\nin the objectives\n1.4 Realistic and attainable\nobjectives are identified\n1.1. Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives for\nwork unit activities and\npriorities\n1.2. Organizations policies,\nstrategic plans,\nguidelines related to\nthe role of the work\nunit\n1.3. Team work and\nconsultation strategies\n\n1.1. Planning\n1.2. Leading\n1.3. Organizing\n1.4. Coordinating\n1.5. Communication\nSkills\n1.6. Inter-and intra-\nperson/\nmotivation\nskills\n\n2. Plan and\nschedule work\nactivities\n2.1 Tasks/work activities to be\ncompleted are identified and\nprioritized as directed\n2.2 Tasks/work activities are\nbroken down into steps in\naccordance with set time\nframes achievable\ncomponents in accordance\nwith set time frames\n2.3 Resources are allocated as\nper requirements of the\nactivity\n2.4 Schedule of work activities\nis coordinated with personnel\nconcerned\n\n2.1. Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives\nfor work unit activities\nand priorities\n2.2. Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n2.3. Team work and\nconsultation\nstrategies\n2.1. Planning\n2.2. Leading\n2.3. Organizing\n2.4. Coordinating\n2.5. Communication\nSkills\n2.6. Inter-and intra-\nperson/\nmotivation\nskills\n\n3. Implement work\nplans\n3.1 Work methods and\npractices are identified in\nconsultation with personnel\nconcerned\n3.2 Work plans are\nimplemented in accordance\nwith set time frames,\nresources and standards\n3.1. Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives\nfor work unit activities\nand priorities\n3.2. Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n3.3. Team work and\nconsultation\nstrategies\n\n3.1. Planning\n3.2. Leading\n3.3. Organizing\n3.4. Coordinating\n3.5. Communication\nSkills\n3.6. Inter-and intra-\nperson/\nmotivation\nskills\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 21\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Monitor work\nactivities\n4.1 Work activities are monitored\nand compared with set\nobjectives\n4.2 Work performance is\nmonitored\n4.3 Deviations from work\nactivities are reported and\nrecommendations are\ncoordinated with appropriate\npersonnel and in accordance\nwith set standards\n4.4 Reporting requirements are\ncomplied with in accordance\nwith recommended format\n4.5 Observe timeliness of report\n4.6 Files are established and\nmaintained in accordance\nwith standard operating\nprocedures\n\n4.1. Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives for\nwork unit activities and\npriorities\n4.2. Organizations policies,\nstrategic plans,\nguidelines related to\nthe role of the work\nunit\n4.3. Team work and\nconsultation strategies\n4.1. Planning\n4.2. Leading\n4.3. Organizing\n4.4. Coordinating\n4.5. Communication\nSkills\n4.6. Inter-and intra-\nperson/\nmotivation skills\n\n5. Review and\nevaluate work\nplans and\nactivities\n5.1. Work plans, strategies and\nimplementation are reviewed\nbased on accurate, relevant\nand current information\n5.2. Review is based on\ncomprehensive consultation\nwith appropriate personnel\non outcomes of work plans\nand reliable feedback\n5.3. Results of review are\nprovided to concerned\nparties and formed as the\nbasis for\nadjustments/simplifications to\nbe made to policies,\nprocesses and activities\n5.4. Performance appraisal is\nconducted in accordance\nwith organization rules and\nregulations\n5.5. Performance appraisal report\nis prepared and documented\nregularly as per organization\nrequirements.\n5.6. Recommendations are\nprepared and presented to\nappropriate\npersonnel/authorities\n5.7. Feedback mechanisms are\nimplemented in line with\norganization policies\n5.1. Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives\nfor work unit activities\nand priorities\n5.2. Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n5.3. Team work and\nconsultation\nstrategies\n5.1. Planning\n5.2. Leading\n5.3. Organizing\n5.4. Coordinating\n5.5. Communication\nSkills\n5.6. Inter-and intra-\nperson/\nmotivation\nskills\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 22\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Objectives\n1.1. Specific\n1.2. General\n2. Resources\n2.1. Personnel\n2.2. Equipment and technology\n2.3. Services\n2.4. Supplies and materials\n2.5. Sources for accessing specialist advice\n2.6. Budget\n3. Schedule of work\nactivities\n3.1. Daily\n3.2. Work-based\n3.3. Contractual\n3.4. Regular\n3.5. Confidential\n3.6. Disclosure\n3.7. Non-disclosure\n4. Work methods and\npractices\nWork methods and