  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Electric Power Distribution Operation and Maintenance NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: UTILIZE SPECIALIZED COMMUNICATION SKILLS\nUNIT CODE : 500311115\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nuse specialized communication skills to meet specific needs\nof internal and external clients, conduct interviews, facilitate\ngroup of discussions, and contribute to the development of\ncommunication strategies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Meet common\nand specific\ncommunication\nneeds of\nclients and\ncolleagues\n1.1. Specific communication\nneeds of clients and\ncolleagues are identified and\nmet\n1.2. Different approaches are\nused to meet communication\nneeds of clients and\ncolleagues\n1.3. Conflict is addressed\npromptly and in a timely way\nand in a manner which does\nnot compromise the standing\nof the organization\n1.1 Communication\nprocess\n1.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n1.3 Communication\nskills relevant to\nclient groups\n\n1.1 Full range of\ncommunication\ntechniques including:\n1.1.1 Full range of\ncommunication\n1.1.2 Active listening\n1.1.3 Feedback\n1.1.4 Interpretation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n2. Contribute to\nthe\ndevelopment of\ncommunication\nstrategies\n2.1. Strategies for internal and\nexternal dissemination of\ninformation are developed,\npromoted, implemented and\nreviewed as required\n2.2. Channels of communication\nare established and reviewed\nregularly\n2.3. Coaching in effective\ncommunication is provided\n2.4. Work related network and\nrelationship are maintained\nas necessary\n2.5. Negotiation and conflict\nresolution strategies are used\nwhere required\n2.1 Different\ncommunication\nstrategies\n2.2 Strategies in\nnegotiations and\nconflict resolution\n\n2.1 Full range of\ncommunication\ntechniques including:\n2.1.1 Active listening\n2.1.2 Feedback\n2.1.3 Interpretation\n2.1.4 Role boundaries\nsetting\n2.1.5 Negotiation\n2.1.6 Establishing\nempathy\n2.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 4\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n2.3 Communication with clients\nand colleagues is\nappropriate to individual\nneeds and organizational\nobjectives\n\n3. Represent the\norganization\n3.1. When participating in internal\nor external forums,\npresentation is relevant,\nappropriately researched\nand presented in a manner\nto promote the organization\n3.2. Presentation is clear and\nsequential and delivered\nwithin a predetermined time\n3.3. Utilize appropriate media to\nenhance presentation\n3.4. Differences in views are\nrespected\n3.5. Written communication is\nconsistent with\norganizational standards\n3.6. Inquiries are responded in a\nmanner consistent with\norganizational standard\n3.1. Communication\nprocess\n3.2. Communication\nskills relevant to\nclient groups\n3.3. Appropriate\npresentation\ntools and\nmaterials\n\n3.1. Computer skills\n3.2. Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n4. Facilitate group\ndiscussion\n4.1 Mechanisms which enhance\neffective group interaction\nis defined and implemented\n4.2 Strategies which encourage\nall group members to\nparticipate are used routinely\n4.3 Objectives and agenda for\nmeetings and discussions\nare routinely set and\nfollowed\n4.4 Relevant information is\nprovided to group to facilitate\noutcomes\n4.5 Evaluation of group\ncommunication strategies is\nundertaken to promote\nparticipation of all parties\n4.6 Specific communication\nneeds of individuals are\nidentified and addressed\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n4.3 Communication\nskills relevant to\nclient groups\n\n4.1. Full range of\ncommunication\ntechniques\nincluding:\n4.1.1. Role\nboundaries\nsetting\n4.1.2. Negotiation\n4.1.3. Establishing\nempathy\n4.2. Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n5. Conduct\ninterview\n5.1. A range of appropriate\ncommunication strategies are\nemployed in interview\nsituations\n5.2. Records of interviews are\nmade and maintained in\naccordance with\norganizational procedures\n5.1 Communication\nprocess\n5.2 Effective\nquestioning,\nlistening and\nnonverbal\ncommunication\ntechniques\n5.1. Full range of\ncommunication\ntechniques\nincluding:\n5.1.1. Active listening\n5.1.2. Feedback\n5.1.3. Negotiation\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 5\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5.3. Effective questioning,\nlistening and nonverbal\ncommunication techniques\nare used to ensure that\nrequired message is\ncommunicated\n5.3 Communication\nskills relevant to\nclient groups\n5.4 Types of\nInterview\n\n5.1.4. Establishing\nempathy\n5.2. Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Strategies\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n2. Effective group interaction\n2.1 Identifying and evaluating what is occurring\nwithin an interaction in a non-judgmental way\n2.2 Using active listening\n2.3 Making decision about appropriate words,\nbehavior\n2.4 Putting together response which is culturally\nappropriate\n2.5 Expressing an individual perspective\n2.6 Expressing own philosophy, ideology and\nbackground and exploring impact with relevance\nto communication\n3. Types of Interview\n3.1 Related to staff issues\n3.2 Routine\n3.3 Confidential\n3.4 Evidential\n3.5 Non-disclosure\n3.6 Disclosure\n4. Interview situations\n4.1 Establish rapport\n4.2 Elicit facts and information\n4.3 Facilitate resolution of issues\n4.4 Develop action plans\n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 10 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 6\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2. Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n\n2. Resource\nImplications\n2.1. Access to appropriate workplace where assessment can\ntake place\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observation\n3.2. Oral Interview\n\n4. Context for\nAssessment\n4.1. This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 11 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 7\n\nUNIT OF COMPETENCY :\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE\n:\n500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto determine individual and team development needs and\nfacilitate the development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Learning and\ndevelopment needs are\nsystematically identified\nand implemented in line\nwith organizational\nrequirements\n1.2 Learning plan to meet\nindividual and group\ntraining and\ndevelopmental needs is\ncollaboratively developed\nand implemented\n1.3 Individuals are\nencouraged to self-\nevaluate performance and\nidentify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected from\nrelevant sources and\ncompared with established\nteam learning process\n1.1. Coaching and\nmentoring\nprinciples\n1.2. Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations, cultures\nand perspective\n1.3. Understanding how\nto facilitate team\ndevelopment and\nimprovement\n1.4. Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n1.1. Ability to :\n1.1.1. read and\nunderstand a\nvariety of texts,\n1.1.2. prepare general\ninformation and\ndocuments\naccording to\ntarget audience;\n1.1.3. spell with\naccuracy;\n1.1.4. use grammar\nand punctuation\neffective\nrelationships and\nconflict\nmanagement\n1.2. Communication skills\n1.3. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n2. Foster\nindividual and\norganizational\ngrowth\n2.1. Learning and development\nprogram goals and\nobjectives are identified to\nmatch the specific\nknowledge and skills\nrequirements of\ncompetency standards\n2.2. Learning delivery\nmethods are appropriate\nto the learning goals, the\nlearning style of\nparticipants and\navailability of equipment\nand resources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are provided to\nfacilitate individual and\nteam achievement of\ncompetencies\n2.1. Coaching and\nmentoring\nprinciples\n2.2. Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n2.3. Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n2.1. Communication skills\nincluding receiving\nfeedback and\nreporting,\nmaintaining effective\nrelationships and\nconflict management\n2.2. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n2.3. Reporting skills to\norganize information;\nassess information\nfor relevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n2.4. Facilitation skills to\nconduct small group\ntraining sessions\n\n--- PDF PAGE 12 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 8\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4. Resources and timelines\nrequired for learning\nactivities are identified and\napproved in accordance\nwith organizational\nrequirements\n\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement improvements\nin future learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and recorded to\ndetermine the\neffectiveness of\ndevelopment programs\nand the extent of\nadditional support\n3.3 Modifications to learning\nplans are negotiated to\nimprove the efficiency\nand effectiveness of\nlearning\n3.4 Records and reports of\ncompetency are\nmaintained within\norganizational\nrequirement\n3.1. Understanding how\nto facilitate team\ndevelopment and\nimprovement\n3.2. Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n3.3. Understanding\nmethods for\nidentifying and\nprioritizing personal\ndevelopment\nopportunities and\noptions\n3.4. Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n3.1. Communication skills\nincluding receiving\nfeedback and\nreporting,\nmaintaining effective\nrelationships and\nconflict management\n3.2. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n3.3. Reporting skills to\norganize information;\nassess information\nfor relevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n3.4. Ability to relate to\npeople from a range\nof social, cultural,\nphysical and mental\nbackgrounds\n4. Develop team\ncommitment\nand cooperation\n4.1. Open communication\nprocesses to obtain and\nshare information is used\nby team\n4.2. Decisions are reached by\nthe team in accordance\nwith its agreed roles and\nresponsibilities\n4.3. Mutual concern and\ncamaraderie are\ndeveloped in the team\n4.1. Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n4.2. Understanding\nmethods for\nidentifying and\nprioritizing\npersonal\ndevelopment\nopportunities and\noptions\n4.3. Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n4.1. Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining effective\nrelationships and\nconflict management\n4.2. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n4.3. Facilitation skills to\nconduct small group\ntraining sessions\n4.4. Ability to relate to\npeople from a range\nof social, cultural,\nphysical and mental\nbackgrounds\n\n--- PDF PAGE 13 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 9\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Facilitate\naccomplishment\nof\norganizational\ngoals\n5.1. Team members actively\nparticipated in team\nactivities and\ncommunication processes\n5.2. Teams members\ndeveloped individual and\njoint responsibility for their\nactions\n5.3. Collaborative efforts are\nsustained to attain\norganizational goals\n5.1. Team activities and\ncommunication\nprocesses\n5.2. Understanding how\nto work effectively\nwith team\nmembers who\nhave diverse work\nstyles, aspirations,\ncultures and\nperspective\n5.3. Understanding how\nto facilitate team\ndevelopment and\nimprovement\n5.4. Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n5.1. Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining effective\nrelationships and\nconflict management\n5.2. Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n5.3. Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n5.4. Ability to relate to\npeople from a range\nof social, cultural,\nphysical and mental\nbackgrounds\n\n--- PDF PAGE 14 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 10\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Learning and\n development needs\n\n1.1 Coaching, mentoring and/or supervision\n1.2 Formal/informal learning program\n1.3 Internal/external training provision\n1.4 Work experience/exchange/opportunities\n1.5 Personal study\n1.6 Career planning/development\n1.7 Performance appraisals\n1.8 Workplace skills assessment\n1.9 Recognition of prior learning\n2. Organizational\n requirements\n2.1 Quality assurance and/or procedures manuals\n2.2 Goals, objectives, plans, systems and processes\n2.3 Legal and organizational policy/guidelines and\nrequirements\n2.4 Safety policies, procedures and programs\n2.5 Confidentiality and security requirements\n2.6 Business and performance plans\n2.7 Ethical standards\n2.8 Quality and continuous improvement processes\nand standards\n3. Feedback on\n performance\n3.1 Formal/informal performance appraisals\n3.2 Obtaining feedback from supervisors and\ncolleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for\nmonitoring service delivery\n4. Learning delivery\n methods\n4.1 On the job coaching or mentoring\n4.2 Problem solving\n4.3 Presentation/demonstration\n4.4 Formal course participation\n4.5 Work experience\n4.6 Involvement in professional networks\n4.7 Conference and seminar attendance\n4.8 Induction\n\n--- PDF PAGE 15 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 11\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of\nthe team\n1.4. Negotiated learning plans to improve the\neffectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 12\n\nUNIT OF COMPETENCY : APPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE (Critical thinking and problem solving\ntechniques)\nUNIT CODE : 500311117\nUNIT DESCRIPTOR : This competency covers the knowledge, skills and attitudes\nrequired to apply the process of problem solving and other\nproblems beyond those associated directly with the process\nunit. It includes the application of structured processes and\nimprovement tools. This competency is typically performed by\nan experienced technician, team leader or supervisor.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Analyze the\nproblem\n (Use system\nthinking)\n1.1. Issues/concerns are\nevaluated based on\ndata gathered\n1.2. Possible causes