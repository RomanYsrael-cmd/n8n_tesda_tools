  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE\nOPERATION AND MAINTENANCE NC IV shall be obtained when a\ncandidate demonstrate competence in all units of competency listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.1.2 The Qualification of Electric Power Distribution Operation and\nMaintenance NC IV can be attained by demonstration of competence\nthrough project-type assessment covering all the units required.\n\n4.1.3 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of formal training on Electric Power Distribution Operation\nand Maintenance NC IV;\n\n4.1.4.2 Graduates\nof\nsupervisory\ntraining\non\ndistribution\nline\ninstallation/construction,\noperation\nand\nmaintenance\nfrom\nenterprise/s and a NC Holder in Electrical Power Distribution\nOperation and Maintenance NC III;\n\n4.1.4.3 Certified holders of Electrical Power Distribution Operation and\nMaintenance NC III and has at least 5 years of work experience in\nsupervising distribution line installation/construction, operation and\nmaintenance.\n\n4.1.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n--- PDF PAGE 109 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 105\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 110 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nElectric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 106\n\n"
