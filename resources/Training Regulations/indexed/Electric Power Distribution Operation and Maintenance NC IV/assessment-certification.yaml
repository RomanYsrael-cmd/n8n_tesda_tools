      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE OPERATION AND MAINTENANCE NC IV shall be obtained when a candidate demonstrate competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The Qualification of Electric Power Distribution Operation and Maintenance NC IV can be attained by demonstration of competence through project-type assessment covering all the units required. 4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4 Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of formal training on Electric Power Distribution Operation and Maintenance NC IV; 4.1.4.2 Graduates of supervisory training on distribution line installation/construction, operation and maintenance from enterprise/s and a NC Holder in Electrical Power Distribution Operation and Maintenance NC III; 4.1.4.3 Certified holders of Electrical Power Distribution Operation and Maintenance NC III and has at least 5 years of work experience in supervising distribution line installation/construction, operation and maintenance. 4.1.5 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\". Electric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 105"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Electric Power Distribution Operation and Maintenance NC IV Revision 00 Promulgated June 27, 2018 106"
    }
