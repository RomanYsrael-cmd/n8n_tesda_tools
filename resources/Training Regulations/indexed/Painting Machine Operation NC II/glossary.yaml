      "definition": "49 - 13. Paint reducer Paint reducer is used in paint mixing to attain the required viscosity. 14. Paint viscosity Paint Viscosity is the condition or property of paint to be viscous; the resistance of paint to shear forces (and hence to flow). 15. Phosphate application Phosphate application is done to make phosphate serve as the base for coating and make it an integral part of metal. It also provides adhesion and coating flexibility. It also increases the resistance to corrosion. 16. Pnematic polisher A pneumatic polisher is an instrument activated by air pressure. It is the hand tool used in wet sanding operation of the gray primer. 17. Polishing compound The polishing compound is the material used to smoothen the paint applied to increase the glossy appearance of the top coat paint. 18. Pressure tank A pressure tank is a closed cylindrical steel container designed to store water under pressure. It is an equipment supplied with air pressure that is designed to contain paint used in painting application. 19. Primer paint Primer Paint is the first or preliminary coat of paint or size applied to a surface. 20. Sealer A sealer seals, as an undercoat of paint or varnish used to size a surface. It is also a kind of sealing material that is used to form a hard coating on a porous surface (as a coat of paint or varnish used to size a surface). 21. Spray booth Spray Booth means a power-ventilated structure that encloses or accommodates a spraying operation so that spray vapour and residue can be controlled and exhausted. 22. Spray gun The spray gun is a an applicator resembling a gun for applying liquid substances (as paint) in the form of a spray 23. Thermocouple A thermocouple is a thermoelectric device used to measure temperatures accurately, especially one consisting of two dissimilar metals joined so that a potential difference generated between the points of contact is a measure of the temperature difference between the points. 24. Wet sanding We