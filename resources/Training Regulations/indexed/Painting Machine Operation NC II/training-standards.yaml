    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PAINTING MACHINE OPERATION NC II\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PAINTING MACHINE OPERATION NC II\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n140 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of automotive manufacturing in accordance with industry standards. It covers\ncompetencies to perform cathodic electro-deposition process operations; perform gray primer\n(2nd primer) application procedures; and perform top coat application procedures in accordance\nwith manufacturer’s specification.\n.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n4. Practice\noccupational\nhealth and safety\n4.1\nEvaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey workplace\ninformation\n1.2 Complete relevant work related\ndocuments\n1.3 Participate in workplace meeting\nand discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n• Written test\n• Observation\n• Simulation\n• Role playing\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal objectives with\norganizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth and\ndevelopment\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 45 ---\nTR Painting Machine Operation NC II Promulgated 41\n\nCOMMON COMPETENCIES\n(20 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n1.1 Select measuring instruments\n1.2 Carry out measurements and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n2. Read, interpret\nand apply\nengineering\nmanuals/specific\nations\n2.1 Identify/access engineering\nmanuals / specification\n2.2 Interpret manual\n2.3 Apply information in manual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n• Direct\nobservation\n• Interview\n3. Move and\nposition vehicle\n3.1 Prepare vehicle for driving\n3.2 Move and position vehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n4. Apply\nappropriate\nsealant/\nadhesive\n4.1 Identify appropriate sealant/\nadhesive\n4.2 Prepare surface for sealant /\nadhesive application\n4.3 Store unused and dispose\nused sealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n• Project method\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and work\narea\n5.2 Store/arrange tools and shop\nequipment\n5.3 Dispose waste/used lubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\n--- PDF PAGE 46 ---\nTR Painting Machine Operation NC II Promulgated 42\n\nCORE COMPETENCIES\n(140Hours)\nUnits of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre-\ntreatment and\nCathodic\nElectro-\ndeposition\nprocess\noperation\n1.1 Prepare surface for operation of\npre-treatment and CEDP\n1.2 Pre-Treatment Operation\n1.3 CEDP Operation\n\n• Actual Training\n\n• Observation\n• Written\nexamination\n\n2. Perform Gray\nPrimer (2nd\nPrimer)\napplication\nprocedures\n2.1 Perform Under body coating\n(asphalt or PVC) to the ED body\nshell\n2.2 Apply Drip sealer and Floor\nSealer\n2.3 Install Floor Silencer\n2.4 Perform Gray Primer Application\n2.5 Bake Gray Primer Body Surface\n• Actual Training\n\n• Observation\n• Written\nexamination\n\n3. Perform Top\ncoat\napplication\nprocedures\n3.1 Perform wet sanding operation\nof the gray primer body surface\n3.2 Perform top coat application\n3.3 Baking top coated body surface\n3.4 Perform Top coat paint\n rectification\n• Actual Training\n\n• Observation\n• Written\nexamination\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modalities may be adopted when designing training\nprograms:\n\n--- PDF PAGE 47 ---\nTR Painting Machine Operation NC II Promulgated 43\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• physically and mentally fit; and\n• with good moral character\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees\nby the school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nPAINTING MACHINE OPERATION NC II\n\nRecommended list of tools, equipment and materials for the training of 15 trainees for\nPainting Machine Operation NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 units Wire brush\n2 units Oil free compressor\nboiler\n20 L.\nTSA Paint (Baking type)\n4 units Pneumatic Sanding\nPousher\n1 unit\nBoiler\n20 L.\nBase coat paint\n2 units Vibrator Sander\n2 units Air Handling\nequipment\n20 L.\nClear coat\n6 units Heavy duty spray\ngun\n3 units Vehicle (Bare\nmetal)\n20 L.\nPolyester gray primer\n5 units Spray gun with cup\n1 set\nPre-treatment\nequipment\n40 L.\nTSA paint reducer\n6 pcs.\nSanding rubber block\n3 units\nBaking oven\n40 L.\nBase coat reducer\n2 units Sealer gun\n1 set\nElectro Deposition\nProcess Equipment\n40 L.\nClear reducer\n\n--- PDF PAGE 48 ---\nTR Painting Machine Operation NC II Promulgated 44\n\n1 unit\nUndercoat spray gun\n3 units\nOven (baking)\n20 L.\nSolvent Naptha\n2 unit\nImpact gun\n1 unit\nInfra-red Dry-off\noven\n20 L.\nAcrylic Thinner (air dry)\n4 unit\nPaint pousher\n1 unit\nBody lifter\n20 L.\nSealer material\n2 unit\nFord cup #4\n5 units\nPressure tank\n1 drum\nUndercoat material\n15 pcs.\nRubber Glove\n10\nunits\nMixing tank\n1 sack Fine cleaner\n(Degreasing chemical)\n\n1 sack PALBOND(Phosphating\nchemical)\n3 L.\nPaint (for rectification)\n10 pcs.\nFender packing\n20 L.\nKerosene\n1 Gal.\nTAC rag varnish\n3 sets\nFloor silencer material\n2 L.\nPolishing compound\n\n30 pcs.\nSandpaper\n(assorted grit)\nGrit # 1200\nGrit # 600\nGrit # 400\nGrit # 360\nGrit # 280\nGrit # 180\n2 kls.\nWhite rag (de hilo)\n\n--- PDF PAGE 49 ---\nTR Painting Machine Operation NC II Promulgated 45\n\n3.5 TRAINING FACILITIES\nPAINTING MACHINE OPERATION NC II\n\nBased on a class size of 15 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working Space\n3.50 x 3.50 per\nstudent/trainee\n12.25 per\nstudent\n306.00\n• Lecture Room\n9.00 x 10.00\n90.00\n90.00\n•\nLearning Resource Center\n5.00 x 8.00\n40.00\n40.00\n• Facilities/ Equipment/\nCirculation Area\n-\n-\n291.75\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SECTOR\n MANUFACTURING SUB-SECTOR\n\nPAINTING MACHINE OPERATIONNC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of Painting Machine Operation NC II\n• Must have undergone training on Training Methodology II (TM II)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 50 ---\nTR Painting Machine Operation NC II Promulgated 46"
