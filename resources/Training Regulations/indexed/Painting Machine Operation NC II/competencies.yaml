          "source_text": "1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Performed wet sanding gray primer body shells\n1.2 Applied top coat\n1.3 Baked top coated body shells\n1.4 Rectified top coat defects\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Surface preparation procedures\n2.2 Paint types and their application procedures\n2.3 Standard operating procedure and standard quality\ncontrol of the company\n2.4 Equipment control and operating standard\n2.5 Painting defects and procedures in rectifying defects\n2.6 Plan and organize work activities\n2.5 Communicate and interpret operational information\n2.6 Safety standard\n2.7 Industrious and diligent worker\n\n3. Underpinning skill\n\n3.1 Operating the pneumatic sanding polisher\n3.2 Operating the baking oven, dry-off, and the automatic\noven conveyor\n3.3 Performing the spray patterns technique\n3.4 Maintaining and cleaning surface preparation and\npainting tools and equipment\n3.5 Designing counter measures to solve minor paint\ndefects\n\n4. Resource implications\n\nThe following resources must be provided:\n4.1 Adequate working area needed in the operation\n4.2 Tools and equipment (pneumatic sanding polisher,\nbaking oven, drying oven, spray booth with balanced\nair velocity, pressure tank, heavy duty spray gun, infra-\nred portable oven, etc.)\n4.3 Vehicle protection equipment\n4.4 Materials relevant to the activity (materials, solvent,\nTAC rag, varnish, and different grits of sand paper)\n4.5 Standard operation manuals\n4.7 Personal protective equipment\n\n5. Method of\nAssessment\n\n5.1 Actual observation with questioning\n5.2 Written examination\n\n6. Context of\nAssessment\n6.1 Competency must be assessed in the workplace or in\nsimulated work environment\n6.2 Competency assessment can be conducted while the\nactivity is being performed.\n\n--- PDF PAGE 44 ---\nTR Painting Machine Operation NC II Promulgated 40"
