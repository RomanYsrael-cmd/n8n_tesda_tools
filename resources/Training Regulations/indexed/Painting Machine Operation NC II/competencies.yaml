        "source_text": "ALT827318\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\napply top coating (final coating) to vehicle body shell.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Perform wet\nsanding of gray\nprimer body\nshell\n\n1.1 Gray primer body shell is inspected and defects to be\nrectified are labeled as per company standard operating\nprocedures.\n1.2 Vehicle is prepared for wet sanding as per company\nstandard operating procedures\n1.3 Wet sanding is performed using pneumatic polisher as per\ncompany standard operating procedures.\n1.4 Vehicle is rinsed and dried as per company standard\noperating procedures.\n\n2. Apply top coat\n\n2.1 Tools and equipment are prepared in accordance with job\nrequirements\n2.2 Gray body shell cleaned and prepared for top coat\napplication based on company standard operation\nprocedure\n2.3 Paint is selected and/or mixed based on job requirements\nand company standard operation procedure\n2.4 Top coat is applied based on the standard number of\ncoating and spray pattern technique provided by the\ncompany\n2.5 Applied top coat is checked for compliance with\nrequirements\n\n3. Bake the top\ncoated body\nshell\n\n3.1 Top coated body shell is baked to the required hardness\nand in accordance with company standard operating\nprocedures\n3.2 Top coated body shells are inspected to ensure that they\nmeet the required appearance and thickness as per quality\ncontrol standard\n\n4. Perform top coat\nrectification\nprocedures\n\n4.1 Painting defects are identified and marked to ensure the\ncorrect method of repair\n4.2 Painting defects are rectified and baked based on the\nrequired standard of the company\n4.3 Repainted surfaces are polished and cleaned to ensure that\nthey show no signs of defects and that they meet the quality\nstandard for paint rectification\n\n--- PDF PAGE 42 ---\nTR Painting Machine Operation NC II Promulgated 38\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Vehicle\n\n1.1 Passenger car\n1.2 Commercial vehicle and light trucks\n\n2. Tools and equipment\n\n2.1 Spray booth with balance air velocity (air handling\nunit)\n2.2 Baking oven and hot air blower\n2.3 Pressure tank with agitator and heavy duty spray\ngun\n2.4 Automatic conveyor\n2.5 Pneumatic polisher\n\n3. Defects and damages\n\n3.1 Solvent popping of paint\n3.2 Mottling and orange peel appearance\n3.3 Dirt, sag, and scratch\n3.4 Under/ over bake of paint\n3.5 Poor gloss and low paint thickness\n\n--- PDF PAGE 43 ---\nTR Painting Machine Operation NC II Promulgated 39\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Performed wet sanding gray primer body shells\n1.2 Applied top coat\n1.3 Baked top coated body shells\n1.4 Rectified top coat defects\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Surface preparation procedures\n2.2 Paint types and their application procedures\n2.3 Standard operating procedure and standard quality\ncontrol of the company\n2.4 Equipment control and operating standard\n2.5 Painting defects and procedures in rectifying defects\n2.6 Plan and organize work activities\n2.5 Communicate and interpret operational information\n2.6 Safety standard\n2.7 Industrious and diligent worker\n\n3. Underpinning skill\n\n3.1 Operating the pneumatic sanding polisher\n3.2 Operating the baking oven, dry-off, and the automatic\noven conveyor\n3.3 Performing the spray patterns technique\n3.4 Maintaining and cleaning surface preparation and\npainting tools and equipment\n3.5 Designing counter measures to solve minor paint\ndefects\n\n4. Resource implications\n\nThe following resources must be provided:\n4.1 Adequate working area needed in the operation\n4.2 Tools and equipment (pneumatic sanding polisher,\nbaking oven, drying oven, spray booth with balanced\nair velocity, pressure tank, heavy duty spray gun, infra-\nred portable oven, etc.)\n4.3 Vehicle protection equipment\n4.4 Materials relevant to the activity (materials, solvent,\nTAC rag, varnish, and different grits of sand paper)\n4.5 Standard operation manuals\n4.7 Personal protective equipment\n\n5. Method of\nAssessment\n\n5.1 Actual observation with questioning\n5.2 Written examination\n\n6. Context of\nAssessment\n6.1 Competency must be assessed in the workplace or in\nsimulated work environment\n6.2 Competency assessment can be conducted while the\nactivity is being performed.\n\n--- PDF PAGE 44 ---\nTR Painting Machine Operation NC II Promulgated 40"
