          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV)\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance with\ncompany OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge\n.1.1. OHS procedures and practices and regulations\n.1.2. PPE types and uses\n.1.3. Personal hygiene practices\n.1.4. Hazards/risks identification and control\n.1.5. Threshold limit value (TLV)\n.1.6. OHS indicators\n.1.7. Organization safety and health protocol\n.1.8. Safety consciousness\n.1.9.\nHealth consciousness\n3. Underpinning\nskills\n3.1\nPractice of personal hygiene\n.2.\nHazards/risks identification and control skills\n.3.\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 19 ---\nTR Painting Machine Operation NC II Promulgated 15\n\nCOMMON COMPETENCIES\n(AUTOMOTIVE MANUFACTURING – ASSEMBLY)\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n:"
