        "source_text": "ALT827316\n\nUNIT DESCRIPTOR : This unit identifies the knowledge, skills and attitudes required to\nperform pre-treatment and CEDP operation.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare body\nshell for pre-\ntreatment\noperation\n\n1.1 Tools and materials are selected based on the requirements of\nthe job.\n1.2 Body shell is prepared for pre-treatment operation in accordance\nwith company procedures\n1.3 Body shell is inspected to ensure that it’s 100% free from defect\nand damage.\n\n2. Perform pre-\ntreatment\noperation\n\n2.1 Degreasing operation is performed in accordance with company\nstandard operating procedures.\n2.2 Phosphating operation is performed in accordance company\nstandard operating procedure.\n2.3 Excess phosphate is rinsed off in accordance with company\nstandard operating procedure\n\n3. Perform\ncathodic\nelectro-\ndeposition\nprocess\n(CEDP)\n\n3.1 Cathodic electro-deposition process is performed in accordance\ncompany standard operating procedures\n3.2 Painted main body shell is oven-baked in accordance company\nstandard operating procedures.\n3.3 Paint coat is checked to ensure compliance with company paint\nappearance and thickness requirements\n\n--- PDF PAGE 35 ---\nTR Painting Machine Operation NC II Promulgated 31\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Tools\n\nTools and equipment for CEDP process include:\n1.1 Pre-treatment dipping process equipment\n1.2 Cathodic electro-deposition process equipment\n1.3 Boiler and pump\n1.4 Baking oven\n1.5 Measuring instruments\n\n2. Materials\n\n2.1 EDP paint\n2.2 Degreasing chemical\n2.3 Phosphating chemical\n2.4 D.I. water and raw water\n2.5 Metal conditioner\n2.6 Solvent naptha\n\n3. Body shell\n\nVehicle body shell model\n1.1 Passenger vehicle\n1.2 Commercial vehicle\n1.3 Light trucks\n\n4. Damage\n\n4.1 Metal scratches\n4.2 Dents and excess metal\n4.3 Rust formation\n4.4 Air pocket\n\n--- PDF PAGE 36 ---\nTR Painting Machine Operation NC II Promulgated 32\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared shell body surface for pre-treatment operation\n1.2 Performed degreasing and phosphate application\nprocedures\n1.3 Performed CEDP and met the standard paint coating\nappearance, paint thickness and hardness\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Standard procedure of surface preparation\n2.2 Standard operation procedure of pre-treatment\noperation\n2.3 Chemical and material preparation\n2.4 Basic mathematics\n2.5 Standard operation procedure of CEDP\n2.6 Basic Chemistry\n2.7 Measuring instruments\n2.8 Equipment control data relevant to the operation\n2.9 Safety procedures\n2.10 Preventive maintenance of all equipment related to the\noperation\n2.11 Plan and organize work activities\n2.12 Honest and diligent worker\n\n3. Underpinning skills\n\n3.1 Operating the pre-treatment equipment\n3.3 Operating baking oven equipment\n3.4 Operating the CEDP equipment\n3.5 Preparation of chemicals\n3.6 Checking of chemical concentration and DI water\nconductivity\n3.7 Interpreting equipment control relevant to the operation\n3.8 Using measuring instruments\n3.9 Cleaning and maintaining equipment relevant to the\noperation\n\n--- PDF PAGE 37 ---\nTR Painting Machine Operation NC II Promulgated 33\n\n4. Resources\nimplications\n\nThe following resources MUST be provided:\n\n4.1 Adequate working area to perform the tasks\n4.2 Pre-treatment equipment (hot water tank, degreasing\ntank, raw water and DI rinse tanks, surface\nconditioning tank, etc)\n4.3 Cathodic electro-deposition process equipment (paint\ntank, UF tank, etc.)\n4.4 Baking oven\n4.5 Materials relevant to the activity\n4.6 Measuring instruments\n4.7 Operating manuals and other relevant reference\n4.8 Personal protective equipment\n\n5. Method of\nassessment\n\nCompetency MUST be assessed or measured through:\n5.1 Written examination\n5.2 Actual observation with questioning\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed in the workplace or in\nsimulated work environment\n6.2 Competency assessment can be conducted while the\nactivity is being performed.\n\n--- PDF PAGE 38 ---\nTR Painting Machine Operation NC II Promulgated 34\n\nUNIT OF COMPETENCY: PERFORM GRAY PRIMER (2nd Primer) APPLICATION\nPROCEDURES\nUNIT CODE\n :"
