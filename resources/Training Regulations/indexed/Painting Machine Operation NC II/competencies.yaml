        "source_text": "ALT827317\n\nUNIT DESCRIPTON : This unit covers the knowledge, skills and attitudes required in the\napplication of gray primer to ED body shell.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Perform under-\nbody coating to\nthe ED body\nshell.\n1.1 Hand/air tools are selected based on the job requirement\n1.2 Underbody is prepared for undercoating in accordance with\ncompany standard operating procedures\n1.3 Undercoating is applied in accordance with company standard\noperating procedures\n1.4 Vehicle is cleaned after undercoating application in accordance\nwith company standard operating procedures.\n1.5 ED body shell is checked for damage and other paint defects in\naccordance with company standard operating procedures\n1.6 Corrective measures are undertaken to correct damage and other\npaint defects.\n\n2. Install floor\nsilencer\n2.1 Floor silencer is selected in accordance with company standard\noperating procedures\n2.2 Floor silencer is installed in accordance with company standard\noperating procedures\n\n3. Apply drip and\nfloor sealant\n\n3.1 Surface is prepared for sealant application in accordance with\ncompany standard operating procedures\n3.2 Sealant is applied based on the quality control guidelines and\nstandards\n3.3 Body shell is cleaned and excess sealants are removed in\naccordance with quality control guidelines and standards\n\n4. Apply gray\nprimer\n\n4.1 Shell body is inspected for excess sealants and other paint defects\nin accordance with company standard operating procedures\n4.2 Body shell is cleaned and prepared for gray primer application in\naccordance with company standard operating procedures.\n4.3 Gray primer is mixed in accordance with standard ratio of paint and\nsolvent\n4.4 Gray primer is applied based on quality control standards of coating\nand spray patterns\n4.5 Gray primer coat is checked for damage and/or paint defects and\ncorrective measures are undertaken in accordance with company\nstandard operating procedures\n\n5. Bake the painted\ngray body shell\n5.1 Baking oven equipment are checked and prepared in accordance\nwith standard operating procedures\n5.2 Body shell is baked as per company standard baking procedure\n5.3 Baking temperature and baking time are monitored to ensure that\nthe painted body surfaces are cured to the required hardness stated\nin the quality control standard\n5.4 Baked gray primer body surfaces are inspected to ensure that they\nmeet the required thickness and appearance as per quality control\nstandard\n5.5 Safety practices are Implemented in the workplace\n\n--- PDF PAGE 39 ---\nTR Painting Machine Operation NC II Promulgated 35\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Tools\n\nTools and equipment includes but not limited to:\n1.1 Sealer Gun\n 1.1.1. Floor Sealer Gun\n 1.1.2. Drip Sealer Gun\n1.2 Sealer pump and underbody coating pump\n1.3 High pressure spray gun and pressure tank\n1.4 Baking oven and hot air blower\n1.5 Spray booth with balance air velocity\n\n2. Undercoating\n\n2.1 Asphalt\n2.2 PVC\n\n3. Vehicle\n\n1.1 Passenger car\n1.2 Commercial vehicles and light trucks\n\n4. Gray primer application\nGray primer application must consider the following:\n4.1 Paint viscosity\n4.2 Paint Pressure\n4.3 Paint Injection Volume\n4.4 Spray Pattern is performed based on the standard\noperating procedure\n4.5 Number of coats is based on the company’s standards\n\n5. Damages and/or paint\ndefects\n\n5.1 Under baking/over baking of paint\n5.2 Scratches, dirt, and dents\n5.3 Orange peel appearance of Gray Primer\n5.4 Uneven paint thickness\n5.5 Poor application of floor and drip sealer\n5.6 Improper installation of floor silencer and other materials\nneeded in the operation\n\n--- PDF PAGE 40 ---\nTR Painting Machine Operation NC II Promulgated 36\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1 Performed under body coating to ED shell\n1.2 Installed floor silencer\n1.3 Applied drip and floor sealant\n1.4 Applied gray primer\n1.5Baked the painted gray body shell\n\n2. Underpinning\nknowledge and\nattitude\n2.1 Types and properties of sealants, undercoat and primer\n2.2 Procedures in the application of sealants, undercoat\nand primer\n2.3 Standard operating procedure of the company\n2.4 Equipment control standard\n2.5 Maintenance and cleaning procedure of equipment\nrelated to the operation\n2.6 Safety standard\n2.7 Communication and interpretation of operational\ninformation\n2.8 Honest and industrious worker\n2.9 Plan and organize work activities\n\n3. Underpinning skills\n3.1 Operating the floor sealer and drip sealer gun\n3.2 Operating body lifter and underbody spray gun\n3.3 Cleaning and maintaining tools equipment used in gray\nprimer application\n3.4 Operating baking oven\n3.5 Rectifying paint defects of ED Primer or 1st Primer\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Adequate working area needed in the operation\n4.2 Tools and equipment (sealer gun, high pressure spray\ngun, pressure tank, lifter, and pump, etc.)\n4.3 Vehicle protection equipment\n4.4 Baking oven and spray booth with balanced air velocity\n4.5 Paint and other materials relevant to the operation\n4.6 Standard operation manuals\n4.7 Personal protective equipment\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written and oral examination\n5.2 Actual observation with questioning\n\n6. Context of\nassessment\n6.1 Competency assessment is conducted while the\nactivities are being performed\n6.2 Assessment may be conducted at work or in simulated\nworkplace environment\n\n--- PDF PAGE 41 ---\nTR Painting Machine Operation NC II Promulgated 37\n\nUNIT OF COMPETENCY: PERFORM TOP COAT APPLICATION PROCEDURES\nUNIT CODE\n :"
