  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in PAINTING MACHINE OPERATION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous manner\n2.5\nQuestions about simple routine workplace procedures and\nmatters concerning working conditions of employment are\ntasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data are recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine calculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed according\nto organizational guidelines\n\n--- PDF PAGE 7 ---\nTR Painting Machine Operation NC II Promulgated 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nsources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace-to-face interactions\n5.2.\nTelephone conversation\n5.3.\nElectronic and two-way radio communication\n5.4.\nWritten communication including electronic mail, memos,\ninstruction and forms\n5.5.\nNon-verbal communication including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Painting Machine Operation NC II Promulgated 4\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization\n1.2.\nAccessed information using communication equipment\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s work\nresponsibilities\n3. Underpinning\nskills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written notices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nFour fundamental operations (addition, subtraction, division and\nmultiplication)\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1.\nDirect observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual workplace or\nthrough accredited institution\n\n--- PDF PAGE 9 ---\nTR Painting Machine Operation NC II Promulgated 5\n\nUNIT OF COMPETENCY : WORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe\nteam’s role\nand scope\n1.1.\nThe role and objective of the team is identified from available\nsources of information\n1.2.\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own\nrole and\nresponsibility\nwithin the\nteam\n2.1.\nIndividual role and responsibilities within the team environment\nare identified\n2.2.\nRoles and responsibility of other team members are identified\nand recognized\n2.3.\nReporting relationships within team and external to team are\nidentified\n3. Work as a\nteam\nmember\n3.1.\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2.\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3.\nObserved protocols in reporting using standard operating\nprocedures\n3.4.\nContribute to the development of team work plans based on an\nunderstanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Painting Machine Operation NC II Promulgated 6\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and\nobjective of\nteam\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgment maybe demonstrated\non the job, either individually or in a team environment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace\ncontext\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Painting Machine Operation NC II Promulgated 7\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nknowledge\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning\nskills\n3.1.\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the work\nactivities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Painting Machine Operation NC II Promulgated 8\n\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance evaluation\n1.3\nCommitment to the organization and its goal is demonstrated in\nthe performance of duties\n2. Set and meet\nwork priorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and availed\nof based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR Painting Machine Operation NC II Promulgated 9\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance appraisal\n1.2\nPsychological profile\n1.3\nAptitude tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings\nand career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing education\n3.2\nServing as resource persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and intangible rewards\n5. Licenses\nand/or\ncertifications\n5.1\nNational certificates\n5.2\nCertificate of competency\n5.3\nSupport level licenses\n5.4\nProfessional licenses\n\n--- PDF PAGE 14 ---\nTR Painting Machine Operation NC II Promulgated 10\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning\nskills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra- and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Painting Machine Operation NC II Promulgated 11\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nhazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate\nhazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold limit\nvalues (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with workplace\nrequirements and relevant workplace OHS legislation\n3. Control\nhazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently followed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol\n4. Maintain\nOHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in as\nper established organization guidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR Painting Machine Operation NC II Promulgated 12\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety\nregulations\nMay include but are not limited to:\n1.1\nClean air act\n1.2\nBuilding code\n1.3\nNational electrical and fire safety codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine occupational safety and health standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards /\nRisks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n--- PDF PAGE 17 ---\nTR Painting Machine Operation NC II Promulgated 13\n\n5. Emergency-\nrelated drills\nand training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/cardio pulmonary resuscitation (CPR)\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS\npersonal\nrecords\n6.1\nMedical/health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 18 ---\nTR Painting Machine Operation NC II Promulgated 14\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV)\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance with\ncompany OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge\n.1.1. OHS procedures and practices and regulations\n.1.2. PPE types and uses\n.1.3. Personal hygiene practices\n.1.4. Hazards/risks identification and control\n.1.5. Threshold limit value (TLV)\n.1.6. OHS indicators\n.1.7. Organization safety and health protocol\n.1.8. Safety consciousness\n.1.9.\nHealth consciousness\n3. Underpinning\nskills\n3.1\nPractice of personal hygiene\n.2.\nHazards/risks identification and control skills\n.3.\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 19 ---\nTR Painting Machine Operation NC II Promulgated 15\n\nCOMMON COMPETENCIES\n(AUTOMOTIVE MANUFACTURING – ASSEMBLY)\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n: ALT311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nmeasuring and calculating using tools and measuring\ninstrument. It also covers caring for and handling of\nmeasuring instrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select\nmeasuring\ninstruments\n1.1\nObject or component to be measured is identified\n1.2\nCorrect specifications are obtained from relevant source\n1.3\nAppropriate measuring instrument is selected according to\njob requirements\n2. Carry out\nmeasurements\nand calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four fundamental operation of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5\nNumerical computation is self-checked and corrected for\naccuracy\n2.6\nInstruments are read to the limit of accuracy of the tool.\n3. Maintain\nmeasuring\ninstruments\n\n3.1\nMeasuring instruments are kept free from corrosion\n3.2\nMeasuring instruments are not dropped to avoid damage\n3.3\nMeasuring instruments are cleaned before and after using.\n\n--- PDF PAGE 20 ---\nTR Painting Machine Operation NC II Promulgated 16\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight edge\n1.7\nThickness gauge\n1.8\nTorque gauge\n1.9\nSmall hole gauge\n1.10 Telescopic gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nIncludes calculation of the following:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 21 ---\nTR Painting Machine Operation NC II Promulgated 17\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected measuring instruments\n1.2. Carried-out measurements and calculations.\n1.3.\nMaintained measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes of measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.2\nFormula for volume, area, perimeter and other geometric figures\n3. Underpinning\n skills\n3.1\nCaring and handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4\nDemonstration with questioning\n6. Context of\nassessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be conducted in a workplace or simulated\nenvironment\n\n--- PDF PAGE 22 ---\nTR Painting Machine Operation NC II Promulgated 18\n\nUNIT OF COMPETENCY:\nREAD, INTERPRET AND APPLY ENGINEERING\nDRAWINGS\n\nUNIT CODE : ALT742201\n\nUNIT DESCRIPTOR :\nThis unit deals with identifying, interpreting and applying\nautomotive mechanical assembly engineering manuals /\nspecifications in accordance with requirements of the job.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\nmanuals /\nspecifications\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret\nmanuals\n\n2.1 Relevant sections, chapters of manuals/specifications are located\nin relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3. Apply\ninformation in\nmanual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 23 ---\nTR Painting Machine Operation NC II Promulgated 19\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Vehicle assembly manual\n1.3 Vehicle quality standard manual\n1.4 Vehicle specification manual\n\n--- PDF PAGE 24 ---\nTR Painting Machine Operation NC II Promulgated 20\n\n EVIDENCE GUIDE\n\n1.Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n12 Underpinning\nknowledge\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n13 Underpinning\nskills\n3.1. Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2.Accessing information and data\n14 Resource\nImplications\n\nThe following resources MUST be provided:\n4.1. All manuals/catalogues relative to Automotive\n4.2. Work order\n4.3. Actual vehicle or simulator\n15 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1. Observation with questioning\n5.2. Interview\n16 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 25 ---\nTR Painting Machine Operation NC II Promulgated 21\n\nUNIT OF COMPETENCY :\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n:\nALT723202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude needed\nto move and position vehicle in a workshop before and after\nservicing.\n ELEMENT\n PERFORMANCE CRITERIA\n Italicized terms are elaborated in the Range of Variables\n1. Prepare\nvehicle for\ndriving\n1.1\nCheck-up procedures is performed based on vehicle\nmanufacturer standard\n2. Move and\nposition\nvehicle\n2.1\nSelect vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3\nPark vehicle following parking safety techniques and\nprocedure\n3. Check the\nvehicle\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 26 ---\nTR Painting Machine Operation NC II Promulgated 22\n\n RANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Check-up procedure\nCheck-up procedures include the following:\n1.1\nOil level\n1.2\nBrake fluid\n1.3\nClutch fluid\n1.4\nCoolant level\n1.5\nBattery (electrolyte)\n1.6\nTire pressure\n1.7\nPosition of driving gear\n1.8\nLighting and warning devices\n2. Vehicles\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n3. Parking safety\ntechniques\n3.1 Engaging of park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 27 ---\nTR Painting Machine Operation NC II Promulgated 23\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared vehicle for driving.\n1.2\nMoved and positioned vehicle\n1.3\nChecked the vehicle.\n2. Underpinning\nknowledge\nand attitudes\n2.1 Driver’s code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n3. Underpinning\nskills\n3.1\nAbility to handle vehicle/maneuver vehicle the easiest way\n3.2\nImmediate response to accident\n3.3\nPreparing vehicle for driving\n3.4\nParking downhill, uphill, parallel\n3.5\nShifting gears\n3.6\nManeuvering\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1\nDriving range/area\n4.2\nAppropriate vehicle for driving\n4.3\nVehicle accessories\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten or oral examination\n6. Context of\nassessment\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment of practical skills must be done in a workplace or\nsimulated environment.\n\n--- PDF PAGE 28 ---\nTR Painting Machine Operation NC II Promulgated 24\n\nUNIT OF COMPETENCY :\nAPPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE :\nALT723201\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the selection and\napplication of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nappropriate\nsealant /\nadhesive\n1.1 Sealant/adhesive is selected in line with job\n requirements and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure that\nproduct is fit for use.\n2. Prepare\nsurface for\nsealant /\nadhesive\napplication\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nSealant /\nadhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n\n3.3 Tools and equipment used to apply sealant/adhesive are\nappropriate to job requirements\n3.6 Safety are observed and PPE are worn in accordance with\nindustry SOP\n3.7 Hazards associated with the use of sealant and adhesives are\nidentified.\n4. Store /\nDispose of\nsealant /\nadhesive\n4.1 Sealant/adhesive are stored as per prescribed procedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 29 ---\nTR Painting Machine Operation NC II Promulgated 25\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2.Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n2.1 Expiry date\n2.2 Free of contamination\n2.3 Cap/Covers\n2.4 Tightly closed\n2.5 Concentration\n3. Tools and\nequipment\nTools and equipment include:\n3.1 Putty knife\n3.2 Scraper\n3.3 Compressor\n3.4 Steel brush\n3.5 Paint brush\n3.6 Rubber hammer\n3.7 Hand tools\nPersonal protective equipment include:\n3.8 Gloves\n3.9 Apron\n3.10 Safety shoes\n3.11Goggles\n3.12Gas mask\n4. Safety\nSafety includes:\n4.1 Ventilation\n4.2 Handling of Flammable/Irritating substances\n4.3 Use of Personal Protective Equipment\n5. Hazards\n Hazard includes:\n5.1 Fumes\n5.2 Skin irritation\n5.3 Burns\n\n--- PDF PAGE 30 ---\nTR Painting Machine Operation NC II Promulgated 26\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Underpinning\nknowledge\nand attitude\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.3 Procedures in sealant/adhesive application\n2.4 Procedures in interpreting manuals\n3. Underpinning\nskills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3. Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\nassessment\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 31 ---\nTR Painting Machine Operation NC II Promulgated 27\n\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE : ALT723205\n\nUNIT DESCRIPTOR : This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/equipment and disposal of used\nmaterials are also incorporated in this competency\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop\nequipment\n\n1.5 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n3. Dispose\nwastes/used\nlubricants\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 32 ---\nTR Painting Machine Operation NC II Promulgated 28\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning\n requirement\n1.1 Cleaning solvent\n1.2 Inventory of supplies, tools, equipment, facilities\n1.3 List of mechanics/technicians\n1.4 Rags\n1.5 Broom\n1.6 Map\n1.7 Pail\n1.8 Used oil container\n1.9 Oiler\n1.10 Dust/waste bin\n2. Work Area\nWork areas include:\n2.1 Workshop areas for assembly of automotive vehicle and/or\noutdoor power equipment\n2.2 Open workshop and enclosed, ventilated office area\n2.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n\n--- PDF PAGE 33 ---\nTR Painting Machine Operation NC II Promulgated 29\n\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge\nand attitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical skills\n may be combined.\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 34 ---\nTR Painting Machine Operation NC II Promulgated 30\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: PERFORM PRE-TREATMENT AND CATHODIC ELECTRO-\nDEPOSITION PROCESS (CEDP) OPERATION\nUNIT CODE\n : ALT827316\n\nUNIT DESCRIPTOR : This unit identifies the knowledge, skills and attitudes required to\nperform pre-treatment and CEDP operation.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare body\nshell for pre-\ntreatment\noperation\n\n1.1 Tools and materials are selected based on the requirements of\nthe job.\n1.2 Body shell is prepared for pre-treatment operation in accordance\nwith company procedures\n1.3 Body shell is inspected to ensure that it’s 100% free from defect\nand damage.\n\n2. Perform pre-\ntreatment\noperation\n\n2.1 Degreasing operation is performed in accordance with company\nstandard operating procedures.\n2.2 Phosphating operation is performed in accordance company\nstandard operating procedure.\n2.3 Excess phosphate is rinsed off in accordance with company\nstandard operating procedure\n\n3. Perform\ncathodic\nelectro-\ndeposition\nprocess\n(CEDP)\n\n3.1 Cathodic electro-deposition process is performed in accordance\ncompany standard operating procedures\n3.2 Painted main body shell is oven-baked in accordance company\nstandard operating procedures.\n3.3 Paint coat is checked to ensure compliance with company paint\nappearance and thickness requirements\n\n--- PDF PAGE 35 ---\nTR Painting Machine Operation NC II Promulgated 31\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Tools\n\nTools and equipment for CEDP process include:\n1.1 Pre-treatment dipping process equipment\n1.2 Cathodic electro-deposition process equipment\n1.3 Boiler and pump\n1.4 Baking oven\n1.5 Measuring instruments\n\n2. Materials\n\n2.1 EDP paint\n2.2 Degreasing chemical\n2.3 Phosphating chemical\n2.4 D.I. water and raw water\n2.5 Metal conditioner\n2.6 Solvent naptha\n\n3. Body shell\n\nVehicle body shell model\n1.1 Passenger vehicle\n1.2 Commercial vehicle\n1.3 Light trucks\n\n4. Damage\n\n4.1 Metal scratches\n4.2 Dents and excess metal\n4.3 Rust formation\n4.4 Air pocket\n\n--- PDF PAGE 36 ---\nTR Painting Machine Operation NC II Promulgated 32\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared shell body surface for pre-treatment operation\n1.2 Performed degreasing and phosphate application\nprocedures\n1.3 Performed CEDP and met the standard paint coating\nappearance, paint thickness and hardness\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Standard procedure of surface preparation\n2.2 Standard operation procedure of pre-treatment\noperation\n2.3 Chemical and material preparation\n2.4 Basic mathematics\n2.5 Standard operation procedure of CEDP\n2.6 Basic Chemistry\n2.7 Measuring instruments\n2.8 Equipment control data relevant to the operation\n2.9 Safety procedures\n2.10 Preventive maintenance of all equipment related to the\noperation\n2.11 Plan and organize work activities\n2.12 Honest and diligent worker\n\n3. Underpinning skills\n\n3.1 Operating the pre-treatment equipment\n3.3 Operating baking oven equipment\n3.4 Operating the CEDP equipment\n3.5 Preparation of chemicals\n3.6 Checking of chemical concentration and DI water\nconductivity\n3.7 Interpreting equipment control relevant to the operation\n3.8 Using measuring instruments\n3.9 Cleaning and maintaining equipment relevant to the\noperation\n\n--- PDF PAGE 37 ---\nTR Painting Machine Operation NC II Promulgated 33\n\n4. Resources\nimplications\n\nThe following resources MUST be provided:\n\n4.1 Adequate working area to perform the tasks\n4.2 Pre-treatment equipment (hot water tank, degreasing\ntank, raw water and DI rinse tanks, surface\nconditioning tank, etc)\n4.3 Cathodic electro-deposition process equipment (paint\ntank, UF tank, etc.)\n4.4 Baking oven\n4.5 Materials relevant to the activity\n4.6 Measuring instruments\n4.7 Operating manuals and other relevant reference\n4.8 Personal protective equipment\n\n5. Method of\nassessment\n\nCompetency MUST be assessed or measured through:\n5.1 Written examination\n5.2 Actual observation with questioning\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed in the workplace or in\nsimulated work environment\n6.2 Competency assessment can be conducted while the\nactivity is being performed.\n\n--- PDF PAGE 38 ---\nTR Painting Machine Operation NC II Promulgated 34\n\nUNIT OF COMPETENCY: PERFORM GRAY PRIMER (2nd Primer) APPLICATION\nPROCEDURES\nUNIT CODE\n : ALT827317\n\nUNIT DESCRIPTON : This unit covers the knowledge, skills and attitudes required in the\napplication of gray primer to ED body shell.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Perform under-\nbody coating to\nthe ED body\nshell.\n1.1 Hand/air tools are selected based on the job requirement\n1.2 Underbody is prepared for undercoating in accordance with\ncompany standard operating procedures\n1.3 Undercoating is applied in accordance with company standard\noperating procedures\n1.4 Vehicle is cleaned after undercoating application in accordance\nwith company standard operating procedures.\n1.5 ED body shell is checked for damage and other paint defects in\naccordance with company standard operating procedures\n1.6 Corrective measures are undertaken to correct damage and other\npaint defects.\n\n2. Install floor\nsilencer\n2.1 Floor silencer is selected in accordance with company standard\noperating procedures\n2.2 Floor silencer is installed in accordance with company standard\noperating procedures\n\n3. Apply drip and\nfloor sealant\n\n3.1 Surface is prepared for sealant application in accordance with\ncompany standard operating procedures\n3.2 Sealant is applied based on the quality control guidelines and\nstandards\n3.3 Body shell is cleaned and excess sealants are removed in\naccordance with quality control guidelines and standards\n\n4. Apply gray\nprimer\n\n4.1 Shell body is inspected for excess sealants and other paint defects\nin accordance with company standard operating procedures\n4.2 Body shell is cleaned and prepared for gray primer application in\naccordance with company standard operating procedures.\n4.3 Gray primer is mixed in accordance with standard ratio of paint and\nsolvent\n4.4 Gray primer is applied based on quality control standards of coating\nand spray patterns\n4.5 Gray primer coat is checked for damage and/or paint defects and\ncorrective measures are undertaken in accordance with company\nstandard operating procedures\n\n5. Bake the painted\ngray body shell\n5.1 Baking oven equipment are checked and prepared in accordance\nwith standard operating procedures\n5.2 Body shell is baked as per company standard baking procedure\n5.3 Baking temperature and baking time are monitored to ensure that\nthe painted body surfaces are cured to the required hardness stated\nin the quality control standard\n5.4 Baked gray primer body surfaces are inspected to ensure that they\nmeet the required thickness and appearance as per quality control\nstandard\n5.5 Safety practices are Implemented in the workplace\n\n--- PDF PAGE 39 ---\nTR Painting Machine Operation NC II Promulgated 35\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Tools\n\nTools and equipment includes but not limited to:\n1.1 Sealer Gun\n 1.1.1. Floor Sealer Gun\n 1.1.2. Drip Sealer Gun\n1.2 Sealer pump and underbody coating pump\n1.3 High pressure spray gun and pressure tank\n1.4 Baking oven and hot air blower\n1.5 Spray booth with balance air velocity\n\n2. Undercoating\n\n2.1 Asphalt\n2.2 PVC\n\n3. Vehicle\n\n1.1 Passenger car\n1.2 Commercial vehicles and light trucks\n\n4. Gray primer application\nGray primer application must consider the following:\n4.1 Paint viscosity\n4.2 Paint Pressure\n4.3 Paint Injection Volume\n4.4 Spray Pattern is performed based on the standard\noperating procedure\n4.5 Number of coats is based on the company’s standards\n\n5. Damages and/or paint\ndefects\n\n5.1 Under baking/over baking of paint\n5.2 Scratches, dirt, and dents\n5.3 Orange peel appearance of Gray Primer\n5.4 Uneven paint thickness\n5.5 Poor application of floor and drip sealer\n5.6 Improper installation of floor silencer and other materials\nneeded in the operation\n\n--- PDF PAGE 40 ---\nTR Painting Machine Operation NC II Promulgated 36\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1 Performed under body coating to ED shell\n1.2 Installed floor silencer\n1.3 Applied drip and floor sealant\n1.4 Applied gray primer\n1.5Baked the painted gray body shell\n\n2. Underpinning\nknowledge and\nattitude\n2.1 Types and properties of sealants, undercoat and primer\n2.2 Procedures in the application of sealants, undercoat\nand primer\n2.3 Standard operating procedure of the company\n2.4 Equipment control standard\n2.5 Maintenance and cleaning procedure of equipment\nrelated to the operation\n2.6 Safety standard\n2.7 Communication and interpretation of operational\ninformation\n2.8 Honest and industrious worker\n2.9 Plan and organize work activities\n\n3. Underpinning skills\n3.1 Operating the floor sealer and drip sealer gun\n3.2 Operating body lifter and underbody spray gun\n3.3 Cleaning and maintaining tools equipment used in gray\nprimer application\n3.4 Operating baking oven\n3.5 Rectifying paint defects of ED Primer or 1st Primer\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Adequate working area needed in the operation\n4.2 Tools and equipment (sealer gun, high pressure spray\ngun, pressure tank, lifter, and pump, etc.)\n4.3 Vehicle protection equipment\n4.4 Baking oven and spray booth with balanced air velocity\n4.5 Paint and other materials relevant to the operation\n4.6 Standard operation manuals\n4.7 Personal protective equipment\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written and oral examination\n5.2 Actual observation with questioning\n\n6. Context of\nassessment\n6.1 Competency assessment is conducted while the\nactivities are being performed\n6.2 Assessment may be conducted at work or in simulated\nworkplace environment\n\n--- PDF PAGE 41 ---\nTR Painting Machine Operation NC II Promulgated 37\n\nUNIT OF COMPETENCY: PERFORM TOP COAT APPLICATION PROCEDURES\nUNIT CODE\n : ALT827318\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\napply top coating (final coating) to vehicle body shell.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Perform wet\nsanding of gray\nprimer body\nshell\n\n1.1 Gray primer body shell is inspected and defects to be\nrectified are labeled as per company standard operating\nprocedures.\n1.2 Vehicle is prepared for wet sanding as per company\nstandard operating procedures\n1.3 Wet sanding is performed using pneumatic polisher as per\ncompany standard operating procedures.\n1.4 Vehicle is rinsed and dried as per company standard\noperating procedures.\n\n2. Apply top coat\n\n2.1 Tools and equipment are prepared in accordance with job\nrequirements\n2.2 Gray body shell cleaned and prepared for top coat\napplication based on company standard operation\nprocedure\n2.3 Paint is selected and/or mixed based on job requirements\nand company standard operation procedure\n2.4 Top coat is applied based on the standard number of\ncoating and spray pattern technique provided by the\ncompany\n2.5 Applied top coat is checked for compliance with\nrequirements\n\n3. Bake the top\ncoated body\nshell\n\n3.1 Top coated body shell is baked to the required hardness\nand in accordance with company standard operating\nprocedures\n3.2 Top coated body shells are inspected to ensure that they\nmeet the required appearance and thickness as per quality\ncontrol standard\n\n4. Perform top coat\nrectification\nprocedures\n\n4.1 Painting defects are identified and marked to ensure the\ncorrect method of repair\n4.2 Painting defects are rectified and baked based on the\nrequired standard of the company\n4.3 Repainted surfaces are polished and cleaned to ensure that\nthey show no signs of defects and that they meet the quality\nstandard for paint rectification\n\n--- PDF PAGE 42 ---\nTR Painting Machine Operation NC II Promulgated 38\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Vehicle\n\n1.1 Passenger car\n1.2 Commercial vehicle and light trucks\n\n2. Tools and equipment\n\n2.1 Spray booth with balance air velocity (air handling\nunit)\n2.2 Baking oven and hot air blower\n2.3 Pressure tank with agitator and heavy duty spray\ngun\n2.4 Automatic conveyor\n2.5 Pneumatic polisher\n\n3. Defects and damages\n\n3.1 Solvent popping of paint\n3.2 Mottling and orange peel appearance\n3.3 Dirt, sag, and scratch\n3.4 Under/ over bake of paint\n3.5 Poor gloss and low paint thickness\n\n--- PDF PAGE 43 ---\nTR Painting Machine Operation NC II Promulgated 39\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Performed wet sanding gray primer body shells\n1.2 Applied top coat\n1.3 Baked top coated body shells\n1.4 Rectified top coat defects\n\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Surface preparation procedures\n2.2 Paint types and their application procedures\n2.3 Standard operating procedure and standard quality\ncontrol of the company\n2.4 Equipment control and operating standard\n2.5 Painting defects and procedures in rectifying defects\n2.6 Plan and organize work activities\n2.5 Communicate and interpret operational information\n2.6 Safety standard\n2.7 Industrious and diligent worker\n\n3. Underpinning skill\n\n3.1 Operating the pneumatic sanding polisher\n3.2 Operating the baking oven, dry-off, and the automatic\noven conveyor\n3.3 Performing the spray patterns technique\n3.4 Maintaining and cleaning surface preparation and\npainting tools and equipment\n3.5 Designing counter measures to solve minor paint\ndefects\n\n4. Resource implications\n\nThe following resources must be provided:\n4.1 Adequate working area needed in the operation\n4.2 Tools and equipment (pneumatic sanding polisher,\nbaking oven, drying oven, spray booth with balanced\nair velocity, pressure tank, heavy duty spray gun, infra-\nred portable oven, etc.)\n4.3 Vehicle protection equipment\n4.4 Materials relevant to the activity (materials, solvent,\nTAC rag, varnish, and different grits of sand paper)\n4.5 Standard operation manuals\n4.7 Personal protective equipment\n\n5. Method of\nAssessment\n\n5.1 Actual observation with questioning\n5.2 Written examination\n\n6. Context of\nAssessment\n6.1 Competency must be assessed in the workplace or in\nsimulated work environment\n6.2 Competency assessment can be conducted while the\nactivity is being performed.\n\n--- PDF PAGE 44 ---\nTR Painting Machine Operation NC II Promulgated 40"
