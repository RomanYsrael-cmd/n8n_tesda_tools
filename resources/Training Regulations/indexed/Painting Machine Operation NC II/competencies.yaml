        "evidence_guide": {
          "source_text": "1. Critical \naspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nPrepared written communication following standard format  of \nthe organization \n1.2. \nAccessed information using communication equipment \n1.3. \nMade use of relevant terms as an aid to transfer information \neffectively \n1.4. \nConveyed information effectively adopting the formal or \ninformal communication\n2. Underpinning \nknowledge  \n \n2.1. \nEffective communication \n2.2. \nDifferent modes of communication  \n2.3. \nWritten communication \n2.4. \nOrganizational policies \n2.5. \nCommunication procedures and systems \n2.6. \nTechnology relevant to the enterprise and the individual’s work \nresponsibilities\n3. Underpinning \nskills \n3.1. \nFollow simple spoken language \n3.2. \nPerform routine workplace duties following simple written notices \n3.3. \nParticipate in workplace meetings and discussions \n3.4. \nComplete work related documents \n3.5. \nEstimate, calculate and record routine workplace measures \n3.6. \nFour fundamental operations (addition, subtraction, division and \nmultiplication) \n3.7. \nAbility to relate to people of social range in the workplace \n3.8. \nGather and provide information in response to workplace \nRequirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. \nFax machine \n4.2. \nTelephone \n4.3. \nWriting materials \n4.4.\nInternet \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. \nDirect observation \n5.2.\nOral interview and written test\n6. Context of \nassessment \n6.1. \nCompetency may be assessed individually in the actual workplace or \nthrough accredited institution",
