  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.To attain the National Qualification of PAINTING MACHINE OPERATION NC II, the\ncandidate must demonstrate competence in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 The qualification of Painting Machine Operation NC II may be attained through:\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the following\nareas:\n\n4.2.1.1 Perform pre-treatment and Cathodic electro-deposition process\nprocedures\n4.2.1.2 Perform gray primer (2nd primer) application procedures\n4.2.1.3 Perform top coat application procedures\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n1.1.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n1.1.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 51 ---\nTR Painting Machine Operation NC II Promulgated 47\n\nPAINTING MACHINE OPERATION NC II\nLegend:\nPerform pre-treatment and\nCathodic Electro-deposition\nprocess procedures\nANNEX A\nPerform welding and\nbrazing application\nPerform tinsmith\noperation\nPerform Gray Primer\n(2nd Primer) application\nprocedures\nPerform Top coat\napplication procedures\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB SECTOR\n(ASSEMBLY)\n\nPAINTING MACHINE OPERATION NC II\n\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nPerform Mensuration\nand Calculation\nRead, Interpret and Apply\nEngineering Drawings\nMove and Position\nVehicle\nApply Appropriate\nSealant/Adhesives\nInstall/Fit out Electrical\nParts to Engine\nAssembly\nAssemble Mechanical\nAssemblies Using Jigs/\nFixtures\nMount/ Install Brake\nFuel System\nMount/ Install\nSuspension Drive\nSystem\nMount/ Install Power\nDrive System\nInstall/Fit Trim\nParts/Components\nPerform Final Engine\nRun\nPerform Wheel\nAlignment Operation\nPerform Shop\nMaintenance\nInstall/Fit out Electronic\nUnits to Body Interior\nComponents\nInstall/Fit out Electrical\nParts & Electronic Units to\nDash Board Instrument\nPanel\nInstall/Fit out Electrical\nParts to Exterior and\nEngine Compartment\nInstall/Fit out Audio and\nVideo Systems\nPerform Headlight\nFocus Aiming Operation\n\n--- PDF PAGE 52 ---\nTR Painting Machine Operation NC II Promulgated - 48 -\n\nDEFINITION OF TERMS\n\n1. Air velocity\nAir velocity is the speed of air inside the painting spray booth.\n\n2. Asphalt undercoat Asphalt undercoat is the use of seal consisting of a coating of a tar or\nrubber like material on the underbody of a motor vehicle to retard\ncorrosion.\n\n3. Baking oven\nThe baking oven is the equipment used to dry paint in order to attain the\nstandard paint hardness.\n4. Cathodic electro-\ndeposition\nprocess\nThe CEDP or Cathodic Electro-Deposition Process is the process of\nimmersing the unit into the ED tank of paint to highly prevent corrosion. It\nis also done to attain the superior paint coating up to the hidden/innermost\nportions of the unit.\n\n5. De-ionized water\nDe-ionized water is water that lacks ions, such as cations from sodium,\ncalcium, iron, copper and anions such as chloride and bromide. This\nmeans it has been purified from all other ions except H3O+ and OH−, but it\nmay still contain other non-ionic types of impurities such as organic\ncompounds. This type of water is produced using an ion exchange\nprocess. De-ionized water is similar to distilled water, in that it is useful for\nscientific experiments where the presence of impurities may be\nundesirable.\n6. Degreasing\nDegreasing is the process of removing grease or oil and other foreign\nmatter on the body surface.\n\n7. Filter cloth\nA filter cloth is the material used to eliminate foreign matter such as dirt\non the paint material.\n8. Floor silencer\nThe floor silencer is a material used to reduce sound, noise, and\nunderbody vibration of the unit.\n\n9. Ford cup # 4\nThe Ford Cup # 4 is an instrument used to measure the paint viscosity.\n\n10. Lacquer thinner\nLacquer thinner is used to dilute, dissolve and clean up lacquer products.\nTypically too caustic for oil paints, lacquer thinner is often used for\nremoving inks on metal, and adhesive residue from a variety of surfaces.\nLacquer thinner is very strong and rapidly deteriorates many surfaces and\nfabrics. Always test in a small inconspicuous area before applying too\nliberally on a large surface.\n11. Naptha solvent\nNaptha Solvent is Any of several highly volatile, flammable liquid\nmixtures of hydrocarbons distilled from petroleum, coal tar, and natural\ngas and used as fuel, as solvents, and in making various chemicals.\n12. Painting\nPainting is the process, art, or occupation of coating surfaces with paint for\na utilitarian or artistic effect.\n\n--- PDF PAGE 53 ---\nTR Painting Machine Operation NC II Promulgated - 49 -\n\n13. Paint reducer\nPaint reducer is used in paint mixing to attain the required viscosity.\n\n14. Paint viscosity\nPaint Viscosity is the condition or property of paint to be viscous; the\nresistance of paint to shear forces (and hence to flow).\n15. Phosphate\napplication\nPhosphate application is done to make phosphate serve as the base for\ncoating and make it an integral part of metal. It also provides adhesion\nand coating flexibility. It also increases the resistance to corrosion.\n\n16. Pnematic polisher\nA pneumatic polisher is an instrument activated by air pressure. It is the\nhand tool used in wet sanding operation of the gray primer.\n\n17. Polishing\ncompound\nThe polishing compound is the material used to smoothen the paint\napplied to increase the glossy appearance of the top coat paint.\n18. Pressure tank\nA pressure tank is a closed cylindrical steel container designed to store\nwater under pressure. It is an equipment supplied with air pressure that is\ndesigned to contain paint used in painting application.\n19. Primer paint\nPrimer Paint is the first or preliminary coat of paint or size applied to a\nsurface.\n20. Sealer\nA sealer seals, as an undercoat of paint or varnish used to size a surface.\nIt is also a kind of sealing material that is used to form a hard coating on a\nporous surface (as a coat of paint or varnish used to size a surface).\n21. Spray booth\nSpray Booth means a power-ventilated structure that encloses or\naccommodates a spraying operation so that spray vapour and residue can\nbe controlled and exhausted.\n22. Spray gun\nThe spray gun is a an applicator resembling a gun for applying liquid\nsubstances (as paint) in the form of a spray\n23. Thermocouple\nA thermocouple is a thermoelectric device used to measure\ntemperatures accurately, especially one consisting of two dissimilar metals\njoined so that a potential difference generated between the points of\ncontact is a measure of the temperature difference\nbetween the points.\n24. Wet sanding\nWet sanding is a painting process wherein the gray primer is sanded with\na pneumatic polisher and water.\n\n--- PDF PAGE 54 ---\nTR Painting Machine Operation NC II Promulgated - 50 -\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nPainting Machine Operation\nNMPI / CATC/PAFI\nAntonio A. Gimenez\nExecutive Director -\nCATC/PAFI\n\nEdgardo P. Zaragoza-\nPaint Shop Manager- NMPI\n(CATC/PAFI)\nRene Torres\n(Labor Representative)\nNissan Motors Philippines\nWorkers Union-AIWA\nNissan TechnoPark Bo.\nPulong, Sta. Cruz Laguna\nMr. Valentino de Leon\nVP- Plant Adminstration-\nNMPI\nRodolfo T. Nunez-\nPlant Manager-Nissan\nMotors Phils. Inc.(NMPI)\nCATC/PAFI\n\nCarina J. Bondad-\nAdministrative Support Staff,\n(CATC/PAFI)\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\nROBERTS RADIATOR\nPILIPINAS HINO INC.\nNISSAN MOTOR PHILIPPINES\nINC.\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
}
