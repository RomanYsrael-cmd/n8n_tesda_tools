  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.To attain the National Qualification of PAINTING MACHINE OPERATION NC II, the\ncandidate must demonstrate competence in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 The qualification of Painting Machine Operation NC II may be attained through:\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the following\nareas:\n\n4.2.1.1 Perform pre-treatment and Cathodic electro-deposition process\nprocedures\n4.2.1.2 Perform gray primer (2nd primer) application procedures\n4.2.1.3 Perform top coat application procedures\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n1.1.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n1.1.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 51 ---\nTR Painting Machine Operation NC II Promulgated 47\n\nPAINTING MACHINE OPERATION NC II\nLegend:\nPerform pre-treatment and\nCathodic Electro-deposition\nprocess procedures\n"
