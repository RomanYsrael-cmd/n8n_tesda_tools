ntion of disease through  Animal \nHealth program \n5.2. Provisions of foot dips and tire baths \n5.3. Prevention of disease transmission through \ngood animal husbandry practices\n6. Farm wastes \n6.1. Animal manure \n6.2. Feed refuse or food leftovers \n6.3. Spoiled feeds (Forage and feed \nsupplements) \n6.4. Empty veterinary bottles, syringes, needles \nand sharp objects \n6.5. Disposable gloves and masks \n6.6. Expired biologics \n6.7. Spoiled milk \n6.8. Spent bedding materials \n6.9. Empty sacks  \n6.10. Dead animals \n6.11. Placenta\n\n--- PDF PAGE 37 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n35"
