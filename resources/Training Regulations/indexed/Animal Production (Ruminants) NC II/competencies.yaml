        "source_title": "PERFORM BREEDING OF RUMINANTS",
        "source_text": "--- PDF PAGE 48 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n46\n \nUNIT OF COMPETENCY \n: PERFORM BREEDING OF RUMINANTS \nUNIT CODE \n: AFF621903 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to perform breeding of ruminants. It comprises \nof preparing animal stocks, breeding of ruminants, \ncarrying-out monitoring activities, feeding the animals, \napplying  basic health care and performing post-\nbreeding activities. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare animal stocks \n \n1.1. Breeds of animals suitable for meat, dairy and \nmixed-type/dual purpose  are obtained based on \nbreed standards and adoptability on the farm \nenvironment following instructions from  authority. \n1.2. Animals are placed in suitable house and facilities \nfollowing Good Animal Husbandry Practices (GAHP) \nand Animal Welfare Act. \n1.3. Animals are well fed and maintained regularly \nfollowing Animal Welfare Act. \n2. Breed ruminants \n2.1. Prepare tools, materials and equipment for \nbreeding operations following breeding schedule and \nrequirements. \n2.2. Breeding program for ruminants is followed \naccording to the  business objective \n2.3. Reproductive phenomena of ruminants are \nobserved, recorded and reported following enterprise \nprotocols.   \n2.4. Ruminants are bred naturally according to designed \nmating plan. \n2.5. Where necessary, small ruminants are inseminated \nartificially according to instructions of supervisor. \n2.6. Tasks are performed following Animal Welfare Acts. \n2.7. Safety measures are practice according to OSHS \nprocedures.\n3. Carry-out monitoring \nactivities   \n3.1. Breeding performance of ruminants are observed \nrecorded and reported following enterprise protocols. \n3.2. Unproductive animals are treated and disposed \naccording to the set standard \n3.3. Breeding and reproduction data are regularly \ngathered and kept for evaluation according to \nenterprise protocols. \n4. Feed animals \n4.1. Basal rations for ruminants at various physiological \nstage are provided based on industry standard. \n4.2. Feed supplements like concentrates, minerals and\n\n--- PDF PAGE 49 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n47\nvitamins are offered according to animal dietary \nrequirements \n4.3. Grazing management for ruminants are identified \nand practiced \n4.4. Grazing capacity of the pasture is determined based \non pasture land condition. \n5. Apply basic health care \n \n5.1. Sick animals are reported to appropriate authority. \n5.2. Assistance is provided during implementation of \nmedication n program in accordance with enterprise \nstandards and instructions of authority. \n5.3. Safety practices are observed according to OSHS.  \n6. Perform post-breeding \nactivities \n6.1. Tools, materials and equipment are cleaned and \nstored following procedural manual and 5S \nprinciples. \n6.2. Proper disposal of wastes are practiced according to \nDENR regulations. \n6.3. Records are updated and kept following enterprise \nprotocol. \n6.4. Work outputs  are reported to the authority following \nenterprise protocol.\n\n--- PDF PAGE 50 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n48\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Breeds of animals \n1.1 Large Ruminants \n1.1.1. Cattle \nBeef \nDairy \nNative Strain \nBrahman \nHindu-Brazil \nSimbrah \nCrosses  \n \nHolstein Friesian \nJersey \nSahiwal \nRed Sindhi \nCrosses \n \n \n1.1.2. Buffaloes \nBeef \nDairy \nNative Carabaos \nAmerican Murrah \nCambodain \nbuffalo \nThai buffaloes  \nCrosses \n \nIndian Murrah \nBulgarian Murrah \nNili Ravi  \nBrazilian buffalo \nCrosses \n \n \n1.2 \nDraft animals \n1.2.1. Native carabaos and cattles \n1.2.2. Cross breeds \n \n1.3 \nSmall Ruminants \n1.3.1. Goat \nMeat-type  \nDairy type  \nMixed type \nBoer \nKiko \nKalahari \nAnglo-Nubian \nAnglo-Nubian \nSaanen \nToggenburg \nAlpine \nOberhasli \n \nAnglo Nubian \n \n1.3.2. Sheep \nMeat-type  \nDorper \n(blackhead and \nwhitehead) \nKatahdin   \nMerino \nSt. Croix \nBlack belly \nDamara \nDorset\n\n--- PDF PAGE 51 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n49\n2. Tools, materials and \nequipment \n2.1. AI kit \n2.2. Frozen semen  \n2.3. Breeder  \n3. Breeding program \n3.1. Pure-breeding \n3.2. Backcrossing \n3.3. Crossbreeding, buckline and doeline \n3.4. Rotational crossbreeding \n3.5. Upgrading\n4. Reproductive \nphenomena \n4.1. Reproductive data \n \nStage \nCattle \nBuffalo \nSheep\nGoat \nAve. estrus cycle, d \n20-23      18-71 \n21 \n21 \nAve. estrus duration, d\n23 \n18-36 \n24-42 \n24-42 \nAve. gestation, d \n270 \n310 \n145 \n150 \nAge of first estrus, yr \n0.8-1 \n1.2 \n0.3 \n0.3 \nCalving interval, yr \n1 \n1.2 \n8 mos \n8 mos \nPost partum estrus,d \n45 \n35-60 \n7-10 \n7-10 \n \n4.2. Signs of estrus \n4.3. Signs of pregnancy \n4.4. Signs of approaching parturition \n5. Breeding performance \n5.1. Breeding services \n5.2. Pregnancy rate \n5.3. Calf drop \n5.4. Kidding/lambing/calving rate \n5.5. Mortality rate \n5.6. Male-female ratio\n6. Unproductive  animals \n6.1. Hard-to-breed animals \n6.2. Long calving to breeding interval \n6.3. Physically deformed animals \n6.4. Sick animals \n6.5. Animals with reproductive disorders \n6.6. Animals with low-milk production \n6.7. Old aged animals \n6.8. Vicious animals \n6.9. Stunted animals \n6.10. Malnourished animal \n6.11.Too-fat animals\n7. Feed supplements \n7.1. Concentrate feeds \n7.2. Mineral supplements \n7.2.1. Urea Molasses Mineral Block (UMMB) \n7.2.2. Medicated Urea Molasses Mineral Block \n(MUMMB) \n7.2.3. Fermented Plant Juices (FPJ) \n7.2.4. Lime \n7.2.5. Dicalcium phosphate \n7.2.6. Oyster shell \n7.2.7. Salt\n\n--- PDF PAGE 52 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n50\n7.2.8. Bone meal \n7.2.9. Minerals and vitamins \n7.2.10.Probiotics\n8. Grazing management \n8.1. Continuous grazing \n8.2. Rapid Rotational grazing (RRG)\n9. Records \n9.1 Animal identification \n9.2 Pedigree (Dam and Sire) \n9.3 Inventory  \n9.4 Breeding and reproduction records \n9.5 Health records \n9.6 Mortality and disposal records \n9.7 Calving/kidding/lambing records\n\n--- PDF PAGE 53 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n51\nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Prepared animal stocks \n1.2. Bred ruminants \n1.3. Carried-out monitoring activities   \n1.4. Provided ration and implement feeding practices \n1.5. Applied basic health care \n1.6.\nPerformed post-breeding activities\n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations  \n2.1.1. Different animal breeds of ruminants \n2.1.2. Selection of stocks \n2.1.3. Tools, materials  and equipment in breeding \nactivities \n2.1.4. Reproductive phenomena \n2.1.5. Breeding program \n2.1.6. Breeding mode and procedures of ruminants  \n2.1.7. Artificial insemination procedures for small \nruminants \n2.1.8. Natural mating \n2.1.9. Monitoring of breeding ruminants \n2.1.10. Care and management of breeders and general \nherd, , \n2.1.11. Feed supplements \n2.1.12. Aflatoxins in feeds  \n2.1.13. GAHP \n2.1.14. Animal Welfare Act relating to breeding \n2.1.15. OSHS in animal breeding \n \n2.2. Communication \n2.2.1. Preparation of selection criteria and breeding \nobjectives, care and management of general herd, \nuse of A.I. for improved reproduction, forage/feed \nproduction and conservation; financial viability of \nthe enterprise. \n2.2.2. Updating and keeping of data and records \n2.2.3. Following verbal and written instructions \n2.3. Mathematics and Mensuration \n2.3.1. Computation of feed requirements at different \nphysiological stages, reproductive parameters, \nfeed conversion efficiency, dose requirements for \nA.I. and biologicals and income over costs of \noperation \n2.4. Safety Practices \n2.4.1. Implementation of safety standard in handling \nanimals and biologicals as prescribed by \nmanufacturers and endorsed by veterinarians \n2.4.2. Wearing of PPE’s and proper disposal of \nhazardous wastes \n2.4.3.\nPractice OSHS\n\n--- PDF PAGE 54 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n52\n2.4.4. Feeds check for aflatoxins \n \n2.5. Codes and Regulations \n2.5.1. Compliance to animal movement and quarantine \nprotocol and herd health program as formulated \nthrough Executive and Administrative Orders \nissued by BAI, PCC, PAHC and NMIC of the Dept. \nof Agriculture, DENR.  \n2.5.2. Animal Welfare Act \n2.5.3. Good Animal Husbandry Practices \n2.5.4. OSHS \n \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional \nmanuals \n2.6.1.2. Safe keeping of equipments every after use  \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, \nmaterials and equipment needed in the \nbreeding operation \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills \n2.7. Values  \n2.7.1. Patience during breeding activities \n2.7.2. Perseverance in rearing the general herd \n2.7.3. Honesty during business transactions such as \nsales of live animals and products\n3. Required  Skills \n3.1. Practice OSHS and first aid \n3.2. Skills in using tools and equipment \n3.3. Calculations \n3.4.\nCommunicate effectively\n4. Resource \nImplications \n4.1. Farm and forage area \n4.2. Different breeds of ruminants \n4.3. Infrastructures-houses, seed, corrals, sheds \n4.4. A.I. kit and paraphernalia \n4.5. Feeds, concentrates and additives \n4.6. Weighing scale (1000 kg. cap.) – for monitoring of animals \nweight  \n4.7. Drenching gun/syringe – deworming purposes \n4.8. Pressurized pump – for cleaning of areas \n4.9. All workers involved in different activities must be fully \noriented and cautioned on the different specific work \nactivities of the farm \n4.10. Technical supervisors should have skills and ability in the\n\n--- PDF PAGE 55 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n53\nsuccessful implementation of work program activities\n5. Method of \nAssessment \n \n Competency in this unit may be assessed through: \n5.1. \nObservation and questioning \n5.2. \nThird Party Report \n5.3. \nPortfolio \n5.4.\nDemonstration\n6. Context of \nAssessment \n6.1. Competency maybe assessed individually in the actual \nworkplace or in accredited farms or institution\n",
