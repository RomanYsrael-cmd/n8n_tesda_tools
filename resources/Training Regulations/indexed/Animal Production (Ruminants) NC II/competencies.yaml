        "descriptor": ": This unit covers the knowledge, skills and attitudes \nrequired to raising feedlot cattle and buffaloes. It \ncomprises of functions starting from preparation of \nanimals, handling and feeding the feedlot animals \nincluding the applying health care until to the completion \nof tasks. \n \n \n1. Provide assistance in \nmanagement of meat-\ntype animals \n \n1.1. Assistance in pre-selection process of meat-type \nanimals are provided following instructions of \nauthority and industry standards. \n1.2. Meat-type animals are raised in complete/semi-\nconfinement or under grazing conditions \n1.3. Fattening period is determined according to the \ntarget market weight. \n1.4. Unproductive animals are managed according to \nthe industry standards. \n1.5. Assistance in animal husbandry practices are \nprovided following GAHP. \n2. Feed animals \n2.1. Basal rations both for meat-type animals at various \nfattening periods are identified and provided based \non feeding standard. \n2.2. Feed supplements like concentrates, minerals and \nvitamins are offered according to animal \nrequirements. \n2.3. Feeding management for meat-type animals are \nidentified and practiced \n2.4. Grazing capacity of the pasture is determined based \non established pasture.\n3. Apply basic health \ncare \n \n3.1. Sick animals are reported to appropriate authority. \n3.2. Assistance is provided during implementation of \nmedication program in accordance with industry \nstandards and instructions of authority. \n3.3. Supplementation is done based on medication \nprogram. \n3.4. Safety practices are observed according to \nOccupational Safety and Health Standards (OSHS). \n4. Perform work to \ncompletion \n4.1. Breeder for meat-type animals are selected for \nbreeding purposes according to breeds standard. \n4.2. Animals are prepared for market disposal following \ninstructions of authority. \n4.3. Animal and financial records derived from meat-type \nanimals are updated and kept according to industry \nstandard.\n\n--- PDF PAGE 62 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n60\n4.4. Wastes disposal is done according to enterprise \nprotocol and environmental legislations. \n4.5. Tools, materials and supplies are maintained and \nstored according to enterprise procedures. \n4.6. Reporting was done to immediate authority following \nenterprise requirements\n\n--- PDF PAGE 63 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n61",
