        "source_text": "AFF621905 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to raising feedlot cattle and buffaloes. It \ncomprises of functions starting from preparation of \nanimals, handling and feeding the feedlot animals \nincluding the applying health care until to the completion \nof tasks. \n \n \n1. Provide assistance in \nmanagement of meat-\ntype animals \n \n1.1. Assistance in pre-selection process of meat-type \nanimals are provided following instructions of \nauthority and industry standards. \n1.2. Meat-type animals are raised in complete/semi-\nconfinement or under grazing conditions \n1.3. Fattening period is determined according to the \ntarget market weight. \n1.4. Unproductive animals are managed according to \nthe industry standards. \n1.5. Assistance in animal husbandry practices are \nprovided following GAHP. \n2. Feed animals \n2.1. Basal rations both for meat-type animals at various \nfattening periods are identified and provided based \non feeding standard. \n2.2. Feed supplements like concentrates, minerals and \nvitamins are offered according to animal \nrequirements. \n2.3. Feeding management for meat-type animals are \nidentified and practiced \n2.4. Grazing capacity of the pasture is determined based \non established pasture.\n3. Apply basic health \ncare \n \n3.1. Sick animals are reported to appropriate authority. \n3.2. Assistance is provided during implementation of \nmedication program in accordance with industry \nstandards and instructions of authority. \n3.3. Supplementation is done based on medication \nprogram. \n3.4. Safety practices are observed according to \nOccupational Safety and Health Standards (OSHS). \n4. Perform work to \ncompletion \n4.1. Breeder for meat-type animals are selected for \nbreeding purposes according to breeds standard. \n4.2. Animals are prepared for market disposal following \ninstructions of authority. \n4.3. Animal and financial records derived from meat-type \nanimals are updated and kept according to industry \nstandard.\n\n--- PDF PAGE 62 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n60\n4.4. Wastes disposal is done according to enterprise \nprotocol and environmental legislations. \n4.5. Tools, materials and supplies are maintained and \nstored according to enterprise procedures. \n4.6. Reporting was done to immediate authority following \nenterprise requirements\n\n--- PDF PAGE 63 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n61\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Unproductive animals \n1.1. Average Daily Gain (ADG) is low \n1.1.1. Too old \n1.1.2. Digestive disorders \n1.1.3. Diseased or sick animals \n1.1.4. Unthrifty animals \n1.1.5. Physically deformed /injured animals \n2. Animal husbandry \npractices \n2.1. Castration (surgical or elastrator) \n2.2. Deworming \n2.3. Dehorning \n2.4. Dehooving \n2.5. Vaccination \n2.6. Disbudding \n2.7. Putting identification (ear tagging, branding,etc) \n2.8. Shearing \n2.9. Medication\n3. Feeding management \n3.1. Cut and carry \n3.2. Continuous grazing \n3.3. Rapid Rotational grazing (RRG) \n3.4. Combination\n4. Records \n4.1. Production records \n4.2. Finished weight of meat-type animals \n4.3. Inventory and consumption records \n4.4. Financial and sales records \n4.5. Health records \n4.6. Mortality and disposal records\n\n--- PDF PAGE 64 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n62\nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nProvided assistance in management of meat-type animals\n1.2 \nFed animals \n1.3 \nApplied basic health care \n1.4 \nPerformed work to completion \n2. Required \nKnowledge and \nAttitudes \n \n2.1 Knowledge, Theory, Practices and Systems Operations \n2.2.1. Pre-selection process for meat-type animals \n2.2.2. Procedures in the preparation of houses \n2.2.3. Knowledge of correct feeding and management of \ngrowing ruminants meat-type \n2.2.4. Implementation of medication program \n2.2.5. Culling of unproductive animals \n2.2.6. GAHP for raising meat-type animals \n2.2.7. Preparation of animals for disposal in market \n2.2.8. Disposal of wastes of the operations \n2.2.9. OSHS \n2.2.10. Record keeping on raising meat-type animals \n \n2.2 Communications \n2.2.1. Preparation of inventory reports and production \nrecords \n2.2.2. Following verbal and written instructions \n2.2.3. Updating and keeping of data and records \n2.3 Mathematics and Mensuration \n2.3.1. Estimation harvest time (meat-type animals) \n2.3.2. Computation of harvest recovery(meat-type \nanimals).. \n2.3.3. Feed conversion efficiency \n2.3.4. Space requirements at various stages of growth \n2.3.5. Provision of right amount of drugs, vaccines and \nother biologicals \n2.3.6. Profitability of the operation \n2.4 Safety Practices \n2.4.1. 5S implementation \n2.4.2. Knowledge in handling biologicals and disinfectants \nbase on manufacturers specifications or VET \nrecommendations \n2.4.3. Wearing PPE \n2.4.4. Practicing OSHS \n2.5 Codes and Regulations \n2.5.1. Appropriate legal regulatory body that supervises \nthe animal industry such as BAI and Phil. Animal \nHealth Center (PAHC), DENR \n2.5.2. Occupational Safety and Health Standards. \n2.5.3. Good Animal Husbandry Practices (GAHP) \n2.5.4. Animal Welfare Act \n2.6 Materials, Tools & Equipment: Uses, Specifications and\n\n--- PDF PAGE 65 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n63\nMaintenance \n2.6.1 \nTools and Equipment \n2.6.1.1. Can understand and follow instructional \nmanuals \n2.6.1.2. Safe keeping of equipments every after use \n2.6.2 \nMaterials \n2.6.2.1. Where to source good quality supplies, \nmaterials and equipment needed in the \nrearing dairy type animals \n2.6.3 \nMaintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills \n2.7 Values \n2.7.1. Diligence \n2.7.2. Time consciousness \n2.7.3. Honesty in records of sales \n2.7.4. Confidence in selecting meat-type animals \n2.7.5. Personal integrity in doing routine management \npractices \n2.7.6. Perseverance in executing routine works \n2.7.7.\nAbility to work with others harmoniously\n3. Required Skills \n3.1. Work safety \n3.2. Simple carpentry and masonry skills \n3.3. Calculations \n3.4. Planning skills \n3.5.\nCommunicate effectively\n4. Resource \nImplications \n4.1. Farm area and forage site \n4.2. Animal house and cage \n4.3. Weighing scale and other tools, materials and equipment \nfor raising meat-type animals \n4.4. Medication and nutritional requirements \n4.5. All workers involved in different activities must be fully \noriented and cautioned on the different specific work \nactivities of the farm \n4.6. Technical supervisors should have skills and ability in the \nsuccessful implementation of work program activities\n5. Method of \nAssessment \nCompetency in this unit must be assessed through: \n5.1. \nPassing written exam \n5.2. \nPractical demonstration \n5.3. \nTestimonies of good performance and behavior of \napplicant by supervisor\n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 66 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n64"
