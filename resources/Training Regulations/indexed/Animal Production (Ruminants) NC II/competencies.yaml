        "source_title": "RAISE DAIRY ANIMALS",
        "source_text": "--- PDF PAGE 56 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n54\n \nUNIT OF COMPETENCY \n: RAISE DAIRY ANIMALS  \nUNIT CODE \n: AFF621904 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to manage dairy animals.  It comprises of \nfunctions such as handling dairy animals,  rearing \ncalves and kids, rearing dairy-breeder animals and \ncompleting the operations of raising dairy animals. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Handle dairy animals \n \n1.1. Pregnant animals are separated from the general    \nherd and are kept in maternity pen. \n1.2. Assistance during calving/lkidding is provided \naccording to GAHP.  \n1.3. Lactating ruminants are fed according to standards. \n1.4. Lactating ruminants are maintained following \nproduction objective. \n1.5. Milk is collected and checked for quality based on \nthe standard procedures. \n1.6. Collected milk are pasteurized and packaged \nfollowing standard hygienic procedures (HACCP). \n2. Rear calves and kids \n \n2.1. Newly born calf /kid is reared according to developed \nrearing system. \n2.2. Tools and materials are prepared according to work \nrequirements.  \n2.3. Routine feeding is carried-out at prescribed feeding \nintervals. \n2.4. Small and less vigorous calves and kids are \nidentified and separated from others for specialized \nfeeding. \n2.5. Calves and kids are separated as required for \nroutine husbandry or animal health procedures. \n2.6. Progress and development of calves/kids is \nmonitored regularly through weighing and/or visual \nappraisal. \n2.7. Welfare and health abnormalities are reported to the \nappropriate authority \n3. Rear dairy-breeder \nanimals \n \n3.1. Dairy-breeder- animals-to-be are placed in \nappropriate housing according to establish farm \nprocedures and GAHP \n3.2. Animals  are fed according to prescribed feeding \nintervals. \n3.3. Welfare and health abnormalities are reported to the \nappropriate authority\n\n--- PDF PAGE 57 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n55\n3.4. Monitoring of animals is done regularly through \nweighing and/or visual appraisal. \n3.5. Adult Breeder for dairy-type animals are selected for \nbreeding purposes according to breeds standard. \n3.6. Male animals not intended for breeding are sold for \nmeat. \n4. Complete the \noperations \n4.1. Animal and financial records derived from dairy \noperations are kept and updated according to \nindustry standard. \n4.2. Tools and materials are maintained and stored \naccording to manufacturer’s specification and \nenterprise protocol. \n4.3. Area is cleaned-up according to enterprise protocol \n4.4. Wastes are disposed following environmental \nregulations and enterprise procedures.\n\n--- PDF PAGE 58 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n56\n \nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Rearing system \n1.1. Feeding of colostrums \n1.2. Natural suckling \n1.3. Artificial rearing ( raw milk or milk replacer) \n1.4. Combination of natural and artificial\n2. Quality \n2.1. Taste \n2.2. Odor \n2.3. Visual\n3. Dairy-breeder-animals-\nto-be \n3.1. Yearlings/growers \n3.2. Young female \na. Heifer \nb. Doelings \n3.3. \nYoung male \na. Buckling \nb. Junior bull \n3.4. \nAdult male \na. Bucks \nb. Bull\n4. Records \n4.1. Production records \n4.2. Breeding and reproduction records \n4.3. Inventory and consumption records \n4.4. Daily milk production records \n4.5. Financial and sales records \n4.6. Health records \n4.7. Mortality and disposal records\n\n--- PDF PAGE 59 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n57\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nHandled dairy animals \n1.2 \nReared calves and kids \n1.3 \nReared dairy-breeder-animals-to-be \n1.4 \nCompleted the operations \n \n2. Required \nKnowledge and \nAttitudes \n \n2.1 Knowledge, Theory, Practices and Systems Operations  \n2.1.1. Calving/kidding \n2.1.2. Rearing calves and kids \n2.1.3. Rearing young ruminants \n2.1.4. Rearing adult male animals for breeding \n2.1.5. Implementation of medication program \n2.1.6. Proper disposal of hazardous wastes \n2.1.7. Procedures in milk collection \n2.1.8. Quality check of milk \n2.2 Communication \n2.2.1 Updating and keeping of records and data relating \nto breeding activities \n2.2.2 Preparation of inventory reports and production \nrecords \n2.2.3 Report preparation on progress of the animals \n2.2.4 Following verbal and written instructions \n2.3 Mathematics and Mensuration \n2.3.1. Estimation harvest time.. \n2.3.2. Computation of harvest recovery \n2.3.3. Feed conversion efficiency \n2.3.4. Space requirements at various stages of growth \n2.3.5. Provision of right amount of drugs, vaccines and \nother biologicals \n2.3.6. Profitability of the operation \n2.4 Safety Practices \n2.4.1. Wear PPE  \n2.4.2. Practice OSHS    \n2.4.3. 5S implementation \n2.4.4. Knowledge in handling biologicals and disinfectants \nbase on manufacturers specifications or VET \nrecommendations \n2.4.5. Proper disposal of hazardous wastes \n2.5 Codes and Regulations \n2.5.1. Appropriate legal regulatory body that supervises \nthe animal industry such as BAI and Phil. Animal \nHealth Center (PAHC), DENR \n2.5.2. Occupational Safety and Health Standards. \n2.5.3. Animal Welfare Act \n2.5.4. GAHP \n2.6 Materials, Tools & Equipment: Uses, Specifications and \nMaintenance\n\n--- PDF PAGE 60 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n58\n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional \nmanuals \n2.6.1.2. Safe keeping of equipments every after use  \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, \nmaterials and equipment needed in the \nrearing dairy type animals \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills \n2.7 Values  \n2.7.1. Diligence \n2.7.2. Time consciousness \n2.7.3. Honesty in records of sales \n2.7.4. Confidence in selecting dairy type animals \n2.7.5. Personal integrity in doing routine management \npractices \n2.7.6. Perseverance in rearing dairy-type animals \n2.7.7.\nAbility to work with others harmoniously\n3. Required Skills \n3.1 \nWork safety \n3.2 \nSimple carpentry and masonry skills \n3.3 \nCalculations \n3.4 \nPlanning skills \n3.5\nCommunicate effectively\n4. Resource \nImplications \n4.1. Farm area and forage site \n4.2. Animal house and cages  \n4.3. Milking parlor \n4.4. Weighing scale  and other tools, materials and equipment \nin handling dairy-type animals and milk collection \n4.5. Medication and nutritional requirements \n4.6. All workers involved in different activities must be fully \noriented and cautioned on the different specific work \nactivities of the farm \n4.7. Technical supervisors should have skills and ability in the \nsuccessful implementation of work program activities\n5. Method of \nAssessment \nCompetency in this unit must be assessed through: \n5.1. \nPassing written exam \n5.2. \nPractical demonstration \n5.3. \nTestimonies of good performance and behavior of \napplicant by supervisor\n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n",
