        "source_text": "--- PDF PAGE 33 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n31\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: MAINTAIN HOUSING, FARM  IMPLEMENTS AND \nSURROUNDING AREAS \nUNIT CODE \n: AFF621901 \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to manage farm structures and environment. It \ncomprises activities such as preparing for maintenance \nactivities, maintaining of farm and its structures, \napplying bio-security measures and perform work to \ncompletion. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare for farm \nmaintenance activities  \n1.1. Farm and surrounding area are checked for \nproblems according enterprise and DENR \nstandards. \n1.2. Equipment, tools and materials for maintenance \nactivities are prepared according to Occupational \nSafety and Health Standards (OSHS). \n1.3. Condition of facilities is recorded and reported to \nappropriate authority based on enterprise \nrequirements. \n2. Maintain farm and \nhousing facilities \n \n2.1. Farm is maintained based on  enterprise standards.  \n2.2. Pest and vermin are controlled according to industry \nprocedures and environmental regulations \n(Environmental Management Standards) . \n2.3. Animal housing  and facilities are maintained  \naccording to BAI.  \n2.4. Farm supplies and tools for maintenance are made \navailable according to farm requirements. \n2.5. Fence is repaired according to work requirements. \n2.6. Safety measures are applied according to \nOccupational Safety and  Health Standards (OSHS) \n3. Apply bio-security \nmeasures \n3.1. Bio-security threats and hazards are identified with \nreference to Bureau of Animal Industry-Department of \nAgriculture (BAI-DA) animal health standards. \n3.2. Bio-security measures are applied according to \nBureau of Animal Industry-Department of Agriculture \n(BAI-DA) standards and OSHS  \n3.3. Relevant records are collected and maintained \naccording to enterprise standards. \n4. Perform work to \ncompletion \n4.1. Tools and materials are maintained and stored \naccording to established enterprise practices and \nfollowing 5S principle.\n\n--- PDF PAGE 34 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n32\n4.2. Farm wastes are disposed according to DENR \nregulations and 3Rs principle. \n4.3. Report on work outputs and updates are prepared \nand submitted to concerned person or authority \naccording to industry practices.\n\n--- PDF PAGE 35 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n33\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Problems \n1.1 \nPests and vermin \n1.2 \nCorrosion \n1.3 \nDamages caused by elements \n1.4 \nFaulty and defective facilities  \n1.5\nDeteriorated farm structures\n2. Equipment, tools and \nmaterials \n2.1. Equipment \n2.1.1. Grass cutter \n2.1.2. Sprayer \n2.1.3. Emergency lights \n2.1.4. Weighing scale \n2.2. Tools \n2.2.1. Pliers, \n2.2.2.  Hammer \n2.2.3.  Bolo and scythe  \n2.2.4. Shovel,  \n2.2.5. Hayfork,  \n2.2.6. Wheel barrow \n2.2.7. Saw \n2.2.8. Plumbing tools \n2.3. Supplies \n2.3.1. Lime \n2.3.2. Detergents \n2.3.3. Disinfectants \n2.3.4. Hygiene supplies \n2.3.5. Fertilizers \n2.3.6. Fuels/lubricants \n2.3.7. Brooms \n2.3.8. Dustpan \n2.3.9. Pail \n2.3.10. Fire extinguisher \n2.3.11. Garden hose \n2.3.12. Nails\n3. Facilities \n3.1. House \n3.2. Feeder \n3.3. Waterer \n3.4. Feedlot pens \n3.5. Maternity pen \n3.6. Kidding/lambing pen \n3.7. Calf hutches \n3.8. Stud pen for bulls \n3.9. Milking barn/parlor with appropriate \nventilation \n3.10. Storage room for feeds and supplies \n3.11. Laborers quarter \n3.12. Silo, hay barn \n3.13. Manure barn\n\n--- PDF PAGE 36 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n34\n3.14. Machinery shed \n3.15. Farm office  \n3.16. Water and power supplies \n3.17. Working corral with chute \n3.18. Disposal area of dead carcasses\n4. Bio-security threats and \nhazards \n4.1. \nDisease outbreak \n4.2. \nVaccination failures \n4.3. \nUnavailability of veterinary supplies \n4.4. \nAstray animals (dogs, cats, birds) \n4.5. \nNew animal acquisition \n4.6. \nDiseases acquired through importation \n4.7. \nZoonotic diseases \n4.8. \nInefficient waste disposal \n4.9. \nInaccurate diagnosis \n4.10. Visitors of farms \n4.11. Vehicles coming from outside \n4.12. Zoning clearance (not near to community \nhouses) \n4.13. Ineffective use of disinfectants\n5. Bio-security measures \n5.1. Prevention of disease through  Animal \nHealth program \n5.2. Provisions of foot dips and tire baths \n5.3. Prevention of disease transmission through \ngood animal husbandry practices\n6. Farm wastes \n6.1. Animal manure \n6.2. Feed refuse or food leftovers \n6.3. Spoiled feeds (Forage and feed \nsupplements) \n6.4. Empty veterinary bottles, syringes, needles \nand sharp objects \n6.5. Disposable gloves and masks \n6.6. Expired biologics \n6.7. Spoiled milk \n6.8. Spent bedding materials \n6.9. Empty sacks  \n6.10. Dead animals \n6.11. Placenta\n\n--- PDF PAGE 37 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n35\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared for farm maintenance activities \n1.2. Maintained farm and housing facilities \n1.3. Applied bio-security measures \n1.4.\nPerformed work to completion\n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Knowledge on first aid \n2.1.2. Different types and uses of equipment, tools and \nmaterials for maintenance \n2.1.3. Categories of farm wastes \n2.1.4. Bio-security threats and hazards \n2.1.5. Different facilities  \n2.1.6. Different pest and vermin \n2.1.7. Bio-security procedures \n2.1.8. Maintenan