al integrity in doing routine management \npractices \n2.7.7 Perseverance in executing routine works \n2.7.8 Ability to work with others harmoniously\n3. Required Skills \n3.1 Occupational health and safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating effectively\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm area \n4.2 Different farm wastes \n4.3 Farm-waste processing area \n4.4 Tools, supplies and materials use in farm wastes \ncollection, segregation and processing \n4.5 Housekeeping tools and supplies \n4.6\nPPE\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nObservation and questioning \n5.2 \nThird-Party Report \n5.3\nDemonstration and oral questioning\n6. Context of \nAssessment \n6.1 Competency maybe assessed individually in the actual \nworkplace or in accredited farms or institution",
