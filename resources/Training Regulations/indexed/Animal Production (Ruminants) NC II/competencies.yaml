 Standards (OSHS) \n3. Apply bio-security \nmeasures \n3.1. Bio-security threats and hazards are identified with \nreference to Bureau of Animal Industry-Department of \nAgriculture (BAI-DA) animal health standards. \n3.2. Bio-security measures are applied according to \nBureau of Animal Industry-Department of Agriculture \n(BAI-DA) standards and OSHS \n3.3. Relevant records are collected and maintained \naccording to enterprise standards. \n4. Perform work to \ncompletion \n4.1. Tools and materials are maintained and stored \naccording to established enterprise practices and \nfollowing 5S principle.\n\n--- PDF PAGE 34 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n32\n4.2. Farm wastes are disposed according to DENR \nregulations and 3Rs principle. \n4.3. Report on work outputs and updates are prepared \nand submitted to concerned person or authority \naccording to industry practices.\n\n--- PDF PAGE 35 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n33\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Problems \n1.1 \nPests and vermin \n1.2 \nCorrosion \n1.3 \nDamages caused by elements \n1.4 \nFaulty and defective facilities \n1.5\nDeteriorated farm structures\n2. Equipment, tools and \nmaterials \n2.1. Equipment \n2.1.1. Grass cutter \n2.1.2. Sprayer \n2.1.3. Emergency lights \n2.1.4. Weighing scale \n2.2. Tools \n2.2.1. Pliers, \n2.2.2. Hammer \n2.2.3. Bolo and scythe \n2.2.4. Shovel, \n2.2.5. Hayfork, \n2.2.6. Wheel barrow \n2.2.7. Saw \n2.2.8. Plumbing tools \n2.3. Supplies \n2.3.1. Lime \n2.3.2. Detergents \n2.3.3. Disinfectants \n2.3.4. Hygiene supplies \n2.3.5. Fertilizers \n2.3.6. Fuels/lubricants \n2.3.7. Brooms \n2.3.8. Dustpan \n2.3.9. Pail \n2.3.10. Fire extinguisher \n2.3.11. Garden hose \n2.3.12. Nails\n3. Facilities \n3.1. House \n3.2. Feeder \n3.3. Waterer \n3.4. Feedlot pens \n3.5. Maternity pen \n3.6. Kidding/lambing pen \n3.7. Calf hutches \n3.8. Stud pen for bulls \n3.9. Milking barn/parlor with appr