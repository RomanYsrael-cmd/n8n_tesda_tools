d follow instructional manuals \n2.6.1.2. Safe keeping of equipments every after use  \n2.7.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the operation of the farm \n2.7.3. Maintenance \n2.6.3.1. Regular upkeep of equipments and facilities \n2.6.3.2. Preventive maintenance skills \n2.7. \nValues  \n2.7.1. Patience  \n2.7.2. Punctuality \n2.7.3. Perseverance  \n2.7.4. Honesty  \n2.7.5. Hardworking\n3. Required Skills \n3.1. Basic first aid \n3.2. Basic skills in using maintenance tools and equipment \n3.3. Calculations \n3.4. Effective communication skills\n4. Resource \nImplications \n4.1. Farm site/pasture area with appropriate facilities \n4.2. Tools \n4.2.1. Weighing scale – for weighing farm wastes \n4.2.2. \nGrass cutter \n4.2.3. \nSprayer \n4.2.4. \nEmergency lights \n4.2.5. \nWeighing scale \n4.2.6. \nPliers, \n4.2.7. \nHammer \n4.2.8. \nBolo and scythe  \n4.2.9. \nShovel,  \n4.2.10. \nHayfork,  \n4.2.11. \nWheel barrow \n4.2.12. \nSaw \n4.2.13. \nPlumbing tools \n4.2.14. \nFire extinguisher \n4.2.15. \nGarden hose \n4.3. Materials \n4.3.1. Lime \n4.3.2. Detergents \n4.3.3. Disinfectants \n4.3.4. Hygiene supplies \n4.3.5. Fertilizers \n4.3.6. Fuels/lubricants \n4.3.7. Brooms \n4.3.8. Dustpan \n4.3.9. Pail \n4.3.10. Nails \n4.4. All workers involved in different activities must be fully \noriented and cautioned on the different specific work\n\n--- PDF PAGE 39 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n37\nactivities of the farm \n4.5. Technical supervisors should have skills and ability in the \nsuccessful implementation of work program activities\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Observation and questioning \n5.2. Written examination \n5.3. Third Party Report \n5.4. Portfolio \n5.5. Demonstration\n6. Context of \nAssessment \n6.1. Competency maybe assessed individually in the actual \nworkplace or in accredited farms or institution",
