ERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare area for forage \nplantation \n1.1 \nTools, materials and equipment are prepared \naccording to work requirements and plan. \n1.2 \nForage area is cleared from unwanted vegetations \nand debris according to site plan. \n1.3 \nLand is prepared according to site plan and \nproduction requirements. \n1.4 \nFence is set-up in the perimeter following site plan. \n1.5 \nSafety measures are practiced according to \nOccupational Health and Safety (OHS) procedures.\n2. Plant forage species \n2.1. Forage species to be planted are determined \naccording to types of ruminants and availability of \nforage species. \n2.2. Forage planting materials are sourced-out and \ncollected from recommended sources and other \nfarmers. \n2.3. Forage species are planted according to plan and \nproduction requirements. \n2.4.\nTask is performed according to OSHS.\n3. Maintain forage plants \n3.1. Pest control measures are employed according to \nGood Agricultural Practices (GAP) \n3.2. Fertilizers are applied according to plant \nrequirements \n3.3. Plants are watered according to plant requirements. \n3.4. Other maintenance practices are done following \nGAP and plant requirements. \n3.5. Tasks are performed following GAP and OSHS \nprocedures.\n4. Produce silage \n \n4.1. Excess forages and other materials for silage are \ngathered following established farm procedures. \n4.2. Silos are used according to supply of silage materials.\n4.3. Ensiling is done following standard procedures. \n4.4. Commercial silage additives are mixed according to \nenterprise requirements. \n4.5. Forage silage is stored following established storage \nrequirements and condition. \n4.6. Forage silage are inspected for quality check and\n\n--- PDF PAGE 41 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n39\nimprovement. \n5. Perform work to \ncompletion \n5.1. Tools and equipment are cleaned, maintained and \nstored according to established standard practices \n5.2. Maintenance of clean and safe area is undertaken \nthroughout and on completion of work. \n5.3. Records of silage production are compiled for \nreference and reporting purposes following enterprise \nprocedures and 5S principles. \n5.4. Work output is reported to concerned person or \nauthority according to industry practices.\n\n--- PDF PAGE 42 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nTools, materials \nand equipment \n1.1. \nEquipment \n1.1.1. Grass cutters \n1.1.2. Generator \n1.1.3. Water pump with hose \n1.1.4. Tractors (optional) \n1.1.5. Draft animals \n1.2. \nTools \n1.2.1. Plow and harrow \n1.2.2. “Bolo”and scythe \n1.2.3. Shovel \n1.2.4. Hoe \n1.2.5. Water sprinklers \n1.2.6. Planter \n1.2.7. Wheel borrow \n1.2.8. Hole digger \n1.3. \nMaterials \n1.3.1. Planting materials \n1.3.2. Fertilizer (Organic and inorganic) \n1.3.3. Pesticides \n1.3.4. Root inoculants \n1.3.5. Herbicides \n1.3.6. Fencing materials\n2. Unwanted \nvegetations and \ndebris \n2.1. \nPoisonous and destructive plants \n2.2. \nInedible vegetation \n2.3. \nTree stumps \n2.4. \nBroken bottles, glass, plastics and other non-\nbiodegradable wastes \n2.5. \nGarbage \n2.6. \nSoil contaminants (chemicals, metals, stones, \nconstruction debris) \n2.7. \nTermite hills \n2.8.\nWeeds \n3. \nForage species \n3.1. \nNapier \n3.2. \nGuinea Grass \n3.3. \nParagrass \n3.4. \nCentrosema \n3.5. \nCalopogonium \n3.6. \nStylosanthes \n3.7. \nAcacia \n3.8. \nMalunggay \n3.9. \nStargrass \n3.10. Humidicola \n3.11. Kakawate \n3.12. “Mani-manian”(Arachis pintoii) \n3.13. Renzonii \n3.14. Flemingia\n\n--- PDF PAGE 43 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n41\n3.15. Pigeon Pea \n3.16. Tricantera or “Madre de agua” \n3.17. Mullberry \n3.18. Indigofera \n3.19. Ipil-ipil \n3.20. Katuray \n3.21. Forage corn \n3.22. Sweet Sorghum \n3.23. Cassava