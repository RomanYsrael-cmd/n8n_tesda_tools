ledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \nELEMENT \nPERFORMANCE CRITERIA \n1. \nPerform estimation \n1.1 Job requirements are identified from written or \noral communications \n1.2 Quantities of materials and resources required to \ncomplete a work task are estimated \n1.3 The time needed to complete a work activity is \nestimated \n1.4 Accurate estimate for work completion are made \n1.5 Estimate of materials and resources are reported \nto appropriate person \n2. \nPerform basic workplace \ncalculation \n2.1 Calculations to be made are identified according \nto job requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be \nfollowed are ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of \naddition, division, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed \nwhen are used to complete the instructions \n2.6 Number computed in self checked and completed \nfor alignment\n\n--- PDF PAGE 25 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n23\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nCalculations \n \n1.1 \nQuantity of feeds \n1.2 \nAmount of fertilizer \n1.3 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5\nRatio and proportion\n3. \nSystem of \nmeasurement \n3.1 \nEnglish \n3.2 \nMetric \n4. \nUnits of measurement \n4.1 \nArea \n4.2 \nVolume \n4.3 \nWeight\n\n--- PDF PAGE 26 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n24\n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed estimation \n1.2 \nPerformed basic workplace calculation \n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nMathematics \n2.1.1 \nBasic mathematical operations \n2.1.2 \nPercentage and ratios \n2.1.3 \nUnit Conversion \n2.1.4 \nBasic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n \n2.2 \nSystems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n \n2.3 \nValues \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision\n3. Underpinning \nSkills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration \n4.2 \nWritten examination \n5. Resource \nImplications \n5.1 \nRelevant tools and equipment for basic calculation \n5.2 \nRecommended data \n6. Context of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a \nsimulated workplace or as part of a team under limited \nsupervision\n\n--- PDF PAGE 27 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n25\n \nUNIT OF COMPETENCY \n: PROCESS FARM WASTES \nUNIT CODE \n: AFF321205\n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to process farm wastes. It comprises functions \nsuch as collecting farm wastes, conducting waste \nidentification and segregation, treating and processing \nfarm wastes and performing housekeeping duties. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Collect farm wastes \n1.1. Tools and materials are prepared for collection of \nfarm wastes. \n1.2. Wastes are collected following OSHS and waste \ncollection requirements and plan. \n1.3. Dangerous and hazardous wastes are collected \nfollowing the HAZMAT(hazardous material) protocol. \n1.4. Appropriate personal protective equipment (PPE) are \nworn as prescribed by Occupational Safety and \nHealth Standards (OSHS). \n2. Identify and segregate \nwastes \n \n2.1. Wastes are identified by categories according to \nindustry standards and environmental legislation. \n2.2. Wastes are segregated according to organizational \nrequirements and relevant legislation. \n2.3. Sorted waste is placed into labelled container to avoid \nlittering and prevent cross-contamination. \n2.4. Information on waste is obtained by asking authority \nto ensure correct identification.\n3. Treat and process farm \nwastes \n3.1. Dangerous and hazardous wastes are handled \naccording to organizational requirements and \nrelevant legislation following OSHS procedures. \n3.2. Processing of farm wastes is done following \nenvironmental legislation and codes. \n3.3. Principles of 3Rs (reduce, reuse and recycle) are \napplied accordingly. \n3.4. Farm wastes are disposed of according to \nenvironmental legislation and codes.\n4. Perform housekeeping \n4.1. Appropriate warning signs and labels are displayed \nin conspicuous places around the workplace. \n4.2. Work area is cleaned according to 5S principles. \n4.3. Tools are checked, cleaned and stowed according to \nestablished industry procedures and following user’s \nmanual. \n4.4. Materials are stored following industry standard\n\n--- PDF PAGE 28 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n26\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \nprocedures and manufacturer’s specifications. \n4.5. PPE is checked for damage prior to ensuring that \nclean and undamaged equipment is stored. \n4.6. Storage facility is checked to ensure no \ncontamination in the area according to organizational \nrequirements and legislation and codes. \n4.7. Record keeping is done according to industry \nrequirements.\n\n--- PDF PAGE 29 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n27\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Tools and materials \nTools and materials include: \n1.1. Tools \n• Spade \n• Wheel borrow \