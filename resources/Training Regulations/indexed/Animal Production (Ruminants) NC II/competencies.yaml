        "source_title": "PROVIDE FORAGE",
        "source_text": "--- PDF PAGE 40 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n38\n \nUNIT OF COMPETENCY \n: PROVIDE FORAGE   \nUNIT CODE \n: AFF621902 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to provide forage which include functions \nduring \nforage \narea \npreparation, \nplanting \nand \nmaintenance activities of forage area, production of \nsilage and completion of work. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare area for forage \nplantation \n1.1 \nTools, materials and equipment are prepared \naccording to work requirements and plan. \n1.2 \nForage area is cleared from unwanted vegetations \nand debris according to site plan. \n1.3 \nLand is prepared according to site plan and \nproduction requirements. \n1.4 \nFence is set-up in the perimeter following site plan.  \n1.5 \nSafety measures are practiced according to \nOccupational Health and Safety (OHS) procedures.\n2. Plant forage species \n2.1. Forage species to be planted are determined \naccording to types of ruminants and availability of \nforage species. \n2.2. Forage planting materials are sourced-out and \ncollected from recommended sources and other \nfarmers. \n2.3. Forage species are planted according to plan and \nproduction requirements. \n2.4.\nTask is performed according to OSHS.\n3. Maintain forage plants \n3.1. Pest control measures are employed according to \nGood Agricultural Practices (GAP) \n3.2. Fertilizers are applied according to plant \nrequirements \n3.3. Plants are watered according to plant requirements. \n3.4. Other maintenance practices are done following \nGAP and plant requirements. \n3.5. Tasks are performed following GAP and OSHS \nprocedures.\n4. Produce  silage \n \n4.1. Excess forages and other materials for silage are \ngathered following established farm procedures. \n4.2. Silos are used according to supply of silage materials.\n4.3. Ensiling is done  following standard procedures.  \n4.4. Commercial silage additives are mixed according to \nenterprise requirements. \n4.5. Forage silage is stored following established storage \nrequirements and condition.  \n4.6. Forage silage are inspected for quality check and\n\n--- PDF PAGE 41 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n39\nimprovement.  \n5. Perform work to \ncompletion \n5.1. Tools and equipment are cleaned, maintained and \nstored according to  established standard practices \n5.2. Maintenance of clean and safe area is undertaken \nthroughout and on completion of work. \n5.3. Records  of silage production are compiled for \nreference and reporting purposes following enterprise \nprocedures and 5S principles. \n5.4. Work output is reported to concerned person or \nauthority according to industry practices.\n\n--- PDF PAGE 42 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nTools, materials \nand equipment \n1.1. \nEquipment \n1.1.1. Grass cutters \n1.1.2. Generator \n1.1.3. Water pump with hose \n1.1.4. Tractors (optional) \n1.1.5. Draft animals  \n1.2. \nTools \n1.2.1. Plow and harrow \n1.2.2. “Bolo”and scythe \n1.2.3. Shovel \n1.2.4. Hoe \n1.2.5. Water sprinklers \n1.2.6. Planter \n1.2.7. Wheel borrow \n1.2.8. Hole digger  \n1.3. \nMaterials \n1.3.1. Planting materials \n1.3.2. Fertilizer (Organic and inorganic) \n1.3.3. Pesticides \n1.3.4. Root inoculants \n1.3.5. Herbicides \n1.3.6. Fencing materials\n2. Unwanted \nvegetations and \ndebris  \n2.1. \nPoisonous and destructive plants \n2.2. \nInedible vegetation \n2.3. \nTree stumps \n2.4. \nBroken bottles, glass, plastics and other non-\nbiodegradable  wastes \n2.5. \nGarbage \n2.6. \nSoil contaminants (chemicals, metals, stones, \nconstruction debris) \n2.7. \nTermite hills \n2.8.\nWeeds \n3. \nForage species \n3.1. \nNapier \n3.2. \nGuinea Grass \n3.3. \nParagrass \n3.4. \nCentrosema \n3.5. \nCalopogonium \n3.6. \nStylosanthes \n3.7. \nAcacia \n3.8. \nMalunggay \n3.9. \nStargrass \n3.10. Humidicola \n3.11. Kakawate \n3.12. “Mani-manian”(Arachis pintoii)  \n3.13. Renzonii \n3.14. Flemingia\n\n--- PDF PAGE 43 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n41\n3.15. Pigeon Pea \n3.16. Tricantera or “Madre de agua” \n3.17. Mullberry \n3.18. Indigofera \n3.19. Ipil-ipil \n3.20. Katuray \n3.21. Forage corn \n3.22. Sweet Sorghum \n3.23. Cassava leaves \n3.24. Soy beans \n4. \nPest control \nmeasures \n4.1. \nOrganic pesticides \n4.2. \nChemical pesticides \n4.3. \nBiological control  \n4.4.\nSelection of pest resistant forages\n5. \nFertilizers \n5.1. Organic fertilizers \n5.2. In-organic fertilizers \n6. \nOther \nmaintenance \npractices \n6.1. Correct cutting intervals \n6.2. Replacement of plant mortalities \n6.3. Weeding \n7. \nExcess forages \nand  other \nmaterials for \nsilage  \n7.1. \nGrasses \n7.1.1. Native grasses \n7.1.2. Improved grasses  \n7.2. \nLegumes \n7.2.1. Vines  \n7.2.2. Shrubs                     \n7.2.3. Fodder trees                      \n7.3. \nConserved forages \n7.3.1. Silages (corn & grasses) \n7.3.2. Hay (grasses or legumes) \n7.3.3. Urea-treated rice straw (UTRS) \n7.4. \nFarm by-products \n7.4.1. Rice straw \n7.4.2. Sugar cane tops \n7.4.3. Sweet potato vines \n7.4.4. Corn stover \n7.5. \nIndustrial by-products \n7.5.1. Spent grain \n7.5.2. Molasses \n7.5.3. Pine apple pulps \n7.5.4. 3Banana peelings \n7.5.5. Rice/corn bran \n7.5.6. Cassava (leaves or meal) \n7.5.7. copra meal \n7.6. \nAlternative feed resources \n7.6.1. Tree leaves and shrubs \n7.6.2. Banana stalks \n7.6.3. Peanut/soya hay \n7.6.4. Gumamela \n7.6.5. Chicken manure\n\n--- PDF PAGE 44 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n42\n7.6.6. Milk replacer \n \n8. \nEnsiling \n8.1. Pre-seal \n8.2. Active fermentation \n8.3. Stable phase  \n8.4. Feed-out\n9. \nCommercial \nsilage additives \n9.1. Bacterial inoculants  \n9.2. Enzymes \n9.3. Nonprotein nitrogen (NPN) sources  \n9.4. Acids  \n9.5. Sugar sources \n9.6. Feed fortifier (grains, bran,molasses)\n10. Improvement \n10.1. Includes the following for improvement of quality of silage:\n10.2. Adding the following: \n10.2.1. molasses \n10.2.2. grains  \n10.3. Silage is compacted \n10.4. Cover to ensure anaerobic condition\n11. Records  of silage \nproduction \n11.1. Date of production of silage \n11.2. Date of harvest of silage \n11.3. Quantity starting materials for silage \n11.4. Silage recovered (yield) \n11.5. Species of forages ensiled \n11.6. Feed sources and contact details\n\n--- PDF PAGE 45 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n43\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared area for forage plantation  \n1.2 Planted forage species and alternative sources of forages \n1.3 Applied accepted cultural practices in forage production \n1.4 Produced silage \n1.5 Performed work to completion\n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1 \nTypes of soil and terrain \n2.1.2 \nTypes of forage species \n2.1.3 \nCropping season and patterns \n2.1.4 \nGood Agricultural Practices \n2.1.5 \nLand preparation procedures \n2.1.1. Different forage and materials for silage \n2.1.2. Volume of protein produce \n2.1.3. Irrigation practices \n2.1.4. Silaging practices \n2.1.5. Cut and carry system of feeding \n2.1.6 \nHarvesting of silage \n2.1.7 \nDisposal procedures of spoiled silages \n2.1.8 \nRecord keeping \n \n2.2 Communication \n2.2.1 Preparation of report \n2.2.2 Following verbal and written instructions \n2.3 Safety Practices \n2.3.1 Wearing of PPE’s  \n2.3.2 Handling of chemicals \n2.3.3 Disposal of wastes (empty bottles, etc.) \n2.3.4 GAP \n2.3.5 First aid \n2.4 \nMathematics and Mensuration \n2.4.1 \nSeeding rate \n2.4.2 \nYield rate \n2.4.3 \nPlanting distance \n2.4.4 \nDosage of chemicals/fertilizers \n2.4.5 \nCost of forages per animal \n2.4.6 \nVolume of forage needed for the whole herd \n2.4.7 \nProductivity per area planted to forage \n2.4.8 \nComputation for mixture of silage components \n2.4.9 \nComputation of nutrient requirements \n2.4.10 Inventory of supplies and materials \n2.5 Safety Practices \n2.5.1. Implementation of safety standard in handling \nchemicals as prescribed by manufacturers \n2.5.2. Wearing of appropriate Personal Protective \nEquipment (PPEs) \n2.5.3. Disposal of hazardous wastes  \n2.5.4.\nElimination of sharp and pointed objects\n\n--- PDF PAGE 46 ---\nTR-Animal Production (Ruminants) NCII                    Promulgated December 2013 \n44\n2.5.5. Practice of safety precautions in harvesting forages \n2.5.6. Disposal of spoiled silages \n2.5.7. Feeds checked for aflatoxins \n2.5.8. Practice Occupational Safety and Health Standards \n(OSHS) \n2.6 Codes and Regulations \n2.6.1. Compliance to OSHS \n2.6.2. Municipal and cities/ provincials ordinances \n2.7 Materials, Tools, Equipment: Uses, Specifications and \nMaintenance \n2.7.1. Tools and Equipment \n2.7.1. 1. Can understand and follow instructional \nmanuals \n2.7.1. 2. Safe keeping of equipments every after use  \n2.7.2. Materials \n2.7.2. 1. Where to source good quality supplies, \nmaterials and equipment needed in the \noperation involving forage provisions.  \n2.7.3. Maintenance \n2.7.3. 1. Regular upkeep of equipments and facilities \n2.7.3. 2. Preventive maintenance skills \n2.8 Values  \n2.8.1 Resourcefulness \n2.8.2 Hardworking \n2.8.3 Diligence \n2.6.3. Patience  \n2.6.4. Perseverance  \n2.6.5. Honesty \n3. Required Skills \n3.1 \nOccupational health and safety practices \n3.2 \nTractor operation or plowing \n3.3 \nHandling draft animals \n3.4 \nSkills in using farming tools and equipment \n3.5 \nCalcu