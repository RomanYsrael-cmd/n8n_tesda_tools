Disposal of hazardous wastes \n2.5.4.\nElimination of sharp and pointed objects\n\n--- PDF PAGE 46 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n44\n2.5.5. Practice of safety precautions in harvesting forages \n2.5.6. Disposal of spoiled silages \n2.5.7. Feeds checked for aflatoxins \n2.5.8. Practice Occupational Safety and Health Standards \n(OSHS) \n2.6 Codes and Regulations \n2.6.1. Compliance to OSHS \n2.6.2. Municipal and cities/ provincials ordinances \n2.7 Materials, Tools, Equipment: Uses, Specifications and \nMaintenance \n2.7.1. Tools and Equipment \n2.7.1. 1. Can understand and follow instructional \nmanuals \n2.7.1. 2. Safe keeping of equipments every after use \n2.7.2. Materials \n2.7.2. 1. Where to source good quality supplies, \nmaterials and equipment needed in the \noperation involving forage provisions. \n2.7.3. Maintenance \n2.7.3. 1. Regular upkeep of equipments and facilities \n2.7.3. 2. Preventive maintenance skills \n2.8 Values \n2.8.1 Resourcefulness \n2.8.2 Hardworking \n2.8.3 Diligence \n2.6.3. Patience \n2.6.4. Perseverance \n2.6.5. Honesty \n3. Required Skills \n3.1 \nOccupational health and safety practices \n3.2 \nTractor operation or plowing \n3.3 \nHandling draft animals \n3.4 \nSkills in using farming tools and equipment \n3.5 \nCalculations \n3.6\nEffective communication skills\n4. Resource \nImplications \n4.1. Farm with forage area and facilities \n4.2. Silage production area \n4.3. Supplies and materials appropriate to the activity \n4.4. Tools and equipment appropriate to the activity \n4.5. Feed resources \n4.6. Different silage \n4.7. All workers involved in different activities must be fully \noriented and cautioned on the different specific work \nactivities of the farm \n4.8. Technical supervisors should have skills and ability in the \nsuccessful implementation of work program activities\n5. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n5.1 \nObservation and questioning \n5.2 \nWritten examination \n5.3\nThird Party Report\n\n--- PDF PAGE 47 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n45\n5.4 \nPortfolio \n5.5\nDemonstration\n6. Context of \nAssessment \n6.1. Competency maybe assessed individually in the actual \nworkplace or in accredited farms or institution\n\n--- PDF PAGE 48 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n46\n \nUNIT OF COMPETENCY \n: PERFORM BREEDING OF RUMINANTS \nUNIT CODE \n: AFF621903 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to perform breeding of ruminants. It comprises \nof preparing animal stocks, breeding of ruminants, \ncarrying-out monitoring activities, feeding the animals, \napplying basic health care and performing post-\nbreeding activities. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare animal stocks \n \n1.1. Breeds of animals suitable for meat, dairy and \nmixed-type/dual purpose are obtained based on \nbreed standards and adoptability on the farm \nenvironment following instructions from authority. \n1.2. Animals are placed in suitable house and facilities \nfollowing Good Animal Husbandry Practices (GAHP) \nand Animal Welfare Act. \n1.3. Animals are well fed and maintained regularly \nfollowing Animal Welfare Act. \n2. Breed ruminants \n2.1. Prepare tools, materials and equipment for \nbreeding operations following breeding schedule and \nrequirements. \n2.2. Breeding program for ruminants is followed \naccording to the business objective \n2.3. Reproductive phenomena of ruminants are \nobserved, recorded and reported following enterprise \nprotocols. \n2.4. Ruminants are bred naturally according to designed \nmating plan. \n2.5. Where necessary, small ruminants are inseminated \nartificially according to instructions of supervisor. \n2.6. Tasks are performed following Animal Welfare Acts. \n2.7. Safety measures are practice according to OSHS \nprocedures.\n3. Carry-out monitoring \nactivities \n3.1. Breeding performance of ruminants are observed \nrecorded and reported following enterprise protocols. \n3.2. Unproductive animals are treated and disposed \naccording to the set standard \n3.3. Breeding and reproduction data are regularly \ngathered and kept for evaluation according to \nenterprise protocols. \n4. Feed animals \n4.1. Basal rations for ruminants at various physiological \nstage are provided based on industry standard. \n4.2. Feed supplements like concentrates, minerals and\n\n--- PDF PAGE 49 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n47\nvitamins are offered according to animal dietary \nrequirements \n4.3. Grazing management for ruminants are identified \nand practiced \n4.4. Grazing capacity of the pasture is determined based \non pasture land condition. \n5. Apply basic health care \n \n5.1. Sick animals are reported to appropriate authority. \n5.2. Assistance is provided during implementation of \nmedication n program in accordance with enterprise \nstandards and instructions of authority. \n5.3. Safety practices are observed according to OSHS. \n6. Perform post-breeding \nactivities \n6.1. Tools, materials and equipment are cleaned and \nstored following procedural manual and 5S \nprinciples. \n6.2. Proper disposal of wastes are practiced according to \nDENR regulations. \n6.3. Records are updated and kept following enterprise \nprotocol. \n6.4. Work outputs are reported to the authority following \nenterprise protocol.\n\n--- PDF PAGE 50 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013 \n48\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Breeds of animals \n1.1 Large Ruminants \n1.1.1. Cattle \nBeef \nDairy \nNative Strain \nBrahman \nHindu-Brazil \nSimbrah \nCrosses \n \nHolstein Friesian \nJersey \nSahiwal \nRed Sindhi \nCrosses \n \n \n1.1.2. Buffaloes \nBeef \nDairy \nNative Carabaos \nAmerican Murrah \nCambodain \