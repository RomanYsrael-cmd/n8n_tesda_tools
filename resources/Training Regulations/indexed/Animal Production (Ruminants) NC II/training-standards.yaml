      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAble to communicate, both orally and in writting; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer\n\n\n3.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n ANIMAL PRODUCTION (RUMINANTS) NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Animal Production (Ruminants) NC II\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n3\nWeighing scale\n(1000 kg. cap.)\nSmall ruminants -\n200 kg capacity\n2\nElectric\ndisbudder\n25\nMedicines (vitamins\nand anti-biotics)\n5\nTattoo pliers,\nhammer\nSyringes\n(5 to 20ml cap.)\n2\nElectric\nshearer\n25\nDewormer\n5\nShovel, wheel\nbarrow\n2\nHoof grinder\n25\nVaccines and\nsyringes\n15\nMineral boxes,\nwaterer, feeding\ntrough\n2\nFire\nextinguisher\n\n\n10\nMilking pails\n1\nFoot baths\n\n25 sets\nPPE:\n• Dust coats\n• Mask\n• Hand gloves\n• Boots\n•Rain coats\n5\nEar applicator\n1\nForage\nchopper\n50 kilos\nSupplemental feeds\n5\nElastrator\n1\nShredder\n25\nEar tags, branding\niron\n5\nHot iron dehorner\n5\nDouble\nbroiler\n3 bot.\nDisinfectant\n5\nHoof trimmer\n1\nStancheon\n10\nsachet\nDetergent\n\n\n1\nChute\n5 pcs\nScrub\n5\nKnife cutter\n1\nRefrigerator\n5 pcs\nBroom\n\n--- PDF PAGE 71 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n69\n1\nBurdizzo\n2 sets\nAudio-visual\n6 pcs\nTrash cans\n5 sets\nPlanting tools\n1\nWater\nsystem\n5 bar\nHand soap/sanitizer\n5 sets\nCarpentry tools\n1 (1,000\ngal.\ncapacity)\nWater tank\n1 block\nIce –crushed (for\nwater bath after\npasteurization)\n12 m\nGarden hose\n\n\n50\nMilk bottles\n\n\n\n25 pcs.\nHairnet (milking)\n\nModels/actual\nobjects\n\n25 pcs.\nWorking gloves\n(silage making)\n5\nDairy Cattle\n\n25\nDisposable gloves\n(for AI)\n5\nBeef Cattle\n\n5x 25/\nspecies\nFor