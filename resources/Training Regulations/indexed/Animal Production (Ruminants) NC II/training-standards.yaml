h\n1. Maintain\nhousing, farm\nimplements\nand\nsurrounding\narea\n1.1\nPrepare for farm\nmaintenance activities\n1.2\nMaintain farm and\nhousing facilities\n1.3\nApply bio-security\nmeasures\n1.4\nPerform work to\ncompletion\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n2. Provide\nforage\n2.1\nPrepare area for forage\nplantation\n2.2\nPlant forage species\n2.3\nMaintain forage plants\n2.4\nProduce silage\n2.5\nPerform work to\ncompletion\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n3. Perform\nbreeding of\nruminants\n4.1\nPrepare animal stocks\n4.2\nBreed ruminants\n4.3\nCarry-out monitoring\nactivities\n4.4\nFeed breeding animals\n4.5\nApply basic health care\n4.6\nPerform post-breeding\nactivities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n4. Raise dairy\nanimals\n5.1\nHandle dairy animals\n5.2\nRear calves and kids\n5.3\nRear dairy-breeder\nanimals\n5.4\nComplete operations\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n•Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n5. 6. Raise\nmeat-type\nanimals\n6.1\nProvide assistance in\nmanagement of meat-\ntype animals\n6.2\nFeed animals\n6.3\nApply basic health care\n6.4\nPerform work to\ncompletion\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n--- PDF PAGE 69 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n67\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency\nstandards and the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL)\nor current competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\no Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n--- PDF PAGE 70 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n68\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAble to communicate, both orally and in writting; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer\n\n\n3.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n ANIMAL PRODUCTION (RUMINANTS) NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Animal Production (Ruminants) NC II\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n3\nWeighing scale\n(1000 kg. cap.)\nSmall ruminants -\n200 kg capacity\n2\nElectric\ndisbudder\n25\nMedicines (vitamins\nand anti-biotics)\n5\nTattoo pliers,\nhammer\nSyringes\n(5 to 20ml cap.)\n2\nElectric\nshearer\n25\nDewormer\n5\nShovel, wheel\nbarrow\n2\nHoof grinder\n25\nVaccines and\nsyringes\n15\nMineral boxes,\nwaterer, feeding\ntrough\n2\nFire\nextinguisher\n\n\n10\nMilking pails\n1\nFoot baths\n\n25 sets\nPPE:\n• Dust coats\n• Mask\n• Hand gloves\n• Boots\n•Rain coats\n5\nEar applicator\n1\nForage\nchopper\n50 kilos\nSupplemental feeds\n5\nElastrator\n1\nShredder\n25\nEar tags, branding\niron\n5\nHot iron dehorner\n5\nDouble\nbroiler\n3 bot.\nDisinfectant\n5\nHoof trimmer\n1\nStancheon\n10\nsachet\nDetergent\n\n\n1\nChute\n5 pcs\nScrub\n5\nKnife cutter\n1\nRefrigerator\n5 pcs\nBroom\n\n--- PDF PAGE 71 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n69\n1\nBurdizzo\n2 sets\nAudio-visual\n6 pcs\nTrash cans\n5 sets\nPlanting tools\n1\nWater\nsystem\n5 bar\nHand soap/sanitizer\n5 sets\nCarpentry tools\n1 (1,000\ngal.\ncapacity)\nWater tank\n1 block\nIce –crushed (for\nwater bath after\npasteurization)\n12 m\nGarden hose\n\n\n50\nMilk bottles\n\n\n\n25 pcs.\nHairnet (milking)\n\nModels/actual\nobjects\n\n25 pcs.\nWorking gloves\n(silage making)\n5\nDairy Cattle\n\n25\nDisposable gloves\n(for AI)\n5\nBeef Cattle\n\n5x 25/\nspecies\nForage planting\nmaterials\n5\nBuffaloes\n\n20\nsacks\n(50 k\neach)\nOrganic Fertilizer\n5\nDairy goat\n\nLearning\nMaterials\n\n\n5\nMeat-type goat\n\nManuals\n\n\n5\nSheep\n\nBooks\n\n\n\n\nReferences\n\n\n\n3.5 TRAINING FACILITIES\n\n ANIMAL PRODUCTION (RUMINANTS) NC II\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL\nAREA IN\nSQ.\nMETERS\nGRAND\nTOTAL\nAREA IN\nSQ. M\n• Building\n(permanent) with\nfacilities\no\n13.00 x 15.00\n\n\n\n195\n\n195\no Student/Traine\ne Working\nSpace\n2 x 2 per\nstudent/trainee\n4 per student\n100\n\no\nLecture Room\n8 x 5\n40\n40\no Learning\nResource\nCenter\n3 x 5\n15\n15\n\no\nKitchen\n4 x 5\n20\n20\no\nStorage room\n4 x 5\n20\n\n--- PDF PAGE 72 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n70\n• Animal Housing with\nfacilities\no Milking parlor\no Corral\no Drinking and\nfeeding through\no Pens\no\nSilo\n8 x 30\n240\n\n240\n• Farm area (overall\narea with the\nbuilding ,animal\nhousing, waste\ndisposal area and\nother facilities\n10 has.\n\n\n10 has.\no Forage and\npasture area\n2 has.\n\n2 has.\n\n\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR\n\nTrainers who will deliver the training on ANIMAL PRODUCTION (RUMINANTS)\nNC II should have the following :\n\n• Must be a holder of National TVET Trainer Certificate I (TM I and NC)\n• Preferrably computer literate\n• Must be physically and mentally fit\n\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency . A certificate of achievement is i