  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider\nwhen\ndesigning\ntraining\nprograms\nfor\nANIMAL\nPRODUCTION\n(RUMINANTS) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: ANIMAL PRODUCTION (RUMINANTS) NC Level NC II\n\nNominal Training Duration:\n18 hrs – Basic Competencies\n\n\n\n\n 48 hrs – Common Competencies\n\n\n 240 hrs – Core Competencies\n\n\n -----------\n\n\n 306 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and\nskills of animal production farm worker in accordance with industry standards. It\ncovers maintenance of housing, farm implements and surrounding area, provision of\nforage, breeding of ruminants, raising dairy animals and raising meat-type animals. It\nalso includes competencies in workplace communication, teamwork, safety in the\nuse of hand tools and equipment, housekeeping and processing of farm wastes.\n\n\n\nBASIC COMPETENCIES\n18 hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant\nwork related\ndocuments.\n1.3 Participate in\nworkplace meeting and\ndiscussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n•\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 67 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n65\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n•\n•\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and\nrisks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n48 hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in farm\noperations\n1.1\nApply appropriate safety\nmeasures while working\nin farm\n1.2\nSafe keep/dispose tools,\nmaterials and outfit.\n•\nSelf-\npaced/modular\n•\nLecture/Discuss\nion\n•\nInteraction\n•\nPractical\nDemonstration\n•\nVisit/tour\n•\nOral/Written\nInterviews\n•\nDirect\nObservation\n•\nPractical\nDemonstration\n2. Use farm tools\nand equipment\n2.1\nPrepare and use farm\ntools\n2.2\nPrepare and operate\nfarm equipment\n2.3\nPerform preventive\nmaintenance\nprocedures/practices\n•\nSelf-\npaced/modular\n•\nLecture/Discuss\nion\n•\nInteraction\n•\nPractical\nDemonstration\n•\nVisit/tour\n•\n•\nOral/Written\nInterviews\n•\nDirect\nObservation\n•\nPractical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1\nPerform estimation\n3.2\nPerform basic workplace\ncalculation\n\n•\nSelf-\npaced/modular\n•\nLecture/Discuss\nion\n•\nInteraction\n•\nPractical\nExercise\n•\nOral/Written\nexamination\n•\nPractical\nexercise\n\n--- PDF PAGE 68 ---\nTR-Animal Production (Ruminants) NCII Promulgated December 2013\n66\n4. Process farm\nwastes\n4.1\nCollect farm wastes\n4.2\nIdentify and segregate\nwastes\n4.3\nTreat and process farm\nwastes\n4.4\nPerform housekeeping\n\n•\nSelf-\npaced/modular\n•\nLecture/Discuss\nion\n•\nInteraction\n•\nPractical\nDemonstration\n•\nVisit/tour\n•\nOral/Written\nInterviews\n•\nDirect\nObservation\n•\nPractical\nDemonstration\n\nCORE COMPETENCIES\n240 hour\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApp