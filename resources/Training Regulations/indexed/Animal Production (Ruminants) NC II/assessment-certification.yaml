roducts Perform Breeding of Ruminants Assess Farm Resources Assist in Aquaculture Operations Assist in Horticulture Operations Produce Biogas Byproducts Maintain Housing, Farm Implements and Surrounding Area Provide Forage Raise Meat- type Animals Market Agri Products Produce Compost Process Farm Wastes Lead workplace communication Work with others Work in team environment Lead small teams Solve problems related to work activities Receive and respond to workplace communication Participate in workplace communication Apply problem solving techniques to workplace Plan and organize work Practice career professionalism Demonstrate work values Practice occupational health and safety procedures Develop and practice negotiation skills Use mathematical method Use relevant technologies Utilize specialized communication skills Develop team and individual Promote environmental protection --- PDF PAGE 75 --- TR-ANIMAL PRODUCTION (RUMINANTS) NC II Promulgated ------- 74 Buck – male breeder goat Buckling –young male breeder ruminant Bull - an adult male bovine mammal. Cage Housing – a type or system of poultry housing where layers could be kept alone, by two or in big groups in cage Calf – a newly born male or female cattle or buffalo Calving – the act or process of delivering young cattle or buffalo Castration – act of removing testicles from male animals Chevon – meat of goat Colostrum – first milk from a female animal after giving birth Cow – a mature female cattle Crossbreed – a group of animals produced by mating two or more different breeds or strains of animals Culling – is the removal of undesirable or inferior animals in the herd based on important economic traits and overall performance Doe – female goat that has given birth, usually more than 1 year old Doeling – female goat that has not given birth, usually less than one (1) year old Estrus – period of time when the female will accept male. Also known as heat period Ewe – (pronounced as “you”) female sheep that has already given birth, usually more than one (1) year old Ewe lamb – female sheep that has not given birth usually less than 1 year old Gestation period – refers to the period of carrying the young in the womb Heifer – a young female cattle or buffalo Hogget – meat of sheep more than one (1) year old but less than two (2) years old Immunization – prevention of diseases by providing appropriate vaccines to animals --- PDF PAGE 76 --- TR-ANIMAL PRODUCTION (RUMINANTS) NC II Promulgated ------- 75 Inbreeding – mating of closely related animals in a herd Lamb – young goat usually less than 1 year old. Also refers to meat of sheep less than one (1 ) year old Lambing – act of giving birth in sheep Livestock – domestic animals kept for use on a farm and raised for sale and profit Mutton – meat of sheep more than 2 years old Nutrients – food elements or substance found in the feeds such as protein, carbohydrates, fats and others Purebreeding – is the mating of the unrelated individuals in the same breed Ram – male breeder sheep Ration – the total amount of feeds taken in by an animal during a 24 hour period Ruminants – refers to animals with complex digestive system e.g. cattle, carabao, goats and sheep Selection – refers to the process of choosing males and females with desirable characteristics either for breeding or replacement stocks Simple stomach/non-ruminant animals – animals that possess simple digestive system e.g. poultry, horse and pigs Steer – a young male calf one year to 18 months old Swine – a collective term for hogs Vaccination – a preventive measure to inoculate an animal with a mildly toxic preparation of bacteria or a virus of specific disease to prevent or to lessen the effects of the disease Waterer – equipment used in providing water to animals Weanling – refers to a young animal of either sex which has been separated from the mother at the end of the lactation period Yearling - An animal that is one year old or has not completed its second year. --- PDF PA