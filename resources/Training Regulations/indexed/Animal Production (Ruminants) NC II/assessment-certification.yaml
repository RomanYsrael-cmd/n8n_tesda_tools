lace\ncommunication\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nApply problem\nsolving techniques\nto workplace\nPlan and organize\nwork\nPractice career\nprofessionalism\nDemonstrate work\nvalues\nPractice occupational\nhealth and safety\nprocedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nmethod\nUse relevant\ntechnologies\nUtilize specialized\ncommunication\nskills\nDevelop team and\nindividual\n\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 75 ---\nTR-ANIMAL PRODUCTION (RUMINANTS) NC II Promulgated -------\n74\n\n"
