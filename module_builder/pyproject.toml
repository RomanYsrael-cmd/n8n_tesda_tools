[project]
name = "tesda-module-builder"
version = "0.1.0"
description = "Local-first syllabus to TESDA learning module builder"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "python-docx>=1.1,<2",
  "lxml>=5.3,<6",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

