{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="/static/activity-drawer.css"><section class="card"><div class="actions"><h1>CBLMs are ready</h1><button type="button" class="secondary" id="activity-toggle">Show LLM activity</button></div><p>{{job.message}}</p><a class="button" href="/cblm/jobs/{{job.id}}/download/zip">Download course ZIP</a><h2>Learning outcomes</h2>{% for f in files %}<p><a href="/cblm/jobs/{{job.id}}/download/{{f.name}}">{{f.name}}</a></p>{% endfor %}</section><aside id="activity-drawer" class="activity-drawer" aria-hidden="true"><div class="drawer-head"><div><h2>LLM activity</h2><p>Requests, responses, validation, and retries</p></div><button type="button" class="secondary" id="activity-close">Close</button></div><div class="privacy-note">API keys are never included.</div><div id="live-streams"></div><div id="activity-summary" class="activity-summary"></div><div id="activity-entries"></div></aside><div id="drawer-backdrop" class="drawer-backdrop"></div><script src="/static/cblm-activity.js" data-job-id="{{job.id}}"></script>{% endblock %}
